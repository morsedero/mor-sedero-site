<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daisey — Focus mode</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8EF; color: #1F1D1A; font-family: Rubik, system-ui, sans-serif; padding: 18px 20px 24px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #2F64C0;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #2F64C0;"></span>
      Admin · <span dir="rtl">סידורים</span>
    </span>
    <button aria-label="Back to the Now screen" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #6B665D; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <section aria-label="Focus" style="margin-top: 12px; border-radius: 28px; background: #EAF1FC; border: 1px solid #CFDDF5; padding: 28px 22px 26px; display: flex; flex-direction: column; align-items: center;">
    <div dir="rtl" style="font-size: 30px; font-weight: 600; text-align: center; letter-spacing: -0.3px;">ביטוח לחיות</div>
    <p style="margin: 8px 0 0; font-size: 15px; color: #3A4A66; text-align: center;">I'll hold everything else.</p>

    <div style="position: relative; width: 220px; height: 220px; margin-top: 26px;">
      <svg width="220" height="220" viewBox="0 0 220 220" style="position: absolute; inset: 0;" aria-hidden="true">
        <circle cx="110" cy="110" r="96" fill="#FFFDF6" stroke="#D9E4F6" stroke-width="8"></circle>
        <circle cx="110" cy="110" r="96" fill="none" stroke="#F5B301" stroke-width="8" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="232" transform="rotate(-90 110 110)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 46px; font-weight: 600; letter-spacing: -0.8px; font-variant-numeric: tabular-nums;">09:12</span>
        <span style="font-size: 14px; color: #6B665D; margin-top: 2px;">of 15 min</span>
      </div>
    </div>
  </section>

  <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; background: #FFFDF6; border: 1px solid #E6E0D2; border-radius: 16px; padding: 12px 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B665D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    <label for="note" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Note for this task</label>
    <input id="note" placeholder="Jot a note while you work…" style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #1F1D1A; outline: none;">
  </div>

  <div style="flex-grow: 1;"></div>

  <button style="position: relative; overflow: hidden; width: 100%; height: 58px; border: none; border-radius: 16px; background: #F5B301; color: #1F1D1A; font-family: inherit; font-size: 18px; font-weight: 600; box-shadow: 0 6px 14px rgba(245, 179, 1, 0.3);">
    <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: #E2A300;"></span>
    <span style="position: relative;">Hold to finish</span>
  </button>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px;">
    <button style="height: 46px; border: 1px solid #E6E0D2; border-radius: 14px; background: #FFFDF6; color: #3A362F; font-family: inherit; font-size: 14px; font-weight: 500;">+15 min</button>
    <button style="height: 46px; border: 1px solid #E6E0D2; border-radius: 14px; background: #FFFDF6; color: #3A362F; font-family: inherit; font-size: 14px; font-weight: 500;">Stuck</button>
    <button style="height: 46px; border: 1px solid #E6E0D2; border-radius: 14px; background: #FFFDF6; color: #3A362F; font-family: inherit; font-size: 14px; font-weight: 500;">Stop</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
