<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daisey — Task</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #E9E3D3; color: #1F1D1A; font-family: Rubik, system-ui, sans-serif;">

  <section aria-label="Task" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: #FFFDF6; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.08); padding: 8px 20px 20px; display: flex; flex-direction: column;">
    <span style="display: block; width: 40px; height: 5px; border-radius: 3px; background: #DCD4C1; margin: 0 auto;"></span>

    <div style="display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; font-weight: 600; color: #5B47B8;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B47B8;"></span>monster punk
    </div>
    <div style="margin-top: 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.3px;">Sfx deep work</div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid #E6E0D2; border-radius: 12px; background: #FFFDF6; font-family: inherit; text-align: left;">
        <span style="font-size: 12px; color: #6B665D;">Start (not before)</span>
        <span style="font-size: 15px; font-weight: 500; color: #8C8574;">Any time</span>
      </button>
      <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid #E6E0D2; border-radius: 12px; background: #FFFDF6; font-family: inherit; text-align: left;">
        <span style="font-size: 12px; color: #6B665D;">Due</span>
        <span style="font-size: 15px; font-weight: 600; color: #1F1D1A;">Fri 9 Oct</span>
        <span style="font-size: 11px; font-weight: 600; color: #8A4B00; background: #FFF1CC; border-radius: 999px; padding: 1px 7px; margin-top: 2px;">Deadline</span>
      </button>
    </div>

    <button aria-expanded="false" style="margin-top: 8px; width: 100%; height: 44px; display: flex; align-items: center; gap: 8px; border: 1px solid #E6E0D2; border-radius: 12px; background: #FBF8EF; padding: 0 12px; font-family: inherit; color: #6B665D; font-size: 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span style="flex-grow: 1; text-align: left;">Details: size, energy, place, repeat</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

    <h3 style="margin: 20px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #6B665D;">Steps</h3>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px;">
      <li style="display: flex; align-items: center; gap: 10px; min-height: 38px;">
        <span style="width: 20px; height: 20px; border-radius: 6px; background: #2F7A47; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
        <span style="font-size: 15px; color: #8C8574; text-decoration: line-through;">[Step one]</span>
      </li>
      <li style="display: flex; align-items: center; gap: 10px; min-height: 38px;">
        <span style="width: 20px; height: 20px; border-radius: 6px; border: 2px solid #B8B09F; box-sizing: border-box;"></span>
        <span style="font-size: 15px; font-weight: 500;">[Step two]</span>
        <span style="font-size: 11px; font-weight: 600; color: #6B4600; background: #FFF4D6; border-radius: 999px; padding: 2px 8px;">next step</span>
      </li>
      <li style="display: flex; align-items: center; gap: 10px; min-height: 38px;">
        <span style="width: 20px; height: 20px; border-radius: 6px; border: 2px solid #B8B09F; box-sizing: border-box;"></span>
        <span style="font-size: 15px;">[Step three]</span>
      </li>
      <li style="min-height: 38px; display: flex; align-items: center; padding-left: 30px; font-size: 14px; color: #6B665D;">+ Add step</li>
    </ul>

    <h3 style="margin: 16px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #6B665D;">Links &amp; notes</h3>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <a href="#" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; background: #F1ECDF; color: #3A362F; text-decoration: none; font-size: 13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>[Link]
      </a>
      <button style="height: 32px; padding: 0 12px; border: 1px dashed #CFC7B4; border-radius: 10px; background: transparent; color: #6B665D; font-family: inherit; font-size: 13px;">+ Link or file</button>
    </div>
    <label for="tnote" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Notes</label>
    <textarea id="tnote" placeholder="Notes…" style="margin-top: 8px; height: 56px; resize: none; border: 1px solid #E6E0D2; border-radius: 12px; background: #FBF8EF; padding: 10px 12px; font-family: inherit; font-size: 14px; color: #1F1D1A;"></textarea>

    <div style="flex-grow: 1;"></div>
    <div style="font-size: 12px; color: #8C8574; text-align: center; margin-bottom: 10px;">Worked 2 sessions · 1 h 40 so far</div>
    <button style="height: 56px; border: none; border-radius: 16px; background: #F5B301; color: #1F1D1A; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>Start
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
