<!doctype html>
<html lang="en">
<head>

<title>Daisey — Calm home</title>
</head>
<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8EF; color: #1F1D1A; font-family: Rubik, system-ui, sans-serif; padding: 18px 20px 0;">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <button aria-label="Done today: 2 tasks" style="display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; font-family: inherit; color: inherit;">
      <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="#FFFFFF" stroke="#E6DCC3" stroke-width="1.2">
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(0 20 20)"></ellipse>
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(72 20 20)"></ellipse>
        </g>
        <circle cx="20" cy="20" r="6.5" fill="#F5B301"></circle>
      </svg>
      <span style="font-weight: 700; font-size: 22px; letter-spacing: -0.4px;">Daisey</span>
    </button>
    <button aria-label="Account" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: #2F2B25; color: #FBF8EF; font-family: inherit; font-weight: 600; font-size: 14px;">M</button>
  </header>

  <h1 style="margin: 10px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.3px;">Good evening, Mor</h1>

  <section aria-label="Now" style="margin-top: 16px; border-radius: 24px; background: #EFEAFD; border: 1px solid #DCD3FA; padding: 20px; box-shadow: 0 12px 28px rgba(91, 71, 184, 0.12);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #5B47B8; white-space: nowrap;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B47B8;"></span>
        Work · monster punk
      </span>
      <span style="font-size: 13px; font-weight: 500; color: #5B4F8A;">1 h</span>
    </div>
    <button aria-label="Edit task: Sfx deep work" style="display: block; margin-top: 14px; padding: 0; border: none; background: transparent; font-family: inherit; color: #1F1D1A; font-size: 32px; font-weight: 600; letter-spacing: -0.3px; text-align: left;">Sfx deep work</button>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: #4A4170;">I'd do this now: it fills your free evening and keeps monster punk going.</p>
    <button style="width: 100%; margin-top: 18px; height: 56px; border: none; border-radius: 16px; background: #F5B301; color: #1F1D1A; font-family: inherit; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 14px rgba(245, 179, 1, 0.35);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
      Start
    </button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px;">
      <button style="height: 44px; border: none; border-radius: 12px; background: transparent; color: #4A4170; font-family: inherit; font-size: 14px; font-weight: 500;">Later</button>
      <button style="height: 44px; border: none; border-radius: 12px; background: transparent; color: #4A4170; font-family: inherit; font-size: 14px; font-weight: 500;">Switch</button>
      <button style="height: 44px; border: none; border-radius: 12px; background: transparent; color: #4A4170; font-family: inherit; font-size: 14px; font-weight: 500;">Pending</button>
    </div>
  </section>

  <div style="margin-top: 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #6B665D;">After this</div>
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px;">
        <span style="width: 74px; color: #6B665D;">23:10</span>
        <span>Wind down</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin: 2px 0;">
        <span style="flex-grow: 1; height: 1px; background: #E6E0D2;"></span>
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 999px; background: #F1ECDF; color: #6B665D; font-size: 12px; font-weight: 500;">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><g fill="#FFFFFF" stroke="#CFC4A8" stroke-width="1"><ellipse cx="9.5" cy="9" rx="2.4" ry="6" transform="rotate(-14 12 17)"></ellipse><ellipse cx="12" cy="8" rx="2.4" ry="6.5"></ellipse><ellipse cx="14.5" cy="9" rx="2.4" ry="6" transform="rotate(14 12 17)"></ellipse></g><circle cx="12" cy="17" r="3" fill="#E0B23C"></circle></svg>
          Night · 23:45 – 08:00
        </span>
        <span style="flex-grow: 1; height: 1px; background: #E6E0D2;"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px;">
        <span style="width: 74px; color: #6B665D;">Tue 09:00</span>
        <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F8F80;"></span>BOBBA</span>
      </div>
    </div>
  </div>

  <a href="#" style="margin-top: 14px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #FFF4D6; border: 1px solid #F5DFA0; color: #6B4600; text-decoration: none;">
    <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5B301; color: #1F1D1A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
    <span style="flex-grow: 1; font-size: 14px; font-weight: 500;">Needs you: 3 quick decisions</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <section aria-label="Today and tasks" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFDF6; border-top: 1px solid #E6E0D2; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.06); padding: 8px 16px 18px;">
    <button aria-label="Pull up for projects" style="display: block; width: 100%; height: 40px; border: none; background: transparent; padding: 0; font-family: inherit;">
      <span style="display: block; width: 40px; height: 5px; border-radius: 3px; background: #DCD4C1; margin: 0 auto 8px;"></span>
      <span style="display: flex; justify-content: center; gap: 6px; font-size: 13px; color: #6B665D;">
        <span>Projects</span><span>·</span><span>4 projects</span><span>·</span><span>14 tasks</span>
      </span>
    </button>
    <form style="margin-top: 8px; display: flex; align-items: center; height: 52px; border: 1px solid #E6E0D2; border-radius: 999px; background: #FBF8EF; padding: 0 6px;">
      <button type="button" aria-label="New task or event" style="width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 50%; background: #EFE9DA; color: #3A362F; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <label for="tellA" class="sr">Tell Daisey</label>
      <input id="tellA" placeholder="Tell Daisey…" style="flex-grow: 1; min-width: 0; height: 40px; border: none; background: transparent; padding: 0 10px; font-family: inherit; font-size: 15px; color: #1F1D1A; outline: none;">
      <button type="button" aria-label="Speak to Daisey" style="width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 50%; background: #2F2B25; color: #FBF8EF; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </form>
  </section>
</div>
