<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daisey — Night mode</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes snooze{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #141310; color: #F3EEE3; font-family: Rubik, system-ui, sans-serif; padding: 18px 20px 0;">

  <span style="position: absolute; left: 60px; top: 120px; width: 3px; height: 3px; border-radius: 50%; background: #F3EEE3; animation: twinkle 3s infinite;"></span>
  <span style="position: absolute; left: 300px; top: 90px; width: 2px; height: 2px; border-radius: 50%; background: #F3EEE3; animation: twinkle 4s 1s infinite;"></span>
  <span style="position: absolute; left: 250px; top: 200px; width: 3px; height: 3px; border-radius: 50%; background: #F3EEE3; animation: twinkle 3.5s .5s infinite;"></span>
  <span style="position: absolute; left: 110px; top: 240px; width: 2px; height: 2px; border-radius: 50%; background: #F3EEE3; animation: twinkle 5s 2s infinite;"></span>

  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
        <g fill="#3A372F" stroke="#4A463C" stroke-width="1.2">
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(0 20 20)"></ellipse>
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(72 20 20)"></ellipse>
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(144 20 20)"></ellipse>
          <ellipse cx="20" cy="9" rx="4.6" ry="8" transform="rotate(216 20 20)"></ellipse>
        </g>
        <circle cx="20" cy="20" r="6.5" fill="#B88A1A"></circle>
      </svg>
      <span style="font-weight: 700; font-size: 21px; letter-spacing: -0.3px;">Daisey</span>
    </div>
    <button aria-label="Account" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: #F3EEE3; color: #141310; font-family: inherit; font-weight: 600; font-size: 14px;">M</button>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; margin-top: 58px; text-align: center;">
    <svg width="96" height="96" viewBox="0 0 40 40" aria-hidden="true" style="animation: snooze 3s ease-in-out infinite;">
      <path d="M29 6a10 10 0 1 0 5 15A8 8 0 0 1 29 6z" fill="#F5D27A" opacity="0.9"></path>
      <g fill="#E9E2D2" opacity="0.85">
        <ellipse cx="14" cy="26" rx="3" ry="5.5" transform="rotate(-60 14 30)"></ellipse>
        <ellipse cx="14" cy="26" rx="3" ry="5.5" transform="rotate(0 14 30)"></ellipse>
        <ellipse cx="14" cy="26" rx="3" ry="5.5" transform="rotate(60 14 30)"></ellipse>
      </g>
      <circle cx="14" cy="30" r="3.6" fill="#B88A1A"></circle>
    </svg>
    <h1 style="margin: 20px 0 6px; font-size: 28px; font-weight: 600;">Late, Mor.</h1>
    <p style="margin: 0; font-size: 15px; color: #A8A193;">Nothing needs you tonight. Here's tomorrow.</p>
  </div>

  <section aria-label="Tomorrow first" style="margin-top: 30px; border-radius: 24px; background: #201E1A; border: 1px solid #2E2B25; padding: 20px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #A8A193;">Tomorrow first</div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px;">
      <span style="width: 54px; font-size: 13px; color: #A8A193;">09:00</span>
      <div style="flex-grow: 1; background: #1D2E2B; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 12px; color: #7CC4B6;">09:00–13:00</span>
        <span style="font-size: 15px; font-weight: 600; color: #BFE7DF;">BOBBA</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
      <span style="width: 54px; font-size: 13px; color: #A8A193;">After</span>
      <div style="flex-grow: 1; border: 1px solid #2F4A73; border-radius: 12px; padding: 10px 12px;">
        <div dir="rtl" style="font-size: 17px; font-weight: 600;">ביטוח לחיות</div>
        <div style="font-size: 13px; color: #8FB2EE; margin-top: 2px;">Admin · 15 min · costs money if late</div>
      </div>
    </div>
  </section>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <button style="height: 44px; padding: 0 18px; border: 1px solid #34312A; border-radius: 999px; background: transparent; color: #E2DCCF; font-family: inherit; font-size: 14px; font-weight: 500;">I'm free now, show me something</button>
    <span style="font-size: 12px; color: #7E786C;">Day hours 08:00–22:00</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
