<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daisey</title>
<meta name="theme-color" content="#fbf8ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<!-- Before the stylesheet, so a saved Light/Dark choice is in place for the
     first paint; main.js owns it from there. -->
<script>try{var t=localStorage.getItem("daisey.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/daisey-192.png">
<link rel="apple-touch-icon" href="icons/daisey-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daisey">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <h1 class="brand">Daisey</h1>
    <p id="clock" class="clock" aria-label="Today's date and time"></p>
    <!-- Account: Google-style avatar, top end corner; tap for email + sign out. -->
    <div class="acct">
      <button id="avatar" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acctMenu" hidden></button>
      <div id="acctMenu" class="acct-menu" hidden>
        <p id="who" class="muted"></p>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button class="theme-btn" type="button" role="radio" data-set-theme="system">Auto</button>
          <button class="theme-btn" type="button" role="radio" data-set-theme="light">Light</button>
          <button class="theme-btn" type="button" role="radio" data-set-theme="dark">Dark</button>
        </div>
        <!-- Day hours: free time counts only inside them; outside is night mode. -->
        <div class="dayhours" role="group" aria-label="Day hours">
          <span class="muted">Day</span>
          <input id="dayStart" type="time" aria-label="Day starts" value="08:00">
          <span class="muted">–</span>
          <input id="dayEnd" type="time" aria-label="Day ends" value="22:00">
        </div>
        <button id="importTrello" class="btn small" type="button" hidden>Import from Trello…</button>
        <button id="signout" class="btn small" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Loading, signed out, or an error: main.js fills this one box, and
       empties it once signed in, so no hidden copy of any of them sits in
       the page (Mor, 2026-10-05). -->
  <section id="status" class="card"><p class="muted">Loading…</p></section>

  <!-- Signed in: the Now card stays put at the top; under it one pane that
       switches between the day and the projects (Mor, 2026-10-04). -->
  <div id="board" hidden>
    <section id="nowcard" aria-label="Now" hidden></section>
    <nav class="panetabs" role="tablist" aria-label="Under the card">
      <button id="tabSchedule" class="tab" role="tab" aria-controls="schedule" type="button">Schedule</button>
      <button id="tabTasks" class="tab" role="tab" aria-controls="tasksview" type="button">Tasks</button>
    </nav>
    <div class="pane">
      <section id="schedule" class="sch" role="tabpanel" aria-labelledby="tabSchedule" hidden></section>
      <div id="tasksview" role="tabpanel" aria-labelledby="tabTasks" hidden></div>
    </div>
  </div>

  <button id="add" class="fab" type="button" aria-label="Add task" hidden>+</button>
  <dialog id="addtask" class="now" aria-labelledby="addTitle"></dialog>
  <dialog id="importdlg" class="now" aria-labelledby="importTitle"></dialog>
  <dialog id="eventdlg" class="now" aria-labelledby="evTitle"></dialog>
  <dialog id="deadlinedlg" class="now" aria-labelledby="dlTitle"></dialog>
  <dialog id="sweepdlg" class="now" aria-labelledby="swTitle"></dialog>
</main>
</body>
</html>
