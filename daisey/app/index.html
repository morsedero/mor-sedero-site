<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daisey</title>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <h1 class="brand">Daisey</h1>
    <!-- Account: Google-style avatar, top end corner; tap for email + sign out. -->
    <div class="acct">
      <button id="avatar" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acctMenu" hidden></button>
      <div id="acctMenu" class="acct-menu" hidden>
        <p id="who" class="muted"></p>
        <button id="signout" class="btn small" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <section data-view="loading" class="card"><p class="muted">Loading…</p></section>

  <section data-view="noconfig" class="card" hidden>
    <p>Firebase isn't configured yet. Paste the web config into <code>js/config.js</code>.</p>
  </section>

  <section data-view="error" class="card" hidden><p id="err"></p></section>

  <section data-view="signedout" class="card" hidden>
    <p>Sign in to see your tasks.</p>
    <button id="signin" class="btn primary">Sign in with Google</button>
    <p id="signinMsg" class="msg" role="alert"></p>
  </section>

  <!-- Signed in: two windows, Now and Tasks. -->
  <nav id="tabs" class="tabs" role="tablist" hidden>
    <button id="tabNow" class="tab" role="tab" aria-controls="viewNow" type="button">Now</button>
    <button id="tabTasks" class="tab" role="tab" aria-controls="viewTasks" type="button">Tasks</button>
  </nav>

  <!-- Now: the card on top, the day planner under it. -->
  <div id="viewNow" role="tabpanel" aria-labelledby="tabNow" hidden>
    <section id="nowcard" class="card nowcard" hidden></section>
    <section id="day" class="card day" hidden></section>
  </div>

  <!-- Tasks: one column per project. -->
  <div id="viewTasks" role="tabpanel" aria-labelledby="tabTasks" hidden></div>

  <button id="add" class="fab" type="button" aria-label="Add task" hidden>+</button>
  <dialog id="addtask" class="now" aria-labelledby="addTitle"></dialog>
</main>
</body>
</html>
