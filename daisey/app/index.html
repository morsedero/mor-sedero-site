<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daisey</title>
<meta name="theme-color" content="#fbf8ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<!-- Before the stylesheet, so a saved Light/Dark choice is in place for the
     first paint; main.js owns it from there. -->
<script>try{var t=localStorage.getItem("daisey.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/daisey-192.png">
<link rel="apple-touch-icon" href="icons/daisey-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daisey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main class="shell">
  <!-- Layout round 2 (Mor, 2026-10-05; daisey/New Design/6–10): a calm home —
       the Now card, what's after it, and decisions waiting — with projects
       one pull away in the sheet at the bottom. -->
  <header class="topbar">
    <!-- The daisy grows a petal per task done today (main.js paints it). -->
    <div class="brandrow" id="brandrow" role="img">
      <span id="logo" class="logo"></span>
      <h1 class="brand">Daisey</h1>
    </div>
    <!-- Account: Google-style avatar, top end corner; tap for email + sign out. -->
    <div class="acct">
      <button id="avatar" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acctMenu" hidden></button>
      <div id="acctMenu" class="acct-menu" hidden>
        <p id="who" class="muted"></p>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button class="theme-btn" type="button" role="radio" data-set-theme="system">Auto</button>
          <button class="theme-btn" type="button" role="radio" data-set-theme="light">Light</button>
          <button class="theme-btn" type="button" role="radio" data-set-theme="dark">Dark</button>
        </div>
        <!-- Day hours: free time counts only inside them; outside is night mode. -->
        <div class="dayhours" role="group" aria-label="Day hours">
          <span class="muted">Day</span>
          <input id="dayStart" type="time" aria-label="Day starts" value="08:00">
          <span class="muted">–</span>
          <input id="dayEnd" type="time" aria-label="Day ends" value="22:00">
        </div>
        <label class="menu-check"><input id="logDone" type="checkbox" checked> Log finished tasks in Google Calendar</label>
        <!-- Where you are: picked by hand, and saved places (places.js). -->
        <button id="placesBtn" class="btn small" type="button">Places…</button>
        <button id="importTrello" class="btn small" type="button">Import from Trello…</button>
        <button id="signout" class="btn small" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <!-- Loading, signed out, or an error: main.js fills this one box, and
       empties it once signed in, so no hidden copy of any of them sits in
       the page (Mor, 2026-10-05). -->
  <section id="status" class="card"><p class="muted">Loading…</p></section>
  <!-- Signed in: greeting, the Now card, After this, Needs you (now.js). -->
  <div id="board" hidden>
    <section id="nowcard" aria-label="Now" hidden></section>
  </div>
  <!-- The pull-up sheet (projects.js): resting, it's a handle, the projects
       count and Tell Daisey; pulled up, the projects grid. -->
  <section id="pull" class="pull" aria-label="Projects" hidden>
    <div id="pullNow" class="pull-now" hidden></div>
    <div class="pull-sheet">
      <button id="pullHandle" class="pull-handle" type="button" aria-expanded="false" aria-controls="pullBody">
        <span class="grip" aria-hidden="true"></span>
        <span id="pullSum" class="pull-sum">Projects</span>
      </button>
      <div id="pullBody" class="pull-body" hidden></div>
      <!-- Tell Daisey (tell.js): type or speak; Daisey shows what it understood
           as cards and changes nothing until you tap Apply. One pill:
           [ + | Tell Daisey… | mic ]. -->
      <form id="tell" class="tellbar">
        <div class="plus-wrap">
          <button id="plus" class="plus" type="button" aria-label="Add" aria-haspopup="true" aria-expanded="false" aria-controls="plusMenu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div id="plusMenu" class="plus-menu" role="menu" hidden>
            <button id="plusTask" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Task
            </button>
            <button id="plusEvent" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Event
            </button>
          </div>
        </div>
        <label for="tellInput" class="sr">Tell Daisey</label>
        <input id="tellInput" dir="auto" autocomplete="off" enterkeyhint="go" placeholder="Tell Daisey…">
        <button id="mic" class="mic" type="button" aria-label="Speak to Daisey">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </form>
    </div>
  </section>
  <!-- One project, full screen (projects.js). -->
  <section id="projectview" class="screen" aria-label="Project" hidden></section>
  <!-- Needs you: one decision at a time, full screen (needs.js). -->
  <section id="needsview" class="screen" aria-label="Needs you" hidden></section>
  <!-- The task sheet: adding and opening a task (addtask.js). -->
  <dialog id="addtask" class="now tsheet" aria-labelledby="addTitle"></dialog>
  <dialog id="importdlg" class="now" aria-labelledby="importTitle"></dialog>
  <dialog id="eventdlg" class="now" aria-labelledby="evTitle"></dialog>
  <dialog id="deadlinedlg" class="now" aria-labelledby="dlTitle"></dialog>
  <dialog id="placedlg" class="now" aria-labelledby="plTitle"></dialog>
</main>
</body>
</html>
