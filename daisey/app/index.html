<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daisey</title>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main class="shell">
  <h1 class="brand">Daisey</h1>

  <section data-view="loading" class="card"><p class="muted">Loading…</p></section>

  <section data-view="noconfig" class="card" hidden>
    <p>Firebase isn't configured yet. Paste the web config into <code>js/config.js</code>.</p>
  </section>

  <section data-view="error" class="card" hidden><p id="err"></p></section>

  <section data-view="signedout" class="card" hidden>
    <p>Sign in to see your tasks.</p>
    <button id="signin" class="btn primary">Sign in with Google</button>
    <p id="signinMsg" class="msg" role="alert"></p>
  </section>

  <!-- The Now card, always on top once signed in. -->
  <section id="nowcard" class="card nowcard" hidden></section>

  <section data-view="signedin" class="card" hidden>
    <div class="row">
      <span id="who" class="muted"></span>
      <button id="signout" class="btn">Sign out</button>
    </div>
    <label for="note" class="label">Test note <span id="noteStatus" class="muted"></span></label>
    <textarea id="note" dir="auto" rows="5" placeholder="Type here, watch it appear on your other device."></textarea>
  </section>

  <!-- Daily check-in: opens on the first visit each day, reopened by "Plan today". -->
  <dialog id="checkin" class="now" aria-labelledby="checkinTitle"></dialog>

  <!-- Temporary task debug list, only at ?debug (session 2). -->
  <section id="debug" class="card dbg" hidden></section>
</main>
</body>
</html>
