  if((c.start && daysBetween(new Date(), c.start) === 0) || c.pendingReturned) return 2;
  if(ageDays(c) >= 1) return 3;
  if(c.due) return 4;
  if(c.blocked || c.stalled) return 5;
  return 6;
}
function candidates(date){
  /* blocked/pending cards sit out of scheduling entirely — not just ranked
     low — until whatever's holding them up clears (edit the description
     to drop the marker, or the label). pendingItem() is what puts them
     here in the first place. green label = info only, never schedule.
     A tracker board's cards are assets, not work sessions: one FMOD sitting
     covers a dozen of them, so they are tracked and moved from the Pipeline
     view and never scheduled — see BOARDS.
     `c.start` (see START_RE / normCard) is Trello's real Start Date field,
     synced in by netlify/functions/trello-webhook.js since the connector
     itself can't read it. A card whose start day is still in the future
     sits out the same way a blocked/pending card does — today and past are
     both fair game, only a future start date holds it back.
     `date` (unused by this filter, kept for callers that pass one) defaults
     to today; see rolloverSweep/planFor/swapPicker for why. */
  return allCards().filter(c => !c.isStats && !c.dueComplete && !c.blocked &&
    !isTrackerCard(c) &&
    !(c.start && daysBetween(new Date(), c.start) > 0) &&
    !c.labels.some(l => l && l.color === "green"));
}
/* board order tie-break: user-configurable (settings → Priority,
   CFG.boardPriority) — defaults to PROJECTS, סדקו, סידורים — ahead of
   Daisey's own win-rate weighting. Cards only carry boardName, not
   boardKey, so the map is built name-keyed off CFG at rank time rather
   than stored that way. */
function boardOrderMap(){
  const order = (CFG.boardPriority && CFG.boardPriority.length) ? CFG.boardPriority : DEFAULTS.boardPriority;
  const map = {};
  order.forEach((key,i) => {
    const b = SCHED_BOARDS.find(x => x.key === key);
    if(b) map[b.name] = i;
  });
  return map;
}
function rankCards(pool){
  const boardOrder = boardOrderMap();
  return pool.slice().sort((a,b) => {
    const ta=tierOf(a), tb=tierOf(b);
    if(ta!==tb) return ta-tb;
    /* Due date is compared before board order and win-rate weighting, not
       after them (2026-08-18). The closer date always wins — that's the
       whole rule now, and it's what makes tierOf's single due tier behave
       like a proper deadline sort instead of a bucket. Board order and
       weighting still break the genuine ties: two cards due the same day, or
       two with no date at all (both Infinity, so this test falls through). */
    const da=a.due?a.due.getTime():Infinity, db=b.due?b.due.getTime():Infinity;
    if(da!==db) return da-db;
    const boa=boardOrder[a.boardName], bob=boardOrder[b.boardName];
    if(boa!==undefined && bob!==undefined && boa!==bob) return boa-bob;
    const wa=catWeight(a.boardName), wb=catWeight(b.boardName);
    if(Math.abs(wa-wb)>0.001) return wb-wa;
    return (a.lastActivityAt?a.lastActivityAt.getTime():0) - (b.lastActivityAt?b.lastActivityAt.getTime():0);
  });
}
function freeWindows(busy, winS, winE){
  const merged=[];
  for(const iv of busy.slice().sort((x,y)=>x.s-y.s)){
    if(!merged.length || iv.s > merged[merged.length-1].e) merged.push({s:iv.s,e:iv.e});
    else merged[merged.length-1].e = Math.max(merged[merged.length-1].e, iv.e);
  }
  const free=[]; let cur=winS;
  for(const iv of merged){
    if(iv.s > cur) free.push({ s:cur, e:Math.min(iv.s, winE) });
    cur = Math.max(cur, iv.e);
    if(cur >= winE) break;
  }
  if(cur < winE) free.push({ s:cur, e:winE });
  return free.filter(f => f.e-f.s > 0);
}
function findSlots(busy, winS, winE, dur, max, fromMin){
  const out=[];
  for(const f of freeWindows(busy, winS, winE)){
    let s = Math.max(f.s, fromMin==null?winS:fromMin);
    s = Math.ceil(s/SNAP_MIN)*SNAP_MIN;
    while(s + dur <= f.e){
      out.push({ s, e:s+dur });
      if(out.length >= max) return out;
      s += SNAP_MIN;
    }
  }
  return out;
}
/* The break window the user has pinned in Settings, in minutes-from-midnight,
   or null when they've left it on "Daisey decides". Clipped to the day window
   and dropped entirely if nothing usable is left of it, so callers can treat
   a non-null result as a real, schedulable-day-relative interval. */
function reservedBreak(){
  if(CFG.breakHour === null || CFG.breakHour === undefined) return null;
  const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const s = Math.max(winS, CFG.breakHour*60);
  const e = Math.min(winE, s + (CFG.breakLen || 60));
  return e - s >= BREAK_MIN ? { s, e } : null;
}
/* "Daisey decides" (CFG.breakHour===null) used to mean no break was ever
   held open — planFor packed sessions back-to-back with a meeting and
   whatever leftover time happened to survive became the break, wherever
   that was (2026-08-18 user report: a meeting ran to 18:00, a session was
   packed on immediately after it, and the break landed at 21:00 — nine
   straight hours of activity before any break appeared). Real breaks after
   real stretches of work is the point of the feature, not a byproduct of
   whatever's left over.
   AUTO_BREAK_MIN is the continuous-activity threshold; `activity` tracks
   real busy time only (meetings + placed sessions), separate from
   `sessionLive`/`quickLive` which also carry break reservations — a break
   must not count as activity that triggers the next break, or a 3h run
   would never actually reset. */
const AUTO_BREAK_MIN = 180;
function contiguousRunBefore(activity, point){
  let start = point, moved = true;
  while(moved){
    moved = false;
    for(const iv of activity){
      if(iv.e === start && iv.s < start){ start = iv.s; moved = true; }
    }
  }
  return point - start;
}
/* Finds the earliest slot for `dur`, forcing a CFG.breakLen break in first
   if the slot would otherwise start right after 3h+ of unbroken activity.
   Reserving the break into the live busy sets (rather than just skipping
   ahead) is what makes it "reshape around it": the break itself becomes a
   real, protected slot that no later card can be packed into, the same way
   a user-pinned breakHour already works. Mutates sessionLive/quickLive
   in place when it inserts a break; `activity` is extended by the caller
   once the real slot is known. */
function findSlotWithAutoBreak(sessionLive, quickLive, activity, winS, winE, dur, nowMin){
  let s = findSlots(sessionLive, winS, winE, dur, 1, nowMin)[0];
  if(!s) return null;
  if(CFG.breakHour === null || CFG.breakHour === undefined){
    const run = contiguousRunBefore(activity, s.s);
    if(run >= AUTO_BREAK_MIN){
      const bs = s.s, be = Math.min(winE, bs + (CFG.breakLen || 60));
      if(be > bs){
        sessionLive.push({ s:bs, e:be }); quickLive.push({ s:bs, e:be });
        const s2 = findSlots(sessionLive, winS, winE, dur, 1, nowMin)[0];
        /* nothing fit after the reserved break, so it isn't a break from
           anything — undo the reservation rather than leave it blocking
           this stretch of time for every candidate still to come. */
        if(!s2){ sessionLive.pop(); quickLive.pop(); return null; }
        s = s2;
      }
    }
  }
  return s;
}
function planFor(date, mode, picked, ignore){
  const have = existingBlocks(date, ignore);
  const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const nowMin = sameDay(date,new Date()) ? Math.ceil(minsOf(new Date())/SNAP_MIN)*SNAP_MIN : null;

  let pool = candidates(date);
  if(mode==="pick" && picked && picked.length){
    const set = new Set(picked);
    pool = pool.filter(c => set.has(c.id));
  }
  const already = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e,date) && !ignored(e.id, ignore))
    .flatMap(e => e.cardShorts));
  pool = pool.filter(c => !c.shortLink || !already.has(c.shortLink));

  const ranked = rankCards(pool);
  const placed = [];
  /* Two busy sets: sessions may never land inside a permeable meeting
     (חמל included), quick tasks still can. Every placed block — whichever
     pass placed it — has to occupy both, so later passes see it. */
  const sessionLive = busyFor(date, ignore, true);
  const quickLive   = busyFor(date, ignore, false);
  /* Real activity only (meetings so far, sessions as they're placed below) —
     see findSlotWithAutoBreak/contiguousRunBefore. Snapshotted before the
     reservedBreak() push just below so a user-pinned break (which never
     triggers the auto-break branch anyway) can't pollute it. */
  const activityLive = sessionLive.slice();

  /* A user-set break hour is held open, not merely preferred: pushed into
     both busy sets here, before a single card is placed, so every pass below
     plans around it exactly as it plans around a meeting. Nothing else is
     needed to make the break itself appear — breakGaps() reads whatever the
     day has left over, and this stretch is now guaranteed to be part of
     that. Clipped to the day window so an hour set outside it (or one that
     would spill past dayEnd) can't reserve time that isn't schedulable
     anyway. */
  const brk = reservedBreak();
  if(brk){ sessionLive.push({ s:brk.s, e:brk.e }); quickLive.push({ s:brk.s, e:brk.e }); }

  let shortRoom = Math.max(0, CFG.sessionMax - have.short);
  for(const c of ranked.filter(x=>x.size==="short")){
    if(shortRoom <= 0) break;
    const dur = c.est || CFG.shortMin;
    const s = findSlotWithAutoBreak(sessionLive, quickLive, activityLive, winS, winE, dur, nowMin);
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"short" });
    sessionLive.push({ s:s.s, e:s.e });
    quickLive.push({ s:s.s, e:s.e });
    activityLive.push({ s:s.s, e:s.e });
    shortRoom--;
  }

  /* Quick tasks land as one "quick-brick" entry, not one placed per card —
     see CLAUDE.md: Google Calendar shows a single event for the whole
     window, Daisey's own view still tracks each task inside it
     independently. Work-day size removed (2026-08-24) — quick tasks are no
     longer suppressed by an 8h card claiming the whole day. */
  {
    const quick = ranked.filter(x=>x.size==="quick");
    if(quick.length){
      const slice = CFG.quickTotal;
      let n = Math.min(quick.length, CFG.quickMax), slot = null;
      while(n > 0){
        slot = findSlots(quickLive, winS, winE, n*slice, 1, nowMin)[0];
        if(slot) break;
        n--;
      }
      if(slot){
        placed.push({ cards:quick.slice(0,n), s:slot.s, e:slot.s + n*slice, kind:"quick-brick" });
        quickLive.push({ s:slot.s, e:slot.s + n*slice });
      }
    }
  }

  /* a card never gets two blocks in one run */
  const seen = new Set();
  const unique = placed.filter(p => {
    const ids = p.kind==="quick-brick" ? p.cards.map(c=>c.id) : [p.card.id];
    if(ids.some(id=>seen.has(id))) return false;
    ids.forEach(id=>seen.add(id));
    return true;
  });
  unique.sort((a,b)=>a.s-b.s);
  return unique;
}
/* Leftover day time once `placed` lands, turned into break blocks. No minimum
   beyond rounding noise — deliberately loose, since the point is that every
   idle stretch shows up, not just the long ones. forSession:true so a break
   is never carved out of a permeable meeting's own time. */
const BREAK_MIN = 5;
function breakGaps(date, ignore, placed){
  const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const nowMin = sameDay(date,new Date()) ? Math.ceil(minsOf(new Date())/SNAP_MIN)*SNAP_MIN : null;
  const busy = busyFor(date, ignore, true);
  for(const p of placed) busy.push({ s:p.s, e:p.e });
  const from = nowMin==null ? winS : Math.max(winS, nowMin);
  /* a Break marks up to CFG.breakLen minutes at the front of each leftover
     gap, not the whole gap — a free window can be hours wide (the rest of
     the day, once everything's placed), and the block used to claim every
     minute of it regardless of the user's own Break length setting. The
     remainder of a wide gap stays genuinely unscheduled, same as it always
     was before a Break block existed.
     A break is a pause *between* two stretches of activity — it needs
     something on the other side of it. freeWindows()'s trailing window (the
     one that runs to winE with nothing merged after it) means there's simply
     nothing left today, not a break from anything, so it's dropped — unless
     a break hour is actually pinned (reservedBreak()) inside that trailing
     stretch, since that's an explicit user setting, not a heuristic guess,
     and must still show up even on a day with nothing scheduled after it.
     A pinned window is anchored at the pin's own start rather than the
     window's front, so slack before the pin doesn't shift the visible block
     off the time the user actually chose. */
  const pin = reservedBreak();
  const pinned = f => pin && f.s < pin.e && f.e > pin.s;
  return freeWindows(busy, from, winE)
    .filter(f => f.e - f.s >= BREAK_MIN)
    .filter(f => f.e < winE || pinned(f))
    .map(f => {
      const s = pinned(f) ? Math.max(f.s, pin.s) : f.s;
      return { s, e: Math.min(f.e, s + (CFG.breakLen || 60)) };
    });
}
/* ------------------------------------------------------ off-hours gap
   The stretch between "the working day is over" and "but there's still
   something on the calendar tonight".

   This is NOT a break and deliberately not one: a Break is a real Google
   Calendar event Daisey creates, inside the work window, as a pause between
   two stretches of work. This is the opposite — it exists precisely because
   `CFG.dayEnd` has passed, so nothing more will ever be scheduled into it.
   `breakGaps` can't express it either: it clamps everything to `winE`, so it
   is blind by construction to anything past the end of the day.

   Nothing is written to Google Calendar for this. It's derived at render
   time from what's already on screen — free time isn't an appointment, and
   creating an event for it would clutter the real calendar and get dragged,
   completed and swapped like work.

   Returns null unless there is a genuine gap: work actually ended, a real
   event starts later, and the space between them is worth naming. */
const OFFHOURS_MIN = 30;          // shorter than this is a turnaround, not an evening
function offHoursGap(items){
  if(!items || !items.length) return null;
  const winE = CFG.dayEnd*60;

  /* The last thing Daisey itself scheduled — a task, session or break. If
     the day holds no work at all there's no "after work" to mark. */
  let workEnd = -Infinity;
  for(const i of items) if(i.task && !i.isBreak) workEnd = Math.max(workEnd, i.e2);
  if(workEnd === -Infinity) return null;

  /* Anchor at whichever comes later: the end of the work window or the end
     of the last thing scheduled. A session that overruns dayEnd (planFor can
     place one that ends past it) must not produce a gap that starts in the
     past relative to its own card. */
  const from = Math.max(winE, workEnd);

  /* The next real commitment after that. Only foreign calendar events count:
     a Daisey block would mean work is still scheduled, which contradicts the
     whole premise. */
  let next = null;
  for(const i of items){
    if(i.task || i.isBreak) continue;
    if(i.allDay || (i.ev && i.ev.allDay)) continue;   // an all-day banner isn't a commitment at a time
    if(i.s >= from && (!next || i.s < next.s)) next = i;
  }
  if(!next) return null;
  if(next.s - from < OFFHOURS_MIN) return null;

  return { s:from, e2:next.s, until:next };
}

/* A run rebuilds the day: every card-linked block it is allowed to touch is
   cleared and the day is laid out again under the caps. That is what keeps a
   day stuffed with Trello-generated blocks from staying stuffed.

   Used to hold the whole day invisible behind S.busy for every delete+create
   round trip — Rebuild could take several seconds of a static "…" button
   before the new day ever appeared. Now the plan lands on the model and
   renders on the same tick (cleared blocks dropped, placed ones standing in
   via localBlock, same primitives Swap already uses), and the actual
   Trello/Calendar writes run behind it. S.busy still gates re-entrancy and
   disables the button, and still clears once the background sequence
   settles — it just no longer blocks the day from updating. */
function applyPlan(date, mode, picked, rebuild){
  if(S.busy) return;
  const clearable = rebuild ? clearableBlocks(date) : [];
  const ignore = new Set(clearable.map(e => e.id));
  const placed = planFor(date, mode, picked, ignore);
  const gaps = rebuild ? breakGaps(date, ignore, placed) : [];

  S.busy = true;
  /* undo closures, kept per-id: a delete that fails below has to put its
     block back, or planFor's "that slot is free" assumption (made against
     the optimistically-cleared local model, before any delete actually
     landed) goes uncorrected — the create pass then hands the same card a
     brand-new block in the same slot the old, still-real one occupies.
     That's how a rebuild used to leave a card with two identical blocks
     side by side: the delete silently failed, nothing put the local model
     back, and nothing kept the re-plan from filling the "freed" slot. */
  const undoClear = new Map(clearable.map(e => [e.id, dropLocalEvent(e.id)]));
  const stands = placed.map(p => p.kind==="quick-brick"
    ? localBrickBlock(p.cards, atMin(date,p.s), atMin(date,p.e))
    : localBlock(p.card, atMin(date,p.s), atMin(date,p.e), p.kind));
  stands.forEach(s => { addLocalEvent(s); S.pending.add(s.id); });
  const gapStands = gaps.map(g => localBreakBlock(atMin(date,g.s), atMin(date,g.e)));
  gapStands.forEach(s => { addLocalEvent(s); S.pending.add(s.id); });
  render();

  (async () => {
    let cleared = 0;
    const keepCardId = new Set();   // cards whose old block survived a failed delete
    for(const e of clearable){
      try{ await deleteBlock(e.id); cleared++; }
      catch(err){
        for(const c of cardsFor(e)) keepCardId.add(c.id);
        undoClear.get(e.id)();
        toast(errCopy(err), true);
        queueFailed("Clear block", async () => {
          const undo2 = dropLocalEvent(e.id);
          try{ await deleteBlock(e.id); render(); }
          catch(err2){ undo2(); render(); throw err2; }
        });
      }
    }
    let ok=0, broke=false;
    const settled = [];   // stand-ins whose real create succeeded — dropped as a batch, below
    for(let i=0; i<placed.length; i++){
      const p = placed[i], stand = stands[i];
      const pCards = p.kind==="quick-brick" ? p.cards : [p.card];
      if(pCards.some(c => keepCardId.has(c.id))){
        /* its old block is still real (the delete above failed) — creating
           this one anyway is exactly the duplicate this guard exists to
           stop, so the stand-in is dropped unfilled instead. */
        S.pending.delete(stand.id);
        dropLocalEvent(stand.id);
        continue;
      }
      try{
        if(p.kind==="quick-brick") await createBrickBlock(p.cards, atMin(date,p.s), atMin(date,p.e));
        else await createBlock(p.card, atMin(date,p.s), atMin(date,p.e), p.kind);
        ok++;
        S.pending.delete(stand.id);
        settled.push(stand);
        let st;
        for(const c of pCards){
          st = bumpCategory(c.boardName,"picked");
          st.rollovers = st.rollovers || {};
          st.rollovers[c.id] = st.rollovers[c.id] || { first:dayKey(date), count:0 };
        }
        S.stats = st;
      }catch(e){
        toast(errCopy(e), true);
        S.pending.delete(stand.id);
        dropLocalEvent(stand.id);   // never became real — take the stand-in back off
        if(AUTHZ.has(e && e.code)){
          broke = true;
          for(let j=i+1; j<stands.length; j++){ S.pending.delete(stands[j].id); dropLocalEvent(stands[j].id); }
          break;
        }
      }
    }
    /* Each stand-in stays on screen, unremoved, through its own create — a
       connector that hands back the exact same live array on every fetch
       (the test stub does; nothing guarantees a real one won't append rather
       than replace either) would otherwise show the stand-in and the real
       block it became side by side forever. Drop them as a batch right
       before the refresh that's about to bring in the authoritative data
       anyway, rather than trusting a wholesale-replacement that isn't
       actually guaranteed. */
    settled.forEach(s => dropLocalEvent(s.id));
    /* Breaks are derived, cosmetic state — never worth a real retry/undo
       bar over. Skipped outright (not attempted, not queued) unless every
       old block cleared cleanly and nothing broke — the same failure this
       run's task-duplicate guard above exists to prevent (a stale block
       still occupying the slot a fresh break would claim), just resolved
       by not writing rather than by tracking per-slot survivors. A skipped
       break simply reappears, correctly, on the next successful rebuild. */
    if(!broke && cleared === clearable.length){
      for(const g of gaps){
        try{ await createBreakBlock(atMin(date,g.s), atMin(date,g.e)); }
        catch(e){ logErr("applyPlan/createBreakBlock", e); }
      }
    }
    gapStands.forEach(s => { S.pending.delete(s.id); dropLocalEvent(s.id); });
    /* A run clears the day before it rebuilds it, so a connector that dies
       between the two halves used to leave the day wiped and only partly
       re-laid — strictly worse than not running at all. If nothing at all got
       placed while the plan wanted blocks, put back what was cleared. */
    if(broke && !ok && cleared){
      let back = 0;
      const recovered = [];
      for(const e of clearable){
        if(e.isBrick){
          const cs = cardsFor(e);
          if(!cs.length) continue;
          try{
            await createBrickBlock(cs, e.start, e.end);
            back++;
            const stand = localBrickBlock(cs, e.start, e.end);
            addLocalEvent(stand); S.pending.add(stand.id); recovered.push(stand);
          }catch(e){ logErr("applyPlan/recover brick", e); }
          continue;
        }
        const c = cardFor(e);
        if(!c) continue;
        try{
          await createBlock(c, e.start, e.end, e.size);
          back++;
          const stand = localBlock(c, e.start, e.end, e.size);
          addLocalEvent(stand); S.pending.add(stand.id); recovered.push(stand);
        }catch(e){ logErr("applyPlan/recover block", e); }
      }
      S.busy = false;
      recovered.forEach(s => { S.pending.delete(s.id); dropLocalEvent(s.id); });
      await refreshCalendar();
      toast(back ? "Rebuild failed — the day was put back." : "Rebuild failed.", true);
      render();
      return;
    }
    const st = S.stats || { ...DEFAULT_STATS };
    st.plans = st.plans || {};
    st.plans[dayKey(date)] = { mode, n:ok, at:Date.now() };
    const keys = Object.keys(st.plans).sort();
    while(keys.length > 30) delete st.plans[keys.shift()];
    saveStats(st);
    S.busy = false;
    await refreshCalendar();
    if(ok) toast(cleared ? `${ok} task${ok===1?"":"s"} · cleared ${cleared}` : `Scheduled ${ok} task${ok===1?"":"s"}.`);
    else if(cleared) toast(`Cleared ${cleared} · rolls to the next day`);
    else toast("Day is full.");
    render();
  })().catch(err => {
    S.busy = false;
    toast(errCopy(err), true);
    render();
  });
}
async function rolloverSweep(){
  const st = S.stats || { ...DEFAULT_STATS };
  const today = dayKey(new Date());
  if(st.lastSweep === today) return;
  st.rollovers = st.rollovers || {};
  const open = new Set(candidates().map(c=>c.id));
  for(const [id,r] of Object.entries(st.rollovers)){
    if(!open.has(id)){ delete st.rollovers[id]; continue; }
    if(r.last !== today){ r.count = (r.count||0)+1; r.last = today; }
  }
  st.lastSweep = today;
  await saveStats(st);
}

/* ---------------------------------------------------------------- writes */
async function createBlock(card, start, end, size){
  const emoji = size === "short" ? "🎵 " : "• ";
  const colorId = size === "short" ? "5" : "9";
  /* colorId stays the pure quick/short/long signal every scheduling
     decision reads back — see CLAUDE.md. The real sync gap was the
     description: it used to be a bare marker+link, so opening the block
     directly in Google Calendar told you nothing about the actual task.
     The marker and the Trello link both stay findable by shortLinkOf()'s
     regex and the DF_MARK substring check regardless of what's between
     them, so this is safe to enrich. */
  const desc = (card.desc || "").trim().slice(0, 500);
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary: emoji + card.name,
    startTime:iso(start), endTime:iso(end),
    description:`${DF_MARK} ${card.name}${desc ? "\n\n"+desc : ""}\n\nOriginal: ${card.url}`,
    colorId
  });
  return res.payload;
}
/* Quick tasks share one contiguous window (see CLAUDE.md's brick rules):
   Google Calendar is treated as pure display for this window, so it gets
   ONE event covering the whole thing rather than one per task — Daisey's
   own view is what still tracks and acts on each task independently, via
   the multiple "Original: <url>" lines this description carries (one per
   card, parsed back by shortLinksOf/cardsFor). A single quick task never
   reaches this path — planFor only emits a "quick-brick" kind, and this
   function is only ever called with cards.length>=2 for that kind. */
function brickDesc(cards){
  return `${DF_MARK} ${cards.length} tasks\n\n` +
    cards.map(c => `• ${c.name}\nOriginal: ${c.url}`).join("\n\n");
}
async function createBrickBlock(cards, start, end){
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary: `• ${cards.length} tasks`,
    startTime:iso(start), endTime:iso(end),
    description: brickDesc(cards),
    colorId: "9"
  });
  return res.payload;
}
/* Done/Swap/Remove on one task inside a brick never delete-and-recreate the
   shared event (that would flash/reorder the block for no reason) — they
   rewrite its description to the remaining card list. Deleting the whole
   event is reserved for when no cards are left; see completeItemInBrick/
   removeFromBrick. */
const updateBrickDesc = (id, cards) => callTool(GCAL, "update_event",
  { calendarId:CAL_ID, eventId:id, description: brickDesc(cards), notificationLevel:"NONE" });
/* A break has no card behind it — colorId 7 (unused by quick/short/long)
   is its own fixed signal, same idea as size's colorId mapping above, and
   isBreak in allEvents() is what actually reads it back (mine && no link,
   not the colour — the colour is just what Google Calendar shows). */
async function createBreakBlock(start, end){
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary: "☕ Break",
    startTime:iso(start), endTime:iso(end),
    description: `${DF_MARK} Break`,
    colorId: "7"
  });
  return res.payload;
}
const moveBlock = (id,start,end) => callTool(GCAL, "update_event",
  { calendarId:CAL_ID, eventId:id, startTime:iso(start), endTime:iso(end), notificationLevel:"NONE" });
const deleteBlock = id => callTool(GCAL, "delete_event",
  { calendarId:CAL_ID, eventId:id, notificationLevel:"NONE" });
/* A failed invalidate leaves the user looking at stale events with no sign
   anything went wrong, so it is worth a log even though it must not throw. */
async function refreshCalendar(){ try{ await S.mcp.invalidate(GCAL, "list_events"); }catch(e){ logErr("refreshCalendar/invalidate", e); } }

/* Drag/resize/reorder all go through these two: patch the block's time
   locally so render() shows the result immediately, then let the actual
   Google Calendar write happen in the background instead of holding the
   UI up for the round trip — that wait was most of what made dragging a
   card feel slow. findRawEvent reaches into S.events.payload directly
   because allEvents() re-derives fresh decorated objects from it on every
   call rather than caching them, so patching one of those copies wouldn't
   stick.
   evVer guards against a stale write's failure clobbering a newer move:
   if this id gets dragged again before the first write lands, the first
   write's eventual rejection must not roll back the second one's result —
   only the still-current version for that id is allowed to revert. */
function findRawEvent(id){
  const list = S.events && S.events.payload && S.events.payload.events;
  return (list || []).find(e => e.id === id) || null;
}
function applyLocalMove(id, start, end){
  const raw = findRawEvent(id);
  if(!raw) return null;
  const prevRaw = { start: raw.start, end: raw.end };
  raw.start = { dateTime: iso(start) };
  raw.end = { dateTime: iso(end) };
  S.evVer[id] = (S.evVer[id] || 0) + 1;
  return prevRaw;
}
/* Same local-first patch as applyLocalMove, for a brick's shared
   description (Done/Remove on one task inside it — see CLAUDE.md's brick
   rules) — cards is the survivor list to render immediately, ahead of the
   real update_event/delete_event write. Returns an undo closure, same
   shape as dropLocalEvent/addLocalEvent, since a brick "drop" only ever
   rewrites the raw event in place rather than removing it from the list
   (deletion, when this was the last task, is handled by the caller via
   dropLocalEvent instead — see completeItemInBrick/doRemoveFromBrick). */
function applyLocalBrickDesc(id, cards){
  const raw = findRawEvent(id);
  if(!raw) return () => {};
  const prevDesc = raw.description;
  raw.description = brickDesc(cards);
  return () => { raw.description = prevDesc; };
}
/* Same idea one level up, for the actions that add or take away a block
   rather than re-time one: Done, Swap, Remove and Pending all used to hold
   the whole UI still behind `S.pending` while two or three round trips to
   Trello and Google Calendar finished, which is exactly the wait that made
   dragging feel slow before commitMove existed. Each returns an undo closure
   so the background write's failure path can put the model back. */
const rawEvents = () => (S.events && S.events.payload && S.events.payload.events) || null;
function dropLocalEvent(id){
  const list = rawEvents();
  if(!list) return () => {};
  const i = list.findIndex(e => e.id === id);
  if(i < 0) return () => {};
  const [gone] = list.splice(i,1);
  return () => { if(!list.includes(gone)) list.splice(Math.min(i,list.length), 0, gone); };
}
function addLocalEvent(raw){
  const list = rawEvents();
  if(!list) return () => {};
  list.push(raw);
  return () => { const i = list.indexOf(raw); if(i>=0) list.splice(i,1); };
}
/* A stand-in for a block Google hasn't given us an id for yet. It carries the
   same marker and colorId the real one will, so allEvents() reads it back as
   the right size and links it to its card exactly like the real thing. */
function localBlock(card, start, end, size){
  return {
    id: "local-" + Math.random().toString(36).slice(2),
    colorId: size === "short" ? "5" : "9",
    summary: (size === "short" ? "🎵 " : "• ") + card.name,
    description: `${DF_MARK} ${card.name}\n\nOriginal: ${card.url}`,
    start:{ dateTime: iso(start) }, end:{ dateTime: iso(end) },
    status:"confirmed"
  };
}
/* Same stand-in idea as localBlock, for a merged quick-task window — see
   createBrickBlock/brickDesc. */
function localBrickBlock(cards, start, end){
  return {
    id: "local-" + Math.random().toString(36).slice(2),
    colorId: "9",
    summary: `• ${cards.length} tasks`,
    description: brickDesc(cards),
    start:{ dateTime: iso(start) }, end:{ dateTime: iso(end) },
    status:"confirmed"
  };
}
/* Same stand-in idea, no card to carry — see createBreakBlock. */
function localBreakBlock(start, end){
  return {
    id: "local-" + Math.random().toString(36).slice(2),
    colorId: "7",
    summary: "☕ Break",
    description: `${DF_MARK} Break`,
    start:{ dateTime: iso(start) }, end:{ dateTime: iso(end) },
    status:"confirmed"
  };
}
/* Optimistic card-field patch: normCard() rebuilds the decorated card from
   the raw payload node on every render, so the change has to land there. */
function patchLocalCard(card, fields){
  const raw = rawCardNode(card);
  const prev = {};
  for(const k in fields){
    prev[k] = raw ? raw[k] : card[k];
    if(raw) raw[k] = fields[k];
    card[k] = fields[k];
  }
  return () => { for(const k in prev){ if(raw) raw[k] = prev[k]; card[k] = prev[k]; } };
}
function commitMove(id, start, end, prevRaw, label){
  const ver = S.evVer[id];
  moveBlock(id, start, end).then(
    () => { if(S.evVer[id] === ver) refreshCalendar().then(render); },
    e => {
      if(S.evVer[id] !== ver) return;   // superseded by a later move — leave it be
      const raw = findRawEvent(id);
      if(raw && prevRaw){ raw.start = prevRaw.start; raw.end = prevRaw.end; }
      toast(errCopy(e), true);
      /* the block snapped back on screen, but the move the user made is still
         gone — hold it in the unsaved list so it's retryable rather than only
         announced for three seconds and then forgotten */
      queueFailed(label || "Move", async () => {
        const again = applyLocalMove(id, start, end);
        try{ await moveBlock(id, start, end); render(); }
        catch(err){
          const r = findRawEvent(id);
          if(r && again){ r.start = again.start; r.end = again.end; }
          render();
          throw err;
        }
      });
      render();
    }
  );
}

/* Done is the action that most needs to feel instant — it's the one you press
   dozens of times a day — so the card strikes through and the progress pill
   moves on the same frame as the tap, and Trello hears about it afterwards.
   The whole stats bump (streak, history, rollover clear) happens locally too:
   S.stats is the in-memory source of truth and saveStats already writes it in
   the background with its own retry/unsaved handling. */
function completeItem(item){
  const card = item.card;
  const key = card ? card.id : item.ev.id;
  if(S.pending.has(key)) return;

  const undo = card ? patchLocalCard(card, { dueComplete:true }) : (()=>{});
  celebrate();
  dopamineBurst();
  setMascot("cheer", 1200);

  const st = bumpCategory(card ? card.boardName : "—", "done");
  const today = dayKey(new Date());
  st.history = st.history || [];
  let h = st.history.find(x=>x.d===today);
  if(!h){ h={ d:today, done:0 }; st.history.push(h); }
  h.done++;
  while(st.history.length > 60) st.history.shift();
  if(st.lastCompletionDate !== today){
    st.streak = (st.lastCompletionDate === dayKey(addDays(new Date(),-1))) ? (st.streak||0)+1 : 1;
    st.lastCompletionDate = today;
  }
  if(card && st.rollovers) delete st.rollovers[card.id];
  render();

  if(!card){ saveStats(st); return; }

  S.pending.add(key);
  const write = () => callTool(TRELLO, "trelloWriteCard", { action:"mark_done", cardId:card.id })
    .then(()=>{ S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{}); });
  write().then(
    ()=>{ S.pending.delete(key); saveStats(st); render(); },
    e =>{
      S.pending.delete(key);
      undo();                       // the strike-through comes back off
      toast(errCopy(e), true);
      queueFailed(`Done: ${card.name}`, async () => {
        const again = patchLocalCard(card, { dueComplete:true });
        try{ await write(); saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}

function removeItem(item){
  const name = item.card ? item.card.name : item.ev.summary;
  return confirmDialog("Remove this?", name + (item.card ? "\n\nArchives the card and clears its block." : "\n\nClears the block."), "Remove")
    .then(ok => { if(ok) doRemove(item); });
}
function doRemove(item){
  const id = item.ev.id, card = item.card;
  const label = card ? card.name : (item.ev.summary || "block");
  if(S.pending.has(id)) return;
  S.pending.add(id);

  /* the block leaves the list on the tap, not two round trips later */
  const restore = dropLocalEvent(id);
  const st = card ? bumpCategory(card.boardName, "skipped") : null;
  if(st && st.rollovers && card) delete st.rollovers[card.id];
  render();
  toast("Removed.");

  /* Block first, card second. Archiving first meant a failed delete left an
     archived card still holding a live block — invisible in Trello, still
     eating the slot, and not recoverable from inside the widget. Clearing the
     block first is the reversible half: if the archive then fails, the worst
     case is an unscheduled card that's still open. */
  const write = async () => {
    await deleteBlock(id);
    if(card){
      await callTool(TRELLO, "trelloWriteCard", { action:"archive", cardId:card.id });
      await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    }
  };
  write().then(
    ()=>{ S.pending.delete(id); if(st) saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id);
      restore();
      toast(errCopy(e), true);
      queueFailed(`Remove: ${label}`, async () => {
        const again = dropLocalEvent(id);
        try{ await write(); if(st) saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}

/* remainingCards: item.cards minus whichever card just finished/was
   removed, and minus anything already dueComplete — the local patch in
   completeItemInBrick flashes a struck-through row for one render (same
   instant-feedback beat completeItem gives everywhere else) before the
   card disappears from the shared description; leaving a dueComplete card
   out here is what makes that disappearance permanent instead of the next
   description write re-listing a task that's actually finished. Shared by
   completeItemInBrick and removeFromBrick so both edit the event the same
   way: rewrite the description down to the survivors, or delete the whole
   event once none are left. */
function brickSurvivors(item, dropId){
  return item.cards.filter(c => c.id !== dropId && !c.dueComplete);
}
function writeBrickAfterDrop(id, rest){
  return rest.length ? updateBrickDesc(id, rest) : deleteBlock(id);
}
/* Done on one task inside a brick (see CLAUDE.md's brick rules): local-first
   like completeItem — patches the card AND rewrites the brick event's raw
   description in the same tick, so render() immediately shows the task
   struck through and gone from the list on the next open. The calendar
   write mirrors that: rewrite the shared description to the survivors, or
   delete the whole event if this was the last task standing. */
function completeItemInBrick(item, card){
  if(S.pending.has(card.id)) return;

  const rest = brickSurvivors(item, card.id);
  const undoCard = patchLocalCard(card, { dueComplete:true });
  const undoDesc = rest.length ? applyLocalBrickDesc(item.ev.id, rest) : dropLocalEvent(item.ev.id);
  celebrate();
  dopamineBurst();
  setMascot("cheer", 1200);

  const st = bumpCategory(card.boardName, "done");
  const today = dayKey(new Date());
  st.history = st.history || [];
  let h = st.history.find(x=>x.d===today);
  if(!h){ h={ d:today, done:0 }; st.history.push(h); }
  h.done++;
  while(st.history.length > 60) st.history.shift();
  if(st.lastCompletionDate !== today){
    st.streak = (st.lastCompletionDate === dayKey(addDays(new Date(),-1))) ? (st.streak||0)+1 : 1;
    st.lastCompletionDate = today;
  }
  if(st.rollovers) delete st.rollovers[card.id];
  render();

  S.pending.add(card.id);
  const write = async () => {
    await callTool(TRELLO, "trelloWriteCard", { action:"mark_done", cardId:card.id });
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    await writeBrickAfterDrop(item.ev.id, rest);
  };
  write().then(
    ()=>{ S.pending.delete(card.id); saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(card.id);
      undoCard(); undoDesc();
      toast(errCopy(e), true);
      queueFailed(`Done: ${card.name}`, async () => {
        const again1 = patchLocalCard(card, { dueComplete:true });
        const again2 = rest.length ? applyLocalBrickDesc(item.ev.id, rest) : dropLocalEvent(item.ev.id);
        try{ await write(); saveStats(st); render(); }
        catch(err){ again1(); again2(); render(); throw err; }
      });
      render();
    }
  );
}
/* Remove on one task inside a brick — mirrors doRemove, but the calendar
   write is the same shared-description rewrite/delete-if-last as
   completeItemInBrick, not a whole-event delete. */
function removeFromBrick(item, card){
  return confirmDialog("Remove this?", card.name + "\n\nArchives the card. Removes just this task from the block.", "Remove")
    .then(ok => { if(ok) doRemoveFromBrick(item, card); });
}
function doRemoveFromBrick(item, card){
  if(S.pending.has(card.id)) return;
  S.pending.add(card.id);

  const rest = brickSurvivors(item, card.id);
  const undoDesc = rest.length ? applyLocalBrickDesc(item.ev.id, rest) : dropLocalEvent(item.ev.id);
  const st = bumpCategory(card.boardName, "skipped");
  if(st.rollovers) delete st.rollovers[card.id];
  render();
  toast("Removed.");

  const write = async () => {
    await writeBrickAfterDrop(item.ev.id, rest);
    await callTool(TRELLO, "trelloWriteCard", { action:"archive", cardId:card.id });
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
  };
  write().then(
    ()=>{ S.pending.delete(card.id); saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(card.id);
      undoDesc();
      toast(errCopy(e), true);
      queueFailed(`Remove: ${card.name}`, async () => {
        const again = rest.length ? applyLocalBrickDesc(item.ev.id, rest) : dropLocalEvent(item.ev.id);
        try{ await write(); saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}

/* A card that's actively waiting on someone/something else: not done, not
   abandoned — just off today. Writes Daisey's own Pending marker and clears
   today's block, but never touches the card's list/archive state.
   The marker always releases itself on the calendar, never on an edit: with
   no date it parks the card for the rest of today and it's a candidate again
   tomorrow; with a "check back on" date it sits out until that date and is a
   candidate every day from then (normCard's `blocked` / PENDING_RE). That's
   deliberate — a card must never need a trip back into Trello to become
   schedulable again. The description pencil can still edit the marker away
   early, but nothing depends on the user doing so. */
/* edits: optional {desc, until, items:[{cl,it,text,checked}]} gathered by
   pendingDialog() — lets "why is this waiting" get written down (and a
   subtask ticked off) in the same motion that parks the card, instead of
   a separate trip back into the card afterward. */
function pendingItem(item, edits){
  const card = item.card;
  /* A row exploded from a brick (item.cards set — see agenda()) is tracked
     by card id, same as completeItemInBrick/doRemoveFromBrick — two
     siblings inside the same brick have to be actionable independently, so
     guarding by the shared item.ev.id would block one while the other is
     mid-write. A plain single-card row keeps the original event-id guard. */
  const id = item.cards ? card.id : item.ev.id;
  if(!card || S.pending.has(id)) return;
  S.pending.add(id);

  /* The dialog has already been confirmed at this point, so the card is off
     today either way — take the block off screen now (or, for a brick task,
     rewrite the shared event down to whoever's left) and let the
     description write and the calendar clear happen behind it. */
  const brickRest = item.cards ? brickSurvivors(item, card.id) : null;
  const restore = item.cards
    ? (brickRest.length ? applyLocalBrickDesc(item.ev.id, brickRest) : dropLocalEvent(item.ev.id))
    : dropLocalEvent(id);
  const body = (()=>{
    if(card.blocked) return null;
    /* The Start marker always comes from card.desc, never from `edits.desc` —
       the pendingDialog textarea shows the user marker-stripped text (see
       withoutStartMarker there), so edits.desc never has one to find even
       when a Start date is set. Re-appended at the *end*, after composing
       the rest, since it no longer has to stay an outermost prefix now that
       it isn't sharing the front of the string with Pending's `^`-anchored
       marker. An already-returned Pending card (undated, or dated and past
       due — see pendingReturned) is no longer `blocked`, so re-pending it is
       a reachable path, not dead code: any existing Pending marker is peeled
       off too, so this replaces it instead of nesting a second one inside. */
    const marker = extractStartMarker(card.desc);
    const raw = edits ? edits.desc : withoutStartMarker(card.desc);
    let rest = raw || "";
    const oldPend = PENDING_RE.exec(rest);
    if(oldPend) rest = rest.slice(oldPend[0].length);
    const trimmed = rest.trim();
    /* No "check back on" date given still means "not today" — so it's written
       as a dated marker for today rather than a bare one. That's the whole
       implementation of "an undated Pending returns tomorrow": the existing
       dated machinery (PENDING_RE / notYetDue) already expires a date at the
       end of its own day, so there's no separate undated code path to keep in
       sync. A bare marker would read as "blocked forever" to normCard, which
       is exactly the behaviour this replaced. */
    const mark = pendingMark((edits && edits.until) || dayKey(new Date()));
    const composed = trimmed ? mark + "\n\n" + trimmed : mark.trim();
    return marker ? composed + "\n\n" + marker : composed;
  })();
  const undoDesc = body === null ? (()=>{}) : patchLocalCard(card, { desc:body });
  render();
  toast("Set aside as pending.");

  const write = async () => {
    if(edits && edits.items){
      for(const {cl, it, text, checked} of edits.items){
        if(checked !== (it.state === "COMPLETE")) await toggleItem(card, cl.id, it);
        if(text !== (it.name || "")) await saveItemText(cl.id, it, text);
      }
    }
    if(body !== null) await writeCardDesc(card, body);
    if(item.cards) await writeBrickAfterDrop(item.ev.id, brickRest);
    else await deleteBlock(id);
  };
  write().then(
    ()=>{ S.pending.delete(id); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id);
      restore(); undoDesc();
      toast(errCopy(e), true);
      queueFailed(`Pending: ${card.name}`, async () => {
        const againEv = item.cards
          ? (brickRest.length ? applyLocalBrickDesc(item.ev.id, brickRest) : dropLocalEvent(item.ev.id))
          : dropLocalEvent(id);
        const againDesc = body === null ? (()=>{}) : patchLocalCard(card, { desc:body });
        try{ await write(); render(); }
        catch(err){ againEv(); againDesc(); render(); throw err; }
      });
      render();
    }
  );
}

/* Popup that opens on Pending: lets you edit the description and tick/edit
   checklist items before the card is parked, instead of committing blind.
   Cancel changes nothing — the card isn't touched until "Set pending". */
function pendingDialog(item){
  const card = item.card;
  if(!card || S.pending.has(item.cards ? card.id : item.ev.id)) return;
  const bag = S.lists[card.id];
  const lists = (bag && bag.checklists) || [];

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null,"Set aside as pending"));
  const sub = el("p"); bidi(sub, card.name); h.appendChild(sub);
  dlg.appendChild(h);

  const body = el("div","details pending-edit");
  const taWrap = el("div","edit-row");
  const ta = el("textarea");
  const visibleDesc = withoutStartMarker(card.desc);   // hidden Start marker isn't user text — see START_RE
  ta.value = visibleDesc;
  ta.rows = Math.min(10, Math.max(3, visibleDesc.split("\n").length + 1));
  ta.placeholder = "What are you waiting on?";
  taWrap.appendChild(ta);
  body.appendChild(taWrap);

  const untilRow = el("div","until-row");
  const untilLbl = el("label",null,"Check back on");
  const untilInp = el("input","until-in");
  untilInp.type = "date";
  untilInp.min = dayKey(addDays(startOfDay(new Date()),1));
  untilLbl.appendChild(untilInp);
  const untilHint = el("span","muted","optional — clears the marker on its own once this date passes");
  untilRow.appendChild(untilLbl); untilRow.appendChild(untilHint);
  body.appendChild(untilRow);

  const itemEdits = [];
  for(const cl of lists){
    const items = cl.checkItems || [];
    if(!items.length) continue;
    const head = el("div","clname");
    const nm = el("span"); bidi(nm, /^checklist$/i.test(cl.name||"") ? "" : (cl.name||"")); head.appendChild(nm);
    body.appendChild(head);
    const ul = el("ul");
    for(const it of items){
      let checked = it.state === "COMPLETE";
      const li = el("li", checked ? "on" : "");
      const b = el("button","box","✓");
      b.type = "button"; b.setAttribute("aria-pressed", String(checked));
      b.addEventListener("click", ()=>{
        checked = !checked; li.classList.toggle("on",checked); b.setAttribute("aria-pressed",String(checked));
      });
      li.appendChild(b);
      const inp = el("input","edit-item");
      inp.type = "text"; inp.value = it.name || "";
      li.appendChild(inp);
      ul.appendChild(li);
      itemEdits.push({ cl, it, getText:()=>inp.value, getChecked:()=>checked });
    }
    body.appendChild(ul);
  }
  if(bag && bag.loading) body.appendChild(el("div","muted","Checklist still loading — you can still set this pending."));
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", close);
  const go = el("button","btn primary","Set pending");
  go.addEventListener("click", ()=>{
    const edits = { desc: ta.value, until: untilInp.value || null,
      items: itemEdits.map(x => ({ cl:x.cl, it:x.it, text:x.getText(), checked:x.getChecked() })) };
    close();
    pendingItem(item, edits);
  });
  f.appendChild(cancel); f.appendChild(go);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  ta.focus();
}

/* ---------------------------------------------------------------- agenda */
/* One ordered list for the viewed day: task blocks (actionable) + meetings. */
function agenda(){
  const date = startOfDay(S.anchor);
  const items = allEvents()
    .filter(e => !e.allDay && overlapsDay(e,date))
    .flatMap(e => {
      /* A brick event (multiple "Original:" links — see CLAUDE.md) is
         Google Calendar's own view only: Daisey's Day list explodes it back
         into one row per task, each still pointing at the shared event, so
         Done/Swap/Remove/Pending on any one task keep working exactly like
         a normal single-card row (rowId — see wireStackDrag/pushReorder —
         is what keeps sibling rows from colliding on S.openRow/S.expanded
         despite sharing one item.ev.id). item.cards carries the full
         sibling list (needed by brickSurvivors et al. so a per-task action
         can rewrite the shared description down to whoever's left, or
         delete the event outright once none are). A brick with exactly one
         card doesn't reach this branch at all — allEvents() only sets
         isBrick for 2+ links, so a lone quick task already takes the plain
         single-card path below, unchanged. */
      if(e.isBrick){
        const cards = cardsFor(e);
        /* Each card gets its own CFG.quickTotal-wide slice of the shared
           window, back to back from the event's own start — same "every
           quick task gets its own fixed slice" sizing planFor/relayRows
           already use to build/repack a brick. Without this every sibling
           row read the *whole* event's start/end, so all of them showed
           the identical time range instead of their own real slot. */
        const evS = minsOf(e.start);
        return cards.map((card,i) => ({
          ev:e, card, cards, isBrick:true,
          /* Position within the brick. timelineItem reads this to state the
             shared window once (on sibling 0) and give every sibling its
             own start, in its in-card time badge. Kept distinct from plain
             array order because the rows can be reordered/split by a drag
             before they reach render. */
          brickPos: i,
          task:e.isTask, isBreak:false,
          title: card.name,
          s: evS + i*CFG.quickTotal, e2: evS + (i+1)*CFG.quickTotal,
          done: !!card.dueComplete
        }));
      }
      const card = e.isTask ? cardFor(e) : null;
      return [{
        ev:e, card,
        task:e.isTask, isBreak:e.isBreak,
        title: card ? card.name : (e.isBreak ? "Break" : e.summary),
        s:minsOf(e.start), e2:minsOf(e.end),
        done: !!(card && card.dueComplete)
      }];
    })
    .sort((a,b) => a.s - b.s || a.e2 - b.e2);
  return items;
}
function splitAgenda(){
  const items = agenda();
  const isToday = sameDay(S.anchor, new Date());
  const nowMin = minsOf(new Date());
  /* a break is never "work" — it can't be the hub, can't be missed, and
     doesn't count toward the done/open progress pill */
  const open = items.filter(i => i.task && !i.done && !i.isBreak);

  /* The hub answers "what am I doing right now" — running, or if nothing
     is, whatever's genuinely still ahead. It must NEVER fall back to the
     earliest open task once that task's own slot has already passed
     (2026-08-27, user request: "if the time has passed from the card's
     time it shouldn't be the main card... if he passed a task without
     touching it it should turn to another color to say you missed me").
     The old third fallback (`open[0]`) picked the earliest open task
     unconditionally once nothing was "now" or "next" — which is exactly
     the moment every remaining open task's own end has already passed
     (open.find(i.e2>nowMin) came back empty), so it always grabbed a
     STALE task and re-presented it as the current focus. A task that slips
     past its own slot untouched isn't what the user is doing now; it falls
     through to `missed` below instead, where the existing .miss styling
     already marks it (grey surface, muted text) — that IS the "you missed
     me" colour the request asks for, just not previously reachable from
     here because a missed task always got re-adopted as current first. */
  let current = null;
  if(isToday){
    current = open.find(i => i.s <= nowMin && i.e2 > nowMin)     // happening now
           || open.find(i => i.e2 > nowMin)                       // next up, not yet missed
           || null;                                               // everything open has slipped — none of it is "now"
  }else{
    current = open[0] || null;
  }
  /* A meeting outranks the hub whenever it comes first chronologically —
     either it's happening right now, or it starts before the hub task does
     (e.g. a 6:00 meeting with the day window starting at 9:00: the hub
     still picks the 9:00 task as "next up" since meetings aren't
     actionable work, but the meeting itself is earlier and must render
     above it, not buried below in the later-items list). This holds on
     any viewed day, not just today — a future day has no "happening now"
     to check, but its own earliest meeting still belongs above its hub.
     `items` is already time-sorted, so .find gives the earliest qualifier. */
  const meetingNow = items.find(i => {
    if(i.task) return false;
    if(isToday){
      if(i.e2 <= nowMin) return false;      // already ended today
      if(i.s <= nowMin) return true;        // happening right now
    }
    return current && i.s < current.s;      // starts before the hub task
  }) || null;

  /* A break can never be the hub (see `open` above — it isn't "work"), so
     the hub picker skips straight past it to whatever real task/session
     comes next. Left alone, that meant a break sitting earlier in the day
     than the hub still rendered below it, in the plain `rest` list — "5-6
     break, 6-9 session" showed the 6-9 session on top and the break
     underneath it, contradicting the times printed on both cards. Same
     outranking rule meetingNow already applies to a real meeting: a break
     that hasn't ended yet and starts before the hub's task belongs above
     it, not buried in the scroll. Only one such break can be relevant at
     a time (`items` is time-sorted, .find takes the earliest), same as
     meetingNow. */
  const breakNow = items.find(i => {
    if(!i.isBreak) return false;
    if(isToday && i.e2 <= nowMin) return false;   // already ended today
    return current && i.s < current.s;             // starts before the hub task
  }) || null;

  /* a task whose slot already passed isn't "later" — it's unfinished.
     It keeps its own group so "Later today" stays a truthful forecast. */
  const missed = isToday
    ? items.filter(i => i !== current && i.task && !i.done && !i.isBreak && i.e2 <= nowMin)
    : [];
  /* Same outranking rule as meetingNow/breakNow, applied to missed tasks:
     "next up" can legitimately be a LATER card than something still-open
     from earlier today (e.g. current picks a 14:45 task because the day's
     only other candidate already missed its 10:00 slot). Left alone, the
     hub rendered the 14:45 card while the 10:00 one sat in the plain list
     underneath it — a card earlier on the clock drawn below one later on
     it. anchorRows' hour gutter is built by measuring real row positions
     top-to-bottom (see its own comment), so that inversion didn't just
     look odd — the gutter's interpolation went non-monotonic and hours
     rendered out of order (2026-08-25 user report).

     EVERY missed task earlier than the hub has to move, not just the
     earliest one — a first pass pulled out only the single earliest
     (missedNow) on the theory that it was the one thing racing the hub
     for position, but any other missed task before the hub's time hits
     the exact same inversion and was still left in the plain list below
     it (same user report, second screenshot: two missed tasks both
     earlier than a 14:45 hub, only one of them moved). missedList holds
     all of them, sorted by their own start time so they read in order
     among themselves too. */
  const missedList = current ? missed.filter(i => i.s < current.s).sort((a,b) => a.s - b.s) : [];
  const missedSet = new Set(missedList);
  const rest = items.filter(i =>
    i !== current && i !== meetingNow && i !== breakNow && !missedSet.has(i) && missed.indexOf(i) < 0 && (!isToday || i.e2 > nowMin));
  const doneCount = items.filter(i => i.task && i.done).length;
  /* nextUp (2026-08-28, "a next up small card under it" — approved design
     canvas): the next real open task strictly after current, by start time.
     `open` is already time-sorted, so it's the first entry later than
     current's own start — not `open[1]`, since a meeting or missed task can
     sit between them in `items` without being in `open` at all, and current
     itself is always in `open` so a plain "next index" would misalign the
     moment anything gets filtered out ahead of it. No current, no next. */
  const nextUp = current ? (open.find(i => i !== current && i.s > current.s) || null) : null;
  return { items, current, nextUp, meetingNow, breakNow, missedList, rest, missed, doneCount, open };
}

/* ---------------------------------------------------------------- render */
function render(){
  if(render._q || S.dragBusy) return;
  render._q = true;
  requestAnimationFrame(()=>{
    render._q = false;
    /* The per-list colour rules are generated from the list names on the
       cards themselves (see listCss), so unlike the board rules they cannot
       all be known at boot — injectBoardCss runs before Trello has answered,
       and a board poll can add or rename a list at any time afterwards.
       Refresh them here, but only when the set of names actually changed:
       this runs on every paint, and rewriting a <style> element's textContent
       forces the whole document to re-style. */
    try{ refreshListCss(); }catch(e){ logErr("listCss", e); }
    try{ paint(); }catch(e){ console.error(e); }
  });
}
/* Rewrites the generated list rules only when the set of list names (or the
   pinned colours) has really changed — see render() for why this is guarded. */
function refreshListCss(){
  const names = [];
  for(const c of allCards()){
    if(c && c.listName && !isTrackerCard(c)) names.push(c.listName);
  }
  const sig = names.sort().join("\u0000") + "|" +
              JSON.stringify((CFG && CFG.colors) || {});
  if(sig === refreshListCss._sig) return;
  refreshListCss._sig = sig;
  injectBoardCss();
}

/* Every view falls back to the same "nothing truthful to show yet" states —
   no connector, a fetch error with no cached data, or still loading. */
function sharedState(){
  if(S.noMcp)
    return stateCard("🔌","Live data isn't available here",
      "Needs the Trello and Google Calendar connectors.");
  /* S.needsLogin only exists in standalone (STANDALONE guards it so the
     artifact never sets it): renderLoginGate() lives entirely in the
     BUILD-STANDALONE-injected boot block, but the actual DOM it produces
     goes through this same "nothing truthful to show yet" fallback so the
     rest of the app's render loop needs no special-casing for it. */
  if(STANDALONE && S.needsLogin) return renderLoginGate();
  if(STANDALONE && S.needsTrello) return renderTrelloLinkGate();
  const firstErr = Object.values(S.errs)[0];
  if(!S.events && firstErr) return stateCard("🔌","Can't reach your data", firstErr.message);
  if(!S.ready || !S.events) return el("div","skel");
  return null;
}

/* The topbar mascot (2026-08-26 redesign, "juicy" request) — pure CSS
   transforms on the existing logo PNG, no new art. One class at a time on
   .daisey-logo: .idle (slow breathe, the default), .cheer (bounce, briefly,
   on a completion — see completeItem/completeItemInBrick), .worried (small
   shake, something's overdue), .sleep (dim+tilt, off the clock/day off).
   setMascot swaps the class and, for the one-shot .cheer, clears itself
   after the animation's own duration rather than waiting for the next
   render to remove it. */
function setMascot(state, oneShot){
  const el = $(".daisey-logo");
  if(!el) return;
  el.classList.remove("idle","cheer","worried","sleep");
  el.classList.add(state);
  if(oneShot){
    clearTimeout(setMascot._t);
    setMascot._t = setTimeout(()=>{ el.classList.remove(state); el.classList.add("idle"); }, oneShot);
  }
}
/* Recomputed every paintMain from the same splitAgenda() result already in
   hand — no separate mascot state to keep in sync by hand. Priority:
   nothing left today (post-work idle) > overdue work > ordinary idle. A
   currently-open task while something else is also overdue still reads as
   worried — overdue is the more actionable fact. */
function updateMascot({ current, missed, open, doneCount }){
  const dayOver = !current && sameDay(S.anchor, new Date()) && minsOf(new Date()) >= CFG.dayEnd*60;
  if(dayOver){ setMascot("sleep"); return; }
  if(missed && missed.length){ setMascot("worried"); return; }
  setMascot("idle");
}

function paintHeader(){
  const d = S.anchor, today = new Date();
  /* The Projects view reads batch cards created by the audio-sync Netlify
     function. A viewer who doesn't run that has no tracker board and no
     batch board, so the tab could only ever show an empty view — hide it
     rather than offer a permanently dead tab. `hidden` alone isn't enough:
     .navbtn-style buttons set an explicit display, so .segmented
     button[hidden] needs its own display:none rule (it has one). */
  const wantProjects = !!(TRACKERS.length && SETUP && SETUP.batchBoardKey);
  for(const b of $("#viewSwitch").children){
    if(b.dataset.view === "projects") b.hidden = !wantProjects;
    b.classList.toggle("active", b.dataset.view === S.view);
  }
  /* if the tab vanished under a viewer sitting on it, don't strand them */
  if(!wantProjects && S.view === "projects"){ S.view = "day"; }
  /* Lets .dash's own CSS tell "switcher actually has a tab" from "switcher
     is empty" (see the ≤340px fallback below .dash-center's CSS) — a plain
     width media query can't see a sibling's content. */
  $("#dash").classList.toggle("has-switcher", wantProjects);

  /* Two views have no date to show and nothing for prev/next to step
     through — Pipeline is the state of a board, Projects is the state of a
     deadline. Neither is a day. The nav hides rather than sitting there
     inert. The class is still called `pipe-mode` on purpose: renaming it
     means touching rules.js and chrome.js selectors for no behavioural gain.
     It now means "dateless view", not "pipeline view". */
  const dateless = S.view === "pipeline" || S.view === "projects";
  $("#prev").hidden = dateless;
  $("#next").hidden = dateless;
  $("#dash").classList.toggle("pipe-mode", dateless);

  if(dateless){
    $("#dateRel").textContent = "";
  }else{
    /* Below the same 520px breakpoint the dash's own CSS already treats as
       "phone" (see .dash-center's media query), the full weekday name is
       one of the things standing between the date and fitting on the dash's
       one line — measured at 320px with the Projects tab visible (author
       only): "Monday 17 Aug" needs 95px, but only ~117px is left for the
       whole date+arrows group once the switcher and pill claim their share,
       and the arrows alone need 64px of that. Three letters is still enough
       to name the day; the full name is kept everywhere wider, where there's
       room to spare (2026-08-27, user request). */
    const narrow = matchMedia("(max-width:520px)").matches;
    const dow = narrow ? DOW[d.getDay()].slice(0,3) : DOW[d.getDay()];
    $("#dateLabel").textContent = `${dow} ${d.getDate()} ${MON[d.getMonth()]}`;
    const delta = daysBetween(today, d);
    $("#dateRel").textContent = delta===0 ? "" : delta>0 ? `+${delta}` : String(delta);
  }
}

/* ----------------------------------------------------- projects manager
   What a deadline costs, read off boards that already exist.

   An audio project's tracker board holds 20-40+ asset cards named
   "<Subject>: <detail>". audio-sync.js scores those, packs them to 16 points,
   and creates yellow/orange batch cards on PROJECTS — but nothing anywhere
   knows the project's *deadline*, so 40 sounds due in three weeks and 40 due
   in three months produce identical cards. This computes the missing half:
   how much runway is left, how much work is left, and whether the second
   fits inside the first.

   Read-only. The only thing this feature ever writes is the deadline the
   user typed (saveProjectDeadline → the state card). It never touches a
   PROJECTS card, never sets a Trello due date, and never changes CFG.

   No new fetch and no new connector tool: tracker cards are already in the
   model — startWatches loops all four BOARDS and allCards() returns them;
   candidates() is the only place that drops them (see isTrackerCard). */
const projectListNameFor = board => board.name.replace(AUDIO_SUFFIX_RE,"").trim();
/* Everything Daisey holds is ARI-wrapped (bAri() for boards, the connector's
   own ARIs for cards); everything audio-sync.js writes into a marker is a raw
   Trello id, because it talks to the REST API directly. Comparing the two
   forms always fails, and fails *silently* — no error, just a match that never
   happens. Both id comparisons this feature makes (board= and the covered item
   list) go through here. */
const bareId = id => String(id||"").split("/").pop();

let _snapCache = null;
function snapshotFor(board){
  if(!_snapCache) _snapCache = Object.create(null);
  if(!(board.key in _snapCache)) _snapCache[board.key] = projectSnapshot(board);
  return _snapCache[board.key];
}

function projectSnapshot(board){
  const st = projectState(board.key);
  const cards = allCards();

  /* Tracker side: assets still to do. Same gate audio-sync.js's `todo` uses —
     open, not done, in a Waiting/In Progress list, and named "<Subject>: …".
     A card outside those lists is further down the pipeline (review, fixing,
     approved) and isn't work this deadline still has to buy. */
  const openAssets = cards.filter(c => c.boardKey === board.key && !c.isStats && !c.dueComplete &&
    AUDIO_STAGE_RE.test(c.listName || "") && c.name.includes(":"));

  /* PROJECTS side: which tracker items a batch card already covers, and what
     the still-open batches cost. A card with no marker is invisible to this
     whole system — never read for coverage, never counted — exactly the rule
     audio-sync.js's parseMarkers applies, and the reason a hand-written card
     can sit on the same list without confusing either of them. */
  const listName = projectListNameFor(board);
  const wanted = audioNormName(listName);
  const batchKey = SETUP && SETUP.batchBoardKey;
  const batchCards = batchKey ? cards.filter(c => c.boardKey === batchKey && audioNormName(c.listName||"") === wanted) : [];
  const covered = new Set();
  let openBatches = 0, openBatchPoints = 0;
  for(const bc of batchCards){
    const m = AUDIO_MARK_RE.exec(bc.desc || "");
    if(!m) continue;
    if(m[2] !== bareId(board.id)) continue;          // a marker from another project's board
    /* Same ARI-vs-raw-id trap as board= above, and this one is easy to miss:
       audio-sync.js builds the marker from raw REST card ids, while normCard's
       c.id is the connector's ARI. Comparing them directly means `covered` is
       never a hit against real data — every already-batched asset would be
       counted a second time as still-unbatched, quietly inflating the pressure
       read on exactly the projects furthest along. Normalise both ends. */
    for(const pair of m[3].split(",").filter(Boolean)) covered.add(bareId(pair.split(":")[0]));
    if(!bc.dueComplete){
      openBatches++;
      openBatchPoints += AUDIO_SESSION_CAP;
    }
  }

  /* Points still to be batched, grouped by subject — the segment unit. Music
     is separated out because audio-sync.js doesn't point-pack it. */
  const bySubject = new Map();
  const music = [];
  for(const c of openAssets){
    if(covered.has(bareId(c.id))) continue;          // both ends bare — see covered.add above
    const sp = splitSubject(c.name);
    if(!sp) continue;
    if(sp.subject.toLowerCase() === "music"){ music.push(c); continue; }
    if(!bySubject.has(sp.subject)) bySubject.set(sp.subject, []);
    /* `card` rides along so the Projects view can offer the real asset to
       assetMoveDialog — audioScoreItems only reads id/detail and ignores it. */
    bySubject.get(sp.subject).push({ id:c.id, detail:sp.detail, card:c });
  }
  const subjects = [];
  let unbatchedPoints = 0;
  for(const [subject, items] of bySubject){
    const pts = audioScoreItems(items).reduce((a,s) => a + s.points, 0);
    unbatchedPoints += pts;
    subjects.push({ subject, points:pts, count:items.length, cards:items.map(i => i.card) });
  }
  subjects.sort((a,b) => b.points - a.points || a.subject.localeCompare(b.subject));
  const musicPoints = music.reduce((a,c) => a + audioMusicPoints(c.desc), 0);

  /* Runway. A day's capacity is treated as 16 points (AUDIO_WORKDAY_CAP) —
     a fixed cap on audio work per day, independent of the calendar-side
     scheduling sizes (work-day size removed 2026-08-24; only quick/session
     remain there now). Kept conservative on purpose — a pressure read that
     flatters itself is worse than no read. */
  const deadline = st.deadline ? new Date(st.deadline + "T00:00:00") : null;
  const today = startOfDay(new Date());
  const calendarDays = deadline ? daysBetween(today, deadline) : null;
  const workDays     = deadline ? countWorkDays(today, deadline) : null;

  const remainingPoints = unbatchedPoints + openBatchPoints + musicPoints;
  const capacityPerDay  = AUDIO_WORKDAY_CAP;
  const supplyPoints    = workDays == null ? null : workDays * capacityPerDay;
  /* A passed or same-day deadline gives 0 supply. Infinity is the honest
     answer there (no amount of runway is enough because there is none), and
     it lands in the "Over" band without a divide-by-zero NaN leaking into
     the bar width or the tier boost. */
  const pressure = supplyPoints == null ? null
                 : supplyPoints === 0 ? (remainingPoints > 0 ? Infinity : 0)
                 : remainingPoints / supplyPoints;

  /* The density read: how many points a batch would have to carry for the
     remaining work to land inside the runway, and how many cards that is.
     Advisory only — nothing acts on it. Floored at the normal cap (never
     advise packing *looser*) and ceilinged at 3x, past which the advice
     stops being actionable and the honest answer is "the deadline doesn't
     fit", which the pressure band already says. */
  const neededPerDay   = (workDays && workDays > 0) ? remainingPoints / workDays : null;
  const packPoints     = neededPerDay == null ? AUDIO_WORKDAY_CAP
                       : clamp(Math.ceil(neededPerDay), AUDIO_WORKDAY_CAP, AUDIO_WORKDAY_CAP * 3);
  const baseCards      = Math.ceil(remainingPoints / AUDIO_WORKDAY_CAP);
  const projectedCards = packPoints > 0 ? Math.ceil(remainingPoints / packPoints) : baseCards;

  return { board, listName, deadline, deadlineIso:st.deadline, calendarDays, workDays,
           openAssetCount:openAssets.length, covered, subjects, music, musicPoints,
           unbatchedPoints, openBatches, openBatchPoints, remainingPoints,
           capacityPerDay, supplyPoints, pressure,
           neededPerDay, packPoints, baseCards, projectedCards,
           loaded: !!S.cards[board.key] && !!(batchKey && S.cards[batchKey]),
           err: S.errs["cards:"+board.key] || null };
}

/* One band, one word, one explanation. Infinity (deadline already gone) falls
   through every threshold into "Over", which is correct. */
function pressureBand(p){
  if(p == null)  return { key:"none",  word:"No deadline", note:"Set one to see whether the work fits." };
  if(p <= 0.5)   return { key:"calm",  word:"Comfortable", note:"Half the runway would do it." };
  if(p <= 0.8)   return { key:"ok",    word:"On track",    note:"Fits with room to spare." };
  if(p <= 1)     return { key:"tight", word:"Tight",       note:"Fits, with no slack left." };
  return { key:"over", word:"Over", note:"" };
}

/* ------------------------------------------------------- asset pipeline
   A tracker board rendered as its own kanban: one column per Trello list,
   one card per asset. This is the half of the workflow Daisey's day view
   can't express — 100+ sounds each with a state — and the reason those
   cards are kept out of candidates() (see BOARDS).

   Moving a card is the only write here, and it goes through the same
   local-first path as everything else: patch the model, render, write
   behind it, put it back and hand it to queueFailed if the write loses. */
function trackerListsOf(board){
  const box = S.boardLists[board.key];
  const arr = (box && box.payload && box.payload.lists) || [];
  /* the connector returns position; keep Trello's own stage order, since on
     a pipeline board left-to-right *is* the meaning */
  return arr.slice().sort((a,b) => (a.position||0) - (b.position||0));
}

async function moveAssetTo(card, list){
  if(!card || !list || card.listId === list.id) return;
  if(S.moving.has(card.id)) return;

  const prev = { id:card.listId, name:card.listName };
  const raw = rawCardNode(card);
  const rawPrev = raw ? raw.list : null;
  const patch = () => {
    card.listId = list.id; card.listName = list.name || "";
    if(raw) raw.list = { id:list.id, name:list.name || "" };
  };
  const undo = () => {
    card.listId = prev.id; card.listName = prev.name;
    if(raw) raw.list = rawPrev;
  };

  patch();
  S.moving.add(card.id);
  render();

  /* `move` + listId, observed on real moves (22 assets migrated onto the
     tracker board this way). The shape this once guessed — `update` + listId —
     is rejected outright: `update` takes only name/desc/due and ignores
     listId, so every move from this view failed until it was corrected. */
  const write = () => callTool(TRELLO, "trelloWriteCard",
      { action:"move", cardId:card.id, listId:list.id })
    .then(()=>{ S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{}); });

  try{
    await write();
    S.moving.delete(card.id);
    render();
  }catch(e){
    S.moving.delete(card.id);
    undo();
    toast(errCopy(e), true);
    queueFailed(`Move: ${card.name} → ${list.name}`, async () => {
      patch();
      try{ await write(); render(); }
      catch(err){ undo(); render(); throw err; }
    });
    render();
  }
}

/* tap an asset → pick its next stage. A sheet rather than a drag: the
   columns scroll horizontally on a phone, which a drag would fight. */
function assetMoveDialog(card, board){
  const lists = trackerListsOf(board);
  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null,"Move to stage"));
  const sub = el("div","muted");
  sub.appendChild(bidiSpan(card.name));
  h.appendChild(sub);
  dlg.appendChild(h);

  const body = el("div","pick");
  for(const l of lists){
    const cur = l.id === card.listId;
    const btn = el("button","stage-opt" + (cur ? " cur" : ""));
    btn.appendChild(bidiSpan(l.name || "(unnamed)"));
    if(cur) btn.disabled = true;
    else btn.addEventListener("click", ()=>{ close(); moveAssetTo(card, l); });
    body.appendChild(btn);
  }
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn","Cancel");
  cancel.addEventListener("click", close);
  f.appendChild(cancel);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  cancel.focus();
}

/* One segment's assets, listed so any of them can be moved along the
   pipeline. Opened from a segment row in the Projects view — the reachable
   entry point to assetMoveDialog now that the Assets tab is gone from the
   switcher. Each row shows the asset's current stage, since "which of these
   is still in Waiting" is the actual question being asked here. */
function segmentAssetsDialog(seg, board){

  dlg.appendChild(h);

  const body = el("div","pick");
  for(const c of seg.cards){

    const nm = el("span","seg-asset-n");

  const f = el("div","df");
  const cancel = el("button","btn","Close");
  cancel.addEventListener("click", close);
  f.appendChild(cancel);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  cancel.focus();
}

function pipelineView(){
  const board = TRACKERS[0];
  const wrap = el("div","pipe");
