/* ============================================================
   Daisey — one day, one question: what's next?
   Light palette on bare :root; dark redefines TOKENS ONLY.
   ============================================================ */
:root{
  --bg:#FFFBEA;
  --surface:#FFFFFF;
  --surface-2:#FFF3D0;
  /* cards sit on this, not bare --surface: plain white next to a warm
     cream page reads as a cold, clinical flash rather than a lifted
     surface — this is --surface warmed and dimmed by a hair, the same
     family as --bg but a step lighter so a card still visibly lifts off
     the page instead of vanishing into it or glaring against it. */
  --card:#FFFDF2;
  --ink:#241D10;
  --ink-2:#6E6350;
  --ink-3:#8A7C60;
  --line:#EDDFBE;
  --line-2:#DCC894;
  --line-strong:#C9AF6E;

  /* type scale (2026-08-26 redesign) — sizes used to be hand-tuned per
     element within 4px of each other (13.5/14/11.5/11/10.5/10px), which is
     the root cause of the app reading flat: nothing was ever visually
     bigger than anything else. --t-hero is a deliberate ~2x jump over any
     timeline card, so the current task is unmistakably the biggest thing
     on screen. */
  --t-hero:30px; --t-hero-sub:15px;
  --t-xl:19px; --t-lg:15px; --t-md:13.5px;
  --t-sm:11.5px; --t-xs:10px;

  --accent:#FFC738;
  --accent-ink:#946200;
  --accent-soft:rgba(255,199,56,.22);
  --accent-line:rgba(255,199,56,.6);
  --on-accent:#2B1B00;

  --crit:#FF4D5E;
  --crit-soft:rgba(255,77,94,.16);
  --age:#F5A623;
  --age-soft:rgba(245,166,35,.2);
  --done:#2ECC71;
  --done-soft:rgba(46,204,113,.18);
  --deep:#5B67FF;
  --deep-soft:rgba(91,103,255,.16);
  /* Pending's light blue (2026-08-26). Deliberately a different FAMILY from
     --deep (indigo), not just a lighter step of it: Swap and Pending sit
     next to each other in every action row, so two shades of one hue would
     read as the same button twice. Dark enough to carry white glyphs. */
  --sky:#2F8FE0;
  --sky-soft:rgba(47,143,224,.16);

  /* one hue per board — bright and a little playful, not muted: a jewel-
     toned pass through this set read as tasteful but flat, and the user
     asked for brighter, funnier colours back plus a card surface that
     isn't stark white (see --card above). Four hues stay clearly apart by
     family (not just brightness) so nothing gets mistaken for a neighbour
     at a glance: violet-purple / cyan-teal / red-orange / magenta-pink,
     with --age pulled to a yellower gold and --deep pushed bluer than
     --b-projects specifically so the status chips don't collide with the
     board hues either. */
     The per-board hues themselves are no longer written here: boards are
     per-viewer now, so `--b-<key>` / `--b-<key>-soft` and the matching
     `.bk-<key>` rules are generated at runtime into <style id="boardCss">
     by injectBoardCss(). PALETTE (in the script) holds these same hues as
     its first entries. Only the two NON-board colours stay hand-written. */
  --b-none:#9C8F72;      --b-none-soft:rgba(156,143,114,.14);
  /* not a board hue — a break's own colour, azure, deliberately outside the
     four-board family above so it never reads as "which board is this". */
  --b-break:#2F8FE0;     --b-break-soft:rgba(47,143,224,.16);
  /* Dusk, for the off-the-clock card (see .offhours). Indigo→violet rather
     than another flat single hue: this is the one card on the page that
     means "stop working", and it earns a richer treatment than the boards,
     which have to stay legible as flat identity colours. */
  --dusk-1:#4C3BCF;      --dusk-2:#7B3FE4;      --dusk-3:#B84BC8;
  --dusk-ink:#F3EAFF;
  /* Break's own ramp — the same treatment .offhours gets, in azure rather
     than dusk, so a rest inside the working day and the evening off the
     clock read as the same FAMILY of thing without being the same card. */
  --brk-1:#1E7BC8;       --brk-2:#2F9FE0;       --brk-3:#41C4D8;
  --brk-ink:#F2FBFF;

  /* two-layer "contact + ambient" shadow — a tight, barely-there shadow
     right under the card plus a wide soft one further out — reads as a
     card actually resting on the surface instead of floating with a
     single blurry halo, which is what one flat shadow value gives you. */
  --shadow:0 1px 2px rgba(40,26,4,.05), 0 10px 26px -6px rgba(40,26,4,.10);
  --shadow-lg:0 3px 6px rgba(40,26,4,.09), 0 24px 52px -8px rgba(40,26,4,.20);
  /* hairline card edge — depth now comes from --shadow, not a saturated
     tan outline, so the border can recede to almost nothing */
  --line-soft:rgba(36,29,16,.07);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-body:'Nunito',var(--sans);
  /* Titan One (a thick, single-weight novelty display face) used to sit
     behind every heading, clock digit and dialog title — a game-jam
     signal fighting the rest of the page. Nunito already ships weights
     200–1000 in the one @font-face already embedded, so display text now
     just borrows the same family at its heaviest weight with tighter
     tracking instead of switching typefaces — one confident face used
     with restraint, rather than a second decorative one layered on top.
     Callers still need to raise font-weight themselves (the old rules
     all assumed Titan One's fixed 400), see the accompanying weight bumps. */
  --font-display:'Nunito',var(--sans);
}
/* Daisey deliberately commits to one bright look and has no dark palette.
   The viewer's theme is overridden rather than followed: the artifact shell
   stamps data-theme="dark" and an inline style.colorScheme on <html> when
   the reader's browser is dark, so color-scheme is forced back to light with
   !important (an important author rule outranks a plain inline style) —
   otherwise scrollbars and form controls would still render dark against
   the light page. Do not reintroduce a dark block without asking: being
   bright regardless of the OS/browser theme is the point, not an oversight. */
:root{ color-scheme:light !important; }

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;font-weight:600;
  -webkit-font-smoothing:antialiased;
}
/* The night-sky backdrop went with the dark palette — a starfield behind a
   paper-toned day theme reads as dirt, not atmosphere. */
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}


/* ---------------- shell ----------------
   The app fills the viewport and doesn't scroll to reach its own chrome:
   header and dash are fixed at their content height, #pageMain takes
   whatever's left and is the one thing that can ever scroll — a safety
   net for content that genuinely doesn't fit, not the normal case. */
html,body{overflow:hidden;}
.wrap{
  height:100dvh;max-width:600px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* topbar: the real clock, above everything else and anchored left — the
   one thing that's true regardless of which day S.anchor is looking at.
   Settings sits opposite it since it no longer fits in .nav (prev/next
   are the only two buttons left there, flanking the date). */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:10px;position:relative;
}
.topbar-left{
  display:flex;align-items:center;justify-content:flex-start;gap:8px;flex:0 0 auto;
}
.topbar-center{
  display:flex;align-items:center;justify-content:center;
  position:absolute;left:50%;transform:translateX(-50%);flex:0 0 auto;
}
.daisey-logo{
  position:relative;display:block;margin:0;padding:0;
}
.daisey-logo-text{height:46px;width:auto;display:block;}
.daisey-logo-icon{
  position:absolute;right:100%;top:50%;transform:translateY(-50%);
  margin-right:6px;height:38px;width:auto;display:block;
  transform-origin:center;
}
/* Mascot states (see setMascot/updateMascot) — every keyframe re-states the
   base translateY(-50%) the icon needs for its own vertical centering
   (see the rule above), since an animation's transform replaces the
   static one rather than composing with it. */
@media (prefers-reduced-motion:no-preference){
  .daisey-logo.idle .daisey-logo-icon{animation:mascot-idle 3.6s ease-in-out infinite;}
  .daisey-logo.cheer .daisey-logo-icon{animation:mascot-cheer .55s cubic-bezier(.34,1.56,.64,1) 2;}
  .daisey-logo.worried .daisey-logo-icon{animation:mascot-worried .5s ease-in-out 2;}
  .daisey-logo.sleep .daisey-logo-icon{opacity:.55;transform:translateY(-50%) rotate(-8deg);}
}
@media (prefers-reduced-motion:reduce){
  .daisey-logo.sleep .daisey-logo-icon{opacity:.55;}
}
@keyframes mascot-idle{
  0%,100%{transform:translateY(-50%) scale(1);}
  50%{transform:translateY(-52%) scale(1.03);}
}
@keyframes mascot-cheer{
  0%,100%{transform:translateY(-50%) scale(1) rotate(0);}
  35%{transform:translateY(-62%) scale(1.08) rotate(-6deg);}
  65%{transform:translateY(-50%) scale(1.04) rotate(4deg);}
}
@keyframes mascot-worried{
  0%,100%{transform:translateY(-50%) translateX(0);}
  25%{transform:translateY(-50%) translateX(-2px);}
  75%{transform:translateY(-50%) translateX(2px);}
}
.topbar-right{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;
}
/* Same absolute-centering collision as .dash-center below: on a narrow
   phone the clock widget (left) is wide enough that the truly-centered
   logo overlaps it. Static positioning here lets space-between keep the
   three groups apart instead. */
@media (max-width:400px){
  .topbar-center{position:static;left:auto;transform:none;flex:1 1 auto;min-width:0;justify-content:flex-start;overflow:hidden;}
}

.head{
  display:none;
}
/* the date sits centered between the prev/next arrows, which pin
   themselves close together — clicking it jumps back to today */
.dash-center .date{
  display:flex;align-items:baseline;justify-content:center;gap:8px;
  background:transparent;border:none;padding:2px;margin:0;cursor:pointer;text-align:center;
  border-radius:8px;flex:0 0 auto;
}
.dash-center .date:hover{background:var(--surface);}
.dash-center .date h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
.dash-center .date .rel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}

/* Day/Week switcher — Day shows the activity list, Week shows
   the calendar grid, in place of one another on the one page. Lives
   in the .dash row now, so it's sized to its content, not forced full-width. */
.segmented{
  display:flex;gap:2px;padding:3px;border:1.5px solid var(--line);border-radius:16px;
  background:var(--surface-2);flex:0 0 auto;
}
.segmented button{
  border:none;background:transparent;color:var(--ink-2);cursor:pointer;
  font-family:var(--font-body);font-size:11px;font-weight:800;
  padding:5px 8px;border-radius:13px;transition:background .15s,color .15s;white-space:nowrap;
}
.segmented button.active{background:var(--accent);color:var(--on-accent);}
/* Explicit, even though this button sets no display of its own: [hidden] is
   a presentation hint that ANY later display declaration silently beats, and
   this file has been bitten by that before (.navbtn[hidden], .dash-right
   [hidden]). Cheaper to state than to re-diagnose. */
.segmented button[hidden]{display:none;}

/* standalone icon buttons — prev/next flanking the date, settings in the
   topbar — no longer grouped inside a shared <nav>, so the class name is
   just its own look rather than "a button that lives in .nav" */
.navbtn{
  width:32px;height:32px;border-radius:12px;border:1.5px solid transparent;flex:0 0 auto;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;font-size:15px;
  transition:background .15s,color .15s,border-color .15s,transform .12s;
}
.navbtn-icon{width:22px;height:22px;object-fit:contain;display:block;}
.navbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink);transform:translateY(-1px);}
.navbtn:active{transform:scale(.92);}
/* display:grid above beats the UA's [hidden]{display:none}, so hiding one of
   these from JS needs saying explicitly — same reason .dash-right[hidden] exists */
.navbtn[hidden]{display:none;}

/* layout: segmented (Day/Week) on left, date navigation centered,
   rebuild/progress on right */
.dash{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:12px;flex-wrap:nowrap;
  position:relative;
}
.dash-left{
  display:flex;align-items:center;justify-content:flex-start;gap:4px;flex:0 0 auto;
  order:1;
}
.dash-center{
  display:flex;align-items:center;justify-content:center;gap:4px;
  position:absolute;left:50%;transform:translateX(-50%);flex:0 0 auto;
  order:2;
}
/* stacked (date line over time line) rather than side by side, and
   left-aligned now that it's alone in the topbar instead of centered
   between two flanking groups */
/* The clock is the biggest thing in the top bar (2026-08-26, user request:
   "make the live clock with date bigger, taking up two rows"). It took over
   the space the removed "Day" tab used to occupy. Two real rows: the full
   weekday + date on top, the running time beneath at display scale.
   The weekday is written out in full ("Wednesday", not "WED") — see
   tickClockWidget, which no longer slices DOW. */
.clockw{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  background:var(--glass,var(--surface));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--line);border-radius:16px;
  padding:6px 12px;box-shadow:var(--shadow);
}
.clockw .cw-date{display:flex;align-items:baseline;gap:5px;line-height:1.1;white-space:nowrap;}
.clockw .cw-dow{
  font-family:var(--font-body);font-size:10.5px;font-weight:900;letter-spacing:.02em;
  color:var(--ink-2);
}
.clockw .cw-day{font-family:var(--font-body);font-size:10.5px;font-weight:800;color:var(--ink-3);white-space:nowrap;}
.clockw .cw-time{
  font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;
  font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--ink);white-space:nowrap;
}
.clockw .cw-sec{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);margin-left:2px;}
/* A full weekday name plus the clock is still a lot of width on a small
   phone even after the base shrink above; step down again so line 1
   (clock + logo) never wraps. */
@media (max-width:400px){
  .clockw{padding:5px 10px;border-radius:14px;}
  .clockw .cw-dow,.clockw .cw-day{font-size:9.5px;}
  .clockw .cw-time{font-size:19px;}
  .clockw .cw-sec{font-size:10px;}
}

.dash-right{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
.dash-right[hidden]{display:none;}
/* Pipeline has no date, and a board name is far too wide to sit centred next
   to a four-tab switcher on a phone — the whole centre group drops out and
   the board names itself inside the view instead. */
.dash.pipe-mode .dash-center{display:none;}
/* THE DASH IS ONE ROW ON A PHONE (2026-08-27, user request: "move current
   day with arrows to 2nd line, no 3rd line" — the topbar clock+logo is line
   1, so .dash must fit switcher + date/arrows + pill/rebuild into a single
   line 2, not two).
   This used to wrap to two internal rows (2026-08-24 fix, history below),
   because three groups didn't fit ~390px when the switcher still held a
   Day/Week/Projects trio. That's no longer the shape: the "Day" tab is gone
   and Projects only ever shows for the author (see CLAUDE.md, "Projects tab
   hides when there's no batchBoardKey") — for every other viewer #viewSwitch
   is empty and collapses to 0 width, so it's really just two groups (date
   nav, pill/rebuild) fighting for the row, which is the case static
   positioning always handled fine. Author-viewing-Projects is the one case
   that still has three groups; the date is allowed to compress there rather
   than force a second line, since a same-width switcher makes the row
   objectively tighter only for the one viewer who chose to add that tab.
   `.dash-center` drops out of absolute positioning (which measures nothing
   about its siblings — the original 2026-08-24 bug) and becomes a normal
   flex item with min-width:0, so it shrinks instead of overlapping. */
@media (max-width:520px){
  .dash{flex-wrap:nowrap;}
  .dash-center{
    position:static;left:auto;transform:none;
    flex:1 1 auto;min-width:0;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .dash-center .date{flex:1 1 auto;min-width:0;justify-content:center;}
  /* min-width:0 + max-width:100% is load-bearing: without it a nowrap h1
     never shrinks below its own text width no matter what its flex
     container does, so overflow:hidden;text-overflow:ellipsis had nothing
     to actually clip against (confirmed live: scrollWidth stayed > clientWidth
     with the ellipsis never rendering). */
  .dash-center .date h1{font-size:15px;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
}
/* Very narrow (small Android, older SE): trim padding so date nav still
   has room next to the pill. */
@media (max-width:340px){
  .segmented button{padding:5px 6px;font-size:10.5px;}
  .dash-center .date h1{font-size:12px;}
  .dash-right .progress-pill{padding-left:8px;padding-right:8px;}
  /* The one combination that genuinely can't fit one line: the Projects tab
     (author only) plus a 320px phone. Measured: even the date abbreviated
     to "Mon 17 Aug" at the smallest still-legible font needs ~53-70px, but
     only ~33-45px is left once the switcher, both arrows and the pill claim
     their share — no font step closes that gap without the date becoming
     unreadably small (confirmed: even 9px, arguably already too small,
     didn't fit). Falls back to the pre-2026-08-27 two-row dash, but ONLY
     when the switcher actually has a tab in it (.has-switcher, set by
     paintHeader) — every other viewer, and the same viewer above 340px,
     keeps the one-line dash. */
  .dash.has-switcher{flex-wrap:wrap;row-gap:8px;}
  .dash.has-switcher #viewSwitch{order:1;}
  .dash.has-switcher .dash-right{order:2;margin-inline-start:auto;}
  .dash.has-switcher .dash-center{
    order:3;flex:1 0 100%;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
}
/* the gamified bit: a solid, badge-like fraction instead of two quiet stats */
.progress-pill{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:-.01em;
  color:var(--on-accent);background:var(--accent);
  border:1.5px solid var(--accent-ink);border-radius:99px;
  padding:5px 11px 5px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 2px 5px rgba(40,26,4,.16);
  transition:filter .14s;
}
.progress-pill:hover{filter:brightness(1.06);}
.progress-pill::before{content:"✓";font-family:var(--font-body);font-size:10px;font-weight:800;}
/* the rebuild button, promoted from a quiet footer icon to a small FAB */
.rebuild{
  width:37px;height:37px;border-radius:50%;flex:0 0 auto;
  border:1.5px solid var(--accent-ink);background:var(--accent);color:var(--on-accent);
  cursor:pointer;font-size:16px;display:grid;place-items:center;
  box-shadow:0 2px 5px rgba(40,26,4,.18);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.rebuild:hover{filter:brightness(1.06);}
.rebuild:active{transform:scale(.93);}
.rebuild[disabled]{opacity:.5;cursor:not-allowed;}
.rebuild[hidden]{display:none;}
@media (prefers-reduced-motion:no-preference){
  .rebuild:hover{transform:rotate(50deg);}
  .rebuild:active{transform:rotate(50deg) scale(.93);}
}

/* .scroller is the one thing allowed to scroll — everything above it (topbar,
   dash) is fixed chrome. It wraps the hero AND #pageMain together
   (2026-08-27, user request: "sliding down the app should also affect main
   card" — the hero used to be a fixed sibling ABOVE the scroller, so it
   never moved at all while the list scrolled under it). #heroSlot stays a
   separate sibling of #pageMain, not nested inside it, on purpose:
   paintMain() does `host.innerHTML=""` on #pageMain every render, which
   would destroy #heroSlot's own DOM node (and paintHero's $("#heroSlot")
   lookup with it) if it lived inside that subtree — the two are rebuilt by
   separate functions and must stay separate elements. .page itself goes
   back to normal flow; only the wrapper scrolls now. */
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page{display:block;}
/* [hidden] loses to any later explicit `display` rule — the same trap
   .navbtn[hidden]/.dash-right[hidden] already work around, now hit here too
   by the collapsible-schedule toggle (2026-08-28, see paintMain's
   `host.hidden = !S.scheduleOpen`). Without this, .page's own
   `display:block` above wins and the "hidden" list stays fully visible. */
.page[hidden]{display:none;}

/* ---------------------------------------------------------------- hero
   The current task, broken out of the timeline into its own card (2026-08-26
   redesign, direct request: "needs to know what is the current task, make
   it big, bold, and outstand the other cards"). A plain block sibling of
   #pageMain INSIDE .scroller (2026-08-27: it used to sit above the scroller
   as a permanently-pinned flex sibling — see .scroller's own comment for why
   that changed, direct user request: "sliding down the app should also
   affect main card"). heroCard() renders the exact same .item.hub
   timelineItem always has. */
.hero-slot{margin-bottom:10px;}
.hero-slot:empty{display:none;}
/* The hero's card fills its slot full-width, same as every list card
   (2026-08-27: the rail column is gone, so there's no second grid track to
   fill against any more — .time-row is a single block column now, see its
   base CSS). Time (start-end) is stated inside the card's own top-left
   corner via .row-lead, styled hero-scale just below. */
.hero-slot .item-top{display:none;}    /* eyebrow moves into the card itself below */
.hero-slot .item.hub{
  border-radius:20px;box-shadow:var(--shadow-lg);
  border-color:var(--line-strong);
  padding-bottom:2px;padding-left:10px;margin-bottom:10px;
  animation:none;   /* current-glow is for the timeline marker now, not the hero */
}
/* Thick board-colour spine (2026-08-28, "juicier and more colorful" hero
   redesign, approved design canvas). ON TOP of the existing --bc-soft wash
   every .lk-<key> card already gets (see .item[class*="lk-"] above), not a
   replacement for it — the wash tints the whole surface, the spine is a
   loud identity mark specifically for the one card meant to dominate. Own
   element rather than a plain border: a border can't carry the top-to-
   bottom two-stop gradient (a flat border-color reads flat), and .item's
   overflow:hidden clips it to the card's own radius for free. */
.hero-slot .item.hub::before{
  content:"";position:absolute;top:0;left:0;bottom:0;width:10px;
  background:linear-gradient(180deg,var(--bc,var(--accent)),var(--bc-soft,var(--accent-soft)));
}
.hero-slot .item.hub .row{padding:16px 18px 6px 12px;}
.hero-slot .item.hub .row .n{font-size:var(--t-hero);font-weight:900;letter-spacing:-.01em;line-height:1.15;}
.hero-slot .item.hub .row-lead{font-size:var(--t-hero-sub);font-weight:800;color:var(--ink-2);}
.hero-slot .item.hub .row-meta{padding:6px 18px 16px 12px;}
/* Chunkier actions with a "pressed" bottom edge (2026-08-28, same redesign)
   — a solid 3px shadow in each button's own hue, not a blur, so it reads as
   a physical button rather than a floating chip. Colours come from .mini's
   own per-action rule (background) — only the shadow and the extra 4px of
   size are new here, both hero-scale only. */
.hero-slot .item.hub .acts-inline{gap:9px;}
.hero-slot .item.hub .mini{width:42px;height:42px;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.16);}
.hero-slot .item.hub .mini.ok{flex:1 1 auto;width:auto;border-radius:13px;font-weight:900;font-size:var(--t-md);box-shadow:0 3px 0 #22A85E;}
.hero-slot .item.hub .mini.ok::after{content:" Done";}
.hero-slot .item.hub .mini.swap{box-shadow:0 3px 0 #2178B8;}
.hero-slot .item.hub .mini.pend{box-shadow:0 3px 0 #E0A800;}
.hero-slot .item.hub .mini.del{box-shadow:0 3px 0 #E0303F;}
.hero-slot .item.hub .mini.info{box-shadow:none;}
.hero-slot .item.hub .mini:active{transform:translateY(2px) scale(1);box-shadow:none;}
/* the eyebrow (On it / Up next / …) — see heroCard(), which inserts this
   as the card's own first child now that .item-top (the old beside-the-
   card column) is hidden. */
.hero-eyebrow{
  font-family:var(--font-display);font-weight:800;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--bc,var(--accent-ink));padding:14px 18px 0 12px;
}
/* The hero on a real phone (2026-08-27, user report: "main card is too big
   for phone, also text inside it"). The -4px title shrink below this was
   never enough for a genuinely long title at 30px bold — a normal task name
   still wrapped to 3-4 lines. Not a bug (nothing overflows the screen), just
   too much of a small screen spent on one card. Scoped to the hero only. */
@media (max-width:420px){
  .hero-slot .item.hub .row .n{font-size:calc(var(--t-hero) - 8px);line-height:1.08;}
  /* The action row (Done/Swap/Remove) was costing nearly as much height as
     the whole timeline row underneath it — smaller circles, tighter gaps
     and padding recover real space without touching the title at all. */
  .hero-slot .item.hub .row-meta{padding:4px 14px 12px 12px;}
  .hero-slot .item.hub .acts-inline{gap:6px;}
  .hero-slot .item.hub .mini{width:36px;height:36px;font-size:14px;}
  .hero-slot .item.hub .mini.ok{font-size:calc(var(--t-md) - 1px);}
}
/* Below 360px the day genuinely doesn't have room for a hero-scale title
   at all without wrapping hard — one more step down keeps it off a 5th
   line for a long real task name. */
@media (max-width:359px){
  .hero-slot .item.hub .row .n{font-size:calc(var(--t-hero) - 11px);}
}

/* "Next up" — the small card under the hero (2026-08-28, approved design
   canvas). Same board-colour spine language as the hero (see
   .hero-slot .item.hub::before) at 6px instead of 10px: a quieter echo,
   not a second hero. Sits inside #heroSlot (see nextUpCard/paintHero), not
   the timeline — it previews the next task, it doesn't replace that task's
   own row further down, which still opens via the normal accordion. */
.next-up{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 14px 10px 16px;box-shadow:var(--shadow);overflow:hidden;
  cursor:pointer;transition:box-shadow .15s,transform .1s;
  margin-bottom:10px;
}
.next-up:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.next-up:active{transform:translateY(0);}
.next-up::before{
  content:"";position:absolute;top:0;left:0;bottom:0;width:6px;
  background:var(--bc,var(--b-none));
}
.next-up-lead{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:56px;flex:0 0 auto;}
.next-up-k{
  font-family:var(--mono);font-weight:800;font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;
}
.next-up-time{font-family:var(--mono);font-weight:800;font-size:12.5px;color:var(--ink-2);}
.next-up-n{
  flex:1 1 auto;min-width:0;font-weight:700;font-size:13.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.next-up-dot{width:9px;height:9px;border-radius:50%;background:var(--bc,var(--b-none));flex:0 0 auto;}

/* "See today's schedule" — toggles #pageMain's own list open/closed
   (2026-08-28, approved design canvas + "make the schedule collapsable"
   follow-up), not a second view: the schedule already renders right below
   in the same #scroller (see scheduleButton/paintMain's `host.hidden`).
   Bold solid pill in the app's own accent, board-agnostic on purpose — it
   isn't about any one task's colour. The trailing chevron rotates 180°
   between states (inline style on the svg, set per-render in
   scheduleButton — simplest way to key it off S.scheduleOpen without a
   second CSS class) rather than swapping glyphs, so the direction change
   itself reads as motion instead of a jump-cut. */
.schedule-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);border:2px solid var(--accent-ink);border-radius:14px;
  padding:12px;color:var(--on-accent);font-family:var(--font-body);
  font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--accent-ink);
  cursor:pointer;transition:transform .1s,box-shadow .1s;margin-bottom:2px;
}
.schedule-btn:hover{filter:brightness(1.04);}
.schedule-btn:active{transform:translateY(3px);box-shadow:none;}

/* board identity: every element that represents a task carries its board hue.
   The per-board `.bk-<key>` rules are GENERATED at runtime (injectBoardCss)
   because the board set is per-viewer — a hand-written rule per key only
   worked while the four boards were hardcoded, and a board with no matching
   rule silently falls back to neutral tan no matter what colour is picked.
   The three below are not boards, so they stay here. */
.bk-none    {--bc:var(--b-none);    --bc-soft:var(--b-none-soft);}
/* a task whose card hasn't resolved yet (Trello hasn't answered, or a poll
   momentarily dropped it) — transparent, not bk-none's grey, so nothing
   colours in until the real board is known. bk-none asserting a definite
   "no board" grey here used to paint a card wrong, then swap it to the
   right hue once the card resolved — a visible flash. This renders as no
   colour at all until the true one is known, once, correctly. */
.bk-pending {--bc:transparent;       --bc-soft:transparent;}
.bk-break   {--bc:var(--b-break);    --bc-soft:var(--b-break-soft);}
/* a Break is the one card that gets its whole surface tinted, not just the
   spine every other card carries (see the "one coloured spine, not a
   tinted fill" note below) — it isn't a task competing for the same
   "which board" read, it's a different kind of thing on the day, and the
   full azure wash is what makes it register as "rest", not "another
   card", at a glance. */
/* Break unified into the standard card look (2026-08-25 redesign — every
   card type now shares one shape; only height varies, by real duration).
   .item.bk-break used to carry its own azure gradient, transparent border,
   corner-glow and single-centred-column layout; all deleted. It still
   carries its own spine colour (--brk-*, set elsewhere) same as any other
   board identity, and lays out exactly like a plain .item.stack card. */

/* ---------------- the hub ----------------
   Unified into the standard card look (2026-08-25 redesign) — the hub used
   to be timelineItem's stack-mode card scaled up (bigger padding/title,
   board-tinted gradient background) so "the one thing now" stood out. That
   special treatment is gone: every card is the same size/shape regardless
   of whether it's current. "Current" is now shown by the now-line crossing
   the card plus a glow outline (see .item.current, near the card base
   rules) — hub/now remain as class names only so JS can still mark which
   row is current, but they carry no styling of their own any more. */

/* drag-to-reorder in the Day-view list — the hub included, it's just the
   topmost of the same cards now, so one rule covers both. The card itself
   (.item.stack) gets the visual lift; the actual dragged/pushed transforms
   land on .time-row (wireStackDrag's dragEl), the whole row including its
   in-card time badge. */
.item.stack.stack-dragging{
  cursor:grabbing;box-shadow:var(--shadow-lg);z-index:30;transition:none;
  pointer-events:none;
}
.time-row.time-row-dragging{ z-index:30; }
.time-row.drop-target .item{
  outline:2.5px dashed var(--bc,var(--accent));outline-offset:-2.5px;
}
/* the hovered row slides into the exact gap the dragged card left behind —
   transform is set inline (per-pair distance varies), the transform
   transition on .time-row below is what animates it. */

/* status label above a stack card — a separate sibling, not a row inside
   the card's own surface; see timelineItem's status handling. .rows.stack's
   gap already spaces every direct child evenly, which would put this label
   equally far from the row above as from its own card below; the negative
   margin pulls it back onto its card so the gap only reads on the far side
   (the hub sits outside .rows.stack, so it doesn't need that pull-back —
   .hub below cancels it). */
/* The status eyebrow sits BESIDE the card, not above it. As a stacked row it
   cost every card ~16px of height on a view whose whole job is fitting the
   day on one screen — and height is the scarce axis here (see anchorRows:
   rows are anchored to their start minute, so every px of card height pushes
   later rows off true scale). Beside it, the cost is width instead, which is
   free by comparison: the label is 4-11 characters and the card keeps
   minmax(0,1fr) of whatever's left. Written sideways so the column is one
   line of text tall regardless of the string, and capped so a long status
   can't eat the card. */
.item-top{
  display:flex;align-items:center;justify-content:center;gap:6px;
  writing-mode:vertical-rl;transform:rotate(180deg);
  max-height:100%;padding:2px 0;
}
.item-top .eyebrow{white-space:nowrap;}
/* .item-top.hub's own bigger font/gap is gone (2026-08-25 redesign) — the
   current task's status eyebrow is the same size as any other card's now,
   consistent with there being no more differently-sized "hub" card. */

.chip{
  font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);
  border:1.5px solid var(--line);white-space:nowrap;display:inline-block;
}
/* same board colour wherever a chip carries it (hub, list rows) */
.chip.bk{background:var(--bc-soft);color:var(--bc);border-color:transparent;}
.chip.crit{background:var(--crit);color:#fff;border-color:var(--crit);}
.chip.age{background:var(--age-soft);color:var(--age);border-color:transparent;}
/* duration is context, not a signal — it used to carry the same saturated
   blue-indigo (--deep) as the urgency badges elsewhere, competing with the
   due chip's own colour for attention. Same quiet neutral .chip.due sits in
   when nothing's actually due soon. --deep/--deep-soft are unchanged and
   still used by celebrate()'s confetti palette. */
.chip.deep{background:var(--surface-2);color:var(--ink-3);border-color:transparent;}
/* A start–end range is a CLOCK READING, so it gets the same treatment the
   meeting banner's own .mn-time already uses: mono, tabular, no pill, no
   uppercase tracking. It reads as the time itself rather than as another
   badge competing with the due/board chips beside it. Not folded into
   .chip.deep — the swap picker still uses that for "8h"/"3h", which are
   sizes, not times. */
/* line-height is explicit and the box keeps real height: with padding:0 and
   the inherited line-height, the inline box collapsed to ~2px of its own and
   the glyphs overflowed the card's bottom edge, where .item's overflow:hidden
   clipped them — the time was in the DOM, measurably "visible", and simply
   not on screen. Any zero-padding chip in an overflow:hidden card needs this. */
.chip.time{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;
  padding:0;background:none;border:none;color:var(--ink-3);
  line-height:1.4;display:inline-block;
}
.chip.due{background:var(--surface-2);color:var(--ink-3);border-color:transparent;}
.chip.live{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}

/* compact open-in-Trello glyph, dropped next to any card title */
.card-link{
  display:inline-grid;place-items:center;width:18px;height:18px;margin-inline-start:6px;
  border-radius:99px;color:var(--ink-3);text-decoration:none;font-size:11px;line-height:1;
  border:1.5px solid var(--line);background:var(--surface);vertical-align:middle;
  transition:background .14s,color .14s,border-color .14s;
}
.card-link:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3);}

.btn{
  border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:99px;padding:10px 18px;cursor:pointer;
  font-family:var(--font-body);font-size:14.5px;font-weight:800;
  box-shadow:none;
  transition:background .15s,border-color .15s,transform .1s,filter .1s,opacity .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);border-color:var(--accent-ink);color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent);}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:10px 12px;}
.btn.quiet:active{transform:scale(.94);}
.btn.icon{padding:0;width:44px;height:42px;display:grid;place-items:center;font-size:17px;line-height:1;}
.btn.icon.quiet{border-color:var(--line);background:transparent;}
.btn.icon.quiet:active{transform:scale(.9);}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* meeting-in-progress note above the answer */
.meeting-now{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;margin-bottom:10px;
  border-radius:16px;border:1.5px dashed var(--line-2);color:var(--ink-2);
  font-size:13.5px;font-weight:700;background:var(--surface-2);
}
.meeting-now .mn-time{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);flex:0 0 auto;}
.meeting-now .mn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------------- later: day timeline ---------------- */
.later{margin-top:16px;}
.later .lh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
/* The separate hour gutter is GONE (2026-08-26). It only ever made sense
   beside rows positioned on a pixel-per-minute scale, and it was the half
   of that design that broke first: the labels were drawn from unpushed
   positions while the cards they name were pushed down to resolve
   short-card overlaps, so a card and its own hour label drifted apart by
   the accumulated push. Every row states its own start time in the rail
   instead — one time column, always beside the thing it describes, no
   second scale to disagree with. */
.rows{flex:1 1 auto;min-width:0;}
/* each scheduled thing is its own card, positioned by time — the hub
   (.item.hub, above) is this same card, just bigger and re-tinted.
   backdrop-filter is dropped — it blurred whatever sat behind the card,
   which mattered when the card itself was a translucent tint; against an
   opaque --surface it had nothing left to do.

   NO COLOURED LEFT SPINE (removed on request). It used to be the card's one
   board signal, back when a card carried no other board mark. It does now:
   .chip.bk in row-meta renders the list name in the board's own colour, so
   the identity is still on every card, in a place that also says WHICH list
   rather than only hinting at a hue. With a real hour grid to the left of
   the cards, a second vertical colour bar at the card's left edge read as
   part of the gutter rather than as a property of the card. */
.item{
  /* position:relative, not absolute — a leftover from the true-to-scale
     layout, where every card was placed by computed top/height. Rows are in
     normal flow now (2026-08-26) and the absolute rule only survived because
     .time-row's grid re-established a containing block for it. */
  position:relative;
  border-radius:14px;border:1.5px solid var(--line-soft);
  background:var(--card);
  overflow:hidden;touch-action:none;cursor:grab;
  transition:box-shadow .15s,transform .1s;
}
.item.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:20;transition:none;}
.item.expanded{z-index:8;height:auto!important;}
/* A missed task RECEDES — it's still open, but its slot has passed, so it
   must not compete with what's live now. Was a 1.75px dashed red border at
   full card size, which made the things you already failed to do the
   loudest objects on the day. Now: grey surface, muted text, a grey spine
   instead of its board colour, and a size step down (the .collapsed
   treatment applies on top of this via the accordion). The grey spine went
   with every other spine (see .item above); the muted surface, border and
   text still carry "this one slipped" on their own. */
.item.miss{
  background:#F4F2EC;border-color:#E2DED2;
}
.item.miss .row .n,.item.miss .n{color:var(--ink-3);}
.item.miss .chip{opacity:.7;}
/* Size/shape unified with every other card (2026-08-25 redesign) — a missed
   slot used to also step down in padding/title size; that's gone, only the
   muted colour still says "this one slipped." */
/* Recedes via muted colours, NOT element opacity: opacity makes the whole
   box translucent, so once there was an hour grid behind the cards the
   dashed rules showed through every meeting and appeared to cut across it.
   The colours below reproduce the same washed-out look opaquely. */
.item.meeting{cursor:default;background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2);}
.item.meeting .n,.item.meeting .row .n{color:var(--ink-2);}
.item.done{opacity:.5;}

/* Day view's rows: a plain flow stack (2026-08-26). `relative` stays as the
   positioning context nestConnectors measures against; the 6px gap is the
   whole vertical rhythm now that nothing computes a per-row offset. */
.rows.stack{
  position:relative;
  display:flex;flex-direction:column;gap:6px;
  margin-top:4px;
}
.day-grid{display:block;}
/* relative, not static: kept as the positioning context for anything
   absolute inside a card, and relative-with-no-offset lays out identically
   to static — the drag hit-testing this was set to `static` for (see
   wireStackDrag) snapshots getBoundingClientRect(), which relative doesn't
   change. (It originally existed to anchor .item's ::before spine, which is
   gone; the rule is not, since removing it changes nothing and risks
   reparenting whatever else resolves against it.) The
   drag/push transform itself now lands on the enclosing .time-row (below),
   not here — the row's in-card time badge has to travel with it. */
/* pan-y overrides the plain .item rule's touch-action:none — Day-list
   reorder only starts once wireStackDrag's own intent check confirms a real drag
   (see its pointerdown/pointermove), so the browser is free to handle a
   vertical touch here as its native page-scroll gesture until that
   moment, instead of every touch on a card eating the scroll outright. */
/* A press-and-hold on a card is a drag, never a text selection. wireStackDrag
   deliberately waits ARM_MS with the finger still before it captures the
   pointer (so a swipe can still scroll past a card) — but during that window
   the browser is free to start its OWN long-press gesture, and on touch that
   means the native text-selection callout. It wins the gesture, the card
   never moves, and you get a blue highlight over the card title instead of a
   drag. Suppressing selection on the card is what makes the hold reach
   wireStackDrag at all. -webkit-touch-callout kills the iOS
   copy/define bubble that rides along with it.
   Scoped to the card surface, not the page: .details (the expanded
   description/checklist) re-enables selection below, since reading and
   copying a card's notes is a real thing to want. */
.item.stack{
  position:relative;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;
  touch-action:pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* LIST TINT (2026-08-26, user request: cards should carry their list's
   colour). Keyed on .lk-<key>, which listClass() only ever emits for a real
   Trello card that has a list — so this deliberately does NOT reach a break
   or a meeting. Both of those set --bc-soft too (.bk-break, .bk-none), and
   an earlier version of this rule lived on plain .item and therefore tinted
   them as well: that re-broke the exact translucency bug fixed on
   2026-08-25, where a break card's azure wash let the grid show through, and
   `brk.js` caught it immediately ("a break card should have no gradient
   any more"). Breaks and meetings are not cards on a list; they have no
   list colour to carry.
   A gradient layer over --card rather than a flat colour, because --bc-soft
   is a ~16% alpha wash: painted as `background-color` it would composite
   against the page instead of the card, and a saturated fill behind body
   text is unreadable regardless. */
.item[class*="lk-"]{
  background:linear-gradient(var(--bc-soft,transparent),var(--bc-soft,transparent)),var(--card);
}
/* the one place inside a card where selecting text is the point */
.item.stack .details{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
.item.stack .row{gap:6px 10px;padding:7px 12px;}
.item.stack .row .n{font-size:var(--t-sm);}
/* The current-task glow. Scoped OFF .hero-slot's own hero card (see
   .hero-slot .item.hub{animation:none} above) — the hero already carries
   its own weight via size/shadow, so this now marks only currentMarker's
   slim in-timeline sliver, the thing standing in for "you are here" while
   scrolling past it. A pure CSS @keyframes loop, no JS ticking: the
   .current class is assigned once per repaint, and the animation itself
   runs forever in CSS with nothing to drive per-second. box-shadow rather
   than border/outline so it doesn't shift layout or fight the board spine. */
.item.current{animation:current-glow 2.4s ease-in-out infinite;}
@keyframes current-glow{
  0%,100%{box-shadow:var(--shadow), 0 0 0 1.5px var(--bc,var(--accent));}
  50%{box-shadow:var(--shadow), 0 0 0 3px var(--bc,var(--accent));}
}
/* The now-line's replacement (see tickDrain()): a wash that fills
   left-to-right as the current task's minutes burn, on both the hero card
   and its slim timeline marker. A plain absolutely-positioned span sized
   by the shared --drain custom property, painted UNDER the card's real
   content (z-index left at auto, inserted first in paint order, no
   content of its own) rather than an animated background-size — a custom
   property write is one style recalc, no layout, cheaper than fighting
   border-radius clipping on a changing background-size. */
.item.hub{position:relative;}
/* The slim in-timeline stand-in for the current task. It carries only a
   title (the hero above owns the actions), so without its own padding it
   rendered as a bare glowing outline with text jammed against the edge —
   which read as an error state once the card also picked up its list tint
   (2026-08-26). Padding is what makes it a card rather than a box. */
.current-marker-card{position:relative;padding:9px 13px;font-weight:800;}
/* One ring, not two. .item.current's pulsing glow plus the list tint plus
   the neutral card border stacked three signals for one fact; the marker
   keeps the glow (it IS the "you are here" marker) and drops the border it
   would otherwise inherit from .item. */
.current-marker-card{border-color:transparent;}
.drain-fill{
  position:absolute;left:0;top:0;bottom:0;width:var(--drain,0%);z-index:0;
  background:var(--accent-soft);border-radius:inherit;
  pointer-events:none;transition:width 1s linear;
}
.hero-slot .drain-fill{opacity:.55;}
.current-marker-card .drain-fill{opacity:.3;}
/* .drain-fill is position:absolute with z-index:auto/0 — CSS stacking
   order paints positioned descendants AFTER non-positioned in-flow ones
   regardless of DOM order, so without this the fill would sit on top of
   the card's own text no matter where it's inserted. Lifting the real
   content into its own stacking context above it is the fix. */
.item.hub > .row, .item.hub > .row-meta, .item.hub > .hero-eyebrow,
.current-marker-card > .n{position:relative;z-index:1;}
/* A collapsible card (see timelineItem's `collapsible`) that isn't the one
   open card renders small and muted — the whole point being that the rest
   of the day stays visible without competing with whichever card is open.
   Tapping it (wired in timelineItem, not here) opens it in place of
   whichever other card was open. */
.item.stack.collapsed{box-shadow:none;}
.item.stack.collapsed .row{padding:6px 10px;}
.item.stack.collapsed .row .n{font-size:11.5px;font-weight:700;color:var(--ink-3);}
.item.stack.collapsed .row .n .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.item.stack.collapsed .row-meta{padding:0 10px 7px;}
.item.stack.collapsed .chip{font-size:10px;padding:2px 7px;}
.item.stack.collapsed .card-link{display:none;}

/* One row = one thing on the day, one column wide (2026-08-27, user
   request: put the start-end time INSIDE the card's top-left corner,
   Google-Calendar-chip style, instead of in a separate rail column outside
   it). The rail used to be a fixed 52px first grid track; cards now start
   flush at the row's own left edge and carry their own time via
   `rowLead`'s `.t` (see timelineItem/quietGap/offHoursCard/heroCard). */
.time-row{
  display:block;
  transition:transform .15s;
  position:relative;
}
/* Nested under a permeable meeting — see timelineItem's opts.indent. A real
   margin now that rows are in flow again; it used to be an inline `left`
   because an absolutely-positioned row resolved against .rows.stack rather
   than its own .nest parent. */
.time-row.indent{margin-left:14px;}
/* .time-row.hub's own margin-bottom is gone (2026-08-25 redesign) — rows
   are absolutely positioned by real time now, so an extra margin on one
   row type would just be a stray offset, not meaningful spacing. */
/* card first, eyebrow second — the eyebrow is order:2 in the DOM too, so
   reading order matches visual order.

   align-items:flex-start, NOT stretch. Stretch made the card a flex item
   sized by the ROW rather than by its own content, so a card whose content
   was taller than the row simply had the overflow clipped by .item's
   overflow:hidden — which silently ate the entire .row-meta line (time chip,
   due chip, action buttons) on the hub. The card must size itself; the
   sideways eyebrow stretches to match it instead, via align-self. */
.card-col{min-width:0;display:flex;align-items:flex-start;gap:6px;}
.card-col > .item{flex:1 1 auto;min-width:0;}
.card-col > .item-top{align-self:stretch;}
/* The card's own time badge (.row-lead .t, see .row CSS below) is
   unselectable for the same reason .item.stack is — a hold that lands on
   the time must arm a drag, never a text selection. */
.row-lead .t{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

/* ---- off the clock ----------------------------------------------------
   The stretch between the end of the working day and a calendar event later
   that evening. It is not a task and not a Break — nothing is scheduled into
   it and nothing is written to Google Calendar for it — so it deliberately
   does NOT reuse .item.stack: no spine, no actions, not draggable.
   This is also the one card in the app that gets a gradient. Everything else
   is a neutral surface plus a coloured spine, on purpose (see the .item
   notes), because those cards are work and have to stay quiet and
   comparable. This one means "you're done" — it's allowed to be the reward,
   and it's the only place a richer treatment doesn't compete with anything.
   Requested as "similar to Break but much more juicy". */
/* Free time inside the working day (quietGap). Deliberately the quietest
   thing on screen: a dashed outline and one line of text, no fill, no
   spine, no actions. It replaces the old ".hour-skip" tag — a "⋯ 2h" mark
   floated over compressed empty space, which announced that the VIEW had
   skipped something rather than that the DAY had room in it. Distinct from
   .offhours below, which means the work day is over and is allowed to be a
   reward; this one just means there is a hole in the middle of it. */
.quiet{
  display:flex;align-items:baseline;gap:8px;min-width:0;
  border:1px dashed var(--line-2);border-radius:12px;
  padding:9px 13px;background:transparent;
}
/* the card's own start time, left anchor — 2026-08-27, replaces the outside
   rail column every card used to get its start from */
.quiet-start{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3);
  opacity:.7;letter-spacing:-.02em;flex:0 0 auto;
}
.quiet-k{
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);opacity:.8;
}
.quiet-span{font-size:13px;font-weight:700;color:var(--ink-2);}
.quiet-until{font-size:12px;font-weight:500;color:var(--ink-3);opacity:.75;margin-left:auto;}

.offhours{
  position:relative;overflow:hidden;min-width:0;
  border-radius:14px;padding:14px 16px;
  background:linear-gradient(135deg,var(--dusk-1) 0%,var(--dusk-2) 52%,var(--dusk-3) 100%);
  color:var(--dusk-ink);
  box-shadow:0 2px 5px rgba(46,22,86,.22), 0 16px 34px -10px rgba(76,59,207,.45);
}
/* a soft highlight sitting off the top-left corner, so the gradient reads as
   lit rather than as a flat two-colour ramp */
.offhours-glow{
  position:absolute;top:-46px;left:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.30),rgba(255,255,255,0) 70%);
  pointer-events:none;
}
.offhours-body{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;}
/* the card's own start time, left anchor — 2026-08-27, replaces the outside
   rail column; recedes, since the card's own "off the clock" message is the
   interesting part, not the exact minute */
.offhours-start{
  font-family:var(--mono);font-size:11px;font-weight:600;opacity:.6;
  letter-spacing:-.02em;
}
.offhours-k{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  opacity:.75;
}
.offhours-span{
  font-family:var(--font-display);font-size:21px;font-weight:900;letter-spacing:-.02em;
  line-height:1.1;
}
.offhours-until{font-size:12px;font-weight:600;opacity:.85;overflow-wrap:anywhere;}
/* no margin nudge — anchorRows owns every row's vertical position now */

/* tasks scheduled inside a permeable meeting nest under it, so "חמל, and
   two tasks inside it" reads as one group instead of scattering in the list */
/* Indent only, no dashed rule of its own any more: with a real hour gutter
   down the left, a second vertical dashed line 20px inside it read as a
   duplicate of the grid rather than as grouping. The indent alone still says
   "these belong to the meeting above", and it's kept small so a nested card
   stays close to the hour line that names it. */
/* .nest is no longer a real layout container (2026-08-25 redesign) — its
   children are position:absolute .time-rows that resolve against
   .rows.stack, their nearest positioned ancestor, so .nest's own
   flex/margin/gap here do nothing to them (confirmed live: .nest's own box
   collapsed to zero height and its indent had no effect once .time-row
   became absolutely positioned in the true-to-scale redesign). Kept only
   as a grouping marker in the DOM (queried by groupForStack's callers,
   tests); the real indent is opts.indent on each nested timelineItem call
   (see timelineItem, `if(opts.indent) timeRow.style.left="12px"`). */
.nest{display:contents;}
/* Connects a permeable meeting to each of its nested tasks — a short
   dashed line bridging the real gap between two specific cards, not a
   fixed-height flow spacer (that stopped making sense once every row is
   absolutely positioned by real time; see nestConnectors' own comment for
   why this measures real gaps instead of using a tuned constant). Kept as
   an in-flow-shaped element sized and placed by JS from measured
   getBoundingClientRect() deltas, not a z-index overlay: two earlier
   passes at ONE continuous line behind a whole group (absolutely
   positioned overlay + negative z-index — correct per CSS2.1's paint-order
   rules, confirmed behind the card in local Playwright renders both times)
   still showed the line crossing OVER the card on the real device, both
   times, including in incognito (rules out cache) — that divergence was
   never explained, so the overlay approach stays abandoned. This reuses
   the proven shape instead: a plain dashed-border strip with nothing else
   sharing its space, so there's no stacking order for any browser to get
   wrong. */
.nest-connector{
  position:absolute;width:0;
  border-left:2px dashed var(--line-2);
  pointer-events:none;
}

/* .row is a real two-column grid, not a flex line: column 1 (.row-lead,
   time+dot+list chip) sizes to its own content, column 2 (.n, the title)
   gets exactly what's left via minmax(0,1fr). A flex row let a long title
   get pushed onto its own full-width line once it couldn't share the line
   at any size; grid makes "title is always the right column" structural
   instead of incidental -- fitRowTitle (below) can then just read .n's own
   clientWidth as the real available width, no sibling-width math needed. */
.row{
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px;
  padding:6px 8px;height:100%;min-height:100%;
}
.row-lead{display:flex;align-items:flex-start;gap:8px;min-width:0;}
.row .t{
  font-family:var(--mono);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--ink-2);flex:0 0 auto;padding-top:1px;white-space:nowrap;
}
.row .dot{
  flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  background:var(--bc,var(--b-none));margin-top:4px;
}
.item.meeting .dot{background:transparent;border:1.5px solid var(--line-2);}
/* -webkit-line-clamp was tried here as a hard 2-line backstop and dropped:
   its only child is .nt (display:inline-block, needed so an RTL title
   still shrink-wraps next to the timestamp -- see .nt below), and Chrome
   doesn't clamp a -webkit-box through an inline-block child -- verified
   directly (a bare text child clamps to 2 lines at the expected height, an
   inline-block-wrapped one renders a 3rd line anyway). The cap is fitRowTitle
   alone: it shrinks the font until the wrapped height fits two lines, down
   to a floor -- a title so long even the floor can't do it in two (never
   seen outside a synthetic 200+ character test) wraps past two rather than
   truncating silently. */
.row .n{min-width:0;font-size:13.5px;font-weight:700;overflow-wrap:anywhere;line-height:1.3;text-align:right;}
/* status / duration / board, one line under the row — the same read the
   hub gives its one task, just compact enough for a whole list of them.
   Done/Swap/Pending/Remove used to be forced onto their own full-width
   line inside .row (acts-inline's old flex:1 1 100%), stacking a third
   line of chips underneath instead of sharing the actions' line — chips
   left, actions right, wrapping together onto a line of their own only
   when the row is too narrow to hold both. */
/* margin-top:auto PINS this line to the card's bottom. .item.stack is a
   flex column, so once sizeCardToDuration grows a long card past its own
   content (a 3h session is 179px of clock but ~85px of content) the leftover
   space would otherwise sit BELOW this row, leaving the time and the action
   buttons floating in the middle of the card with dead space under them.
   auto absorbs that space above the row instead, so the bottom line stays on
   the bottom at every card height. On a natural-height card auto resolves to
   0, which is why the old -2px tightening moved onto .row's bottom padding
   rather than staying here — a negative top margin here would fight the pin. */
.row-meta{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;padding:0 12px 10px;margin-top:auto;}
.row-meta .eyebrow{font-size:10px;}
.meta-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0;}
/* shrink-to-fit titles: RTL text stays next to its timestamp */
.nt{display:inline-block;max-width:100%;vertical-align:top;}
.item.meeting .n{font-style:normal;color:var(--ink-2);}
.item.miss .t{color:var(--crit);}
.row.done .n{text-decoration:line-through;text-decoration-thickness:2px;}

.acts-inline{display:flex;gap:3px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
.mini{
  width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;font-size:12px;line-height:1;
  transition:background .14s,color .14s,border-color .14s,transform .12s;
}
.mini:hover{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink);transform:scale(1.08);}
.mini:active{transform:scale(.9);}
.mini:disabled{opacity:.4;cursor:not-allowed;}
.mini.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
/* FILLED AT REST, one colour per action (2026-08-26, user request: "action
   buttons need colors and look juicy with white text"). They used to be
   neutral rings that only coloured on hover, which meant the whole action
   row read as one grey blur until you moved the pointer over it — on a
   phone, where there is no hover at all, it never coloured.
   Re-mapped 2026-08-27 (direct user request): Done green, Swap light blue,
   Pending yellow — matching the rebuild button and progress-pill's own
   accent, since Pending is the "revisit later" action and that's the same
   family those two already read as. Remove stays red.
   White glyphs on every fill EXCEPT Pending: --accent is a bright yellow and
   white-on-yellow fails contrast badly (~1.6:1), so Pending uses the same
   dark ink the yellow rebuild/progress-pill buttons already use on that
   fill — it reads as the same family and is legible. The others clear
   4.5:1, --done included (a mid-bright green, not a pale one). */
.mini.ok{background:var(--done);border-color:var(--done);color:#fff;font-weight:800;}
.mini.ok:hover{background:#4CDE8C;border-color:#4CDE8C;color:#fff;}
.mini.swap{background:var(--sky);border-color:var(--sky);color:#fff;}
.mini.swap:hover{background:#3FA0DC;border-color:#3FA0DC;color:#fff;}
.mini.pend{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.mini.pend:hover{background:#FFD469;border-color:#FFD469;color:var(--on-accent);}
.mini.del{background:var(--crit);border-color:var(--crit);color:#fff;}
.mini.del:hover{background:#E63B4C;border-color:#E63B4C;color:#fff;}
/* Details is a disclosure toggle, not a committing action like the four
   above — user asked for "something more subtle" than the solid grey fill
   it had. A ghost/outline treatment (soft tinted fill, no saturated hue,
   ink-2 text) reads as "look, don't act" rather than joining the row of
   filled buttons as a fifth equally-weighted action. */
.mini.info{background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2);}
.mini.info:hover{background:var(--line);border-color:var(--ink-3);color:var(--ink);}
/* A filled button must not wash out to near-white when disabled — keep the
   fill and dim the whole control, so a locked action still reads as itself. */
.mini.ok:disabled,.mini.swap:disabled,.mini.pend:disabled,
.mini.del:disabled,.mini.info:disabled{opacity:.38;}
.mini.text{width:auto;padding:0 10px;font-size:11px;font-weight:800;}
/* Settings' "Clear Activity Data" is the one remaining .mini.text button —
   reuses the red remove-card colour at rest, unlike the icon actions above. */
.mini.text.del{color:var(--crit);}
.resize-handle{
  position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none;
}
.resize-handle::after{
  content:"";position:absolute;left:50%;bottom:2px;width:26px;height:3px;border-radius:2px;
  background:var(--bc,var(--ink-3));opacity:.5;transform:translateX(-50%);
}
.item.dragging.cross-day{outline:2.5px dashed var(--accent);outline-offset:2px;}


/* ---------------- asset pipeline (tracker board kanban) ----------------
   Columns scroll sideways as a group; each column scrolls its own cards.
   Sized so a phone shows roughly one and a half stages, which is enough to
   make the horizontal scroll obvious without a hint. */
.pipe{display:flex;flex-direction:column;gap:10px;min-height:0;}
.pipe-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.pipe-board{
  font-family:var(--font-display);font-size:19px;font-weight:900;
  letter-spacing:-.01em;color:var(--ink);min-width:0;overflow-wrap:anywhere;
}
.pipe-total{
  flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink-3);
}
.pipe-cols{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding-bottom:6px;-webkit-overflow-scrolling:touch;
}
.pipe-col{
  flex:0 0 auto;width:min(68vw,240px);
  display:flex;flex-direction:column;min-height:0;
  border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);
}
.pipe-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-bottom:1.5px solid var(--line);
}
.pipe-name{
  font-family:var(--font-body);font-size:11px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pipe-count{
  flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:800;
  background:var(--bc-soft,var(--surface));color:var(--bc,var(--ink-3));
  border-radius:99px;padding:2px 7px;
}
.pipe-body{display:flex;flex-direction:column;gap:6px;padding:8px;overflow-y:auto;}
.asset{
  display:flex;align-items:flex-start;gap:6px;width:100%;text-align:right;
  border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  padding:8px 10px;cursor:pointer;color:var(--ink);
  transition:border-color .12s,transform .12s;
}
.asset:hover{border-color:var(--bc,var(--ink-3));}
.asset:active{transform:scale(.98);}
.asset.busy{opacity:.5;pointer-events:none;}
.asset-n{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;}
.pipe-empty{padding:10px;text-align:center;color:var(--ink-3);font-size:12px;}
.pipe-note{margin:0;font-size:11px;}

/* ---------------------------------------------------------- projects view
   Same card language as .item / .now: one neutral surface, a hairline edge,
   and a single coloured spine for board identity — never a tinted fill. */
.proj{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;}
.proj-card{
  position:relative;overflow:hidden;
  border-radius:16px;border:1.5px solid var(--line-soft);
  background:var(--card);box-shadow:var(--shadow);
  padding:14px 16px 14px 18px;
  display:flex;flex-direction:column;gap:8px;
}
.proj-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--bc,var(--b-none));
}
.proj-top{display:flex;align-items:baseline;gap:8px;}
.proj-name{
  font-family:var(--font-display);font-size:19px;font-weight:900;
  letter-spacing:-.01em;color:var(--ink);min-width:0;overflow-wrap:anywhere;
}
.proj-clear{margin:0;font-size:13px;}
.proj-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.proj-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:0 0 auto;}
.proj-v{font-size:14px;font-weight:700;color:var(--ink);text-align:end;min-width:0;overflow-wrap:anywhere;}
.proj-note{margin:0;font-size:11.5px;}
/* the one interactive control in the view — reads as a field, not a button
   pretending to be text */
.proj-deadline{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  width:100%;padding:8px 10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface-2);
  font:inherit;text-align:start;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.proj-deadline:hover{border-color:var(--bc,var(--accent-line));}
.proj-deadline.unset .proj-v{color:var(--ink-3);font-weight:600;}
.proj-press{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.proj-band{font-family:var(--font-display);font-weight:900;letter-spacing:-.01em;}
.proj-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.proj-fill{height:100%;border-radius:99px;background:var(--ink-3);transition:width .2s;}
/* one hue per band, reusing the existing status tokens rather than new ones */
.pb-calm  .proj-band{color:var(--done);}   .pb-calm  .proj-fill{background:var(--done);}
.pb-ok    .proj-band{color:var(--deep);}   .pb-ok    .proj-fill{background:var(--deep);}
.pb-tight .proj-band{color:var(--age);}    .pb-tight .proj-fill{background:var(--age);}
.pb-over  .proj-band{color:var(--crit);}   .pb-over  .proj-fill{background:var(--crit);}
.pb-none  .proj-band{color:var(--ink-3);}
.proj-dense{
  border-radius:12px;background:var(--accent-soft);
  border:1.5px solid var(--accent-line);padding:8px 10px;
}
.proj-dense-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);}
.proj-dense-b{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);}
.proj-segs{display:flex;flex-direction:column;gap:2px;margin-top:2px;border-top:1.5px dashed var(--line);padding-top:8px;}
/* a segment row is a real control now — it opens that segment's assets so
   they can be moved along the pipeline */
.proj-seg{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  width:100%;font:inherit;font-size:12.5px;text-align:start;
  padding:4px 6px;margin:0 -6px;border-radius:8px;
  background:none;border:0;cursor:pointer;
  transition:background .12s;
}
.proj-seg:hover{background:var(--surface-2);}
.proj-seg::after{content:"›";color:var(--ink-3);opacity:.5;flex:0 0 auto;}
.proj-seg-n{color:var(--ink-2);min-width:0;overflow-wrap:anywhere;flex:1 1 auto;}
.proj-seg-c{color:var(--ink-3);flex:0 0 auto;font-variant-numeric:tabular-nums;}
/* asset rows inside the segment sheet */
.seg-asset{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.seg-asset-n{min-width:0;overflow-wrap:anywhere;}
.seg-asset-stage{
  flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-3);
  background:var(--surface-2);border:1.5px solid var(--line);
  padding:2px 7px;border-radius:99px;
}
.seg-asset.busy{opacity:.5;pointer-events:none;}
.proj-seg-more{font-size:11px;margin-top:2px;}
/* deadline dialog */
.dl-set{padding:0 19px 14px;display:flex;flex-direction:column;gap:10px;}
.dl-input{
  width:100%;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);
  font:inherit;font-size:15px;color:var(--ink);
}
.dl-input:focus{outline:2px solid var(--accent-line);outline-offset:1px;}
.dl-prev{margin:0;font-size:12.5px;font-weight:700;color:var(--ink-2);}
.dl-cancel{background:var(--surface-2);color:var(--ink-2);border:1.5px solid var(--line);}
/* stage picker inside the move sheet — sits in a standard .pick body */
.stage-opt{
  width:100%;text-align:start;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.stage-opt:hover{border-color:var(--accent);background:var(--accent-soft);}
.stage-opt.cur{opacity:.45;cursor:default;}

/* ---------------- expandable card detail ---------------- */
.details{
  margin-top:6px;padding-top:10px;border-top:1.5px dashed var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);
}
.item > .details{
  margin:0 8px 10px;padding:10px 12px;border-top:1.5px dashed var(--line-2);
  background:var(--surface);border-radius:14px;
}
@media (max-width:520px){ .item > .details{margin-left:8px;} }

.details .desc{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;}
.details .desc:last-child{margin-bottom:0;}
.details .desc-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:12px;}
.details .desc-row .desc{margin-bottom:0;flex:1 1 auto;}
.details .edit-pencil{
  flex:0 0 auto;width:22px;height:22px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;font-size:11px;line-height:1;
  transition:background .14s,color .14s,border-color .14s;
}
.details .edit-pencil:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3);}
.details .edit-row{margin-bottom:12px;}
.details .edit-row textarea{
  width:100%;resize:vertical;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:12px;padding:8px 10px;box-sizing:border-box;
}
.details .edit-acts{display:flex;gap:8px;margin-top:8px;}
.details li.editing{align-items:center;}
.details li .mini{width:22px;height:22px;font-size:10px;}
.details .edit-item{
  flex:1 1 auto;min-width:0;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:10px;padding:4px 8px;box-sizing:border-box;
}
.details .clname{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin:10px 0 6px;
}
.details ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.details li{display:flex;gap:8px;align-items:flex-start;line-height:1.4;}
.details li .box{
  flex:0 0 auto;width:17px;height:17px;border-radius:5px;margin-top:1px;padding:0;
  border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;
  font-size:10px;color:transparent;cursor:pointer;
  transition:background .14s,border-color .14s,color .14s,transform .18s cubic-bezier(.2,.8,.25,1);
}
.details li .box:hover{border-color:var(--done);transform:scale(1.12);}
.details li .box:disabled{opacity:.5;cursor:progress;}
.details li.on .box{background:var(--done);border-color:var(--done);color:#fff;}
.details li.on .it{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;}
.details .it{min-width:0;overflow-wrap:anywhere;cursor:pointer;}
.details .it:hover{color:var(--ink);}
.details .muted{color:var(--ink-3);font-size:12.5px;}
.details .prog{
  height:4px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  overflow:hidden;margin-bottom:8px;
}
.details .prog i{display:block;height:100%;background:var(--done);}

.expand{
  border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 8px;border-radius:10px;
  transition:color .15s,background .15s;
}
.expand:hover{color:var(--ink);background:var(--surface-2);}

/* ---------------- states ---------------- */
.state{
  text-align:center;padding:44px 24px;
  background:var(--glass,var(--surface));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px dashed var(--line-2);border-radius:28px;
}
.state .big{font-size:38px;line-height:1;margin-bottom:14px;}
.state h2{margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em;text-wrap:balance;}
.state p{margin:0 auto;max-width:38ch;color:var(--ink-2);font-size:14px;font-weight:600;}
.state .acts{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}


.banner{
  border-radius:16px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:16px;
  border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);
}
.banner.crit{border-color:var(--crit);color:var(--ink);}
.banner strong{display:block;color:var(--ink);margin-bottom:2px;}
.skel{height:112px;border-radius:28px;background:var(--surface-2);}
@media (prefers-reduced-motion:no-preference){
  .skel{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.55;}}
}

/* ---------------- dialog / toast ---------------- */
/* padding leaves room for the notch/home-indicator on phones too, not just a
   flat 20px — a dialog taller than the space between them used to be able to
   overlap the top or bottom edge of the screen instead of just shrinking */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,10,20,.5);display:grid;place-items:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));}
.dialog{
  background:var(--glass-2,var(--surface));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow-lg);max-width:390px;width:100%;overflow:hidden;
}
@media (prefers-reduced-motion:no-preference){
  .dialog{animation:pop .2s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0;}}
}
.dialog .dh{padding:18px 19px 12px;}
.dialog .dh h3{margin:0;font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-size:17px;}
.dialog .dh p{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere;}
.dialog .df{padding:12px 17px;border-top:1.5px dashed var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;background:transparent;flex-wrap:wrap;}
.dialog .df:has(.df-actions){justify-content:space-between;}
.df-actions{display:flex;gap:8px;align-items:center;}

/* lock popup prototype — a big square that sits over the activity until the
   user commits via the nested confirm, not dismissable by tapping outside */
.lock-scrim{z-index:62;background:rgba(10,10,20,.72);}
.lock-box{
  width:min(360px,86vw);
  background:var(--glass-2,var(--surface));border:1.5px solid var(--line-2);border-radius:26px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;
  padding:28px 22px 24px;gap:16px;
}
@media (prefers-reduced-motion:no-preference){.lock-box{animation:pop .2s cubic-bezier(.2,.9,.3,1);}}
.lock-label,.lock-title{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-size:20px;color:var(--ink);text-align:center;}
.lock-sub{
  font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin-top:-8px;
}
.lock-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;width:100%;}
.lock-choice{
  border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:6px 2px 8px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,color .12s ease,background .18s ease;
}
.lock-choice .lc-badge{
  width:40px;aspect-ratio:1/1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--cc) 20%,var(--surface) 80%);
