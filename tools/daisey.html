     no write at all; that's the common case (most rows in a push don't
     actually move relative to their siblings). Scoped to quick rows only:
     a session/meeting row's own event is already fully handled by the
     "move" branch above (retimed in place, never split), so including it
     here would wrongly see zero of "its cards" surviving in any quick run
     (it was never a quick run's business to begin with) and queue a
     spurious delete right behind the move that just retimed it. */
  const oldEvIds = new Set(laidRows.filter(r => r.isQuick).map(r => r.evId));
  const undo = [];
  const writes = [];

  for(const run of runs){
    const cards = run.rows.map(r => r.card).filter(Boolean);
    const start = atMin(date, run.s), end = atMin(date, run.en);
    if(!run.isQuick){
      const row = run.rows[0];
      const raw = findRawEvent(row.evId);
      if(raw && +evStart(raw) === +start && +evEnd(raw) === +end) continue;
      const prevRaw = applyLocalMove(row.evId, start, end);
      undo.push(()=>{ if(prevRaw){ const r2=findRawEvent(row.evId); if(r2){ r2.start=prevRaw.start; r2.end=prevRaw.end; } } });
      writes.push({ kind:"move", id:row.evId, start, end, prevRaw });
      continue;
    }
    /* This run's cards match one still-alive event's own full card set,
       same order, same computed time → genuinely nothing to do. */
    const soleEvId = new Set(run.rows.map(r=>r.evId)).size===1 ? run.rows[0].evId : null;
    if(soleEvId){
      const raw = findRawEvent(soleEvId);
      const sameTime = raw && +evStart(raw)===+start && +evEnd(raw)===+end;
      const already = allEvents().find(e=>e.id===soleEvId);
      const sameCards = already && already.cardShorts.length===cards.length && cards.every(c=>already.cardShorts.includes(c.shortLink));
      if(sameTime && sameCards) continue;
    }
    if(cards.length===1){
      const stand = localBlock(cards[0], start, end, "quick");
      addLocalEvent(stand);
      const w = { kind:"create1", card:cards[0], start, end, standId:stand.id };
      /* Lazy: by the time undo actually runs, the local stand-in
         (standId) may already have been swapped for the real event
         (w.realId, set once commitRelay's write settles) — delete
         whichever one is actually live, not whichever existed when this
         closure was captured. */
      undo.push(()=>{ dropLocalEvent(w.realId || w.standId); });
      writes.push(w);
    }else{
      const stand = localBrickBlock(cards, start, end);
      addLocalEvent(stand);
      const w = { kind:"createN", cards, start, end, standId:stand.id };
      undo.push(()=>{ dropLocalEvent(w.realId || w.standId); });
      writes.push(w);
    }
  }
  /* Every old event this drag drew rows from, minus whatever it still
     legitimately keeps (a card that landed back in a run built from that
     same original event, unchanged) — the rest was just re-homed above,
     so the old event either shrinks or disappears. */
  for(const evId of oldEvIds){
    const ev = allEvents().find(e=>e.id===evId);
    if(!ev) continue;
    const keptShorts = new Set();
    for(const run of runs){
      if(!run.isQuick) continue;
      const evIdsInRun = new Set(run.rows.map(r=>r.evId));
      if(evIdsInRun.size===1 && [...evIdsInRun][0]===evId){
        for(const r of run.rows) if(r.card) keptShorts.add(r.card.shortLink);
      }
    }
    const stillHas = ev.cardShorts.filter(s=>keptShorts.has(s));
    if(stillHas.length === ev.cardShorts.length) continue;   // untouched
    /* prevCards/prevStart/prevEnd: what this event looked like before this
       drag touched it — undoRelay needs this to recreate a deleted event
       or restore an edited description on the real server, not just
       locally; a Ctrl+Z that only fixed the screen while leaving the real
       Calendar write standing would be worse than no undo at all. */
    const prevCards = ev.cardShorts.map(cardOf).filter(Boolean);
    if(stillHas.length === 0){
      const undoDrop = dropLocalEvent(evId);
      undo.push(undoDrop);
      writes.push({ kind:"delete", id:evId, prevCards, prevStart:ev.start, prevEnd:ev.end });
    }else{
      const cards = stillHas.map(cardOf).filter(Boolean);
      const undoDesc = applyLocalBrickDesc(evId, cards);
      undo.push(undoDesc);
      writes.push({ kind:"editDesc", id:evId, cards, prevCards });
    }
  }
  if(!writes.length) return null;
  return { writes, undo: ()=>undo.forEach(u=>u()) };
}
/* Fires the writes relayRows queued, in the safe order: creates first (so a
   task is never briefly homeless), then edits, then deletes — mirrors the
   "destroy second, create first" rule the rest of this file already
   follows for swap/remove. A write that still fails after callTool's own
   transient-retry backoff is handed to queueFailed exactly like every
   other write in this file (commitMove, applyPlan, swapTo) — the local
   patch stays on screen and the write becomes retryable from the unsaved
   bar, rather than only toasted for 3.4 seconds and then quietly lost. */
async function commitRelay(writes){
  const byKind = k => writes.filter(w=>w.kind===k);
  const label = w => w.kind==="create1" ? `Move: ${w.card.name}`
    : w.kind==="createN" ? `Move: ${w.cards.length} tasks`
    : w.kind==="editDesc" ? `Move: ${w.cards.length} task${w.cards.length===1?"":"s"}`
    : "Move";
  /* Each create* write already has a local stand-in on screen (relayRows
     added it via addLocalEvent, same optimistic pattern applyPlan uses) —
     once the real event lands, the stand-in has to come off or both sit in
     S.events.payload.events (the same array list_events reads) forever:
     one real, one a leftover local double, both rendered. applyPlan drops
     its own stand-ins the same way once their writes settle. */
  for(const w of byKind("create1")){
    try{
      const ev = await createBlock(w.card, w.start, w.end, "quick");
      w.realId = ev.id;
      dropLocalEvent(w.standId);
    }
    catch(e){
      toast(errCopy(e), true);
      queueFailed(label(w), async () => {
        const ev = await createBlock(w.card, w.start, w.end, "quick");
        w.realId = ev.id;
        dropLocalEvent(w.standId);
        render();
      });
    }
  }
  for(const w of byKind("createN")){
    try{
      const ev = await createBrickBlock(w.cards, w.start, w.end);
      w.realId = ev.id;
      dropLocalEvent(w.standId);
    }
    catch(e){
      toast(errCopy(e), true);
      queueFailed(label(w), async () => {
        const ev = await createBrickBlock(w.cards, w.start, w.end);
        w.realId = ev.id;
        dropLocalEvent(w.standId);
        render();
      });
    }
  }
  for(const w of byKind("move")){
    try{ await moveBlock(w.id, w.start, w.end); }
    catch(e){
      /* Same revert-on-failure commitMove already promises for a plain
         drag: this one row snaps back to where it was, on screen, rather
         than staying at a position that was never actually saved. */
      const raw = findRawEvent(w.id);
      if(raw && w.prevRaw){ raw.start = w.prevRaw.start; raw.end = w.prevRaw.end; }
      toast(errCopy(e), true);
      queueFailed(label(w), async () => {
        const again = applyLocalMove(w.id, w.start, w.end);
        try{ await moveBlock(w.id, w.start, w.end); render(); }
        catch(err){
          const r = findRawEvent(w.id);
          if(r && again){ r.start = again.start; r.end = again.end; }
          render();
          throw err;
        }
      });
    }
  }
  for(const w of byKind("editDesc")){
    try{ await updateBrickDesc(w.id, w.cards); }
    catch(e){
      toast(errCopy(e), true);
      queueFailed(label(w), async () => { await updateBrickDesc(w.id, w.cards); render(); });
    }
  }
  for(const w of byKind("delete")){
    try{ await deleteBlock(w.id); }
    catch(e){
      toast(errCopy(e), true);
      queueFailed(label(w), async () => { await deleteBlock(w.id); render(); });
    }
  }
  await refreshCalendar();
  render();
}
/* The real server-side reverse of commitRelay — Ctrl+Z on a card-aware push
   has to undo the actual Calendar writes, not just what's on screen, or a
   newly-merged event stays merged and a deleted one stays gone the moment
   this session's local model gets overwritten by the next real refetch.
   Same safe ordering logic as commitRelay, mirrored: recreate whatever was
   deleted first (so a task is never homeless mid-undo), restore edited
   descriptions, revert moves, then delete whatever this drag had created —
   deletes go last for the same "destroy second" reason creates go first
   in commitRelay itself. Best-effort: a write that fails to reverse is
   toasted, not queued — retrying a partial undo has no clean single
   "redo" recipe the unsaved bar's retry contract could describe, unlike a
   plain failed write whose retry is just "try the same write again". */
async function undoRelay(writes){
  const byKind = k => writes.filter(w=>w.kind===k);
  for(const w of byKind("delete")){
    try{
      if(w.prevCards.length===1) await createBlock(w.prevCards[0], w.prevStart, w.prevEnd, "quick");
      else await createBrickBlock(w.prevCards, w.prevStart, w.prevEnd);
    }catch(e){ toast(errCopy(e), true); }
  }
  for(const w of byKind("editDesc")){
    try{ await updateBrickDesc(w.id, w.prevCards); }
    catch(e){ toast(errCopy(e), true); }
  }
  for(const w of byKind("move")){
    if(!w.prevRaw) continue;
    try{ await moveBlock(w.id, evStart(w.prevRaw), evEnd(w.prevRaw)); }
    catch(e){ toast(errCopy(e), true); }
  }
  for(const w of [...byKind("create1"), ...byKind("createN")]){
    if(!w.realId) continue;   // never actually landed — nothing server-side to undo
    try{ await deleteBlock(w.realId); }
    catch(e){ toast(errCopy(e), true); }
  }
  await refreshCalendar();
  render();
}
function pushReorder(orderIds, originId, targetId){
  if(originId === targetId) return;
  const rowsById = new Map(reorderRows().map(r => [r.rowId, r]));
  const order = orderIds.map(id => rowsById.get(id)).filter(Boolean);
  const originIdx = order.findIndex(r => r.rowId === originId);
  const targetIdx = order.findIndex(r => r.rowId === targetId);
  if(originIdx < 0 || targetIdx < 0 || originIdx === targetIdx) return;
  const lo = Math.min(originIdx, targetIdx), hi = Math.max(originIdx, targetIdx);
  const range = order.slice(lo, hi+1);
  const evIdsInRange = new Set(range.map(r => r.evId));
  if(range.some(r => S.pending.has(r.card ? r.card.id : r.evId))) return;

  const dragged = order[originIdx];
  const rest = range.filter(r => r.rowId !== originId);
  const newOrder = originIdx < targetIdx ? [...rest, dragged] : [dragged, ...rest];

  const date = S.anchor;
  /* range[0]'s current position anchors the whole run — same "outer
     boundary doesn't move" rule as before. A quick row's own event.start
     isn't reliable (several rows can share one event), so the anchor comes
     from this row's own computed position in the live agenda(), not from
     reading its event directly. */
  const anchor = agenda().find(r => (r.card ? r.ev.id+":"+r.card.id : r.ev.id) === range[0].rowId);
  let cursor = anchor ? anchor.s : 0;
  const laid = newOrder.map(r => {
    const s = cursor, en = s + r.dur;
    cursor = en;
    return { ...r, s, en };
  });

  for(const r of laid){
    if(r.s < CFG.dayStart*60 || r.en > CFG.dayEnd*60){
      toast("That push doesn't fit inside the day.", true);
      render();
      return;
    }
    const busy = busyFor(date, evIdsInRange, !r.isQuick);
    if(busy.some(b => r.s < b.e && r.en > b.s)){
      toast(r.isQuick ? "That push doesn't fit — something's in the way." : "Sessions can't run inside a meeting or another block.", true);
      render();
      return;
    }
  }

  const relay = relayRows(date, laid);
  if(!relay) return;   // dropped back where it started
  if(relay.error){ toast("Couldn't move — one of these tasks isn't fully loaded yet.", true); render(); return; }
  render();
  showUndoPopup(relay.writes.length > 1 ? `Pushed ${relay.writes.length} cards.` : "→ moved");
  S.lastRelay = relay;
  S.lastMove = null;   // the two undo mechanisms are mutually exclusive — see undoMove
  /* undoMove needs this settled (specifically: every create write's
     w.realId filled in) before it can run undoRelay — a Ctrl+Z pressed
     while writes are still in flight has nothing server-side to delete
     yet for a create that hasn't landed. relay.settled is that handle. */
  relay.settled = commitRelay(relay.writes);
}

/* ---------------------------------------------------------------- undo
   One level, scoped to the last drag/resize/push — matches what a single
   Ctrl+Z press can reasonably promise to put back. A push undoes every
   card it moved together. Optimistic like the moves themselves: every
   card snaps back locally at once, each write goes out in the background.
   Two shapes share this one popup: S.lastMove (a plain time move — drag,
   resize, or a push that never touched a brick, {id,start,end} triples)
   and S.lastRelay (a card-aware push that created/edited/deleted whole
   events — see relayRows/commitRelay — a single undo closure plus the
   writes to re-fire). They're mutually exclusive: pushReorder clears
   whichever it isn't setting. */
async function undoMove(){
  if(S.lastRelay){
    const { undo, writes, settled } = S.lastRelay;
    dismissUndo();
    S.lastRelay = null;
    undo();
    render();
    toast(writes.length > 1 ? "Push undone." : "Move undone.");
    /* undoRelay needs every create write's realId, which only exists once
       commitRelay's own writes have actually landed — awaiting settled
       first is what makes a Ctrl+Z pressed while the drag's writes are
       still in flight correct instead of a no-op on whatever hadn't
       landed yet. The local model (already reverted above, on the same
       tick as every other undo in this file) doesn't wait on this. */
    await settled;
    await undoRelay(writes);
    return;
  }
  const moves = S.lastMove;
  if(!moves || !moves.length) return;
  dismissUndo();
  S.lastMove = null;
  for(const m of moves) m.prevRaw = applyLocalMove(m.id, m.start, m.end);
  render();
  toast(moves.length > 1 ? "Push undone." : "Move undone.");
  for(const m of moves) commitMove(m.id, m.start, m.end, m.prevRaw);
}
/* clears the popup itself (DOM + timer) without touching S.lastMove/
   S.lastRelay — used by showUndoPopup to retire a stale popup right before
   showing a new one */
function clearUndoPopup(){
  if(S.undoTimer){ clearTimeout(S.undoTimer); S.undoTimer = null; }
  const t = document.querySelector(".toast.undo");
  if(t) t.remove();
}
function dismissUndo(){
  clearUndoPopup();
  S.lastMove = null;
  S.lastRelay = null;
}
function showUndoPopup(label){
  clearUndoPopup();
  const t = el("div","toast undo");
  const msg = el("span","undo-msg"); bidi(msg, label);
  const undoBtn = el("button","undo-btn","Undo");
  undoBtn.addEventListener("click", undoMove);
  const closeBtn = el("button","undo-x","✕");
  closeBtn.setAttribute("aria-label","Dismiss");
  closeBtn.addEventListener("click", dismissUndo);
  t.appendChild(msg); t.appendChild(undoBtn); t.appendChild(closeBtn);
  $("#toasts").appendChild(t);
  S.undoTimer = setTimeout(dismissUndo, 8000);
}
document.addEventListener("keydown", e => {
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "z") return;
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(!S.lastMove && !S.lastRelay) return;
  e.preventDefault();
  undoMove();
});

/* ---------------------------------------------------------------- dialog */
/* ---------------------------------------------------------------- swap */
/* Replace what's in a slot with a card you pick. The slot keeps its time. */
/* true when ev's own slot sits inside a permeable meeting — a session
   can't be swapped into that slot, only another quick task can. */
function withinPermeable(ev, date){
  return allEvents().some(m => !m.isTask && permeable(m) && overlapsDay(m,date) &&
    sameDay(m.start,date) && minsOf(m.start) <= minsOf(ev.start) && minsOf(m.end) >= minsOf(ev.end));
}
/* outCard: which task inside a brick this swap replaces (undefined for a
   normal single-card row, where swapping still means the whole event —
   see swapTo). Only quick-size cards are legal targets once a slot is
   inside a brick, same reasoning as the existing insideMeeting rule right
   below: a session/work-day card can't fit into a shared quick window. */
function swapPicker(item, outCard){
  if(isLockedItem(item)){ toast("Only today and tomorrow can be scheduled.", true); return; }
  const scheduled = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e, S.anchor)).flatMap(e => e.cardShorts));
  const insideMeeting = withinPermeable(item.ev, S.anchor);
  const outId = outCard ? outCard.id : (item.card ? item.card.id : null);
  const pool = rankCards(candidates(S.anchor).filter(c =>
    (!c.shortLink || !scheduled.has(c.shortLink)) && (!outId || c.id !== outId) &&
    (!insideMeeting || c.size === "quick") && (!item.isBrick || c.size === "quick")));

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null, fmtRange(item.ev.start, item.ev.end)));
  dlg.appendChild(h);

  const body = el("div","pick");
  if(!pool.length) body.appendChild(el("div","muted","Nothing else open."));
  for(const c of pool.slice(0,40)){
    const b = el("button","pick-row " + boardClass(c));
    b.type = "button";
    b.appendChild(el("span","dot"));
    const n = el("span","n"); n.appendChild(bidiSpan(c.name)); b.appendChild(n);
    const t = tierOf(c);
    if(isAging(c))    b.appendChild(el("span","chip age", ageDays(c)+"d"));
    else if(c.overdue)b.appendChild(el("span","chip crit","!"));
    if(c.size==="short") b.appendChild(el("span","chip deep","3h"));
    b.addEventListener("click", ()=>{ close(); swapTo(item, c, outCard); });
    body.appendChild(b);
  }
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", close);
  f.appendChild(cancel);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  cancel.focus();
}

/* outCard: the specific task inside a brick being replaced (see
   swapPicker). A brick swap never creates/deletes the whole event — the
   slot and every other task in it stay put, only outCard's line in the
   shared description is replaced with the incoming card's — so this
   branches off before any of the whole-event machinery below. */
function swapToInBrick(item, card, outCard){
  if(S.pending.has(outCard.id)) return;
  const rest = brickSurvivors(item, outCard.id);
  const next = [...rest, card];
  S.pending.add(outCard.id);
  const undo = applyLocalBrickDesc(item.ev.id, next);
  const st = bumpCategory(card.boardName, "picked");
  render();
  toast("Swapped.");
  const write = () => updateBrickDesc(item.ev.id, next);
  write().then(
    ()=>{ S.pending.delete(outCard.id); saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(outCard.id);
      undo();
      toast(errCopy(e), true);
      queueFailed(`Swap: ${card.name}`, async () => {
        const again = applyLocalBrickDesc(item.ev.id, next);
        try{ await write(); saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}
function swapTo(item, card, outCard){
  if(outCard) return swapToInBrick(item, card, outCard);
  const id = item.ev.id;
  if(S.pending.has(id)) return;
  const existingBlock = allEvents().find(e => e.cardShort === card.shortLink && overlapsDay(e, S.anchor));

  /* The old slot's own length used to carry straight over to whatever card
     landed in it — swap a quick task's 20-minute slot for a session and
     the block stayed 20 minutes. A session has a real size of its own
     (CFG.shortMin) and needs to land at that size, not inherit the
     outgoing slot's. A quick task has a nominal size too
     (CFG.quickTotal, since planFor's build), but swap deliberately doesn't
     enforce it: a quick card swapped in (or a quick slot getting a
     same-size quick replacement) keeps whatever slot it lands in untouched
     — this is a same-day substitution, not a rebuild, and there's no
     rebuild-time neighbor to re-pack around. */
  let start = item.ev.start, end = item.ev.end;
  const haveDur = minsOf(end) - minsOf(start);
  const wantDur = card.size === "quick" ? haveDur : (card.est || CFG.shortMin);
  if(wantDur !== haveDur){
    const ignore = new Set([id]);
    if(existingBlock) ignore.add(existingBlock.id);
    const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
    const busy = busyFor(S.anchor, ignore, card.size !== "quick");
    const fromMin = minsOf(start);
    const slot = findSlots(busy, winS, winE, wantDur, 1, fromMin)[0]
              || findSlots(busy, winS, winE, wantDur, 1, winS)[0];
    if(!slot){ toast("Doesn't fit here — nowhere left today.", true); return; }
    start = atMin(S.anchor, slot.s);
    end = atMin(S.anchor, slot.e);
  }
  S.pending.add(id);

  /* The slot changes hands on the tap. A stand-in block stands in for the one
     Google hasn't minted an id for yet; the real ids arrive with the refresh
     that follows the write. */
  const stand = localBlock(card, start, end, card.size);
  const undo = [dropLocalEvent(id), addLocalEvent(stand)];
  if(existingBlock) undo.push(dropLocalEvent(existingBlock.id));
  /* the stand-in has no real event id yet, so hold it out of drag, swap and
     the action buttons until the refresh replaces it with the real block */
  S.pending.add(stand.id);
  const st = bumpCategory(card.boardName, "picked");
  render();
  toast("Swapped.");

  /* Create before destroying. This used to delete the slot first, so a failing
     create left an empty slot with *both* cards unscheduled — the swap lost
     work instead of just not happening. Worst case now is a harmless duplicate
     that the next rebuild clears. */
  /* The stand-in has to be REMOVED once the real block exists, or both sit
     in S.events.payload.events — the same array allEvents() reads — and the
     swapped-in card renders twice at the same minute. Confirmed live: a swap
     produced two identical rows, and only one of them was real.
     `applyPlan` (settled.forEach(s => dropLocalEvent(s.id))) and
     `commitRelay` (via w.realId) have always done this; swapTo simply never
     did. Dropped here rather than after refreshCalendar() so the duplicate
     never survives a paint — the refresh is what brings the real event in,
     and it can be seconds away on a slow connector. */
  /* Drop the stand-in the moment the real block exists. Without this BOTH
     sit in S.events.payload.events — the array allEvents() reads — and the
     swapped-in card renders twice at the same minute until a refresh
     happens to replace the whole payload. Confirmed live: a swap produced
     two identical rows, one of them not real.
     Only the drop: createBlock's own result is already in that array (the
     connector's create response is merged in for us), so re-adding a copy
     keyed to the real id just reproduces the duplicate under a new id —
     which is exactly what a first attempt at this fix did.
     `applyPlan` (settled.forEach(s => dropLocalEvent(s.id))) and
     `commitRelay` (via w.realId) have always dropped their stand-ins;
     swapTo simply never did. */
  const write = async () => {
    const made = await createBlock(card, start, end, card.size);
    dropLocalEvent(stand.id);
    await deleteBlock(id);
    if(existingBlock) await deleteBlock(existingBlock.id);
    return made;
  };
  write().then(
    ()=>{ S.pending.delete(id); S.pending.delete(stand.id); saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id); S.pending.delete(stand.id);
      dropLocalEvent(stand.id);
      for(const u of undo) u();
      toast(errCopy(e), true);
      queueFailed(`Swap: ${card.name}`, async () => {
        try{ await write(); saveStats(st); refreshCalendar().then(render); }
        catch(err){ render(); throw err; }
      });
      render();
    }
  );
}

/* ---------------------------------------------------------------- settings */
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function settingsPanel(){
  /* Edits land on a draft copy, not the live CFG — Save commits it, Cancel
     throws it away. Colours still preview live (nice immediate swatch
     feedback) but against the draft, and get reverted on Cancel. */
  let draft = normalizeCfg(CFG);

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const body = el("div","set");
  dlg.appendChild(body);

  const row = (label, ...controls) => {
    const r = el("label","set-row");
    r.appendChild(el("span","set-k", label));
    const w = el("span","set-v");
    controls.forEach(c => w.appendChild(c));
    r.appendChild(w);
    body.appendChild(r);
    return r;
  };
  const num = (key, min, max, step) => {
    const i = el("input","num-in");
    i.type="number"; i.min=min; i.max=max; i.step=step||1; i.value=draft[key];
    i.addEventListener("change", ()=>{ draft = normalizeCfg({...draft, [key]:+i.value}); i.value = draft[key]; });
    return i;
  };
  const numHours = (key, min, max, step) => {
    const i = el("input","num-in");
    i.type="number"; i.min=min; i.max=max; i.step=step||0.5; i.value=draft[key]/60;
    i.addEventListener("change", ()=>{ draft = normalizeCfg({...draft, [key]:+i.value*60}); i.value = draft[key]/60; });
    return i;
  };

  function buildBody(){
    body.innerHTML = "";

    /* Re-entry into the setup wizard — how a viewer adds a board they made
       after first run, drops one they deleted, or moves to another
       calendar. A body row, not a footer button: a footer button was tried
       first and cost a whole second footer row (five controls no longer fit
       one line at 375px), which pushed Sound/Chime into an internal scroll
       — exactly the "no scroll at 667px" promise this sheet exists to keep.
       As a row it costs one line, same as everything else here, and reads
       as what it is: a setting, not a destructive footer action like
       Clear Activity Data. */
    const boardsRow = el("button","set-row set-link");
    boardsRow.type = "button";
    boardsRow.title = "Change which boards Daisey schedules, or which calendar it writes to.";
    boardsRow.appendChild(el("span","set-k","Boards & calendar"));
    boardsRow.appendChild(el("span","set-v set-link-go","Edit →"));
    boardsRow.addEventListener("click", ()=>{ applyColors(); close(); setupWizard({ edit:true }); });
    body.appendChild(boardsRow);

    body.appendChild(el("div","set-h","Day"));
    row("Hours", num("dayStart",0,23), el("span","set-dash","–"), num("dayEnd",1,24));
    const off = el("select","num-in wide");
    [["-1","none"]].concat(DAYS.map((d,i)=>[String(i),d])).forEach(([v,t])=>{
      const o=el("option",null,t); o.value=v; if(+v===draft.dayOff) o.selected=true; off.appendChild(o);
    });
    off.addEventListener("change", ()=>{ draft.dayOff=+off.value; });
    row("My Day Off", off);

    body.appendChild(el("div","set-h","Load"));
    /* Three types, each with a length and a per-day cap — a table reads the
       two numbers per type as one fact ("Session: up to 3h, up to 2/day")
       instead of four stacked set-rows where the cap sat under a generic
       "Max Per Day" label with no type name of its own. */
    const loadTable = el("table","load-table");
    const lhead = el("tr");
    ["","Length","Max/day"].forEach(t => lhead.appendChild(el("th",null,t)));
    loadTable.appendChild(lhead);
    const loadRow = (label, lenInput, unit, maxInput) => {
      const tr = el("tr");
      tr.appendChild(el("td","lt-k", label));
      const lenTd = el("td");
      const lenWrap = el("span","lt-v");
      lenWrap.appendChild(lenInput); lenWrap.appendChild(el("span","set-u",unit));
      lenTd.appendChild(lenWrap);
      tr.appendChild(lenTd);
      const maxTd = el("td");
      const maxWrap = el("span","lt-v");
      maxWrap.appendChild(maxInput);
      maxTd.appendChild(maxWrap);
      tr.appendChild(maxTd);
      loadTable.appendChild(tr);
    };
    loadRow("Quick Task", num("quickTotal",5,480,5), "min", num("quickMax",1,20,1));
    loadRow("Session", numHours("shortMin",0.5,8,0.5), "h", num("sessionMax",1,10,1));
    body.appendChild(loadTable);
    const bhr = el("select","num-in wide");
    [["","Daisey decides"]].concat(
      Array.from({length:24}, (_,h) => [String(h), pad2(h)+":00"])
    ).forEach(([v,t])=>{
      const o = el("option",null,t); o.value = v;
      if(v === "" ? draft.breakHour === null : +v === draft.breakHour) o.selected = true;
      bhr.appendChild(o);
    });
    bhr.addEventListener("change", ()=>{
      draft = normalizeCfg({ ...draft, breakHour: bhr.value === "" ? null : +bhr.value });
      buildBody();
    });
    row("Break At", bhr, num("breakLen",15,180,15), el("span","set-u","min"));
    const lg = el("div","legend");
    lg.appendChild(document.createTextNode("No label = Quick Task. Yellow or Orange = Session."));
    body.appendChild(lg);

    /* One row, three boards — used far less often than the Load numbers
       above, so it doesn't need a row of its own per board. It's also the
       only priority control (no separate row for that any more, on direct
       feedback: a second line wasn't worth it for something the colour row
       can just do itself). Drag a swatch left/right to reorder
       CFG.boardPriority — see rankCards/boardOrderMap for where that order
       is spent. Dragging is pointer-based, not native HTML5 DnD, since this
       app is phone-first and native drag-and-drop doesn't fire on touch.
      Tracker boards are intentionally absent: they never reach ranking or
      scheduling, so they have no user-facing priority colour here. */
    body.appendChild(el("div","set-h","Colour & Priority"));
    const swatchRow = el("div","set-row tall");
    const sw = el("span","set-v swatches");
    swatchRow.appendChild(sw);
    body.appendChild(swatchRow);

    /* Grabbing anywhere on the card drags it — the colour square included,
       since "the whole square" is the natural, biggest target to grab and
       excluding it (only the name/number worked) was the actual complaint.
       A plain tap still opens the native colour picker: nothing is
       intercepted below DRAG_THRESH of movement, so a tap-and-release on
       the square fires its own ordinary click with no preventDefault ever
       having run. Only once the pointer has actually travelled do we call
       setPointerCapture/preventDefault and start following it — at that
       point it's unambiguously a drag, not a click. */
    const DRAG_THRESH = 6;
    function wireSwatchDrag(card, key){
      let pid=null, startX=0, startY=0, dragging=false, snapshot=[];
      const onMove = e => {
        if(pid===null || e.pointerId!==pid) return;
        const dx = e.clientX-startX, dy = e.clientY-startY;
        if(!dragging){
          if(Math.abs(dx) < DRAG_THRESH && Math.abs(dy) < DRAG_THRESH) return;
          dragging = true;
          card.classList.add("dragging");
          try{ card.setPointerCapture(pid); }catch(_){}
          snapshot = [...sw.querySelectorAll(".swatch-card.draggable")].map(x=>x.getBoundingClientRect());
        }
        card.style.transform = `translateX(${dx}px)`;
        card.style.zIndex = 5;
        e.preventDefault();
      };
      const onUp = e => {
        if(pid===null || e.pointerId!==pid) return;
        if(dragging){
          card.classList.remove("dragging");
          card.style.transform=""; card.style.zIndex="";
          let bestI=0, bestD=Infinity;
          snapshot.forEach((s,i)=>{
            const mid=s.left+s.width/2, d=Math.abs(e.clientX-mid);
            if(d<bestD){ bestD=d; bestI=i; }
          });
          const cur = draft.boardPriority.indexOf(key);
          if(cur>=0 && bestI!==cur){
            draft.boardPriority.splice(cur,1);
            draft.boardPriority.splice(bestI,0,key);
          }
          renderSwatches();
        }
        pid=null; dragging=false;
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
      };
      card.addEventListener("pointerdown", e=>{
        pid=e.pointerId; startX=e.clientX; startY=e.clientY; dragging=false;
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    }
    function renderSwatches(){
      sw.innerHTML = "";
      const schedOrdered = draft.boardPriority.map(k => SCHED_BOARDS.find(b=>b.key===k)).filter(Boolean);
      let rank = 0;
      for(const b of schedOrdered){
        const draggable = !b.tracker;
        const card = el("span","swatch-card" + (draggable ? " draggable" : ""));
        /* the rank badge is the "add numbers" fix: dragging alone didn't say
           which position was 1st vs 3rd, only that an order existed. Numbers
           come straight off render order, which is already draft.boardPriority
           order, so no separate lookup is needed. The per-swatch reset button
           (↺) is gone — it read as a second, unrelated arrow control sitting
           right next to the drag handle and the new number, and the sheet's
           own Default button already resets colour along with everything
           else on this screen. */
        if(draggable){ rank++; card.appendChild(el("span","prio-num", String(rank))); }
        const c = el("input","col-in");
        c.type="color";
        c.value = (draft.colors && draft.colors[b.key]) ||
          (getComputedStyle(document.documentElement).getPropertyValue("--b-"+b.key).trim() || "#888888");
        c.addEventListener("input", ()=>{ draft.colors[b.key]=c.value; applyColors(draft.colors); });
        const swrow = el("span","swrow");
        swrow.appendChild(c);
        const name = el("span","swname", b.name);
        name.setAttribute("dir","auto");
        card.appendChild(swrow); card.appendChild(name);
        sw.appendChild(card);
        if(draggable) wireSwatchDrag(card, b.key);
      }
    }
    renderSwatches();

    body.appendChild(el("div","set-h","Chores"));
    const time = el("input","num-in wide");
    time.type = "time"; time.value = draft.choresTime;
    time.addEventListener("change", ()=>{ draft = normalizeCfg({...draft, choresTime:time.value}); time.value = draft.choresTime; });
    const editDays = el("button","mini text","Edit days →");
    editDays.type = "button";
    editDays.addEventListener("click", () => choreDaysPanel(() => draft));
    row("Remind at", time, editDays);

    body.appendChild(el("div","set-h","Sound"));
    const snd = el("button","toggle" + (draft.sound ? " on" : ""), draft.sound ? "on" : "off");
    snd.type="button";
    snd.addEventListener("click", ()=>{ draft.sound=!draft.sound; snd.textContent=draft.sound?"on":"off";
      snd.classList.toggle("on",draft.sound); });
    row("Chime", snd);
  }
  buildBody();

  const f = el("div","df");
  const resetAllBtn = el("button","mini text del","Clear Activity Data");
  resetAllBtn.type = "button";
  resetAllBtn.title = "Clears chores, activity stats and rollover memory. Hours, load, colours and calendar events are kept.";
  resetAllBtn.addEventListener("click", () => resetAllData());
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", ()=>{ applyColors(); close(); });
  const reset = el("button","btn quiet","Default");
  reset.addEventListener("click", async ()=>{
    const ok = await confirmDialog("Reset to default?",
      "Restores every field on this screen — Day, Load, Colour, Priority, Chores and Sound — to its shipped default.\n\nNothing is saved until you tap Save.",
      "Reset");
    if(!ok) return;
    draft = normalizeCfg({colors:{}}); applyColors(draft.colors); buildBody();
  });
  const save = el("button","btn primary","Save");
  save.addEventListener("click", ()=>{ CFG = draft; saveCfg(); close(); });
  const actions = el("div","df-actions");
  actions.appendChild(cancel); actions.appendChild(reset); actions.appendChild(save);
  f.appendChild(resetAllBtn); f.appendChild(actions);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); render(); }
  function onKey(e){ if(e.key==="Escape"){ applyColors(); close(); } }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim){ applyColors(); close(); } });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  save.focus();
}

/* "Start over" for the memory Daisey keeps on top of the real calendar/Trello
   data: card rollovers/aging, category weighting, streak/history, and the
   chores done/overdue localStorage state. Settings (CFG, incl. colours),
   project deadlines and anything already on the calendar or Trello are
   untouched — this forgets Daisey's own bookkeeping, not the user's actual
   schedule. A deadline is kept for the same reason settings are: the user
   typed it, so it's their data, not something Daisey inferred. Reloads after
   so every in-memory cache (S.cardCache, S.choresShown, etc.) starts clean
   too, rather than trying to hand-unwind each one. */
async function resetAllData(){
  const ok = await confirmDialog("Reset all?",
    "Clears chores, activity stats and rollover memory. Settings, project deadlines and calendar events are kept.\n\nCan't be undone.",
    "Reset all");
  if(!ok) return;
  try{ localStorage.removeItem(CHORES_LS_KEY); }catch(_){}
  const st = { ...DEFAULT_STATS, settings:{ ...CFG }, projects:normProjects(S.stats && S.stats.projects) };
  await saveStats(st);
  location.reload();
}

/* Split out of the main settings sheet: four chores × seven-day pickers
   inline added ~350px to a sheet already tight against the "no internal
   scroll down to 667px" promise (see CLAUDE.md). Mutates getDraft()'s
   choreDays object in place; the outer sheet's own Save/Cancel still governs
   whether that survives. */
function choreDaysPanel(getDraft){
  const scrim = el("div","scrim");
  const dlg = el("div","dialog");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
  const h = el("div","dh");
  h.appendChild(el("h3",null,"Chore days"));
  dlg.appendChild(h);

  const body = el("div","chore-set");
  body.style.padding = "0 19px 14px";
  for(const c of CHORES){
    const line = el("div","chore-row");
    const nm = el("span","chore-name");
    nm.appendChild(document.createTextNode(c.icon + " " + c.label));
    line.appendChild(nm);
    const dayWrap = el("span","chore-days");
    for(let d=0; d<7; d++){
      const dbtn = el("button","mini text" + (getDraft().choreDays[c.id].includes(d) ? " on" : ""), DAYS[d].slice(0,2));
      dbtn.type = "button";
      dbtn.setAttribute("aria-label", c.label + " on " + DAYS[d]);
      dbtn.addEventListener("click", ()=>{
        const set = new Set(getDraft().choreDays[c.id]);
        if(set.has(d)) set.delete(d); else set.add(d);
        getDraft().choreDays[c.id] = [...set];
        dbtn.classList.toggle("on", set.has(d));
      });
      dayWrap.appendChild(dbtn);
    }
    line.appendChild(dayWrap);
    body.appendChild(line);
  }
  dlg.appendChild(body);

  const f = el("div","df");
  const close = el("button","btn primary","Close");

  function onKey(e){ if(e.key==="Escape") done(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) done(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  close.focus();
}

/* The project deadline editor — its own small dialog, deliberately NOT a
   settings row: the settings sheet is already over its height budget at
   375x667, and a deadline is project data the user typed, not configuration.

   <input type="date"> gets the native mobile picker for free. Daisey's own
   datePicker() was removed on purpose; don't bring it back for this.

   A past date is allowed. That's a real state worth showing (pressure reads
   "Over" and says how many work days short it is), not an input error. */
function deadlineDialog(board){
  const s = snapshotFor(board);
  const scrim = el("div","scrim");
  const dlg = el("div","dialog");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
  const h = el("div","dh");
  h.appendChild(el("h3",null,"Deadline"));
  h.appendChild(el("p","dsub", s.listName));
  dlg.appendChild(h);

  const body = el("div","dl-set");
  const inp = document.createElement("input");
  inp.type = "date";
  inp.className = "dl-input";
  if(s.deadlineIso) inp.value = s.deadlineIso;
  body.appendChild(inp);

  /* Live consequence, so the date is picked against what it costs rather
     than committed blind and re-read afterwards. */
  const prev = el("p","dl-prev");
  function refresh(){
    const v = inp.value;
    if(!v){ prev.textContent = "No deadline — pressure won't be shown."; return; }
    const d = new Date(v+"T00:00:00");
    const wd = countWorkDays(startOfDay(new Date()), d);
    const supply = wd * AUDIO_WORKDAY_CAP;
    const p = supply === 0 ? (s.remainingPoints > 0 ? Infinity : 0) : s.remainingPoints / supply;
    const band = pressureBand(p);
    prev.textContent = `${wd} work day${wd===1?"":"s"} for ${s.remainingPoints} pts — ${band.word}`;
    prev.className = "dl-prev pb-" + band.key;
  }
  inp.addEventListener("change", refresh);
  inp.addEventListener("input", refresh);
  refresh();
  body.appendChild(prev);
  dlg.appendChild(body);

  /* Distinct classes on purpose: `.dialog .btn.quiet` is Settings' own Cancel
     button, and reusing it here has already broken that button once. */
  const f = el("div","df");
  const clear = el("button","mini text del","Clear");
  clear.type = "button";
  clear.addEventListener("click", ()=>{ saveProjectDeadline(board.key, null); close(); });
  const cancel = el("button","btn dl-cancel","Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", ()=> close());
  const save = el("button","btn primary","Save");
  save.type = "button";
  save.addEventListener("click", ()=>{
    saveProjectDeadline(board.key, /^\d{4}-\d{2}-\d{2}$/.test(inp.value) ? inp.value : null);
    close();
  });
  if(s.deadlineIso) f.appendChild(clear);
  f.appendChild(cancel); f.appendChild(save);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  inp.focus();
}

   No Cancel on the first run — there is nothing behind it. Re-entered from
   settings with {edit:true}, where Cancel is offered and existing board keys
   are preserved (matched by board id) so colours, priority and project
   deadlines survive an edit. */
function setupWizard(opts){
  opts = opts || {};
  const editing = !!opts.edit;
  const prev = editing && SETUP ? SETUP : null;

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
  const h = el("div","dh");
  h.appendChild(el("h3",null, editing ? "Boards & calendar" : "Welcome to Daisey"));
  const sub = el("p","dsub", editing
    ? "Change which boards Daisey schedules, or which calendar it writes to."
    : "Daisey plans your day from your Trello boards onto your calendar. A few questions and you're set.");
  h.appendChild(sub);
  dlg.appendChild(h);

  const body = el("div","pick");
  dlg.appendChild(body);

  const f = el("div","df");
  const err = el("span","setup-err");
  f.appendChild(err);
  const cancel = el("button","btn dl-cancel","Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", ()=> close());
  const next = el("button","btn primary","Next");
  next.type = "button";
  if(editing) f.appendChild(cancel);
  f.appendChild(next);
  dlg.appendChild(f);

  /* draft state */
  const picked = new Map();          // board ARI -> {id,name,tracker}
  let boardNodes = [];
  let calendars = [], calId = prev ? prev.calId : null, calName = prev ? prev.calName : null;
  let statsAri = null;
  let dayOff = (prev && typeof prev.dayOff === "number") ? prev.dayOff : CFG.dayOff;
  let step = 0;
  /* set when a step can't render at all (a connector that isn't connected).
     Next becomes "Try again" and re-runs the step instead of validating a
     selection the viewer had no way to make. */
  let blocked = false;

  const say = m => { err.textContent = m || ""; };

  async function loadBoards(){
    body.innerHTML = "";
    body.appendChild(el("div","skel"));
    try{
      const res = await callTool(TRELLO, "trelloReadBoard", { action:"list", limit:50 });
      boardNodes = (res.payload && res.payload.cards && res.payload.cards.nodes) || [];
      const more = res.payload && res.payload.cards && res.payload.cards.pageInfo
                && res.payload.cards.pageInfo.hasNextPage;
      renderBoards(more);
    }catch(e){
      body.innerHTML = "";
      body.appendChild(stateCard("🔌","Can't reach Trello", errCopy(e)));
      /* Nothing to advance to, so don't offer Next — pressing it would only
         answer "Pick at least one board", which blames the user for a
         connector that isn't there. Offer the retry that actually applies
         once they've added it. */
      blocked = true;
      next.textContent = "Try again";
    }
  }
  function renderBoards(more){
    body.innerHTML = "";
    if(!boardNodes.length){
      body.appendChild(stateCard("📋","No boards found","Create a board in Trello, then reopen Daisey."));
      return;
    }
    if(prev) for(const b of prev.boards)
      if(boardNodes.some(n => n.id === b.id) && !picked.has(b.id))
        picked.set(b.id, { id:b.id, name:b.name, tracker:!!b.tracker });
    body.appendChild(el("p","setup-q","Which boards should Daisey schedule?"));
    for(const n of boardNodes){
      const row = el("div","setup-board" + (picked.has(n.id) ? " on" : ""));
      const tick = el("button","setup-tick");
      tick.type = "button";
      tick.textContent = picked.has(n.id) ? "✓" : "";
      const nm = el("span","setup-bn");
      nm.appendChild(bidiSpan(n.name || "(unnamed)"));
      /* A tracker board is read and editable but never scheduled — one card
         per asset, lists as pipeline stages. Offered here because that
         distinction can't be inferred from Trello. */
      const trk = el("button","toggle setup-trk" + (picked.get(n.id) && picked.get(n.id).tracker ? " on" : ""), "Tracker");
      trk.type = "button";
      const sync = () => {
        const on = picked.has(n.id);
        row.classList.toggle("on", on);
        tick.textContent = on ? "✓" : "";
        trk.classList.toggle("on", !!(picked.get(n.id) || {}).tracker);
        trk.disabled = !on;
      };
      tick.addEventListener("click", ()=>{
        if(picked.has(n.id)) picked.delete(n.id);
        else picked.set(n.id, { id:n.id, name:n.name || "(unnamed)", tracker:false });
        sync(); say("");
      });
      trk.addEventListener("click", ()=>{
        const p = picked.get(n.id); if(!p) return;
        p.tracker = !p.tracker; sync();
      });
      row.appendChild(tick); row.appendChild(nm); row.appendChild(trk);
      body.appendChild(row);
      sync();
    }
    if(more) body.appendChild(el("p","dim setup-note","Showing your first 50 boards."));
  }

  async function loadCalendars(){
    body.innerHTML = "";
    body.appendChild(el("div","skel"));
    try{
      const res = await callTool(GCAL, "list_calendars", {});
      calendars = (res.payload && res.payload.calendars) || [];
    }catch(e){
      body.innerHTML = "";
      body.appendChild(stateCard("🔌","Can't reach Google Calendar", errCopy(e)));
      blocked = true;
      next.textContent = "Try again";
      return;
    }
    if(!calId){
      /* the viewer's own calendar, not a subscribed/shared one */
      const own = calendars.find(c => c.id && c.id.indexOf("@") > 0 && !/@group\.calendar\.google\.com$/.test(c.id));
      if(own){ calId = own.id; calName = own.summary || own.id; }
    }
    body.innerHTML = "";
    body.appendChild(el("p","setup-q","Which calendar should Daisey write your day to?"));
    for(const c of calendars){
      const row = el("button","pick-row setup-cal" + (c.id === calId ? " on" : ""));
      row.type = "button";
      row.appendChild(el("span","dot"));
      const nm = el("span","n"); nm.appendChild(bidiSpan(c.summary || c.id));
      row.appendChild(nm);
      row.addEventListener("click", ()=>{
        calId = c.id; calName = c.summary || c.id;
        for(const r of body.querySelectorAll(".setup-cal")) r.classList.remove("on");
        row.classList.add("on"); say("");
      });
      body.appendChild(row);
    }
  }

  function renderHome(){
    body.innerHTML = "";
    const opts2 = [...picked.values()].filter(p => !p.tracker);
    body.appendChild(el("p","setup-q","Where should Daisey keep its own settings?"));
    body.appendChild(el("p","dim setup-note",
      "It adds one hidden list — “📊 Daisey (widget state — do not edit)” — and keeps your settings, streak and deadlines in a card there. Nothing else on the board is touched."));
    if(!statsAri && prev){
      const keep = prev.boards.find(b => b.key === prev.statsBoardKey);
      if(keep && opts2.some(p => p.id === keep.id)) statsAri = keep.id;
    }
    if(!statsAri && opts2.length) statsAri = opts2[0].id;
    for(const p of opts2){
      const row = el("button","pick-row setup-home" + (p.id === statsAri ? " on" : ""));
      row.type = "button";
      row.appendChild(el("span","dot"));
      const nm = el("span","n"); nm.appendChild(bidiSpan(p.name));
      row.appendChild(nm);
      row.addEventListener("click", ()=>{
        statsAri = p.id;
        for(const r of body.querySelectorAll(".setup-home")) r.classList.remove("on");
        row.classList.add("on"); say("");
      });
      body.appendChild(row);
    }
    body.appendChild(el("p","setup-q","Which day is your day off?"));
    const days = el("div","setup-days");
    for(let d=-1; d<7; d++){
      const b = el("button","mini text" + (d === dayOff ? " on" : ""), d < 0 ? "None" : DAYS[d].slice(0,2));
      b.type = "button";
      b.addEventListener("click", ()=>{
        dayOff = d;
        for(const x of days.children) x.classList.remove("on");
        b.classList.add("on");
      });
      days.appendChild(b);
    }
    body.appendChild(days);
  }

  const STEPS = [
    { load:loadBoards, ok:()=> picked.size ? "" : "Pick at least one board.",
      valid:()=> [...picked.values()].some(p => !p.tracker) || "At least one board must be schedulable (not a tracker)." },
    { load:loadCalendars, ok:()=> calId ? "" : "Pick a calendar." },
    { load:renderHome, ok:()=> statsAri ? "" : "Pick where settings should live." }
  ];

  async function show(i){
    step = i;
    say("");
    blocked = false;
    next.textContent = i === STEPS.length-1 ? (editing ? "Save" : "Start") : "Next";
    await STEPS[i].load();
  }
  next.addEventListener("click", async ()=>{
    if(blocked){ await show(step); return; }   // retry, don't validate
    const s = STEPS[step];
    const msg = s.ok();
    if(msg){ say(msg); return; }
    if(s.valid){ const v = s.valid(); if(v !== true && v){ say(v); return; } }
    if(step < STEPS.length-1){ await show(step+1); return; }
    next.disabled = true;
    try{ await finish(); }
    catch(e){ next.disabled = false; say(errCopy(e)); }
  });

  async function finish(){
    /* Keys are assigned once and never recomputed. A Trello RENAME must not
       change a key, or CFG.colors, CFG.boardPriority and S.stats.projects
       all orphan at once — so an existing board keeps its key (matched by
       ARI) and only genuinely new boards mint one. Indices are never reused. */
    const prevByAri = new Map((prev ? prev.boards : []).map(b => [b.id, b]));
    let n = 0;
    for(const b of (prev ? prev.boards : [])){
      const m = /^b(\d+)$/.exec(b.key);
      if(m) n = Math.max(n, parseInt(m[1],10) + 1);
    }
    const boards = [...picked.values()].map(p => {
      const old = prevByAri.get(p.id);
      return { key: old ? old.key : ("b" + (n++)),
               id:p.id, name:p.name, tracker:!!p.tracker,
               color: (old && old.color) || null };
    });
    boards.forEach((b,i) => { if(!b.color) b.color = PALETTE[i % PALETTE.length]; });
    const home = boards.find(b => b.id === statsAri) || boards.find(b => !b.tracker);
    const cfg = {
      v:1, calId, calName,
      boards,
      statsBoardKey: home.key,
      /* audio-sync's board. Only this app's author has one; for everyone
         else the Projects view stays hidden rather than permanently empty. */
      batchBoardKey: prev ? (prev.batchBoardKey || null) : null
    };
    if(!validSetup(cfg)) throw { code:"tool_error", message:"That selection didn't make a usable setup." };

    applySetup(cfg);
    CFG.dayOff = dayOff;
    /* Create the state list unless we're editing and it already exists. Its
       id isn't stored: statsListId() finds it by name, and the create
       response shape has never been observed against the real connector, so
       nothing is allowed to depend on parsing it. The name contains
       "Daisey", which is what STATS_LIST_RE matches. */
    const already = allCards().some(c => c.boardKey === home.key && STATS_LIST_RE.test(c.listName || ""));
    if(!already){
      try{
        await callTool(TRELLO, "trelloWriteList",
          { action:"create", boardId: home.id, name:"📊 Daisey (widget state — do not edit)", pos:"bottom" });
      }catch(e){
        /* Non-fatal: statsListId falls back to a live trelloReadList lookup,
           and saveStats surfaces a real failure through queueFailed. */
        console.warn("state list create failed", e);
      }
    }
    persistSetup(cfg);
    close();
    /* Same path for both: applySetup has already rebuilt BOARDS/CAL_ID and
       the board CSS, so starting the watches is all a first run needs. It
       deliberately does NOT reload — on an origin where localStorage is
       blocked (which is the norm in the test harness, and unverified in the
       real artifact) a reload would throw away the setup we just wrote and
       land back on the wizard. Boot's own settle loop is still running and
       calls startDay() as soon as the boards answer. */
    startWatches();
    render();
  }

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key === "Escape" && editing) close(); }
  document.addEventListener("keydown", onKey);
  if(editing) scrim.addEventListener("click", e => { if(e.target === scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  show(0);
}

function confirmDialog(title, detail, okLabel){
  return new Promise(resolve => {
    const scrim = el("div","scrim");
    const dlg = el("div","dialog");
    dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
    const h = el("div","dh");
    h.appendChild(el("h3",null,title));
    const p = el("p"); bidi(p, detail); h.appendChild(p);
    dlg.appendChild(h);
    const f = el("div","df");
    const cancel = el("button","btn quiet","Keep");
    const go = el("button","btn primary",okLabel);
    cancel.addEventListener("click", ()=>{ close(); resolve(false); });
    go.addEventListener("click", ()=>{ close(); resolve(true); });
    f.appendChild(cancel); f.appendChild(go);
    dlg.appendChild(f);
    function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape"){ close(); resolve(false); } }
    document.addEventListener("keydown", onKey);
    scrim.addEventListener("click", e => { if(e.target===scrim){ close(); resolve(false); } });
    scrim.appendChild(dlg); document.body.appendChild(scrim); go.focus();
  });
}

/* Chore identity (icon/colour) is fixed; the schedule — which weekdays each
   one is due — is a user setting (CFG.choreDays), same pattern as everything
   else in the settings panel. */
const CHORES = [
  { id:"dishwasher", icon:"🍽️", label:"Dishwasher", cc:"#2FA8FF", glow:"rgba(47,168,255,.55)" },
  { id:"trash",      icon:"🗑️", label:"Trash",      cc:"#22C55E", glow:"rgba(34,197,94,.55)" },
  { id:"laundry",    icon:"🧺", label:"Laundry",    cc:"#8B5CF6", glow:"rgba(139,92,246,.55)" },
  { id:"broom",      icon:"🧹", label:"Broom",      cc:"#FF8A3D", glow:"rgba(255,138,61,.55)" },
];

/* Chore done/overdue state lives in localStorage, not the Trello state card:
   it's a per-device daily nag, not something that needs to sync or survive
   the card being edited by another session. */
const CHORES_LS_KEY = "daisey.chores.v1";
function loadChoreState(){
  try{
    const st = JSON.parse(localStorage.getItem(CHORES_LS_KEY) || "{}");
    return { doneOn: st.doneOn || {}, overdue: st.overdue || {}, lastSweep: st.lastSweep || null };
  }catch(_){ return { doneOn:{}, overdue:{}, lastSweep:null }; }
}
function saveChoreState(st){ try{ localStorage.setItem(CHORES_LS_KEY, JSON.stringify(st)); }catch(_){} }
const choreDue = (c, date) => (CFG.choreDays[c.id] || [0,1,2,3,4,5,6]).includes(date.getDay());

/* Mirrors rolloverSweep's model for cards: a chore due yesterday and still
   unconfirmed stays flagged — and its day count keeps climbing — until it's
   marked done, regardless of whether today's own schedule has it due again. */
function choresSweep(){
  const cs = loadChoreState();
  const today = dayKey(new Date());
  if(cs.lastSweep === today) return;
  const yesterday = dayKey(addDays(new Date(),-1));
  for(const c of CHORES){
    if(cs.doneOn[c.id] === today || cs.doneOn[c.id] === yesterday){ delete cs.overdue[c.id]; continue; }
    if(cs.overdue[c.id]) cs.overdue[c.id].days = (cs.overdue[c.id].days||1) + 1;
    else if(choreDue(c, addDays(new Date(),-1))) cs.overdue[c.id] = { since:yesterday, days:1 };
  }
  cs.lastSweep = today;
  saveChoreState(cs);
}

/* Fixed time each day (CFG.choresTime, see tick()) — fully automatic now, no
   manual topbar entry point any more (that was the 🔒 button; the topbar
   slot is now ❓, see fieldGuideDialog). Shows whatever's due today or still
   overdue from an earlier day — each chore confirms independently (was
   single-select). A chore already confirmed today shows checked but can't
   be re-toggled off from here. Deliberately not dismissable by tapping
   outside while chores are still pickable — the all-done/nothing-due screen
   is, since there's nothing left to act on. */
function lockDialog(){
  const cs = loadChoreState();
  const now = new Date();
  const today = dayKey(now);
  const relevant = CHORES.filter(c => choreDue(c, now) || cs.overdue[c.id] || cs.doneOn[c.id] === today);
  const pickable = relevant.filter(c => cs.doneOn[c.id] !== today);

  const scrim = el("div","scrim lock-scrim");
  const box = el("div","lock-box");
  box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  box.appendChild(el("div","lock-title", relevant.length && !pickable.length ? "You did all your chores." : "Did you do your CHORES?"));

  if(!pickable.length){
    box.appendChild(el("div","lock-sub", relevant.length ? "All done ✅" : "Nothing due today 🌼"));
    const ok = el("button","lock-square","Nice!");
    ok.addEventListener("click", () => scrim.remove());
    box.appendChild(ok);
    scrim.addEventListener("click", e => { if(e.target === scrim) scrim.remove(); });
    scrim.appendChild(box); document.body.appendChild(scrim);
    return;
  }

  box.appendChild(el("div","lock-sub","Choose"));

  const picked = new Set();
  const doneBtn = el("button","lock-square","Done!");
  doneBtn.disabled = true;

  const grid = el("div","lock-choices");
  for(const c of relevant){
    const already = cs.doneOn[c.id] === today;
    const btn = el("button","lock-choice" + (already ? " sel" : ""));
    btn.type = "button";
    btn.disabled = already;
    btn.setAttribute("aria-label", c.label + (already ? " — done" : ""));
    btn.style.setProperty("--cc", c.cc);
    btn.style.setProperty("--cc-glow", c.glow);
    const badge = el("div","lc-badge");
    const icon = el("div","lc-icon", c.icon);
    badge.appendChild(icon);
    btn.appendChild(badge);
    const overdueDays = !already && cs.overdue[c.id] ? cs.overdue[c.id].days : 0;
    btn.appendChild(el("div","lc-label", c.label + (overdueDays ? ` · ${overdueDays}d` : "")));
    icon.addEventListener("animationend", () => icon.classList.remove("hover-in","hover-out"));
    badge.addEventListener("animationend", () => badge.classList.remove("flash"));
    if(!already){
      btn.addEventListener("mouseenter", () => { icon.classList.remove("hover-out"); icon.classList.add("hover-in"); });
      btn.addEventListener("mouseleave", () => { icon.classList.remove("hover-in"); icon.classList.add("hover-out"); });
      btn.addEventListener("click", () => {
        btn.classList.toggle("sel");
        if(btn.classList.contains("sel")) picked.add(c.id); else picked.delete(c.id);
        doneBtn.disabled = picked.size === 0;
        badge.classList.remove("flash"); void badge.offsetWidth; badge.classList.add("flash");
      });
    }
    grid.appendChild(btn);
  }
  box.appendChild(grid);

  doneBtn.addEventListener("click", () => lockConfirmDialog(scrim, picked));
  box.appendChild(doneBtn);
  scrim.appendChild(box); document.body.appendChild(scrim);
}

function lockConfirmDialog(lockScrim, picked){
  const scrim = el("div","scrim lock-confirm-scrim");
  const box = el("div","lock-confirm-box");
  box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  box.appendChild(el("div","lock-confirm-text","Are you ABSOLUTELY sure?!?!"));
  const row = el("div","lock-confirm-btns");
  const yes = el("button","lock-confirm-square yes","YES!");
  const no = el("button","lock-confirm-square whoopsy","Whoopsy...");
  yes.addEventListener("click", () => {
    const cs = loadChoreState();
    const today = dayKey(new Date());
    for(const id of picked){ cs.doneOn[id] = today; delete cs.overdue[id]; }
    saveChoreState(cs);
    scrim.remove(); lockScrim.remove();
    celebrate();
  });
  no.addEventListener("click", () => scrim.remove());
  row.appendChild(no); row.appendChild(yes);
  box.appendChild(row);
  scrim.appendChild(box); document.body.appendChild(scrim);
  yes.focus();
}

/* ---------------------------------------------------------------- flourish */
const fx = $("#fx"), fxc = fx.getContext("2d");
let parts=[], raf=null;
function fitFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", fitFx); fitFx();
/* mult: particle-count multiplier for a bigger moment (day-complete, see
   paintHero) — 1 for every ordinary per-task completion, unchanged. */
function celebrate(mult){
  mult = mult || 1;
  chime();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  /* the last entry was a hardcoded board key; boards are per-viewer now, so
     sample whichever board exists first. The || fallback already covers a
     missing variable. */
  const anyBoard = BOARDS.length ? "--b-" + BOARDS[0].key : "--deep";
  const cols = ["--accent","--done","--age","--crit","--deep",anyBoard].map(v => cs.getPropertyValue(v).trim() || "#0E7C86");
  const host = document.querySelector(".item.hub") || document.querySelector(".state");
  const r = host ? host.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/3, width:0, height:0 };
  const ox = r.left + r.width/2, oy = r.top + r.height/2;
  for(let i=0;i<64*mult;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
    parts.push({ x:ox, y:oy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.6, r:2.4+Math.random()*3,
                 c:cols[i%cols.length], life:1, rot:Math.random()*6, shape:i%3 });
  }
  if(!raf) raf = requestAnimationFrame(tickFx);
}

/* One dopamine hit per completed task: a cartoon daisy "writes" a random
   affirmation for 3s, then fades. Purely decorative — no state, no writes. */
const DOPAMINE_LINES = [
  ["Floret by floret","Task complete—just like the daisy builds a vibrant bloom out of tiny florets, every small win compounds into real progress!"],
  ["Growing anywhere","Checked off—just like the daisy thriving in whatever soil it finds, you took action and made it happen without waiting for perfect conditions."],
  ["Pacing yourself","Step by step—just like the daisy blooming steadily at its own pace, you're moving forward without burning out."],
  ["Focused energy","Win secured—just like the daisy opening wide to catch the morning sun, you brought focused energy right when it counted."],
  ["Simple mastery","Task done—just like the humble daisy making something beautiful look effortless, you handled that with total ease."],
  ["Grounding in action","Boom, done—just like the daisy anchored deep in the earth, you stayed grounded and knocked another item off your list!"],
];
function dopamineBurst(){
  document.querySelectorAll(".dopamine-pop").forEach(n=>n.remove());
  const [lead, msg] = DOPAMINE_LINES[Math.floor(Math.random()*DOPAMINE_LINES.length)];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 64 64");
  svg.setAttribute("class","dopamine-daisy"+(reduced?"":" bob"));
  svg.setAttribute("aria-hidden","true");
  let petals = "";
  for(let i=0;i<8;i++){
    petals += `<ellipse cx="32" cy="13" rx="7" ry="13" fill="#fff" stroke="var(--line-2)" stroke-width="1" transform="rotate(${i*45} 32 32)"/>`;
  }
  svg.innerHTML = petals + `<circle cx="32" cy="32" r="11" fill="var(--accent)" stroke="var(--accent-ink)" stroke-width="1.4"/>`;

  const msgEl = el("div","dopamine-msg");
  if(reduced){
    msgEl.textContent = msg;
  }else{
    const words = msg.split(" ");
    const step = Math.min(28, 460/Math.max(words.length,1));
    words.forEach((w,i)=>{
      const s = el("span","dopamine-word", w + (i<words.length-1 ? " " : ""));
      s.style.animationDelay = (i*step)+"ms";
      msgEl.appendChild(s);
    });
  }

  const text = el("div","dopamine-text");
  text.appendChild(el("div","dopamine-lead",lead));
  text.appendChild(msgEl);

  const pop = el("div","dopamine-pop");
  pop.appendChild(svg);
  pop.appendChild(text);
  document.body.appendChild(pop);

  setTimeout(()=>{
    pop.classList.add("out");
    setTimeout(()=>pop.remove(), 320);
  }, 3000);
}
/* Named tickFx, not tick: a same-named `function tick(){...}` further down
   (the clock/rollover one wired to setInterval) is a later top-level
   declaration and silently wins the name in sloppy mode — this animation
   loop was calling straight into the clock tick instead of itself, so
   celebrate()'s confetti was pushed into `parts` but never actually drawn. */
function tickFx(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.life -= 0.014; p.rot += 0.15;
    fxc.save(); fxc.globalAlpha = Math.max(0,p.life);
    fxc.translate(p.x,p.y); fxc.rotate(p.rot);
    fxc.fillStyle = p.c;
    if(p.shape===0) fxc.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
    else if(p.shape===1){ fxc.beginPath(); fxc.arc(0,0,p.r*0.9,0,Math.PI*2); fxc.fill(); }
    else{ fxc.beginPath(); for(let k=0;k<5;k++){ const ang=k*2*Math.PI/5-Math.PI/2, x=Math.cos(ang)*p.r,y=Math.sin(ang)*p.r; k?fxc.lineTo(x,y):fxc.moveTo(x,y); } fxc.closePath(); fxc.fill(); }
    fxc.restore();
  }
  raf = parts.length ? requestAnimationFrame(tickFx) : (fxc.clearRect(0,0,innerWidth,innerHeight), null);
}
let actx=null;
function chime(){
  if(!CFG.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*0.08);
      g.gain.linearRampToValueAtTime(0.075,t+i*0.08+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.4);
      o.connect(g); g.connect(actx.destination); o.start(t+i*0.08); o.stop(t+i*0.08+0.42);
    });
  }catch(_){}
}
function toast(msg, isErr){
  const t = el("div","toast"+(isErr?" err":""));
  bidi(t, msg);
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 3400);
}

/* ---------------------------------------------------------------- boot */
function goDay(n){
  S.anchor = n===0 ? startOfDay(new Date()) : addDays(S.anchor, n);
  syncCalendarWatch();
  render();
}
function stepNav(n){
  if(S.view === "pipeline" || S.view === "projects") return;   // neither has a next day to step to
  goDay(n);
}
$("#prev").addEventListener("click", ()=>stepNav(-1));
$("#next").addEventListener("click", ()=>stepNav(1));
$("#setBtn").addEventListener("click", settingsPanel);
$("#guideBtn").addEventListener("click", fieldGuideDialog);
$("#replanBtn").addEventListener("click", ()=>replan());
$("#dateWrap").addEventListener("click", ()=>goDay(0));
$("#progressPill").addEventListener("click", doneDialog);

for(const b of $("#viewSwitch").children){
  /* TOGGLES, it doesn't just set. With the "Day" tab removed (2026-08-26)
     the switcher holds one button, so a plain `S.view = b.dataset.view`
     would make entering Projects a one-way trip with nothing on screen to
     get back to the day. Tapping the active tab returns to Day. */
  b.addEventListener("click", ()=>{
    S.view = (S.view === b.dataset.view) ? "day" : b.dataset.view;
    syncCalendarWatch(); render();
  });
}

async function replan(){
  if(isLockedDay(S.anchor)){ toast("Only today and tomorrow can be built.", true); return; }
  if(S.anchor.getDay() === CFG.dayOff){ toast("My Day Off — nothing gets scheduled."); return; }
  const date = startOfDay(S.anchor);
  const clearable = clearableBlocks(date);
  if(clearable.length){
    const ok = await confirmDialog(
      "Rebuild today?",
      `Clears ${clearable.length} block${clearable.length===1?"":"s"} and re-lays the day.\n\nSchedules tasks by available time: quick tasks take ${CFG.quickTotal}min each, sessions take ${CFG.shortMin}min. Meetings, finished and past work stay.`,
      "Rebuild");
    if(!ok) return;
  }
  applyPlan(date, "normal", null, true);
}
/* the little clock widget lives outside #pageMain, so it survives every
   repaint untouched — it only needs its own second-by-second tick */
function tickClockWidget(){
  const n = new Date();
  $("#cwDow").textContent = DOW[n.getDay()];   /* full name, not the old 3-letter cut */
  $("#cwDay").textContent = `${n.getDate()} ${MON[n.getMonth()]}`;
  $("#cwHH").textContent = hhmm(n);
  $("#cwSec").textContent = ":" + pad2(n.getSeconds());
}
/* Everything that has to happen when a day becomes *the* day: re-read the
   state card, load settings, sweep rollovers, and build the day if it hasn't
   been built yet. Boot runs it once the connectors settle; the rollover
   watcher runs it again after midnight, so both paths agree instead of one
   of them being a half-copy of the other. */
async function startDay(){
  const sc = statsCard();
  /* keep what we have if Trello can't answer — resetting to DEFAULT_STATS on
     a blip would wipe the streak and re-plan an already-planned day */
  if(sc){ S.stats = parseStats(sc); S.statsCardId = sc.id; }
  else if(!S.stats) S.stats = { ...DEFAULT_STATS };
  S.stats.projects = normProjects(S.stats.projects);
  _snapCache = null;
  loadCfg(S.stats);

  await rolloverSweep();

  const d = new Date();
  const planned = S.stats.plans && S.stats.plans[dayKey(d)];
  if(!planned && d.getDay()!==CFG.dayOff) await applyPlan(startOfDay(d),"normal",null,true);
  render();
}

/* Crossing midnight with the page open used to gut the app. S.anchor was set
   once at load and only user navigation moved it, while allEvents() drops
   every card-linked block that doesn't start today — so at 00:00 the entire
   schedule vanished from the model, the hub fell to "Nothing scheduled", and
   its own Re-plan button could only answer "Only today can be built right
   now." Nothing short of a reload recovered, and leaving the tab open
   overnight is the normal way this thing gets used.
   Now the clock tick watches the date. If the anchor was on the old today it
   follows the clock; either way the calendar watch re-registers on the new
   range and the new day gets built exactly as a fresh boot would build it. */
function checkDayRollover(){
  if(!SETUP) return;          // still in setup — no day to roll over yet
  const now = dayKey(new Date());
  if(S.today === now) return;
  const wasOnToday = S.anchor && dayKey(S.anchor) === S.today;
  S.today = now;
  if(wasOnToday) S.anchor = startOfDay(new Date());
  syncCalendarWatch();
  render();
  if(S.ready && !S.noMcp) startDay();
}

/* Nothing refreshed on return: a backgrounded tab rode entirely on the host's
   2-3 minute refetch, so coming back to it showed minutes-old data with no
   sign of it. Paired with checkDayRollover above, re-opening the tab the next
   morning now lands on the right day with fresh data in one step. */
const REFRESH_IDLE_MS = 60000;
function refreshIfStale(){
  if(!S.mcp || document.hidden) return;
  checkDayRollover();
  if(Date.now() - S.lastRefresh < REFRESH_IDLE_MS) return;
  S.lastRefresh = Date.now();
  Promise.all([
    S.mcp.invalidate(GCAL, "list_events").catch(()=>{}),
    S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{})
  ]).then(render);
}
document.addEventListener("visibilitychange", refreshIfStale);
window.addEventListener("focus", refreshIfStale);

/* Fires the chores lock screen once a day, the moment the clock crosses
   CFG.choresTime — S.choresShown is in-memory only (a reload re-checks and
   may show it again same day, which reads fine as "you still haven't"
   rather than a bug). Skipped if nothing's actually outstanding, or if some
   other dialog is already up. */
function checkChoresTrigger(){
  if(!S.ready || !SETUP) return;   // never fire the lock screen over the wizard
  const now = new Date();
  const today = dayKey(now);
  if(S.choresShown === today) return;
  if(hhmm(now) < CFG.choresTime) return;
  S.choresShown = today;
  choresSweep();
  const cs = loadChoreState();
  const outstanding = CHORES.some(c => cs.doneOn[c.id] !== today && (choreDue(c, now) || cs.overdue[c.id]));
  if(outstanding && !document.querySelector(".scrim")) lockDialog();
}
/* The now-line's replacement (2026-08-26 redesign, direct request: "think
   of something else" for showing where we are in the day). Instead of a
   red rule crossing the page, the current task's own card fills left-to-
   right as its minutes burn — time-remaining lives inside the thing
   you're looking at, not as a mark across everything else. A style-only
   write on a plain CSS var, run every second from tick() (cheap: no DOM
   rebuild, unlike render()'s 60s full repaint) — S.hubItem is set by
   heroCard() each render, so this always tracks whichever card is
   current without needing its own state. */
function tickDrain(){
  const item = S.hubItem;
  const pct = item ? Math.max(0, Math.min(1, (minsOf(new Date()) + new Date().getSeconds()/60 - item.s) / (item.e2 - item.s))) : 0;
  document.documentElement.style.setProperty("--drain", (pct*100).toFixed(2) + "%");
}
function tick(){
  tickClockWidget();
  tickDrain();
  checkDayRollover();
  checkChoresTrigger();
}
setMascot("idle");   // default before the first real paintMain sets a real state
tick();   // paint the clock widget immediately, don't wait a full second
setInterval(tick, 1000);
setInterval(render, 60000);   // keep "now" honest

(async function boot(){
  render();
  let mcp = null;
  /* BUILD-STANDALONE:MCP-RESOLVE — tools/build-standalone.js replaces this
     exact block (between the markers) with the standalone login gate + shim.
     Keep the marker comments intact; the build script matches on them
     literally, not on surrounding code, so unrelated edits nearby are safe
     but renaming/reordering these two lines breaks the build silently. */
  try{ mcp = await (window.claude && window.claude.use ? window.claude.use("mcp") : null); }
  catch(_){ mcp = null; }
  /* END BUILD-STANDALONE:MCP-RESOLVE */

  if(!mcp){ S.noMcp = true; S.ready = true; render(); return; }
  S.mcp = mcp;
  S.lastRefresh = Date.now();

  /* Who is this viewer? Cache first (fast), then the state card (always
     right), then the author's legacy config (gated on his own credentials),
     and only then give up and ask. Nothing below this line can run until
     BOARDS and CAL_ID are real. */
  let cfg = readSetupCache();
  if(!cfg) cfg = await discoverSetup();
  if(!cfg) cfg = await legacySetup();
  if(cfg && !validSetup(cfg)) cfg = null;
  if(cfg){
    applySetup(cfg);
    cacheSetup(cfg);
    startWatches();
  }else{
    /* First run. The settle loop below still starts: the wizard calls
       startWatches() when it finishes, and the loop is what then runs
       startDay(). Returning here instead would leave a configured app with
       nothing to boot it. */
    S.ready = true;
    render();
    setupWizard();
  }

  /* Two gates, not one. The calendar alone is enough to draw a truthful day,
     so the page stops being a skeleton the moment it lands — it used to wait
     for all three Trello boards as well, which meant a slow board bought a
     20-second blank screen and then a fallback that skipped settings, the
     rollover sweep and the auto-plan entirely. Those still wait for both
     sources, but they now run the moment the second one arrives rather than
     being abandoned on a timeout. */
  let started = false;
  const go = () => {
    if(started) return;
    started = true;
    clearInterval(settle);
    startDay();
  };
  const settle = setInterval(()=>{
    if(S.events && !S.ready){ S.ready = true; render(); }
    /* SETUP gates the whole thing: BOARDS is [] until the wizard finishes,
       and `[].every(...)` is vacuously true, which would fire startDay()
       against no identity at all.
       boardSettled, not S.cards[key]: a board that ERRORED has answered too,
       and waiting for success meant one dead board hung the app forever. */
    if(!SETUP || !BOARDS.length || !S.events || !BOARDS.every(boardSettled)) return;
    go();
  }, 400);
  /* Backstop for the case the error gate can't see: a watch that neither
     fires nor errors (a wedged connector). Without it that is still an
     unbounded skeleton, which is the worst outcome in this file. Skipped
     while the wizard is still open — there is nothing to boot yet. */
  setTimeout(()=>{ if(SETUP && BOARDS.length) go(); }, 25000);
})();
</script>
