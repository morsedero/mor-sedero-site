  if(!board) return stateCard("📋","No asset board","None of the boards is marked as a tracker.");

  /* "empty" has four different causes here and they need different answers —
     returning a skeleton for all of them is an infinite blank that can't be
     told apart from a hang. */
  const cardErr = S.errs["cards:"+board.key], listErr = S.errs["lists:"+board.key];
  if(listErr || cardErr)
    return stateCard("🔌","Can't reach the asset board",(listErr||cardErr).message);
  if(!S.cards[board.key] || !S.boardLists[board.key]) return el("div","skel");

  const lists = trackerListsOf(board);
  if(!lists.length)
    return stateCard("📋","No stages yet",
      `${board.name} has no lists. Add them in Trello — Waiting, In progress, In review, Fixing, Approved, Implemented — and they'll show up here as columns.`);

  const assets = allCards().filter(c => c.boardKey === board.key && !c.isStats);
  const byList = new Map(lists.map(l => [l.id, []]));
  const orphans = [];
  for(const c of assets){
    if(byList.has(c.listId)) byList.get(c.listId).push(c);
    else orphans.push(c);   // list came back past the 50 cap, or was archived
  }

  const top = el("div","pipe-top");
  const nameEl = el("span","pipe-board");
  nameEl.appendChild(bidiSpan(board.name));
  top.appendChild(nameEl);
  top.appendChild(el("span","pipe-total", `${assets.length} assets`));
  wrap.appendChild(top);

  const cols = el("div","pipe-cols");
  for(const l of lists){
    const items = byList.get(l.id) || [];
    const col = el("div","pipe-col " + boardClass({ boardKey:board.key }));
    const head = el("div","pipe-head");
    const nm = el("span","pipe-name", l.name || "(unnamed)");
    nm.setAttribute("dir","auto");
    head.appendChild(nm);
    head.appendChild(el("span","pipe-count", String(items.length)));
    col.appendChild(head);

    const body = el("div","pipe-body");
    for(const c of items){
      const a = el("button","asset" + (S.moving.has(c.id) ? " busy" : ""));
      const t = el("span","asset-n", c.name);
      t.setAttribute("dir","auto");
      a.appendChild(t);
      const link = cardLink(c);
      if(link) a.appendChild(link);
      a.addEventListener("click", e=>{
        if(e.target.closest(".card-link")) return;   // ↗ opens Trello, doesn't move
        if(S.moving.has(c.id)) return;
        assetMoveDialog(c, board);
      });
      body.appendChild(a);
    }
    if(!items.length) body.appendChild(el("div","pipe-empty","—"));
    col.appendChild(body);
    cols.appendChild(col);
  }
  wrap.appendChild(cols);

  if(orphans.length){
    wrap.appendChild(el("p","dim pipe-note",
      `${orphans.length} card(s) sit in a stage this view can't see — trelloReadList caps at 50.`));
  }
  return wrap;
}

/* The Projects view: one card per tracker board, each answering "does this
   fit before the deadline". Dateless, like the pipeline — S.anchor means
   nothing here.

   Deliberately gated on S.cards only, never on S.boardLists: this view reads
   listName straight off each card (normCard already carries it), so waiting
   on the list watch would make it hang on data it doesn't use. */
function projectsView(){
  const wrap = el("div","proj");
  if(!TRACKERS.length)
    return stateCard("📋","No project boards","None of the boards is marked as a tracker.");
  /* Unreachable in normal use — paintHeader hides the tab without a batch
     board — but the view is also driven directly by tests, and S.view can be
     restored from a stale state, so it must not read S.cards[undefined]. */
  if(!SETUP || !SETUP.batchBoardKey)
    return stateCard("📋","Projects isn't set up",
      "This view reads batch cards created by the audio-sync function. Nothing is configured to write them.");

  for(const board of TRACKERS){
    /* Same four-way split the pipeline uses, for the same reason: one
       skeleton for every cause is a blank nobody can tell from a hang. */
    if(S.errs["cards:"+board.key]){
      wrap.appendChild(stateCard("🔌","Can't reach "+board.name, S.errs["cards:"+board.key].message));
      continue;
    }
    if(!S.cards[board.key] || !S.cards[SETUP.batchBoardKey]){ wrap.appendChild(el("div","skel")); continue; }

    const s = snapshotFor(board);
    const card = el("div","proj-card " + boardClass({ boardKey:board.key }));

    const top = el("div","proj-top");
    const nm = el("span","proj-name");
    nm.appendChild(bidiSpan(s.listName));
    top.appendChild(nm);
    const lnk = cardLink({ url:"https://trello.com/b/"+bareId(board.id) });
    if(lnk) top.appendChild(lnk);
    card.appendChild(top);

    if(!s.openAssetCount && !s.openBatches){
      card.appendChild(el("p","dim proj-clear","Nothing left on the tracker. 🎉"));
      wrap.appendChild(card);
      continue;
    }

    /* Deadline — the one editable thing in this whole view. */
    const dl = el("button","proj-deadline" + (s.deadline ? "" : " unset"));
    dl.appendChild(el("span","proj-k","Deadline"));
    dl.appendChild(el("span","proj-v", s.deadline
      ? `${s.deadline.getDate()} ${MON[s.deadline.getMonth()]} ${s.deadline.getFullYear()}`
      : "Set a date"));
    dl.addEventListener("click", ()=> deadlineDialog(board));
    card.appendChild(dl);

    /* Runway shows both numbers on purpose: work days is the one that drives
       every calculation, and without the calendar count beside it the smaller
       number just looks wrong. */
    if(s.deadline){
      const rw = el("div","proj-row");
      rw.appendChild(el("span","proj-k","Runway"));
      rw.appendChild(el("span","proj-v",
        s.workDays > 0
          ? `${s.workDays} work day${s.workDays===1?"":"s"} · ${s.calendarDays} calendar`
          : (s.calendarDays < 0 ? `${-s.calendarDays} day${s.calendarDays===-1?"":"s"} past` : "today")));
      card.appendChild(rw);
    }

    /* Remaining: card count leads (that's the unit that gets scheduled),
       points support it. */
    const rem = el("div","proj-row");
    rem.appendChild(el("span","proj-k","Remaining"));
    rem.appendChild(el("span","proj-v",
      `${s.baseCards} card${s.baseCards===1?"":"s"}' worth · ${s.remainingPoints} pts`));
    card.appendChild(rem);

    const brk = el("p","dim proj-note",
      `${s.openBatches} batch card${s.openBatches===1?"":"s"} open · ` +
      `${s.subjects.length} segment${s.subjects.length===1?"":"s"} still to batch` +
      (s.music.length ? ` · ${s.music.length} music track${s.music.length===1?"":"s"}` : ""));
    card.appendChild(brk);

    /* Pressure. The bar runs past 100% into an overflow tint rather than
       clamping flat, so "over" reads as over rather than as "exactly full". */
    const band = pressureBand(s.pressure);
    const pr = el("div","proj-press pb-"+band.key);
    const head = el("div","proj-row");
    head.appendChild(el("span","proj-k","Pressure"));
    head.appendChild(el("span","proj-v proj-band", band.word));
    pr.appendChild(head);
    if(s.pressure != null){
      const bar = el("div","proj-bar");
      const fill = el("div","proj-fill");
      fill.style.width = Math.min(100, (isFinite(s.pressure) ? s.pressure : 1.2) / 1.2 * 100) + "%";
      bar.appendChild(fill);
      pr.appendChild(bar);
    }
    let note = band.note;
    if(band.key === "over"){
      const short = isFinite(s.pressure)
        ? Math.ceil((s.remainingPoints - s.supplyPoints) / AUDIO_WORKDAY_CAP)
        : Math.ceil(s.remainingPoints / AUDIO_WORKDAY_CAP);
      note = `Needs ${short} more work day${short===1?"":"s"} than there are.`;
    }
    if(note) pr.appendChild(el("p","dim proj-note", note));
    card.appendChild(pr);

    /* Density — advisory only, writes nothing. Shown only when packing denser
       would actually change the card count; at or below the normal cap there
       is nothing to say. */
    if(s.packPoints > AUDIO_WORKDAY_CAP && s.projectedCards < s.baseCards){
      const dens = el("div","proj-dense");
      dens.appendChild(el("div","proj-dense-h","Pack denser"));
      dens.appendChild(el("p","proj-dense-b",
        `At ${AUDIO_WORKDAY_CAP} pts/card that's ${s.baseCards} cards over ${s.workDays} work days. ` +
        `At ${s.packPoints} pts/card it's ${s.projectedCards}.`));
      card.appendChild(dens);
    }

    /* Per-subject breakdown — free, already computed, and the thing that says
       *which* part of the project is heavy. */
    if(s.subjects.length){
      const segs = el("div","proj-segs");
      for(const sg of s.subjects.slice(0,12)){
        /* Tapping a segment is how an asset gets moved along the pipeline
           (Waiting → In progress → …). The machinery for that — pipelineView,
           assetMoveDialog, moveAssetTo — has existed and been tested since the
           Assets tab, but has been *unreachable* since that tab was pulled
           from the switcher: nothing set S.view="pipeline" any more except
           tracker.js. This is the way back in, and a better one than a fourth
           top-level tab, because the segment you're looking at is already the
           context you'd be picking from. */
        const row = el("button","proj-seg");
        const sn = el("span","proj-seg-n", sg.subject);
        sn.setAttribute("dir","auto");
        row.appendChild(sn);
        row.appendChild(el("span","proj-seg-c", `${sg.count} · ${sg.points} pts`));
        row.addEventListener("click", ()=> segmentAssetsDialog(sg, board));
        segs.appendChild(row);
      }
      if(s.subjects.length > 12)
        segs.appendChild(el("div","dim proj-seg-more", `+${s.subjects.length-12} more`));
      card.appendChild(segs);
    }

    wrap.appendChild(card);
  }
  return wrap;
}

/* #heroSlot is a flex sibling of #pageMain, outside its scroller — see the
   body shell — so it's structurally sticky with no position:sticky/z-index
   needed (CLAUDE.md's documented overlay hazard doesn't apply: nothing
   here overlaps anything). Rebuilt fresh every render() alongside
   paintMain, same cadence, since both read the same splitAgenda() result. */
function paintHero(current, doneCount, missedCount, nextUp){
  const slot = $("#heroSlot");
  slot.innerHTML = "";
  slot.appendChild(current ? heroCard(current) : emptyNow(doneCount, missedCount));
  slot.classList.toggle("hero-empty", !current);
  slot.hidden = false;
  /* "A next up small card under it" + "an option to see the day's
     schedule" (2026-08-28, approved design canvas). Both only make sense
     while there's an actual hero to sit under — the empty states already
     say their own thing (nothing scheduled / day clear / you missed some
     tasks) and don't need a next-up card competing with that message, and
     "see the schedule" is exactly what's already on screen once the hero
     itself is the empty state. */
  if(current){
    if(nextUp) slot.appendChild(nextUpCard(nextUp));
    slot.appendChild(scheduleButton());
  }
  /* Day-complete moment: celebrate() (confetti, already exists — see
     completeItem) fires once per day the moment the day empties out with
     something actually finished, not on every render of the clear state —
     S.dayCelebrated (per dayKey, so a new day can celebrate again) is the
     guard. Reuses the same confetti/chime the per-task completion already
     uses, just a bigger burst for the bigger moment.
     !missedCount (2026-08-27): a day isn't "clear" while missed tasks are
     still sitting open further down — that's the same state emptyNow above
     now gives its own honest copy to, not a moment to celebrate. */
  if(!current && doneCount && !missedCount){
    const today = dayKey(S.anchor);
    if(S.dayCelebrated !== today){
      S.dayCelebrated = today;
      celebrate(2);
    }
  }
}
/* The small card directly under the hero (2026-08-28, approved design
   canvas: "a next up small card under it"). Deliberately NOT built via
   timelineItem/rowLead — it isn't a row in the list (it doesn't need drag,
   an accordion, or action buttons), just a glanceable preview of what's
   next, so it gets its own minimal markup. Same board-colour identity every
   other card carries (boardClass/listClass), as a thin 6px spine rather
   than the hero's 10px — smaller card, quieter mark, same visual language.
   Clicking it opens that task's own row in the list below (S.openRow),
   same accordion every other row already uses, then scrolls it into view —
   "next up" is a preview, not a duplicate action surface. */
function nextUpCard(item){
  const rowId = item.card ? item.ev.id+":"+item.card.id : item.ev.id;
  const card = el("div","next-up "+boardClass(item.card, item.task, item.isBreak)+listClass(item.card));
  /* item.s, not item.ev.start (2026-08-28 fix): a brick sibling (a merged
     quick-task window — see CLAUDE.md) shares one Google Calendar event
     across several tasks, so item.ev.start is the WHOLE WINDOW's start,
     identical for every sibling. item.s is this task's own real slice —
     the same distinction timelineItem/currentMarker already make for their
     own time badges. Using ev.start here showed "next up" at the same
     clock time as the hero above it, for a different task. */
  const time = el("span","next-up-time", hhmm(atMin(S.anchor, item.s)));
  const lead = el("div","next-up-lead");
  lead.appendChild(el("span","next-up-k","Next up"));
  lead.appendChild(time);
  card.appendChild(lead);
  const n = el("div","next-up-n");
  n.appendChild(bidiSpan(item.title));
  card.appendChild(n);
  card.appendChild(el("span","next-up-dot"));
  card.addEventListener("click", ()=>{
    S.openRow = rowId;
    /* the row this opens lives in #pageMain — expand it first (2026-08-28,
       same day the schedule became collapsible) or the accordion opens
       behind a `host.hidden` list and scrollIntoView below has nothing
       visible to scroll to. */
    S.scheduleOpen = true;
    render();
    requestAnimationFrame(()=>{
      const row = document.querySelector(`[data-row-id="${CSS.escape(rowId)}"]`);
      if(row) row.scrollIntoView({block:"center", behavior:"smooth"});
    });
  });
  return card;
}
/* "An option to see the day's schedule" (2026-08-28, approved design
   canvas) — the schedule already IS #pageMain's own list, right below the
   hero in the same #scroller (see .scroller's own comment), so this button
   doesn't open a second view; it toggles that list's own visibility.
   Collapsible (2026-08-28 follow-up, direct user request: "make the
   schedule collapsable") — S.scheduleOpen is the one flag, read here and
   in paintMain (which actually hides/shows #pageMain), so both stay in
   sync across a render without either side owning the DOM state alone.
   Starts open (matches the button's original scroll-only behaviour before
   this request) and persists only for the tab's lifetime — not written to
   settings, since which is "normal" varies call to call, not day to day. */
function scheduleButton(){
  const b = el("button","schedule-btn");
  b.type = "button";
  b.setAttribute("aria-expanded", String(S.scheduleOpen));
  const chevron = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .18s;transform:rotate('+(S.scheduleOpen?180:0)+'deg)"><path d="M6 9l6 6 6-6"></path></svg>';
  b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>'
    + '<span>' + (S.scheduleOpen ? "Hide today’s schedule" : "See today’s schedule") + '</span>' + chevron;
  b.addEventListener("click", ()=>{
    S.scheduleOpen = !S.scheduleOpen;
    render();
  });
  return b;
}
/* Views with no day/current-task concept at all (pipeline/projects/day-off/
   shared-state) hide the hero outright rather than showing stale content. */
function clearHero(){
  const slot = $("#heroSlot");
  slot.innerHTML = "";
  slot.hidden = true;
}

/* The one page. Day shows the activity list — the current task's own
   slim in-timeline marker (see currentMarker) plus everything else left
   today, meetings included so a permeable one (see groupForStack) shows
   what's scheduled inside it. */
function paintMain(){
  const host = $("#pageMain");
  host.innerHTML = "";

  const shared = sharedState();
  /* The collapsible-schedule flag (S.scheduleOpen) only means anything for
     the Day view's own list — every branch below that returns early has
     nothing to do with that list, so each has to unhide #pageMain itself
     or it stays hidden forever once a Day-view render has collapsed it
     (host.hidden is only ever set back to false at the bottom of this
     function, which none of these branches reach). */
  if(shared){ host.appendChild(shared); host.hidden = false; $("#dashRight").hidden = true; clearHero(); return; }

  /* The asset pipeline is the one view with no date at all — it's a board
     state, not a day — so it ignores S.anchor entirely. */
  if(S.view === "pipeline"){ host.appendChild(pipelineView()); host.hidden = false; $("#dashRight").hidden = true; clearHero(); return; }
  /* Projects is dateless too — it's the state of a deadline, not a day. */
  if(S.view === "projects"){ host.appendChild(projectsView()); host.hidden = false; $("#dashRight").hidden = true; clearHero(); return; }

  const d = S.anchor;
  if(d.getDay() === CFG.dayOff){
    host.appendChild(stateCard("🏄‍♂️","My Day Off",""));
    host.hidden = false;
    $("#dashRight").hidden = true;
    clearHero();
    setMascot("sleep");
    return;
  }

  const { items, current, nextUp, meetingNow, breakNow, missedList, rest, missed, doneCount, open } = splitAgenda();
  const missedListSet = new Set(missedList);
  updateMascot({ current, missed, open, doneCount });

  /* True-to-scale positioning (2026-08-25 redesign): winS/winE/ppm are
     computed once, up front, from the day's real items — not measured after
     the fact from rendered DOM the way anchorRows used to. Every
     timelineItem(...,{mode:"stack"}) call below needs these to place its
     row at a real pixel position; passing 0,0 (as before the redesign) is
     no longer valid once positioning is real. Same widen-to-whole-hours
     clamp timeline() used to apply after rendering. */
  let dayWinS = CFG.dayStart*60, dayWinE = CFG.dayEnd*60;
  for(const it of items){
    dayWinS = Math.min(dayWinS, Math.floor(it.s/60)*60);
    dayWinE = Math.max(dayWinE, Math.ceil(it.e2/60)*60);
  }
  const dayGap = offHoursGap(items);
  if(dayGap) dayWinE = Math.max(dayWinE, Math.ceil(dayGap.e2/60)*60);
  const dayPpm = TL_PPM_DAY;

  /* the day is capped at a few tasks, so fetch their checklists up front and
     let the panels appear without being asked for */
  let budget = 12;
  for(const i of [current].concat(rest, missed)){
    if(budget <= 0) break;
    if(i && i.card && !S.lists[i.card.id]){ loadChecklists(i.card); budget--; }
  }

  /* every remaining thing today, tasks and meetings alike */
  const upcoming = rest.filter(i => !i.done);
  const missedTasks = missed.filter(i => i.task && !missedListSet.has(i));
  for(const i of missedTasks) i.missed = true;
  let laterItems = upcoming.concat(missedTasks);

  /* a currently-active permeable meeting renders as the compact banner
     above, not a stack row — so it never reaches groupForStack, and its
     own tasks used to fall into laterItems as flat siblings with no sign
     they were "inside" it. Pulled out here and given their own dashed
     nest under the banner — each one its own full card (same component
     as everywhere else, actions included), not folded into anything. */
  let meetingKids = null;
  if(meetingNow){
    const kids = childrenOf(meetingNow, laterItems);
    if(kids.length){
      laterItems = laterItems.filter(i => kids.indexOf(i) < 0);
      meetingKids = kids;
    }
  }

  /* Current no longer renders inside the timeline at all (2026-08-26
     redesign) — it lives in the sticky #heroSlot, built by heroCard()
     below, outside #pageMain's scroller entirely. Everything else that
     used to share the "lead" group (a live meeting banner, an unstarted
     break, missed tasks earlier than current) stays in-timeline, as plain
     cards at their own real time position — only the one "current" card
     leaves the flow, since it's the one thing the hero exists to make
     permanently visible. */
  const lead = el("div","hub-lead");

  if(meetingNow) lead.appendChild(meetingNowRow(meetingNow));

  /* An unstarted break earlier than current (see splitAgenda's breakNow),
     and/or any still-open tasks whose own slots already passed
     (missedList — every one of them, not just the earliest, see its own
     comment), render as plain rows same as everything else — same normal
     stack card each always was in `rest`/`missed`. Marked .missed same as a
     plain missed-list row would be, so the card itself still reads as
     overdue rather than a normal upcoming task. */
  for(const i of missedList) i.missed = true;
  for(const i of [breakNow].concat(missedList).filter(Boolean).sort((a,b) => a.s - b.s))
    lead.appendChild(timelineItem(i, dayWinS, dayPpm, 0, 1, {mode:"stack"}));

  paintHero(current, doneCount, missed.length, nextUp);
  if(current) lead.appendChild(currentMarker(current, dayWinS, dayPpm));

  if(meetingKids){
    const nest = el("div","nest standalone");
    for(const c of meetingKids) nest.appendChild(timelineItem(c, dayWinS, dayPpm, 0, 1, {mode:"stack", indent:true}));
    lead.appendChild(nest);
  }

  /* One timeline holds the whole day now — current first, then everything
     after it. It renders even with no laterItems, because current itself
     is a row that needs the clock behind it.
     `all` lets timeline() find the off-hours gap against the whole day, not
     just the rows it happens to be rendering — see the note in timeline(). */
  const sec = timeline(laterItems, dayWinS, dayWinE, dayPpm, { all:items, lead });
  host.appendChild(sec);

  /* run after every row is in the live tree — fitRowTitle measures real
     layout, so it needs real boxes, not ones still being built */
  /* A collapsed card's title is plain CSS ellipsis (see .collapsed .n .nt),
     not fitRowTitle's shrink-then-wrap — it's a one-line, small-and-muted
     read by design, so it's excluded here rather than measured. */
  host.querySelectorAll(".item.stack:not(.collapsed) .row").forEach(fitRowTitle);
    /* Uniform rows (2026-08-26): pushForOverflow is gone with the fixed
     slot heights it existed to rescue. A card in normal flow is as tall as
     its own content, so an opened accordion simply makes its row taller
     and everything after it moves down — the browser does what the pass
     used to do by hand. The dead-button bug it fixed (an open card's
     actions rendering UNDER the next card) cannot recur in flow layout. */
  /* nestConnectors still needs a real post-layout measurement pass (same
     reason as above — a nest's own connector line has to know where its
     rows actually ended up, pushForOverflow included) — see its own
     comment. */
  nestConnectors(sec);

  /* transient trouble: keep data, say it once, quietly */
  const soft = Object.values(S.errs).find(e => !AUTHZ.has(e.code) && !LIFECYCLE.has(e.code));
  if(soft){
    const b = el("div","banner");
    b.style.marginTop = "20px";
    b.appendChild(el("div",null,soft.message));
    host.appendChild(b);
  }

  $("#dashRight").hidden = false;
  $("#progressPill").textContent = `${doneCount}/${doneCount + open.length}`;
  /* only today is buildable — the rebuild button only ever creates new
     blocks, so it has nothing honest to do on any other day */
  $("#replanBtn").hidden = isLockedDay(d);
  $("#replanBtn").disabled = !!S.busy;
  $("#replanBtn").textContent = S.busy ? "…" : "↻";
  /* Collapsible schedule (2026-08-28, direct user request) — set LAST, after
     nestConnectors' real-layout measurement pass above, since a hidden
     element has no layout to measure. host still gets built in full either
     way (fitRowTitle/nestConnectors/the progress pill all need the real
     content and counts regardless of whether the list is shown), so
     expanding again never needs a rebuild — see scheduleButton(). */
  host.hidden = !S.scheduleOpen;
}

/* Sits with the toasts rather than in the dash: it has to be visible in Week
   too, and the dash row is already measured to fit at phone width. */
function paintFailed(){
  const host = $("#toasts");
  const old = host.querySelector(".toast.unsaved");
  if(old) old.remove();
  const n = S.failed.length;
  if(!n) return;
  const t = el("div","toast unsaved");
  t.appendChild(el("span","undo-msg", `${n} change${n===1?"":"s"} didn't save`));
  const again = el("button","undo-btn","Retry");
  again.addEventListener("click", retryFailed);
  t.appendChild(again);
  const x = el("button","undo-x","✕");
  x.title = "Discard";
  x.addEventListener("click", ()=>{ S.failed = []; render(); });
  t.appendChild(x);
  host.appendChild(t);
}

function paint(){
  /* projectSnapshot walks allCards() and tierOf calls into it once per
     comparison inside rankCards' sort — O(n log n) full-board scans without
     this. One cache per painted frame is enough; every write path that could
     change the answer (saveProjectDeadline, startDay) clears it too. */
  _snapCache = null;
  paintHeader();
  paintMain();
  paintFailed();
}

/* ---------------------------------------------------------------- timeline
   The day's activity list: uniform rows in document order (2026-08-26).
   A permeable meeting (one tasks may run inside — see permeable()) groups
   the tasks scheduled during it underneath itself instead of listing them
   as flat siblings, so "I have חמל, and two tasks inside it" reads at a
   glance.

   Rows are NOT sized by duration. That was tried (the 2026-08-25 redesign)
   and removed a day later: see timelineItem's positioning comment for the
   arithmetic, but the short version is that legible card heights span ~2.3x
   while real durations span 32x, so any honest pixel mapping either crushes
   the short tasks or buries the day under a five-hour block of empty
   colour. Duration is stated as text in the rail instead, where it costs
   nothing and reads exactly. */
/* The flex gap between two .time-rows in .rows.stack. Mirrored here because
   wireStackDrag has to know how wide the seam between two rows is to hit-test
   across it — keep in sync with .rows.stack's own `gap`. */
const ROW_GAP_PX = 6;
const TL_PPM = 1.6; // pixels per minute
const TL_PPM_DAY = TL_PPM * 0.62;   // ~0.99 px/min, kept for the drain wash

/* tasks that read as "during" a permeable meeting: started inside its
   window, regardless of whether they run past its end (e.g. a session that
   only had to dodge the meeting's start) — grouping them under the meeting,
   and letting the .nest dashed line grow to its real height, keeps the
   line from stopping short of a task that visually followed right after
   it. Shared by groupForStack and paintMain's meetingNow handling below —
   both need the exact same "inside" test, or one could nest a task the
   other treats as a flat sibling. */
function childrenOf(meeting, pool){
  return pool.filter(t => t.task && t.s >= meeting.s && t.s < meeting.e2);
}

/* group a flat, time-sorted item list so a permeable meeting's own tasks
   nest under it instead of scattering through the list */
function groupForStack(items){
  const sorted = items.slice().sort((a,b) => a.s-b.s || a.e2-b.e2);
  const used = new Set();
  const groups = [];
  for(const it of sorted){
    if(used.has(it)) continue;
    used.add(it);
    if(!it.task && permeable(it.ev)){
      const children = childrenOf(it, sorted.filter(t => !used.has(t)));
      children.forEach(c => used.add(c));
      groups.push({ meeting:it, children });
    }else{
      groups.push({ item:it });
    }
  }
  return groups;
}

/* Draws the dashed line from a permeable meeting to each of its nested
   tasks (2026-08-25 redesign — see the .nest-connector CSS comment for why
   this measures real gaps via JS instead of a fixed-height flow spacer).
   Runs once per paint, after every row has its real top/height (must run
   after fitRowTitle, same ordering anchorRows used to need, since a
   shrunk title changes a card's height).

   For each `.nest` found: its immediately preceding sibling is either the
   meeting's own `.time-row` (groupForStack's case, inside `.rows.stack`)
   or `meetingNowRow`'s `.meeting-now` banner (paintMain's meetingKids
   case, inside the unstyled `.hub-lead` — itself inside `.rows.stack`) —
   both are real elements with a real bottom edge to measure from. One
   connector bridges that edge to the first nested card's top; one more
   bridges each subsequent pair. Height/top are measured in `.rows.stack`'s
   own coordinate space — the one positioned ancestor every `.time-row`
   itself already resolves its own top/left against — not viewport pixels. */
function nestConnectors(sec){
  /* Always the same positioned ancestor every .time-row itself resolves
     against (see timelineItem's top/left) — appending here rather than to
     .nest's own (unstyled, non-positioned) parent keeps the connector's
     coordinate space identical to the cards it's measuring, regardless of
     whether the nest sits under .rows.stack (groupForStack's case) or the
     unstyled .hub-lead (meetingKids' case, itself inside .rows.stack). */
  const container = sec.querySelector(".rows.stack");
  if(!container) return;
  const base = container.getBoundingClientRect();
  for(const nest of sec.querySelectorAll(".nest")){
    const anchor = nest.previousElementSibling;
    if(!anchor) continue;
    const chain = [anchor, ...nest.querySelectorAll(":scope > .time-row")];
    for(let i = 1; i < chain.length; i++){
      const aRect = chain[i-1].getBoundingClientRect();
      const bRect = chain[i].getBoundingClientRect();
      const top = aRect.bottom - base.top;
      const height = bRect.top - aRect.bottom;
      /* Sub-pixel noise, not a real gap: getBoundingClientRect() can
         report a fraction of a pixel between two rows the flex gap packs
         together — confirmed live (a 0.03px "gap" rendered as a
         visible-ish zero-height connector). 1px is comfortably above that
         noise floor and comfortably below "a real gap worth bridging." */
      if(height <= 1) continue;
      const line = el("div","nest-connector");
      line.style.top = top + "px";
      line.style.height = height + "px";
      /* Centred in the 12px indent gutter (see opts.indent in timelineItem)
         between the un-indented anchor's left edge and the nested card's
         own left edge, same visual role the old .hub-connector's dashed
         line played. */
      line.style.left = (bRect.left - base.left - 6) + "px";
      container.appendChild(line);
    }
  }
}

/* Day view's timeline. Renders the hour gutter down the left, then the day's rows beside it — each row positioned at its
   real true-to-scale pixel top/height (2026-08-25 redesign; previously
   ANCHORED to its start minute by anchorRows(), never sized by duration —
   that whole mechanism is gone, see anchorRows' own removal note).

   winS/winE/ppm are computed by the caller (paintMain), from the day's real
   items, BEFORE any row is built — every timelineItem(...,{mode:"stack"})
   call needs a real winS/ppm to position itself now, so the window can no
   longer be measured after the fact from rendered DOM the way anchorRows
   used to (there is nothing left to measure; a row's position is set
   directly from its own start minute).

   opts.lead is a prebuilt node (paintMain's hub group: meeting banner, hub
   card, its nest) that goes in first, so the hub sits ON the clock with the
   rest of the day rather than floating above the timeline. It's passed in
   rather than built here because paintMain owns all the hub/nest/connector
   logic already, and none of that needed to change to move it. */
function timeline(items, winS, winE, ppm, opts){
  opts = opts || {};
  const sec = el("section","later stack");
  const wrap = el("div","day-grid");
  const rowsEl = el("div","rows stack");
  if(opts.lead) rowsEl.appendChild(opts.lead);
  /* The off-hours card is placed by time, not appended: it belongs between
     the last work of the day and whatever the calendar holds afterwards, so
     it goes in just before the first group that starts at or after the gap
     ends. It is not part of `items`, so groupForStack never sees it and it
     can't be swept into a permeable meeting's nest.
     Computed from `opts.all` (the WHOLE day) rather than from `items`: the
     list this renders is `laterItems`, which excludes the hub — and on a day
     whose only work is the hub (a single 8h session, say) the leftover list
     holds nothing but the evening event, so the gap would never be found. */
  const gap = opts.gap === false ? null : offHoursGap(opts.all || items);
  /* Uniform rows (2026-08-26): no scale, no push map, no gutter. Rows are
     in flow order, so "where a card sits" is just its place in the list.
     buildDayScale/pushForFloor/pushForOverflow/hourGutter/hourLines are
     gone with the proportional heights they existed to correct — see
     timelineItem's positioning comment for why. Empty stretches are no
     longer compressed-and-labelled either; a real gap now renders as a
     visible quietGap card (below), which says the same thing in a way that
     reads as intentional rather than as a rendering fault. */
  let gapPlaced = false;
  const placeGap = before => {
    if(!gap || gapPlaced) return;
    if(before != null && before < gap.e2) return;
    gapPlaced = true;
    rowsEl.appendChild(offHoursCard(gap, winS, ppm));
  };
  /* A genuinely empty stretch between two consecutive rows, stated as a
     card. QUIET_GAP_MIN keeps it to gaps worth naming — a 15-min turnaround
     between two tasks is not free time and shouldn't claim to be. */
  let prevEnd = null;
  const placeQuiet = it => {
    if(prevEnd != null && it && it.s - prevEnd >= QUIET_GAP_MIN){
      rowsEl.appendChild(quietGap(prevEnd, it.s));
    }
    if(it) prevEnd = prevEnd == null ? it.e2 : Math.max(prevEnd, it.e2);
  };
  for(const g of groupForStack(items)){
    const it = g.meeting || g.item;
    placeGap(it ? it.s : null);
    placeQuiet(it);
    if(g.meeting){
      rowsEl.appendChild(timelineItem(g.meeting, winS, ppm, 0, 1, {mode:"stack"}));
      if(g.children.length){
        const nest = el("div","nest");
        for(const c of g.children) nest.appendChild(timelineItem(c, winS, ppm, 0, 1, {mode:"stack", indent:true}));
        rowsEl.appendChild(nest);
      }
    }else{
      rowsEl.appendChild(timelineItem(g.item, winS, ppm, 0, 1, {mode:"stack"}));
    }
  }
  placeGap(null);   // gap after everything else in this list
  wrap.appendChild(rowsEl);
  sec.appendChild(wrap);
  sec.dataset.winS = winS;
  sec.dataset.winE = winE;
  sec.dataset.ppm = ppm;
  return sec;
}

/* Three generations of vertical-position machinery have now been removed
   from this file, and the third removal is the one worth remembering.
   anchorRows()/sizeCardToDuration() (gone 2026-08-25) measured where rows
   landed and stretched an hour gutter to match. buildDayScale()/
   pushForFloor()/pushForOverflow() (gone 2026-08-26) replaced that with
   true pixel-per-minute positions computed up front. Both existed to make
   card height mean duration, and both failed the same way: the floor
   needed to keep a 15-min card legible is larger than the space 15 minutes
   buys, so short cards always overflow into each other and something has
   to push the rest of the day down — at which point the card positions and
   the hour labels beside them no longer agree, which is the exact
   misreading an hour gutter exists to prevent.
   Rows are in normal document flow now. Nothing measures, nothing pushes,
   nothing can drift. */

/* The off-hours card. Deliberately NOT a `.item.stack`: it isn't a task, has
   no card, no actions, and must never be dragged, swapped or completed — so
   it doesn't get that class, doesn't go through timelineItem, and
   wireStackDrag never sees it. It still sits in a `.time-row` so its start
   time lines up in the same rail as everything else. */
/* A stretch of genuinely free clock between two things, stated plainly.
   Replaces the old .hour-skip marker (a "⋯ 2h" tag floated over compressed
   empty space), which read as a rendering fault rather than as information
   — it announced that the VIEW had skipped something, not that the DAY had
   room in it. Free time is one of the more useful things a focus widget can
   tell you, so it gets a real card that names how long it is and what it
   ends at. */
const QUIET_GAP_MIN = 45;
function quietGap(fromMin, toMin){
  const row = el("div","time-row quiet-row");
  row.dataset.min = fromMin;
  row.dataset.dur = toMin - fromMin;
  const at = atMin(S.anchor, fromMin);
  const mins = toMin - fromMin;
  const h = Math.floor(mins/60), m = mins%60;
  const span = h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
  const card = el("div","quiet");
  card.appendChild(el("span","quiet-start", hhmm(at)));
  card.appendChild(el("span","quiet-k","Free"));
  card.appendChild(el("span","quiet-span", span));
  card.appendChild(el("span","quiet-until","until " + hhmm(atMin(S.anchor, toMin))));
  row.appendChild(card);
  return row;
}
function offHoursCard(gap, winS, ppm){
  const row = el("div","time-row offhours-row");
  row.dataset.min = gap.s;
  row.dataset.dur = gap.e2 - gap.s;

  const at = atMin(S.anchor, gap.s);
  const mins = gap.e2 - gap.s;
  const h = Math.floor(mins/60), m = mins%60;
  const span = h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;

  const card = el("div","offhours");
  card.title = fmtRange(at, atMin(S.anchor, gap.e2));
  card.appendChild(el("span","offhours-glow"));
  const body = el("div","offhours-body");
  body.appendChild(el("div","offhours-start", hhmm(at)));
  body.appendChild(el("div","offhours-k","Off the clock"));
  body.appendChild(el("div","offhours-span", span + " free"));
  /* Name what's on the other side — the gap is only interesting because
     something is waiting at the end of it. */
  const until = el("div","offhours-until");
  until.appendChild(document.createTextNode(`until `));
  until.appendChild(bidiSpan(gap.until.title));
  until.appendChild(document.createTextNode(` · ${hhmm(atMin(S.anchor, gap.until.s))}`));
  body.appendChild(until);
  card.appendChild(body);
  row.appendChild(card);
  return row;
}

/* The hub: wall clock, what you're on, and how long is left on it.
   It is not a bespoke card — it's the exact same card component every
   list row uses (timelineItem, stack mode), with opts.hub set. The only
   two things that make it read as "the one" instead of just another card:
   opts.hub scales its type/spacing up via CSS (.item.hub) and swaps its
   background (.item.hub too — see the CSS comment by that rule). Nothing
   about its structure, actions, chips, or drag wiring diverges from a
   regular card; a hand-rolled parallel implementation is exactly what let
   the two drift apart before (see the CLAUDE.md history on this file). */
function heroStatus(item){
  const now = new Date();
  const isToday = sameDay(S.anchor, now);
  const nowMin = minsOf(now);
  const live = isToday && item.s <= nowMin && item.e2 > nowMin;
  const overdueSlot = isToday && item.e2 <= nowMin;
  return live ? "On it" : overdueSlot ? "Still open" : isToday ? "Up next" : "First up";
}
/* The hero: current's real card, rendered a second time — once here,
   unpositioned, inside #heroSlot; once as currentMarker below, a slim
   sliver at its true timeline position so the day above/below it still
   reads as continuous. Reuses timelineItem verbatim (same actions, same
   collapsible-exempt "always open" behaviour via opts.hub) rather than a
   parallel hand-rolled card — see the historical note above on why that
   drifted before. winS/ppm are irrelevant here — rows carry no computed
   position at all since the 2026-08-26 uniform-rows change; passing 0s
   keeps the call shape identical to every other timelineItem call site. */
function heroCard(item){
  S.hubItem = item;
  const timeRow = timelineItem(item, 0, 0, 0, 1, { mode:"stack", hub:true, status:heroStatus(item) });
  /* timelineItem's own eyebrow lands in .item-top, a sibling column beside
     the card — hidden here (see .hero-slot .item-top CSS) since the hero
     has no "beside the card" space to spend. Re-homed as the hero's own
     first line instead, same status/source (heroStatus), just inside the
     card. */
  const card = timeRow.querySelector(".item.hub");
  if(card){
    card.appendChild(el("span","drain-fill"));
    card.insertBefore(el("div","hero-eyebrow", heroStatus(item)), card.firstChild);
  }
  return timeRow;
}
/* The slim in-timeline stand-in for current — real position, real height,
   no OPEN-CARD actions (Done/Swap/Pending/Remove — the hero already has
   them, showing both would be the exact duplication the hero exists to
   avoid) — just enough to keep the day's geometry honest and to carry the
   drain wash at true scale. Still wired for drag-to-reorder
   (wireStackDrag): dragging the current task to re-sequence it against
   the rest of the day is a real, pre-existing capability (pushReorder),
   not something the hero redesign meant to take away — only the hub's
   special "always open, full actions" card treatment moved out, not its
   place in the reorderable list. Not built via timelineItem: that always
   renders a full open card with actions, which duplicates the hero. */
function currentMarker(item, winS, ppm){
  const timeRow = el("div","time-row current-marker");
  /* hub/now: stable selector names carried over from before the hero split
     (see the CSS comment by .item.hub) — no styling of their own, kept so
     "which card is currently the day's focus" stays queryable by the same
     identity everywhere, hero included. */
  const card = el("div","item stack current hub now current-marker-card " + boardClass(item.card, item.task, item.isBreak) + listClass(item.card));
  card.appendChild(el("span","drain-fill"));
  /* Real start time worth stating on its own, since the hero above states
     its own range separately — now in-card, top-left, like every other
     stack row (2026-08-27, see timelineItem's rowLead call). */
  const at = atMin(S.anchor, item.s);
  const r = el("div","row");
  r.appendChild(rowLead(hhmm(at) + "–" + hhmm(atMin(S.anchor, item.e2)), null));
  const n = el("span","n"); n.appendChild(bidiSpan(item.title));
  r.appendChild(n);
  card.appendChild(r);
  timeRow.appendChild(card);
  const rowId = item.card ? item.ev.id+":"+item.card.id : item.ev.id;
  wireStackDrag(card, item, rowId);
  return timeRow;
}

/* the hub says this itself (eyebrow + meter); list-row cards get the same
   read in one line — "Doing now" while live, "Starting in X" while ahead,
   nothing once it's missed (the dashed miss styling already says that) */
function itemStatusText(item){
  if(!sameDay(item.ev.start, new Date())) return null;
  const now = new Date();
  const nowMin = minsOf(now) + now.getSeconds()/60;
  if(item.s <= nowMin && item.e2 > nowMin) return "Doing now";
  if(nowMin < item.s) return `Starting in ${fmtDur(Math.round(item.s - nowMin))}`;
  return null;
}

/* description + checklists; items are clickable and write straight through */
function detailPanel(card){
  const bag = S.lists[card.id];
  const lists = (bag && bag.checklists) || [];
  /* The Start marker is a hidden HTML comment (see START_RE) — real content
     for scheduling, but not something the user typed or wants to see, so
     every read/edit here goes through withoutStartMarker rather than raw
     card.desc. saveCardDesc re-appends it on save (from card.desc, never
     from what the user typed) so editing the visible text can't drop it. */
  const visibleDesc = withoutStartMarker(card.desc);
  const hasDesc = !!visibleDesc;
  const descKey = "desc:"+card.id;
  const editingDesc = S.editing.has(descKey);
  if(!hasDesc && !editingDesc && !lists.length && !(bag && bag.error)) return null;   // say nothing

  const d = el("div","details");
  if(editingDesc){
    const wrap = el("div","edit-row");
    const ta = el("textarea");
    ta.value = visibleDesc;
    ta.rows = Math.min(10, Math.max(3, visibleDesc.split("\n").length + 1));
    wrap.appendChild(ta);
    const acts = el("div","edit-acts");
    const save = el("button","btn primary","Save");
    save.addEventListener("click", ()=>saveCardDesc(card, ta.value));
    const cancel = el("button","btn quiet","Cancel");
    cancel.addEventListener("click", ()=>{ S.editing.delete(descKey); render(); });
    acts.appendChild(save); acts.appendChild(cancel);
    wrap.appendChild(acts);
    d.appendChild(wrap);
    requestAnimationFrame(()=>{ ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; });
  }else if(hasDesc){
    const row = el("div","desc-row");
    const p = el("div","desc"); bidi(p, visibleDesc); row.appendChild(p);
    const pen = el("button","edit-pencil","✎");
    pen.type = "button"; pen.title = "Edit description"; pen.setAttribute("aria-label","Edit description");
    pen.addEventListener("click", ()=>{ S.editing.add(descKey); render(); });
    row.appendChild(pen);
    d.appendChild(row);
  }
  if(bag && bag.error){ d.appendChild(el("div","muted", bag.error)); return d; }

  for(const cl of lists){
    const items = cl.checkItems || [];
    if(!items.length) continue;
    const done = items.filter(i => i.state === "COMPLETE").length;
    const head = el("div","clname");
    const nm = el("span"); bidi(nm, /^checklist$/i.test(cl.name||"") ? "" : (cl.name||"")); head.appendChild(nm);
    head.appendChild(el("span",null, `${done}/${items.length}`));
    d.appendChild(head);

    const prog = el("div","prog");
    const bar = el("i"); bar.style.width = Math.round(100*done/items.length) + "%";
    prog.appendChild(bar); d.appendChild(prog);

    const ul = el("ul");
    for(const it of items){
      const on = it.state === "COMPLETE";
      const itemKey = "item:"+it.id;
      const li = el("li", on ? "on" : "");
      if(S.editing.has(itemKey)){
        li.classList.add("editing");
        const inp = el("input","edit-item");
        inp.type = "text"; inp.value = it.name || "";
        inp.addEventListener("keydown", e=>{
          if(e.key === "Enter"){ e.preventDefault(); saveItemText(cl.id, it, inp.value); }
          else if(e.key === "Escape"){ e.preventDefault(); S.editing.delete(itemKey); render(); }
        });
        li.appendChild(inp);
        const save = el("button","mini ok","✓");
        save.type = "button"; save.title = "Save"; save.setAttribute("aria-label","Save item text");
        save.addEventListener("click", ()=>saveItemText(cl.id, it, inp.value));
        li.appendChild(save);
        const cancel = el("button","mini","✕");
        cancel.type = "button"; cancel.title = "Cancel"; cancel.setAttribute("aria-label","Cancel edit");
        cancel.addEventListener("click", ()=>{ S.editing.delete(itemKey); render(); });
        li.appendChild(cancel);
        ul.appendChild(li);
        requestAnimationFrame(()=>{ inp.focus(); inp.select(); });
        continue;
      }
      const b = el("button","box","✓");
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", it.name || "check item");
      if(S.ticking.has(it.id)) b.disabled = true;
      b.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(b);
      const t = el("span","it"); bidi(t, it.name);
      t.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(t);
      const pen = el("button","edit-pencil","✎");
      pen.type = "button"; pen.title = "Edit item text"; pen.setAttribute("aria-label","Edit item text");
      pen.addEventListener("click", e=>{ e.stopPropagation(); S.editing.add(itemKey); render(); });
      li.appendChild(pen);
      ul.appendChild(li);
    }
    d.appendChild(ul);
  }
  return d;
}

/* missedCount (2026-08-27): the hub no longer re-adopts a task whose own
   slot already passed (see splitAgenda's `current` selection) — so "no
   current task" can now mean either a genuinely clear day OR a day where
   everything left is sitting missed further down the list. Those are
   different states and deserve different copy: "Nothing scheduled"/"Day
   clear" would both misreport a day that still has real unfinished work,
   just none of it happening or upcoming any more. */
function emptyNow(doneCount, missedCount){
  if(missedCount) return stateCard("!","You missed some tasks", `${missedCount} still open, further down.`, true);
  if(doneCount) return stateCard("✓","Day clear", `${doneCount} done.`, true);
  const past = sameDay(S.anchor, new Date()) && minsOf(new Date()) >= CFG.dayEnd*60;
  if(past) return stateCard("—","Day's over","", false);
  return stateCard("—","Nothing scheduled","", true);
}

function stateCard(glyph, title, body, withReplan){
  const s = el("div","state");
  s.appendChild(el("div","big",glyph));
  s.appendChild(el("h2",null,title));
  s.appendChild(el("p",null,body));
  if(withReplan){
    const a = el("div","acts");
    const b = el("button","btn","Re-plan day");
    b.disabled = !!S.busy;
    b.addEventListener("click", ()=>replan());
    a.appendChild(b); s.appendChild(a);
  }
  return s;
}

function meetingNowRow(item){
  const r = el("div","meeting-now");
  r.appendChild(el("span","mn-time", fmtRange(item.ev.start, item.ev.end)));
  const n = el("span","mn-name"); bidi(n, item.title); r.appendChild(n);
  return r;
}

function timelineItem(item, winS, ppm, col, cols, opts){
  opts = opts || {};
  const stack = opts.mode === "stack";
  /* Every non-current, non-break task in the Day list is collapsible:
     compact and muted by default (see .item.stack.collapsed below), full
     detail and controls only while it's the one open card — an accordion,
     not a per-card toggle, so the list never shows two full cards
     competing for attention at once. The current task is exempt: opts.hub
     always reads as open, it's never in S.openRow and can't be collapsed
     (2026-08-25 user decision: keeping this auto-open, even though the
     card itself is no longer visually special otherwise — it's the one
     thing you're most likely to act on right now, so it saves a tap). */
  /* Two exploded sibling rows (see agenda()) share one item.ev.id — every
     place that used to mean "this specific row" by event id has to use a
     per-card identity instead, or opening/expanding one sibling would
     silently open/expand every other task sharing its brick event too. */
  const rowId = item.card ? item.ev.id+":"+item.card.id : item.ev.id;
  const isHub = !!opts.hub;
  const isOpen = isHub || (item.task && !item.isBreak && S.openRow === rowId);
  const collapsible = stack && item.task && !item.isBreak && !opts.compact && !isHub;
  const collapsedRow = collapsible && !isOpen;

  const cls = ["item", boardClass(item.card, item.task, item.isBreak) + listClass(item.card), item.task ? "" : "meeting",
               item.missed ? "miss" : "", item.done ? "done" : "",
               stack ? "stack" : "", opts.compact ? "compact" : "",
               collapsedRow ? "collapsed" : "",
               /* "hub"/"now" carry no size/background of their own any more
                  (2026-08-25 redesign — see the CSS comment by .item.hub) —
                  kept as stable selectors, same names since before this was
                  unified with the regular card component. "current" is the
                  new one: the only thing this class actually drives is the
                  glow-outline animation (see .item.current), keyed off
                  whichever card the now-line is inside/nearest, same
                  identity nowCard already used for the old hub styling. */
               opts.hub ? "hub now current" : ""].filter(Boolean).join(" ");
  const wrap = el("div", cls);
  if(!stack && cols > 1){ wrap.style.left = (col*100/cols) + "%"; wrap.style.width = `calc(${100/cols}% - 6px)`; }

  /* The in-card time range is back in stack mode (2026-08-27, user request:
     put start-end inside the card's own top-left corner, Google-Calendar-
     chip style, rather than in a separate rail column outside it — see the
     .time-row CSS for the matching grid removal). It was dropped 2026-08-26
     when the outside rail took over stating the row's start/end; now that
     the rail is gone, the card is the only place left to say it. A brick
     sibling still reads its own slice (item.s/item.e2 — see agenda()), not
     the shared event's whole span, so four siblings each show their own
     consecutive time rather than the same hour four times over. */
  const r = el("div","row" + (item.done ? " done" : ""));
  const inBrick = item.brickPos != null;
  const startAt = inBrick ? atMin(item.ev.start, item.s) : item.ev.start;
  const endAt = inBrick ? atMin(item.ev.start, item.e2) : item.ev.end;
  r.appendChild(stack
    ? rowLead(hhmm(startAt) + "–" + hhmm(endAt), item.card ? sourceChip(item.card) : null)
    : rowLead(fmtRange(item.ev.start, item.ev.end), null));
  const n = el("span","n");
  n.appendChild(bidiSpan(item.title));
  if(item.card){ const link = cardLink(item.card); if(link) n.appendChild(link); }
  r.appendChild(n);

  let status = null;

  if(item.task){
    const key = "row:"+rowId;
    /* A collapsed Day-view row is narrow on purpose — no acts until it's
       the open card. */
    let acts = null;
    if(!opts.compact && !item.isBreak && isOpen){
      acts = el("div","acts-inline");
      if(item.card && hasDetail(item.card)){
        const shut = !S.expanded.has(key);
        const info = el("button","mini info", shut ? "▾" : "▴");
        info.setAttribute("aria-label", shut ? "Show details" : "Hide details");
        info.addEventListener("click", e=>{
          e.stopPropagation();
          if(shut) S.expanded.add(key); else S.expanded.delete(key);
          render();
        });
        acts.appendChild(info);
      }
      /* A row exploded from a brick (item.cards set — see agenda()) has to
         edit that shared event's description rather than own a whole event
         of its own; a plain single-card/session row keeps calling the
         original functions unchanged. Swap's outCard param already exists
         for exactly this: undefined for a non-brick row falls back to
         item.card.id inside swapPicker, same as always. */
      const ok = el("button","mini ok","✓");
      ok.title = "Done"; ok.setAttribute("aria-label","Done");
      ok.addEventListener("click", e=>{ e.stopPropagation(); item.cards ? completeItemInBrick(item, item.card) : completeItem(item); });
      acts.appendChild(ok);
      const btns = [ok];
      const sw = el("button","mini swap","⇄");
      sw.title = "Swap"; sw.setAttribute("aria-label","Swap task");
      sw.addEventListener("click", e=>{ e.stopPropagation(); swapPicker(item, item.cards ? item.card : undefined); });
      if(isLockedItem(item)){ sw.disabled = true; sw.title = "Only today and tomorrow can be scheduled."; }
      acts.appendChild(sw); btns.push(sw);
      if(item.card){
        const pd = el("button","mini pend","⏱");
        pd.title = "Waiting on something else — clears today's block, keeps the card open";
        pd.setAttribute("aria-label","Set pending");
        pd.addEventListener("click", e=>{ e.stopPropagation(); pendingDialog(item); });
        acts.appendChild(pd); btns.push(pd);
      }
      const dl = el("button","mini del","✕");
      dl.title = "Remove"; dl.setAttribute("aria-label","Remove");
      dl.addEventListener("click", e=>{ e.stopPropagation(); item.cards ? removeFromBrick(item, item.card) : removeItem(item); });
      acts.appendChild(dl); btns.push(dl);
      /* A brick task's own pending state is tracked by card id (see
         completeItemInBrick/doRemoveFromBrick — two siblings must be
         actionable independently), a plain row's by its event id. */
      if(S.pending.has(item.cards ? item.card.id : item.ev.id)) btns.forEach(b=>b.disabled=true);
    }
    wrap.appendChild(r);
    /* Time now lives on the card's one main row (see r above) rather than
       here — row-meta is left with only the due-date chip and, once open,
       the action buttons, so it's skipped entirely when neither applies
       (a collapsed, non-due card has nothing left to say on a second
       line). Chips left, actions right when both are present. */
    if(stack){
      status = isOpen ? ("status" in opts ? opts.status : itemStatusText(item)) : null;
      const dueChip = isOpen && item.card && item.card.due
        ? el("span","chip "+dueChipClass(item.card), fmtShortDate(item.card.due)) : null;
      if(dueChip || acts){
        const meta = el("div","row-meta");
        if(dueChip){
          const chipRow = el("div","meta-chips");
          chipRow.appendChild(dueChip);
          meta.appendChild(chipRow);
        }
        if(acts) meta.appendChild(acts);
        wrap.appendChild(meta);
      }
    }
    if(isOpen && !opts.compact && item.card && hasDetail(item.card) && S.expanded.has(key)){
      const panel = detailPanel(item.card);
      if(panel){ wrap.appendChild(panel); wrap.classList.add("expanded"); }
    }
    {
      wireStackDrag(wrap, item, rowId);
      /* Tapping a collapsible row opens it (closing whichever other row was
         open — S.openRow holds at most one id); tapping the open one again
         collapses it back. Every real control inside the open card
         (Done/Swap/Pending/Remove, the ▾ toggle) already stops propagation
         on its own click, so this only ever fires for a tap on the card
         itself — and wireStackDrag's own capturing click-guard already
         swallows the click a real drag ends on, so a drag never toggles it. */
      if(collapsible){
        wrap.addEventListener("click", ()=>{
          if(S.pending.has(item.cards ? item.card.id : item.ev.id)) return;
          S.openRow = (S.openRow === rowId) ? null : rowId;
          render();
        });
      }
    }
  }else{
    if(!opts.compact){
      const open = permeable(item.ev);
      const t = el("button","mini" + (open ? " on" : ""), open ? "⊙" : "⊘");
      t.title = open ? "Tasks may run inside" : "Blocks tasks";
      t.setAttribute("aria-label", t.title);
      t.addEventListener("click", e=>{ e.stopPropagation(); toggleOpenEvent(item.ev.summary); replan(); });
      const acts = el("div","acts-inline"); acts.appendChild(t); r.appendChild(acts);
    }
    wrap.appendChild(r);
  }

  if(!stack){
    wrap.style.top = ((item.s - winS) * ppm) + "px";
    wrap.style.height = Math.max(20, (item.e2 - item.s) * ppm) + "px";
    return wrap;
  }

  /* the status eyebrow (Doing now / Starting in X) reads as a label
     floating above the card, not a row inside it — nowCard (the hub) is
     just this same stack-mode card with opts.hub set and its own status
     string passed in (On it / Still open / Up next / First up covers
     cases itemStatusText doesn't: a day that isn't today, or a slot
     that's already passed but is still the hub because nothing else is
     open). ".hub" on .item-top is the one CSS hook that scales the
     eyebrow to match — no separate hub markup to keep in sync by hand.

     Stack mode's time now lives INSIDE the card (2026-08-27 — see the
     `rowLead` call above and the .time-row CSS), not in a separate rail
     column to its left — hub included, same component, same in-card badge. */
  const cardCol = el("div","card-col");
  /* Card first, status column second — the eyebrow now sits to the card's
     right rather than stacked above it, so the DOM order matches. */
  cardCol.appendChild(wrap);
  if(status){
    const top = el("div","item-top" + (isHub ? " hub" : ""));
    top.appendChild(el("span","eyebrow",status));
    if(!item.card && !item.ev.mine) top.appendChild(el("span","chip","external"));
    cardCol.appendChild(top);
  }

  const timeRow = el("div","time-row" + (isHub ? " hub" : ""));
  /* Uniform rows (2026-08-26 redesign) — replaces the true-to-scale
     top/height set here since 2026-08-25. Rows are back in normal flow:
     no top, no height, no toY, no push. A card is as tall as its own
     content and no taller, and duration is stated as TEXT in the rail
     rather than encoded as pixels.

     Why the proportional version had to go: at TL_PPM_DAY (~0.99px/min) a
     15-min task was ~15px, floored to CARD_MIN_HEIGHT — so four
     back-to-back quarter-hour tasks claimed 112px of a 60px span, and
     pushForFloor resolved the overlap by shoving every later row down.
     The hour gutter was drawn from the UNPUSHED toY, so cards and their
     own hour labels drifted apart by exactly the accumulated push
     (confirmed live: a 10:00 meeting rendering level with the 10:20 mark).
     Meanwhile a 5h meeting got ~300px of empty colour while the four
     things you'd actually act on were crushed into a strip.
     Proportional height is what a CALENDAR does; Daisey is a focus widget
     whose whole premise is that the current task dominates. The hero keeps
     that role; the list below is now a list. */
  if(opts.indent) timeRow.classList.add("indent");
  timeRow.dataset.min = item.s;
  timeRow.dataset.dur = item.e2 - item.s;
  timeRow.appendChild(cardCol);
  return timeRow;
}

/* Drag-to-reorder for the Day-view list — the hub card included, since
   it's just the topmost of these now. Position:static, so this isn't
   pixel/time math: pick the card up, follow the pointer
   with a transform, and land it on whatever row the pointer is over. Hub
   and list rows aren't literal DOM siblings, so the order is collected by
   query instead of a sibling walk. Dropping on one calls pushReorder(),
   which shifts every card between the old and new position over by one
   slot rather than just trading times with whatever's under the pointer;
   dropping on empty space or a meeting is a no-op.

   Every row between the dragged card's original slot and wherever it's
   currently hovering gets pushed to its own new rest position — one slot
   toward the gap the drag opened — so letting go visibly *is* where
   everything lands. That push moves rows away from the pointer, though —
   so hit-testing can't be a live elementFromPoint (it'd immediately see
   through to whatever the push just uncovered and lose the target).
   Instead every row's un-pushed rect is snapshotted once at pickup and
   reused for the rest of the drag. */
function wireStackDrag(wrap, item, rowId){
  if(!item.task || isLockedItem(item)) return;   // meetings hold their slot; only today and tomorrow can be rebuilt
  /* rowId (evId+":"+cardId for a task exploded out of a brick, plain evId
     otherwise — see timelineItem/agenda) is what dataset.rowId and every
     downstream lookup key off; two sibling rows can share one evId, so the
     old dataset.evId alone would have let them collide with each other in
     pushReorder's own id lookups. */
  wrap.dataset.rowId = rowId;
  /* wrap (.item.stack) is what the pointer actually touches and what shows
     the drag styling, but the thing that has to MOVE is its whole
     .time-row — wrap's own .item-top eyebrow sibling (inside .card-col)
     carries status text that must travel with it, and a transform on wrap
     alone would leave it behind while the card slid away. dragEl is
     resolved fresh on each pointerdown (never cached at wire-time) since
     paintMain only finishes assembling .time-row around wrap before any
     real interaction can start. */
  let startY=0, startX=0, dragging=false, moved=false, order=[], originIdx=-1, targetIdx=-1, pushed=[], dragEl=wrap;
  let armTimer=null, pendingId=null, armed=false;
  /* Registered once, non-passive, for the life of the card: Chrome defaults
     touchmove to passive on mobile, where preventDefault() is ignored with a
     console warning, so this cannot be added lazily on arm without the first
     (decisive) move already having gone through as passive. It no-ops until
     the hold arms. */
  const onTouchMove = e => { if(armed) e.preventDefault(); };
  wrap.addEventListener("touchmove", onTouchMove, { passive:false });
  const eligible = e => !e.target.closest(".mini, .details, a");
  const pendingKey = item.cards ? item.card.id : item.ev.id;
  /* A touch that starts on a card used to arm the drag immediately
     (setPointerCapture on pointerdown), which claims the gesture from the
     browser before it can tell a scroll from a drag — a finger swiping
     down the list to scroll got dragged instead the moment it touched a
     card, with no way to just scroll past one. Real reorders are a
     deliberate press-and-hold; a scroll is a prompt swipe. So arming now
     waits ARM_MS with the finger roughly still before it captures the
     pointer at all — a swipe that moves past the threshold first cancels
     arming outright and the browser's own pan-y handles it as a normal
     scroll, untouched.

     **Dragging a card by touch was completely broken until 2026-08-24, and
     the cause is subtle enough to be worth spelling out.** `.item.stack`
     ships `touch-action:pan-y` so a swipe can still scroll the list. pan-y
     means the browser owns vertical panning — so the moment the finger moved
     down, it claimed the gesture and fired **pointercancel**, killing the
     drag a frame after it armed. Every time, on every touch device.
     `setPointerCapture` does not protect against this: the browser's scroll
     claim outranks it. Observed via CDP touch events:
     `pointerdown | pointermove | pointercancel`.
     Two fixes were tried and did NOT work, both plausible:
       1. `user-select:none` — blamed the native long-press text selection.
          Real nuisance, wrong bug; the drag stayed dead. (Kept, it's still
          worth having.)
       2. Flipping `wrap.style.touchAction = "none"` when the hold arms.
          The style *does* apply (verified: computed touch-action reads
          "none" after the hold) but Chrome latches the touch-action value at
          **touchstart** and ignores changes for the rest of that gesture, so
          pointercancel still fired. Mid-gesture touch-action is a dead end —
          don't try it a third time.
     What actually works is `preventDefault()` on a non-passive `touchmove`
     once the hold has armed: that is the documented way to take a gesture
     back from the browser's scroller mid-touch. The listener has to be
     registered `{passive:false}` (Chrome defaults touchmove to passive on
     mobile, where preventDefault is silently ignored) and only swallows the
     event while `armed` is true, so an un-armed swipe still scrolls
     normally. */
  const ARM_MS = 160, ARM_SLOP = 10;
  function clearArm(){
    if(armTimer){ clearTimeout(armTimer); armTimer = null; }
    wrap.removeEventListener("pointermove", onPreMove);
    wrap.removeEventListener("pointerup", onPreUp);
    wrap.removeEventListener("pointercancel", onPreCancel);
  }
  /* a swipe that never armed, or a tap, must leave scrolling alone */
  function disarm(){ armed = false; clearArm(); }
  function onPreMove(e){
    if(Math.abs(e.clientY-startY) > ARM_SLOP || Math.abs(e.clientX-startX) > ARM_SLOP) clearArm();
  }
  function onPreUp(){ disarm(); }
  function onPreCancel(){ disarm(); }
  function arm(e){
    dragEl = wrap.closest(".time-row") || wrap;
    /* a nest (a meeting's own children — see groupForStack and paintMain's
       standalone nest for an active meeting) is its own visually separate
       group, dashed off from the main list on purpose — dragging within it
       must not sweep in the hub or the main "Later today" run, and dragging
       the hub or a main-list card must not reach into a nest either, or a
       long drag ends up silently reordering cards several dashed groups
       away from what the pointer was ever over. */
    const myNest = wrap.closest(".nest");
    const pool = myNest
      ? [...myNest.querySelectorAll(".item.stack:not(.meeting)")]
      : [...document.querySelectorAll(".item.stack:not(.meeting)")].filter(el => !el.closest(".nest"));
    /* The current task is in the DOM TWICE — once as the hero in #heroSlot,
       once as currentMarker inside the timeline — and both carry the same
       dataset.rowId, so an unfiltered pool holds two entries for one task.
       That made `order` disagree with reality in two ways: findIndex(o.el
       === dragEl) could resolve to whichever copy wasn't being dragged, and
       orderIds carried a duplicate id into pushReorder's sequence. Keep the
       copy actually being dragged, else the first — one entry per real
       task, which is what every consumer here assumes. */
    const seen = new Map();
    for(const el of pool){
      if(!el.dataset.rowId) continue;
      const row = el.closest(".time-row") || el;
      /* Whichever copy is actually under the pointer wins, so originIdx can
         always find itself; otherwise first-seen. Dragging the hero and
         dragging the marker are both real (the marker keeps its drag
         wiring on purpose — see currentMarker), and the pool must contain
         the one being dragged either way. */
      if(seen.has(el.dataset.rowId) && row !== dragEl) continue;
      const r = row.getBoundingClientRect();
      seen.set(el.dataset.rowId, { el:row, id:el.dataset.rowId, top:r.top, bottom:r.bottom });
    }
    order = [...seen.values()].sort((a,b) => a.top - b.top);
    originIdx = order.findIndex(o => o.el === dragEl);
    targetIdx = originIdx;
    /* the hold proved intent — from here every touchmove is ours, and
       swallowing it is what stops the browser scrolling the list out from
       under the drag (see the note above for what doesn't work) */
    armed = true;
    wrap.setPointerCapture(pendingId);
    wrap.addEventListener("pointermove", onMove);
    wrap.addEventListener("pointerup", onUp, { once:true });
    wrap.addEventListener("pointercancel", onCancel, { once:true });
  }
  function onDown(e){
    if(!eligible(e) || S.pending.has(pendingKey)) return;
    startY = e.clientY; startX = e.clientX; dragging = false; pendingId = e.pointerId;
    wrap.addEventListener("pointermove", onPreMove);
    wrap.addEventListener("pointerup", onPreUp, { once:true });
    wrap.addEventListener("pointercancel", onPreCancel, { once:true });
    armTimer = setTimeout(()=>{ armTimer = null; clearArm(); arm(e); }, ARM_MS);
  }
  function clearPush(){
    for(const o of pushed){ o.el.classList.remove("drop-target"); o.el.style.transform = ""; }
    pushed = [];
  }
  /* rows between origin and the new target each slide one slot toward the
     gap the drag opened — toward origin's old rect if dragging down past
     them, toward the far end if dragging up past them */
  function applyPush(idx){
    clearPush();
    if(idx === originIdx || idx < 0) return;
    if(idx > originIdx){
      for(let i=originIdx+1;i<=idx;i++){
        const o = order[i], prev = order[i-1];
        o.el.style.transform = `translateY(${prev.top - o.top}px)`;
        o.el.classList.add("drop-target");
        pushed.push(o);
      }
    }else{
      for(let i=idx;i<originIdx;i++){
        const o = order[i], next = order[i+1];
        o.el.style.transform = `translateY(${next.top - o.top}px)`;
        o.el.classList.add("drop-target");
        pushed.push(o);
      }
    }
  }
  function onMove(e){
    const dy = e.clientY - startY, dx = e.clientX - startX;
    if(!dragging){
      if(Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
      dragging = true; moved = true; S.dragBusy = true;
      wrap.classList.add("stack-dragging");
      dragEl.classList.add("time-row-dragging");
    }
    dragEl.style.transform = `translateY(${dy}px)`;
    /* Rows no longer tile the column edge-to-edge — .rows.stack is a flex
       column with a real gap between cards (2026-08-26 uniform rows), so a
       strict top<=y<bottom test drops the pointer into the dead space
       between every pair of rows and reports "no target". Widen each row's
       catchment by half the gap on each side, which closes the seam without
       claiming anything beyond it: a pointer over a MEETING (never in
       `order` — meetings are not a drop target) or past the end of the list
       must still resolve to no target, so a plain nearest-row fallback is
       wrong here, not merely loose. */
    const SEAM = ROW_GAP_PX / 2 + 1;
    const hitIdx = order.findIndex(o => e.clientY >= o.top - SEAM && e.clientY < o.bottom + SEAM);
    const next = hitIdx < 0 ? originIdx : hitIdx;
    if(next !== targetIdx){ targetIdx = next; applyPush(targetIdx); }
  }
  function cleanup(){
    wrap.removeEventListener("pointermove", onMove);
    wrap.classList.remove("stack-dragging");
    dragEl.classList.remove("time-row-dragging"); dragEl.style.transform = "";
    /* hand scrolling back to the browser, or the list stops panning by touch
       anywhere this card sits */
    armed = false;
    clearPush(); S.dragBusy = false;
  }
  function onUp(){
    const target = (targetIdx >= 0 && targetIdx !== originIdx) ? order[targetIdx] : null;
    const orderIds = order.map(o => o.id);
    cleanup();
    if(dragging && target) pushReorder(orderIds, rowId, target.id);
    setTimeout(()=>{ moved = false; }, 0);
  }
  function onCancel(){ cleanup(); moved = false; }
  wrap.addEventListener("pointerdown", onDown);
  wrap.addEventListener("click", e => { if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* Commits a drag/resize: validate, patch the block's time locally so
   render() shows the new slot immediately, and let the Google Calendar
   write land in the background (applyLocalMove/commitMove) — waiting on
   that round trip before the UI moved on is what made dragging feel slow.
   The block's prior slot is kept as the one undoable move — Ctrl+Z or the
   popup's Undo button puts it straight back.
   Same meeting rule as planFor/postpone/push: a session (item.ev.deep) may
   never land inside a meeting, permeable or not; a quick task may still
   skip a permeable one. Drag had no such check until now, so a session
   dragged onto a permeable meeting (חמל and friends) would happily commit —
   this closes that gap rather than only preventing the scheduler from
   doing it itself.
   Also rejects landing on a locked day, so the destination gets its own
   check here regardless of what started the move. */
function rescheduleTo(item, start, end){
  if(S.pending.has(item.ev.id)) return;
  if(isLockedDay(start)){ toast("Only today and tomorrow can be scheduled.", true); render(); return; }
  const date = startOfDay(start);
  const s = minsOf(start), e = minsOf(end);
  const busy = busyFor(date, item.ev.id, item.ev.deep);
  if(busy.some(b => s < b.e && e > b.s)){
    toast(item.ev.deep ? "Sessions can't run inside a meeting or another block." : "That slot's already taken.", true);
    render();
    return;
  }
  const prevStart = item.ev.start, prevEnd = item.ev.end;
  const prevRaw = applyLocalMove(item.ev.id, start, end);
  S.lastMove = [{ id:item.ev.id, start:prevStart, end:prevEnd }];
  render();
  showUndoPopup(`→ ${fmtRange(start,end)}`);
  commitMove(item.ev.id, start, end, prevRaw);
}

/* Drag-to-reorder in the Day-view list: dropping a card among others pushes
   the whole run of cards between its old and new position over by one
   slot — the vacated slot closes, a new one opens where it lands, same as
   sliding a run of items along a shelf. Each card keeps its own duration;
   the affected run's outer boundary (earliest start of the topmost slot in
   play) doesn't move, only what's sitting in each slot inside it does. It
   used to just trade times with whatever it landed on, which only reads as
   "moving this card here" when there happen to be exactly two cards
   involved — a real reorder is what the gesture actually implies once
   there's a longer run of cards on screen.
   Same collision rule as rescheduleTo, checked per card with the whole
   moving run ignored (every card in it is vacating its own slot). Also
   rejected if the repacked run would spill outside the day window.
   Meetings are never a party to this — wireStackDrag doesn't wire them as
   draggable or as a drop target, their time is a real commitment, so they
   just get stepped over in the run without being touched.
   Optimistic like rescheduleTo: every affected card's time is patched
   locally and shown before any of the writes lands, and each write then
   goes out in the background rather than being waited on one at a time. */
/* Row-level model for the reorder: one entry per Day-list row (see
   agenda()'s explode), not per event — two rows can share one evId when
   they're siblings inside the same brick. dur is CFG.quickTotal for a
   quick row (its fixed per-task slice, same value planFor sizes a brick
   window with) and the event's own real duration otherwise. Order is
   irrelevant here (a plain id->row Map) — pushReorder's own orderIds,
   built from the drag's live DOM snapshot, is what carries sequence. */
function reorderRows(){
  return agenda()
    .filter(i => i.task && !i.isBreak && !isLockedItem(i))
    .map(i => ({
      rowId: i.card ? i.ev.id+":"+i.card.id : i.ev.id,
      evId: i.ev.id, card: i.card, isQuick: !i.ev.deep,
      dur: i.ev.deep ? (minsOf(i.ev.end)-minsOf(i.ev.start)) : CFG.quickTotal
    }));
}
/* Rewrites/creates/deletes whatever real events a repacked row range now
   implies, given each row's NEW s/en (minutes-of-day) from the caller.
   Consecutive quick rows that land back-to-back merge into one event
   (auto-brick, same "adjacent quick tasks share a window" rule planFor
   already applies); a quick row with no adjacent quick neighbor gets its
   own single-task event; a non-quick row is always its own event, moved
   in place exactly like today. Returns { undo, label } — undo is a single
   closure that reverts every write this call queued (local patch +
   background commit), matching the one-shot-Ctrl+Z contract the rest of
   the drag/push machinery already promises; label is the undo-popup text.
   Returns null if nothing actually needs to change (dropped back where it
   started). */
function relayRows(date, laidRows){
  /* A quick row with no resolved card (a board-poll blip — see CLAUDE.md's
     "trelloReadCard has been seen coming back with a card missing" note —
     or a genuinely broken Original: link) must never silently drop that
     task out of whatever event gets written next: relayRows only ever
     writes a run's card list, so an unresolved row would just vanish from
     the rewritten description instead of erroring. Bail out before any
     write is queued rather than risk that. A non-quick row's own card
     resolution failing doesn't matter here — the "move" branch never reads
     .card at all, it only retimes the event by id. */
  if(laidRows.some(r => r.isQuick && !r.card)) return { error:true };
  const runs = [];
  for(const r of laidRows){
    const last = runs[runs.length-1];
    if(r.isQuick && last && last.isQuick && last.rows[last.rows.length-1].en === r.s){
      last.rows.push(r); last.en = r.en;
    }else{
      runs.push({ isQuick:r.isQuick, s:r.s, en:r.en, rows:[r] });
    }
  }
  /* Every OLD event a QUICK row in this drag came from, and which of its
     cards (if any) survive unchanged in some run above — an event whose
     full card set reappears together, in the same order, in one run needs
