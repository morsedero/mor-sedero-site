  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc) 35%,var(--line-2) 65%);
  transition:background .18s ease,box-shadow .18s ease;
}
.lock-choice .lc-icon{font-size:20px;line-height:1;display:block;transform:scale(1);}
.lock-choice .lc-label{font-family:var(--font-body);font-weight:800;font-size:9.5px;}
.lock-choice:hover{border-color:var(--ink-3);transform:translateY(-2px);}
.lock-choice:hover .lc-badge{
  background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--cc) 55%,white) 0%,var(--cc) 72%);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,255,255,.5),0 0 8px 2px var(--cc-glow),0 0 0 2px var(--cc);
}
.lock-choice:active{transform:scale(.94);}
.lock-choice:disabled{cursor:default;opacity:.7;}
.lock-choice:disabled:hover{transform:none;}
.lock-choice.sel{background:color-mix(in srgb,var(--cc) 26%,var(--surface) 74%);border-color:var(--cc);color:var(--ink);}
.lock-choice.sel:hover{transform:translateY(-2px);}
.lock-choice.sel .lc-badge{
  background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--cc) 55%,white) 0%,var(--cc) 72%);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,255,255,.5),0 0 0 3px var(--cc-glow);
}
@keyframes lc-icon-in{
  0%{transform:scale(1) rotate(0deg);}
  35%{transform:scale(1.3) rotate(-14deg);}
  65%{transform:scale(1.12) rotate(10deg);}
  100%{transform:scale(1.18) rotate(0deg);}
}
@keyframes lc-icon-out{
  0%{transform:scale(1.18) translateY(0);}
  45%{transform:scale(.88) translateY(2px);}
  75%{transform:scale(1.06) translateY(-1px);}
  100%{transform:scale(1) translateY(0);}
}
@keyframes lc-click-flash{
  0%{filter:brightness(1.7) saturate(1.4);transform:scale(1.12);}
  100%{filter:brightness(1) saturate(1);transform:scale(1);}
}
.lock-choice .lc-badge.flash{animation:lc-click-flash .4s ease-out;}
.lock-choice .lc-icon.hover-in{animation:lc-icon-in .32s cubic-bezier(.34,1.56,.64,1) forwards;}
.lock-choice .lc-icon.hover-out{animation:lc-icon-out .4s ease-out forwards;}
.lock-square{
  width:100%;margin-top:4px;padding:18px 0;
  border-radius:20px;border:1.5px solid var(--accent-ink);background:var(--accent);color:var(--on-accent);
  font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:filter .12s ease,transform .12s ease;
}
.lock-square:hover{filter:brightness(1.06);}
.lock-square:active{transform:scale(.98);}
.lock-square:disabled{background:var(--surface-2);border-color:var(--line-2);color:var(--ink-3);cursor:not-allowed;}
.lock-square:disabled:hover{filter:none;}

.lock-confirm-scrim{z-index:64;background:rgba(10,10,20,.78);}
.lock-confirm-box{
  width:min(340px,84vw);
  background:var(--glass-2,var(--surface));border:1.5px solid var(--crit);border-radius:26px;
  box-shadow:var(--shadow-lg);padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:20px;
}
@media (prefers-reduced-motion:no-preference){.lock-confirm-box{animation:pop .2s cubic-bezier(.2,.9,.3,1);}}
.lock-confirm-text{
  font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-size:23px;text-align:center;line-height:1.25;
  background:linear-gradient(135deg,var(--crit) 0%,var(--accent-ink) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media (prefers-reduced-motion:no-preference){
  .lock-confirm-text{animation:lockwiggle .5s ease-in-out;}
  @keyframes lockwiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-2deg);}75%{transform:rotate(2deg);}}
}
.lock-confirm-btns{display:flex;gap:14px;width:100%;}
.lock-confirm-square{
  flex:1 1 0;aspect-ratio:1/1;border-radius:18px;
  font-family:var(--font-display);font-weight:800;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border:1.5px solid;
  transition:filter .12s ease;
}
.lock-confirm-square.yes{background:var(--done);border-color:#178C46;color:#fff;}
.lock-confirm-square.yes:hover{filter:brightness(1.06);}
.lock-confirm-square.whoopsy{background:var(--surface-2);border-color:var(--line-2);color:var(--ink-2);}
.lock-confirm-square.whoopsy:hover{background:var(--surface);color:var(--ink);}

/* settings — sized to fit the viewport in one screen rather than a fixed
   600px, so it only ever scrolls internally as a last resort on a genuinely
   short window; the grid row layout keeps every value lined up in one
   column instead of drifting with each label's own width. */
.dialog.sheet{
  max-width:min(420px,90vw);
  max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 36px);
  display:flex;flex-direction:column;
}
.set{padding:12px 18px 4px;display:flex;flex-direction:column;gap:0;overflow-y:auto;min-height:0;flex:1 1 auto;}
.set-h{
  font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--bc,var(--accent-ink));margin:8px 0 2px;padding-top:6px;border-top:1.5px dashed var(--line);
}
.set-h:first-child{margin-top:0;padding-top:0;border-top:none;}
.set-row{
  display:grid;grid-template-columns:104px 1fr;align-items:center;
  gap:10px;padding:6px 0;font-size:12.5px;font-weight:700;
}
/* .set-row is normally a <label>; .set-link reuses its grid/spacing but is a
   real button — Boards & calendar, the one row here that navigates instead
   of editing a value in place. */
.set-row.set-link{
  width:100%;text-align:start;border:none;background:none;cursor:pointer;
  font:inherit;color:inherit;border-radius:10px;
  padding:4px 0 8px;margin-bottom:2px;border-bottom:1.5px dashed var(--line);
}
.set-row.set-link:hover{background:var(--surface-2);}
.set-link-go{color:var(--accent-ink);font-weight:800;justify-self:end;}
/* the swatch row skips the label column entirely — "Colour" is already said
   by the section header above it, and on a narrow phone that 104px back was
   the difference between three swatches fitting on one line or wrapping to
   two and roughly doubling the row's height */
.set-row.tall{grid-template-columns:1fr;align-items:flex-start;padding-top:4px;}
.set-k{color:var(--ink-2);white-space:nowrap;}
.set-v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.set-dash,.set-u{font-family:var(--mono);font-size:11px;color:var(--ink-3);}
/* 732px, not 700: pixel-short's real viewport is 732px tall, and until the
   Boards & calendar row was added it happened to fit without needing this
   query's help at all — its own .set had zero deficit. The extra row tipped
   it over, and 700px was too narrow a threshold to catch it: the query
   simply never applied there, so none of these trims were reaching the one
   device that turned out to need them. */
@media (max-height:732px){
  .dialog.sheet .set{padding-top:8px;}
  .dialog.sheet .set-row{padding-top:2px;padding-bottom:2px;}
  .dialog.sheet .set-h{font-size:10px;margin-top:2px;margin-bottom:0;padding-top:2px;}
  .dialog.sheet .df{padding-top:6px;padding-bottom:6px;}
  .dialog.sheet .set-row.set-link{padding:2px 0 5px;margin-bottom:0;}
  .dialog.sheet .legend{margin:1px 0;font-size:11px;}
  .dialog.sheet .load-table td{padding:1px 0;}
  .dialog.sheet .load-table th{padding-bottom:1px;}
  .dialog.sheet .set{padding-top:6px;padding-bottom:2px;}
}
/* Quick Task / Session, each a length + a per-day cap — a plain table
   lines the two numbers up under their own headers instead of a set-row
   repeating a generic "Max Per Day" label per type. */
.load-table{width:100%;border-collapse:collapse;margin:0 0 2px;table-layout:fixed;}
.load-table th{
  font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 0 2px;
}
.load-table th:first-child{width:38%;}
.load-table td{padding:3px 0;border-top:1px solid var(--line-soft);vertical-align:middle;}
.lt-k{font-size:12.5px;font-weight:700;color:var(--ink-2);}
.lt-v{display:inline-flex;align-items:center;gap:5px;}
.load-table .num-in{width:44px;padding:4px 5px;font-size:12px;}
.num-in{
  width:54px;padding:7px;border-radius:12px;
  border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;
}
.num-in.wide{width:80px;text-align:left;}
.num-in.wide[type="time"]{width:108px;}
.num-in:focus{border-color:var(--accent);outline:none;}
.col-in{
  width:34px;height:28px;padding:0;border:1.5px solid var(--line-2);
  border-radius:12px;background:transparent;cursor:pointer;
}
.col-in::-webkit-color-swatch-wrapper{padding:2px;}
.col-in::-webkit-color-swatch{border:0;border-radius:8px;}
.toggle{
  padding:6px 14px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
  font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  transition:background .15s,color .15s,border-color .15s;
}
.toggle.on{background:var(--accent);border-color:var(--accent-ink);color:var(--on-accent);}
.set .legend{font-size:11.5px;font-weight:600;line-height:1.4;color:var(--ink-3);padding:1px 0 3px;}
.set .legend b{font-weight:800;}
/* three board swatches side by side instead of one row each — the biggest
   single space saving in the panel, since colour is rarely touched */
.set-v.swatches{gap:16px;row-gap:10px;}
.swatch-card{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;}
.swrow{display:flex;align-items:center;gap:4px;}
/* rank badge: the number *is* the priority order, sitting right on the
   swatch it belongs to rather than a legend the reader has to cross-reference */
.prio-num{
  position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);border:1.5px solid var(--surface);
  font-size:9px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.swname{
  font-size:9.5px;font-weight:700;color:var(--ink-3);max-width:60px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* the colour row doubles as the priority control — drag a swatch to
   reorder (see renderSwatches/wireSwatchDrag). touch-action:none stops the
   sheet scrolling under a drag instead of the card following the pointer;
   pointer-based, not native HTML5 DnD, since DnD never fires on touch and
   this app is phone-first. */
.swatch-card.draggable{cursor:grab;touch-action:none;}
.swatch-card.draggable.dragging{cursor:grabbing;opacity:.85;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
.chore-set{display:flex;flex-direction:column;gap:8px;width:100%;}
.chore-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chore-name{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2);min-width:88px;}
.chore-days{display:flex;gap:4px;flex-wrap:wrap;}

/* pending popup: reuses .details' textarea/checklist styling, just needs
   its own scroll box and no redundant top border under the dialog header */
.pending-edit{margin-top:0;border-top:none;padding:0 19px 4px;max-height:52vh;overflow:auto;}
.pending-edit .edit-row{margin-bottom:10px;}
.pending-edit .clname:first-of-type{margin-top:0;}
.until-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;
  font-size:13px;font-weight:700;color:var(--ink-2);
}
.until-row label{display:flex;align-items:center;gap:8px;}
.until-in{
  font:inherit;font-weight:700;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:10px;padding:5px 8px;
}
.until-row .muted{font-weight:600;flex-basis:100%;}

.pick{padding:8px 10px 4px;max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:3px;}
.pick-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 11px;border-radius:16px;border:1.5px solid transparent;
  background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink);
  transition:background .14s,border-color .14s;
}
.pick-row:hover{background:var(--bc-soft,var(--surface-2));border-color:var(--bc,var(--line-2));}
.pick-row .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--bc,var(--b-none));}
.pick-row .n{flex:1 1 auto;min-width:0;overflow:hidden;text-align:right;}
.pick .muted{padding:14px;text-align:center;color:var(--ink-3);font-size:13px;}

/* ---- first-run setup wizard ---- */
.setup-q{margin:6px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);}
.setup-note{margin:2px 2px 10px;font-size:11.5px;line-height:1.45;}
.setup-board{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:14px;border:1.5px solid transparent;
  transition:background .14s,border-color .14s;
}
.setup-board.on{background:var(--accent-soft);border-color:var(--accent-line);}
.setup-tick{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;cursor:pointer;
  border:1.5px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--on-accent);
}
.setup-board.on .setup-tick{background:var(--accent);border-color:var(--accent-ink);}
.setup-bn{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:700;}
.setup-trk{flex:0 0 auto;padding:4px 9px;font-size:9.5px;}
.setup-trk:disabled{opacity:.35;cursor:default;}
.pick-row.on{background:var(--accent-soft);border-color:var(--accent-line);}
.setup-days{display:flex;flex-wrap:wrap;gap:4px;padding:2px 2px 6px;}
.setup-err{flex:1 1 auto;min-width:0;font-size:12px;font-weight:700;color:var(--crit);text-align:start;overflow-wrap:anywhere;}

/* pointer-events:none on the CONTAINER, auto on the toasts themselves: it's
   a full-width fixed strip across the bottom of the screen, so without this
   it silently swallows every tap and touch-drag that lands under it, even
   where no toast is actually drawn. Found when a card anchored to its real
   hour ended up beneath the strip and stopped responding to touch at all —
   the container is invisible, so the card simply read as broken. */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;}
.toasts > *{pointer-events:auto;}
.toast{
  background:var(--glass-2,var(--surface));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:99px;padding:9px 18px;font-size:13px;font-weight:700;
}
.toast.err{border-color:var(--crit);color:var(--crit);}
.toast.undo{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 18px;}
.toast.undo .undo-msg{white-space:nowrap;}
.toast.undo .undo-btn{
  border:none;background:var(--accent);color:var(--on-accent);cursor:pointer;
  font-family:var(--font-body);font-size:12.5px;font-weight:800;
  padding:7px 14px;border-radius:99px;
}
.toast.undo .undo-x{
  border:none;background:transparent;color:var(--ink-3);cursor:pointer;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  transition:background .14s,color .14s;
}
.toast.undo .undo-x:hover{background:var(--surface-2);color:var(--ink);}
/* writes that ran out of retries — same shape as the undo popup, but it
   doesn't time out: it stays until the work is either saved or given up on */
.toast.unsaved{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 18px;border-color:var(--crit);color:var(--crit);}
.toast.unsaved .undo-btn{border:none;background:var(--crit);color:#fff;cursor:pointer;
  font-family:var(--font-body);font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:99px;}
.toast.unsaved .undo-x{border:none;background:transparent;color:var(--crit);cursor:pointer;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .24s cubic-bezier(.2,.9,.3,1);}
  @keyframes tin{from{transform:translateY(10px);opacity:0;}}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;}

/* A quick daisy-themed dopamine hit on every completed task — see
   dopamineBurst(). Fixed top-center, non-interactive, self-removing. */
.dopamine-pop{
  position:fixed;top:14px;left:50%;transform:translate(-50%,0);z-index:95;
  display:flex;align-items:center;gap:12px;max-width:min(92vw,380px);
  background:var(--card);border:1.5px solid var(--line-soft);border-radius:20px;
  box-shadow:var(--shadow-lg);padding:12px 18px 12px 12px;pointer-events:none;
}
.dopamine-daisy{flex:0 0 auto;width:46px;height:46px;}
.dopamine-text{min-width:0;}
.dopamine-lead{font-family:var(--font-display);font-weight:800;font-size:12px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px;}
.dopamine-msg{font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.35;}
@media (prefers-reduced-motion:no-preference){
  .dopamine-pop{animation:dpIn .32s cubic-bezier(.2,.9,.3,1);}
  .dopamine-pop.out{animation:dpOut .28s ease forwards;}
  .dopamine-daisy.bob{animation:dpBob 1.1s ease-in-out infinite;}
  .dopamine-word{display:inline-block;opacity:0;animation:dpWord .34s ease forwards;}
}
@media (prefers-reduced-motion:reduce){
  .dopamine-pop.out{opacity:0;transition:opacity .28s ease;}
}
@keyframes dpIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94);}}
@keyframes dpOut{to{opacity:0;transform:translate(-50%,-10px) scale(.96);}}
@keyframes dpBob{0%,100%{transform:rotate(-5deg) translateY(0);}50%{transform:rotate(5deg) translateY(-3px);}}
@keyframes dpWord{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
</style>

<script>
"use strict";
/* Self-healing stale-cache guard. Chrome outside incognito has repeatedly
   kept serving an old cached copy of this page after a republish, so even a
   manual refresh shows stale code. Fixed from inside the page, with no
   version string to remember to bump: the artifact shell stamps every
   publish into a versioned <base href="/_f/<stamp>/">, so compare ours
   against a copy fetched with cache:"reload" — which skips the cache on the
   way in *and* overwrites the cache entry with what it downloads. If the
   stamps differ we were stale, and that fetch has already repaired the
   cache, so an ordinary reload now lands on the new build.
   Runs this check on every load, not just the first in a tab — an earlier
   version cached "already verified this tab" and skipped the fetch from
   then on, which meant one clean load early in a long tab session (common
   here: republishing several times while iterating) permanently disabled
   the guard for every publish after it. The one-shot part is now scoped to
   the specific stale stamp seen, via sessionStorage, so it still can't loop
   forever against a server that keeps disagreeing, but a *new* stale stamp
   after a later publish gets its own reload attempt instead of being
   silently trusted. */
(function(){
  try{
    const tag = document.querySelector("base");
    const mine = tag && tag.getAttribute("href");
    if(!mine || !window.fetch) return;   // not in the shell (tests, file://)
    /* deliberately the bare canonical path, not location.href: opening a
       ?cache-busted variant of this page then also repairs the cache entry
       for the clean URL a home-screen shortcut points at. */
    fetch(location.pathname, {cache:"reload"}).then(r => r.text()).then(html => {
      const m = /<base[^>]+href="([^"]+)"/.exec(html);
      if(!m || m[1] === mine) return;   // current, or couldn't tell — leave it
      if(window.sessionStorage){
        if(sessionStorage.getItem("dfStale") === mine) return;   // already tried reloading past this exact stale stamp
        sessionStorage.setItem("dfStale", mine);
      }
      /* location.reload() re-requests through the HTTP cache, so against a
         cache entry Chrome refuses to revalidate it can hand back the SAME
         stale HTML — and the one-shot guard above then records that stamp as
         "tried" and never attempts again. That's how a stale tab got stuck
         permanently: the guard fired, achieved nothing, and disabled itself.
         Navigating to a URL the cache has no entry for cannot be served from
         cache at all. The query is stripped on the way in (below) so the
         address bar doesn't keep it and a bookmark never inherits it. */
      const url = new URL(location.href);
      url.searchParams.set("_fresh", m[1].replace(/[^\w.-]/g, ""));
      location.replace(url.toString());
    }).catch(()=>{});
    /* Having landed on the ?_fresh= URL, put the clean one back in the
       address bar — same document, no reload, so the repaired page stays. */
    if(location.search.indexOf("_fresh=") !== -1 && window.history && history.replaceState){
      const clean = new URL(location.href);
      clean.searchParams.delete("_fresh");
      history.replaceState(null, "", clean.pathname + clean.search + clean.hash);
    }
  }catch(_){}
})();
/* ==========================================================================
   Daisey — minimal daily focus.

   Answers two questions and nothing else:
     1. What do I do right now?
     2. What else is left today?

   Connector call shapes were observed from real request/response pairs.
   ========================================================================== */

/* ---------------------------------------------------------------- config */
const TRELLO = "Trello";
const GCAL   = "Google Calendar";

/* ------------------------------------------------------------ who is this
   Everything below used to be four literal board ARIs, one workspace id and
   one calendar address, all belonging to this app's author. That made the
   app unusable by anyone else: a different viewer's connectors would resolve
   nothing (permanent skeleton) or, worse, resolve the author's own calendar
   inside their app.

   Board/calendar identity now comes from a per-viewer SETUP object — see
   setupWizard(), loadSetup() and applySetup(). The artifact `mcp` capability
   already runs every connector call with the VIEWER's own credentials, so
   there is no auth work here; only identity had to stop being hardcoded.

   These are `let`, reassigned together by applySetup(). Every one of the
   ~30 consumers reads them at call time, so keeping the names (rather than
   moving to SETUP.boards) is what makes this a small change instead of a
   30-site rewrite. */
let SETUP  = null;      // the loaded config, or null = not set up yet
let CAL_ID = null;      // was a hardcoded gmail address
let BOARDS = [];
let TRACKERS = [], SCHED_BOARDS = [], TRACKER_KEYS = new Set();

/* Board no longer decides quick/short/long — the card's own label does
   (sizeFromLabels). Board now only drives colour identity: there is no
   separate "today priority" board any more — this app, with its own live
   schedule, is that board. */
/* A `tracker` board is read, watched and editable like any other, but its
   cards never enter the scheduling pool (candidates()). It exists so an
   asset pipeline — one card per sound, lists as pipeline stages — can live
   in Trello and be driven from inside Daisey without 100+ assets flooding
   a day that only has room for 3 quick tasks. Lists mean nothing to the
   scheduler anywhere else in this app; on a tracker board they are the
   whole point, which is exactly why it has to sit outside the pool. */
function applySetup(setup){
  SETUP  = setup;
  CAL_ID = setup.calId;
  BOARDS = setup.boards.map(b => ({ key:b.key, id:b.id, name:b.name, tracker:!!b.tracker }));
  TRACKERS     = BOARDS.filter(b => b.tracker);
  SCHED_BOARDS = BOARDS.filter(b => !b.tracker);
  TRACKER_KEYS = new Set(TRACKERS.map(b => b.key));
  injectBoardCss();
}
/* Validate on the way in, never guard at each use site — same posture as
   normalizeCfg. Anything malformed is treated as "not set up", which routes
   to the wizard rather than half-booting against a broken identity. */
function validSetup(s){
  if(!s || typeof s !== "object" || s.v !== 1) return false;
  if(typeof s.calId !== "string" || !s.calId) return false;
  if(!Array.isArray(s.boards) || !s.boards.length) return false;
  if(!s.boards.every(b => b && typeof b.key === "string" && b.key &&
                          typeof b.id === "string" && b.id &&
                          typeof b.name === "string")) return false;
  if(new Set(s.boards.map(b => b.key)).size !== s.boards.length) return false;
  return s.boards.some(b => b.key === s.statsBoardKey);
}
const isTrackerCard = c => !!c && TRACKER_KEYS.has(c.boardKey);

/* ------------------------------------------------------- legacy migration
   The author's own install predates setup entirely: his settings, streak,
   rollovers, board colours and project deadlines are all stored under the
   ORIGINAL board keys. So his config is reconstructed with those keys
   VERBATIM — renumbering them to b0..b3 would orphan CFG.colors,
   CFG.boardPriority and S.stats.projects.mpaudio in one go.

   It is gated by capability, not by a build flag or a URL parameter: boot
   asks Trello for one of these boards, and only adopts LEGACY if the
   viewer's own credentials can actually see it. Another person gets an
   error there and goes to the wizard, so they can never inherit these
   boards. See legacySetup(). */
const bAri = id => "ari:cloud:trello::board/workspace/6047bc9723ed9c3e9036b496/" + id;
const LEGACY_PROBE = bAri("693683bc8be8844147bbe82c");   // סידורים
const LEGACY_SETUP = {
  v:1,
  calId:"morsedero@gmail.com", calName:"morsedero@gmail.com",
  boards:[
    { key:"projects", id:bAri("692abd49a69c853bb71cb728"), name:"PROJECTS",             color:"#A855F7" },
    { key:"sidurim",  id:bAri("693683bc8be8844147bbe82c"), name:"סידורים",              color:"#00B8D9" },
    { key:"sedco",    id:bAri("6a718220df5bd657f0636bc7"), name:"סדקו",                 color:"#FF7043" },
    { key:"mpaudio",  id:bAri("6a82c2cd37d859bc17a06fb8"), name:"Monster Punk — Audio", color:"#F0369C", tracker:true }
  ],
  statsBoardKey:"sidurim",
  batchBoardKey:"projects"
};
const STATS_CARD_NAME = "📊 Daisey Stats";
/* The card that already holds the user's real state is named "📊 DayFlow Stats"
   — it predates the rename — so recognition has to accept both names while
   creation uses the new one. Matching only the new name doesn't just lose the
   settings, streak and rollovers: `isStats` is also what keeps this card *out*
   of candidates(), so an unrecognised state card becomes an ordinary
   unlabelled card and Daisey starts scheduling its own machine card as a quick
   task and offering it in the swap picker. */
const STATS_NAME_RE = /^📊 (Daisey|DayFlow) Stats$/;

const SNAP_MIN = 15;
const AGING_DAYS = 5, STALL_DAYS = 3;

/* Everything the scheduler is allowed to argue about lives here and is
   editable from the settings panel; it persists in the Trello state card. */
const DEFAULTS = {
  dayStart:9, dayEnd:17,
  quickTotal:15,   // minutes each quick task gets, on its own — not divided among however many share the day
  quickMax:4,      // max quick tasks scheduled in one day
  shortMin:180,    // short session: yellow or orange label, 3h
  sessionMax:3,    // max sessions scheduled in one day
  /* The hour a break is *held open* at, 0-23, or null to let Daisey decide.
     null keeps the original behaviour exactly: breaks are purely whatever
     the day has left over once tasks are placed. Set to an hour and that
     hour stops being schedulable at all — see planFor, which pushes it into
     both busy sets before placing anything, so it's protected the same way
     a meeting is rather than merely preferred. breakLen is how long that
     held-open stretch is. */
  breakHour:null,
  breakLen:60,
  dayOff:6,          // 0 Sun … 6 Sat; -1 = none
  sound:true,
  colors:{},         // boardKey -> hex, empty means the theme's own hue
  /* Both empty because boards and meetings are per-viewer now. normalizeCfg
     appends every real SCHED_BOARDS key that isn't already listed, so an
     empty priority degrades to "the order they were set up in" rather than
     to no ordering. openEvents is populated by the ⊙/⊘ control on a meeting
     row (toggleOpenEvent). The author's own saved values live in his state

function softOf(hex, a){

   and nothing else (see CLAUDE.md's connector notes), so there is no list
   colour to read back. Daisey assigns one instead, on exactly the mechanism
   boards already use: a generated `--l-<key>` / `--l-<key>-soft` pair plus a
   `.lk-<key>` rule setting the same `--bc`/`--bc-soft` custom properties every
   card already paints from. That is what makes this "same as boards" rather
   than a second parallel system — no card CSS changes at all.
   The key hashes the list NAME, not its id: a list is identified to the user
   by what it is called, two boards that both have a "Doing" should look alike,
   and a colour must not shift because Trello handed back a different id. An
   explicit CFG.colors["list:<lowercased name>"] always wins, so a per-list
   picker can pin one later without touching this code. */

  const n = String(name||"").trim().toLowerCase();
  let h = 0;
  for(let i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i)) >>> 0;
  return "l" + h.toString(36);
}

  const key = "list:" + String(name||"").trim().toLowerCase();

  if(pin) return pin;
  const n = String(name||"").trim().toLowerCase();
  let h = 0;
  for(let i=0;i<n.length;i++) h = (h*131 + n.charCodeAt(i)) >>> 0;

   they never reach the day view). Rebuilt on every injectBoardCss call, same
   as the board block above, so a renamed or new list picks up its colour on
   the next paint without a reload. */

const listClass = card => (card && card.listName) ? " lk-" + listKey(card.listName) : "";

   validate a draft before Save commits it. */
function normalizeCfg(saved){
  const cfg = { ...DEFAULTS, ...saved,
          colors:{ ...(saved.colors || {}) },
          openEvents: Array.isArray(saved.openEvents) ? saved.openEvents.slice() : DEFAULTS.openEvents.slice() };
  /* smallMin was a per-task length, not a window — it does not carry over.

     outright by the short/long tiers — a stale 90-min default must not
     survive under the new names. */
  delete cfg.smallMin;
  delete cfg.maxDeep;
  delete cfg.deepMin;

  cfg.dayEnd     = clamp(+cfg.dayEnd||0, cfg.dayStart+1, 24);
  cfg.quickTotal = clamp(Math.round((+cfg.quickTotal||60)/5)*5, 5, 480);
  cfg.quickMax   = clamp(Math.round(+cfg.quickMax||4), 1, 20);
  cfg.shortMin   = clamp(Math.round((+cfg.shortMin||180)/5)*5, 15, 480);
  cfg.sessionMax = clamp(Math.round(+cfg.sessionMax||3), 1, 10);

     hour survives, so a corrupt saved value degrades to the old behaviour

                     ? null : clamp(Math.round(+cfg.breakHour)||0, 0, 23);
  if(Number.isNaN(cfg.breakHour)) cfg.breakHour = null;

  cfg.choresTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(cfg.choresTime) ? cfg.choresTime : DEFAULTS.choresTime;

     Anything saved but unrecognised is dropped; anything missing (a new
     board) is appended at the end, i.e. least urgent by default. */

    ? [...new Set(saved.boardPriority.filter(k => schedKeys.includes(k)))] : [];

    fallbackOrder.filter(k => !savedPriority.includes(k)),
    schedKeys.filter(k => !savedPriority.includes(k) && !fallbackOrder.includes(k))

/* Settings used to hold the dialog open (and the openEvents toggle's caller

   ever emit DF_MARK. Without the legacy arm, the rename silently strands every

const $ = s => document.querySelector(s);

const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };

const isSchedulable = d => {

function dueChipClass(card){

const shortLinksOf = d => Array.from((d||"").matchAll(/trello\.com\/c\/([A-Za-z0-9]+)/g), m => m[1]);

/* A title sits in .row's right-hand grid column, next to its time/dot/chip
   left column (.row-lead) — never dropping to a full-width line of its own.
   Full size and it fits on one line: untouched. Full size and it doesn't:
   shrink by exactly the ratio needed to fit the column's width on one line.
   If even the floor size can't make one line, it wraps — but capped at 2
   rows, shrinking further step by step until the wrapped text actually
   fits in two, rather than growing a 3rd/4th line under the chip. */
function fitRowTitle(row){
  const n = row.querySelector(":scope > .n");
  if(!n) return;
  n.style.fontSize = "";
  const base = parseFloat(getComputedStyle(n).fontSize);
  if(!(base > 0)) return;

  /* .row is a grid now (see the .row rule) — .n's own clientWidth already
     *is* its column's real rendered width, whatever the lead cluster
     (time/dot/list chip) next to it happens to measure. No more summing
     sibling widths by hand. */
  const available = n.clientWidth;
  if(!(available > 0)) return;

  const prevPos = n.style.position, prevWS = n.style.whiteSpace, prevVis = n.style.visibility;
  n.style.position = "absolute"; n.style.whiteSpace = "nowrap"; n.style.visibility = "hidden";
  const natural = n.getBoundingClientRect().width;
  n.style.position = prevPos; n.style.whiteSpace = prevWS; n.style.visibility = prevVis;
  if(natural <= available) return; // fits at full size, nothing to shrink

  const floor = Math.max(base * 0.68, 10);
  let size = Math.max(floor, Math.floor(base * (available / natural)));
  n.style.fontSize = size + "px";

  /* Shrinking to fit one line is a clean ratio (nowrap width scales
     linearly with font size); fitting two lines isn't, since a real line
     break lands word-by-word, not at a fraction of the string. So this
     second pass measures the actual wrapped height and keeps stepping the
     font down until it fits two lines or bottoms out at a lower floor.
     CSS line-clamp was tried as a hard backstop below the floor and
     dropped — it doesn't clip through .nt's inline-block (see the .row .n
     rule) — so a title long enough to still overflow the floor (a
     synthetic 200+ character title in testing; nothing seen in real data)
     wraps past two lines rather than truncating silently. */
  const floor2 = Math.max(base * 0.55, 9);
  let guard = 12;
  while(size > floor2 && guard-- > 0){
    const lh = parseFloat(getComputedStyle(n).lineHeight) || size * 1.3;
    if(n.scrollHeight <= lh * 2 + 1) break;
    size -= 1;
    n.style.fontSize = size + "px";
  }

function errCopy(e){

   This whole file had exactly one console.error in ~5700 lines of code, so a
   scheduling run that half-failed left nothing behind to debug it with.
   `logErr` keeps the control flow (it returns undefined, callers continue)
   and costs one line at the point of the catch. */
function logErr(where, e){
  try{ console.error(`[daisey] ${where}:`, (e && (e.message || e.code)) || e, e); }
  catch(_){}
}
const retryable = e => {
  const c = e && e.code;
  if(!c) return true;
  return c === "server_unavailable" || c === "rate_limited";
};
async function callTool(server, tool, input, opts){
  if(!S.mcp) throw { code:"capability_disabled", message:"no mcp", server };
  let last;
  for(let attempt = 0; attempt <= RETRY_DELAYS.length; attempt++){
    try{ return await S.mcp.callTool(server, tool, input, opts); }
    catch(e){
      last = e;
      if(attempt === RETRY_DELAYS.length || !retryable(e)) break;
      await sleep(RETRY_DELAYS[attempt]);
    }
  }
  throw last;
}

/* A toast lasts 3.4 seconds; a write that never landed lasts forever. Anything
   still failing after its retries lands here and stays on screen as "N didn't
   save" until it's either retried successfully or dismissed — the alternative
   was a drag made on a dead connection looking saved and quietly not being. */
function queueFailed(label, retry){
  S.failed.push({ label, retry });
  render();
}
async function retryFailed(){
  const queue = S.failed.slice();
  S.failed = [];
  render();
  for(const f of queue){
    try{ await f.retry(); }
    catch(_){ S.failed.push(f); }
  }
  render();
  toast(S.failed.length ? `${S.failed.length} still unsaved.` : "Saved.", !!S.failed.length);
}

/* Newest `storedAt` applied per watch key. A watch can deliver responses out
   of order — a slow poll landing after a faster later one — and `assign` used
   to take whatever arrived last unconditionally, quietly reverting the board
   or the calendar to an older snapshot. Nothing in the app could distinguish
   that from real data, which is exactly the shape of a bug that reads as
   "it randomly forgot my change". */
const WATCH_AT = Object.create(null);
function onWatch(key, ev, assign){
  if(ev.type === "data"){
    delete S.errs[key];
    const at = ev.result && ev.result.cache && ev.result.cache.storedAt;
    /* Only order when the connector actually stamped the payload; without a
       stamp there is nothing to compare and last-write-wins is still the
       best available answer. */
    if(typeof at === "number"){
      /* Stale poll: don't let it overwrite newer data. Still fall through to
         render() — the error banner was just cleared above, and skipping the
         paint would leave a dead banner on screen until something else
         happened to repaint. */
      if(WATCH_AT[key] > at){ render(); return; }
      WATCH_AT[key] = at;
    }
    assign(ev.result);
  }else{
    /* Errors used to retract the cached payload on any auth/lifecycle code,
       which blanked the whole app on a reauth blip. Last-good data plus the
       banner beats an empty page: what's on screen is still what was true a
       few minutes ago, and the banner says why it isn't newer. */
    const e = ev.error || {};
    S.errs[key] = { code:e.code, message:errCopy(e) };
  }
  render();
}
function startWatches(){
  for(const b of BOARDS){
    S.mcp.watchTool(TRELLO, "trelloReadCard",
      { action:"list_by_board", boardIdOrUrl:b.id, filter:"open" },
      ev => onWatch("cards:"+b.key, ev, res => {
        S.cards[b.key] = { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
      }),
      { refetchInterval:180000, cache:{ staleTime:60000 } });
  }
  /* A tracker board's *lists* are its pipeline stages, so unlike every other
     board here they're real data the view renders — not just a place cards
     happen to sit. Watched rather than fetched once so a stage renamed or
     added in Trello shows up without a reload. limit:50 because
     trelloReadList caps there (observed — see the connector notes). */
  for(const b of TRACKERS){
    S.mcp.watchTool(TRELLO, "trelloReadList",
      { action:"list_by_board", boardId:b.id, limit:50 },
      ev => onWatch("lists:"+b.key, ev, res => {
        S.boardLists[b.key] = { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
      }),
      { refetchInterval:600000, cache:{ staleTime:300000 } });
  }
  syncCalendarWatch();
}
/* Day view only needs the one visible day. Week needs to see the whole
   visible range so the grid doesn't have to fetch per-cell — widen only
   when that range is actually on screen. */
function calFetchRange(){
  const a = startOfDay(S.anchor);
  return { a, b:addDays(a,1) };
}
/* one watch, re-registered whenever the visible range changes */
function syncCalendarWatch(){
  const { a, b } = calFetchRange();
  const key = iso(a) + "|" + iso(b);
  if(S.calRange === key) return;
  S.calRange = key;
  if(S.calUnsub){ try{ S.calUnsub(); }catch(_){} S.calUnsub=null; }
  if(!S.mcp) return;
  S.calUnsub = S.mcp.watchTool(GCAL, "list_events",
    { calendarId:CAL_ID, startTime:iso(a), endTime:iso(b), pageSize:100 },
    ev => onWatch("cal", ev, res => {
      S.events = { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
    }),
    { refetchInterval:120000, cache:{ staleTime:45000 } });
}

/* ---------------------------------------------------------------- model */
/* There was a BLOCK_RE here — a keyword regex (waiting/מחכה/blocked/…) run
   over a card's name, description and label names, and any hit kept the card
   out of scheduling until the wording was edited away. Removed 2026-08-18 on
   direct feedback: a card should never have to be touched in Trello after
   it's created, and this rule made ordinary wording ("waiting on the part")
   silently unschedulable forever, with nothing in Daisey saying why. Only
   Daisey's own Pending marker parks a card now — set from the Pending
   button, cleared by time, never by prose. Don't reintroduce text sniffing
   as an eligibility gate. */
const EST_RE   = /(?:~|est[:\s]|estimate[:\s]|\[)\s*(\d{1,3})\s*(m|min|minutes|h|hr|hours)?\b/i;
/* Pending's own marker, optionally dated ("check back on"). Undated parks the
   card for the rest of today only; dated holds it until that date arrives,
   and from then it's a normal candidate again every day. Either way the
   marker expires on its own — the user never has to go back into Trello to
   release a card (see normCard's `blocked`). */
const PENDING_RE = /^⏳ Pending(?: until (\d{4}-\d{2}-\d{2}))? — /;
const pendingMark = until => until ? `⏳ Pending until ${until} — ` : "⏳ Pending — ";
/* Trello's own Start Date field isn't exposed by the connector — no `start`
   key comes back from any read tool, in any shape (checked exhaustively,
   2026-08-18). A Netlify function (netlify/functions/trello-webhook.js)
   subscribes to Trello webhooks on the three scheduled boards, reads the
   real field via Trello's REST API directly, and mirrors it into the
   description as this marker — so the connector limitation never has to be
   worked around from inside this file.
   An HTML comment, not visible text (2026-08-18, user report: the original
   visible `▶ Starts YYYY-MM-DD — ` prefix showed up as real clutter in the
   card's actual Trello description — which already has its own native Start
   Date badge in Trello's UI, so this was a pure duplicate). Trello's
   description renderer drops HTML comments the same way GitHub's does; this
   file already leans on that trick for DF_MARK and the audio-sync markers.
   Lives at the *end* of the description, not the start, so it no longer
   competes with Pending's `^`-anchored marker for the front of the text —
   `normCard` can read PENDING_RE straight off `desc` with no stripping step,
   and `extractStartMarker`/`withoutStartMarker` below are what the two write
   paths (`saveCardDesc`, `pendingItem`) use to keep it out of what the user
   actually sees and edits in Daisey too. */
const START_RE = /<!--\s*daisey-start:(\d{4}-\d{2}-\d{2})\s*-->/;
const extractStartMarker = desc => { const m = START_RE.exec(desc||""); return m ? m[0] : ""; };
const withoutStartMarker = desc => (desc||"").replace(START_RE,"").replace(/\n{3,}/g,"\n\n").trim();

/* Size comes from the Trello label, not the board: yellow or orange = short
   session (3h), no label = quick task. Work-day size removed (2026-08-24,
   user request) — the user's own day-window setting is the day's real
   ceiling, a card shouldn't re-claim the whole thing. Orange degrades to
   short rather than quick so an old 8h card doesn't collapse to 20min. */
function sizeFromLabels(labels){
  const colors = (Array.isArray(labels) ? labels : []).map(l => l && l.color);
  if(colors.includes("orange") || colors.includes("yellow")) return "short";
  return "quick";
}

/* ------------------------------------------------- audio segment scoring
   MIRRORED FROM netlify/functions/audio-sync.js — classify(), splitSubject(),
   scoreSfxItems()'s chain-merge, normName(), AUDIO_SUFFIX_RE, MARKER_RE and
   the two caps, all copied verbatim.

   That function owns *creating* the batch cards on PROJECTS, on a 30-minute
   schedule. This copy exists only so the Projects view can predict what the
   remaining tracker items will become without waiting for the next run — it
   never writes a card.

   There is deliberately no shared module: audio-sync.js is a CommonJS Netlify
   function, this file is a single-file artifact with no build step, so there
   is no import path between them. **Tune a keyword list in one file and you
   must tune it in the other in the same commit**, or the pressure read
   silently drifts from what actually gets created. proj.js asserts the two
   agree across a fixed table — that assertion is the real guard, not this
   comment.

   The chain-merge is not optional: without it a 4-part "<Name> - <part>"
   chain scores 8 instead of 4, and Monster Punk has a real one (Mine Shot:
   fire / loop / ground-contact / explosion). */
const AUDIO_SESSION_CAP = 6, AUDIO_WORKDAY_CAP = 16;
const AUDIO_SUFFIX_RE = /[-–—]\s*Audio\s*$/i;      // hyphen/en-dash/em-dash tolerant
const AUDIO_STAGE_RE  = /^(waiting|in progress)$/i;
const AUDIO_MARK_RE   = /<!--\s*daisey-audio-sync v1 subject="([^"]*)" board="([^"]*)" items="([^"]*)"(?:\s+legacy="true")?\s*-->/;
/* ֐-׿ is audio-sync.js's literal ֐-׿ range, escaped so this file
   stays ASCII-safe. Same characters, same behaviour. */
const audioNormName = s => (s||"").toLowerCase().replace(/[^a-z0-9֐-׿]/g, "");
function audioClassify(text){
  const t = (text||"").toLowerCase();
  if(/\b(chain|shockwave|multi|sequence|cutscene)\b/.test(t)) return 4;
  if(/\b(ui|menu|blip|beep|click|tick|ambient|footstep)\b/.test(t)) return 1;
  return 2;
}
function splitSubject(name){
  const i = (name||"").indexOf(":");
  if(i < 0) return null;
  return { subject:name.slice(0,i).trim(), detail:name.slice(i+1).trim() };
}
function audioScoreItems(items){
  const chainKey = it => { const m = /^(.*?)\s-\s/.exec(it.detail||""); return m ? m[1].trim() : null; };
  const groups = new Map();
  for(const it of items){
    const k = chainKey(it);
    if(!k) continue;
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  const used = new Set();
  const scored = [];
  for(const group of groups.values()){
    if(group.length < 2) continue;
    group.forEach(it => used.add(it.id));
    scored.push({ ids:group.map(it => it.id), points:4 });
  }
  for(const it of items){
    if(used.has(it.id)) continue;
    scored.push({ ids:[it.id], points:audioClassify(it.detail) });
  }
  return scored;
}
/* A music track isn't point-packed by audio-sync (a track doesn't parallelise
   with other tracks the way small SFX cues do) — it emits one card per track,
   sized off a "<n> min" parse of the tracker card's own description. Its own
   `pts` values there are commented "record-keeping only; label is what
   schedules it", so they can't be used as capacity; these are the matching
   *day* costs instead. See CLAUDE.md if this read looks wrong against the
   real tracks. */
function audioMusicPoints(desc){
  const m = /(\d+(?:\.\d+)?)\s*min/i.exec(desc || "");
  if(!m) return AUDIO_SESSION_CAP;                       // no length = demo stage
  return Number(m[1]) >= 1 ? AUDIO_WORKDAY_CAP : AUDIO_SESSION_CAP;
}

function normCard(n, board){
  const name = n.name||"", desc = n.desc||"";
  const due = n.due ? new Date(n.due) : null;
  const smatch = START_RE.exec(desc);
  const start = smatch ? new Date(smatch[1]+"T00:00:00") : null;
  const last = n.lastActivityAt ? new Date(n.lastActivityAt) : null;
  const now = new Date();
  const size = sizeFromLabels(n.labels);
  let est = null;
  const m = EST_RE.exec(desc) || EST_RE.exec(name);
  if(m){ const v=parseInt(m[1],10), u=(m[2]||"m").toLowerCase();
         est = u[0]==="h" ? v*60 : v; if(!(est>0 && est<=600)) est=null; }
  /* Pending, 2026-08-18 decision: it only *hides* a card while a dated
     check-back hasn't arrived yet. Undated Pending never hides at all —
     it's eligible immediately. Either way, once eligible, the marker's
     presence itself becomes a `pendingReturned` boost signal (tierOf) that
     — unlike the one-day start-date boost — keeps firing every day the
     card sits unresolved, since there's no natural "it's been claimed"
     moment the way a start date has. Only actually resolving the card
     (Done/Remove, or editing the marker away) stops it. Start's marker now
     lives at the *end* of desc (see START_RE), so it no longer sits in front
     of Pending's `^`-anchored one — no stripping needed before this match. */
  const pend = PENDING_RE.exec(desc);
  const notYetDue = !!(pend && pend[1] && now < new Date(pend[1]+"T23:59:59"));
  return {
    id:n.id, name, desc,
    url:n.url || n.webUrl || "",
    shortLink: shortLinkOf(n.url || n.webUrl),
    /* labels come along whole, not just distilled into `size`: candidates()
       reads them to keep green "info only" cards out of scheduling, and it
       used to read a key that was never here — the filter was a permanent
       no-op via optional chaining, so green cards got scheduled anyway. */
    labels: Array.isArray(n.labels) ? n.labels : [],
    listId: n.list ? n.list.id : null,
    listName: n.list ? (n.list.name || null) : null,
    boardKey:board.key, boardName:board.name,
    due, dueComplete:!!n.dueComplete, lastActivityAt:last, start,
    stalled: last ? daysBetween(last, now) >= STALL_DAYS : false,
    /* One source of truth: a dated Pending marker whose date hasn't arrived.
       Nothing a card *says* can block it any more (see the note where
       BLOCK_RE used to live) — so this is the only way a card is held out of
       the pool, and it always clears itself by the calendar rather than
       needing an edit in Trello. Start's own marker lives at the end of
       desc (see START_RE), not the front, so it never competes with
       Pending's `^`-anchored regex for the start of the string. */
    blocked: notYetDue,
    /* true once a Pending card is actually eligible (undated, or dated and
       past its date) — the daily tierOf boost keys off this, not off
       `blocked`, since a card can be un-blocked and still need surfacing
       so it doesn't quietly sink to the bottom of a normal ranking. */
    pendingReturned: !!pend && !notYetDue,
    overdue: !!(due && !n.dueComplete && due < now && !sameDay(due, now)),
    dueToday: !!(due && sameDay(due, now)),
    est, size, deep: size !== "quick",
    isStats: STATS_NAME_RE.test(name)
  };
}
/* the connector has been observed returning the same card more than once
   in a single list_by_board page — dedupe by id or the swap picker (and
   anything else built on this) shows it twice */
function allCards(){
  const out=[], seen=new Set();
  for(const b of BOARDS){
    const bag = S.cards[b.key];
    if(!bag || !bag.payload) continue;
    for(const n of ((bag.payload.cards && bag.payload.cards.nodes) || [])){
      if(seen.has(n.id)) continue;
      seen.add(n.id);
      out.push(normCard(n,b));
    }
  }
  return out;
}
const evStart = e => e.start && e.start.dateTime ? new Date(e.start.dateTime) : (e.start && e.start.date ? new Date(e.start.date) : null);
const evEnd   = e => e.end   && e.end.dateTime   ? new Date(e.end.dateTime)   : (e.end   && e.end.date   ? new Date(e.end.date)   : null);

function allEvents(){
  const p = S.events && S.events.payload;
  return ((p && p.events) || [])
    .filter(e => e.status !== "cancelled")
    .map(e => {
      const d = e.description || "";
      const links = shortLinksOf(d);
      const link = links[0] || null;
      const mine = isDfMark(d);
      /* a Daisey-made block with no card link at all is a break — every
         real task block always carries "Original: <url>" (createBlock
         always appends it), so mine-with-no-link is otherwise unused. */
      const isBreak = mine && !link;
      /* mirrors createBlock's colour choice: 9 quick, 5 short, 11 was long.
         A break is its own size, not a quick task: its colorId (7) isn't in
         that map, so it used to fall through to "quick" and be counted as
         one everywhere size is read — inflating existingBlocks' quick tally
         and making a rest block look like scheduled work. Nothing schedules
         by this value for a break, so it just has to be honest. colorId 11
         still reads as "short" (not "quick") even though nothing writes it
         any more (work-day size removed 2026-08-24) — a real block already
         on the user's calendar can still carry it, and misreading that as a
         quick task would let planFor schedule over it. */
      const size = isBreak ? "break"
                 : e.colorId === "11" ? "short"
                 : e.colorId === "5"  ? "short" : "quick";
      return {
        raw:e, id:e.id, summary:e.summary || "(untitled)",
        start:evStart(e), end:evEnd(e),
        allDay: !!(e.start && e.start.date && !e.start.dateTime),
        isTask: mine || !!link, mine, cardShort:link, cardShorts:links, isBreak,
        isBrick: links.length > 1,
        size, deep: size === "short"
      };
    })
    .filter(e => e.start && e.end)
    /* a stale card-linked block (left over from a day that's rolled past)
       is presumed wrong and hidden — but that window has to match what's
       actually schedulable (today and tomorrow, see isSchedulable), or a
       block built for tomorrow vanishes from the app the instant it's
       created: still real on the calendar, invisible everywhere here,
       and rebuilt as a duplicate on every subsequent run. */
    .filter(e => !(e.cardShort && !isSchedulable(e.start)));
}
const overlapsDay = (e,d) => { const a=startOfDay(d), b=addDays(a,1); return e.start < b && e.end > a; };

/* `ignore` may be a single id or a Set of ids */
const ignored = (id, ignore) => !!ignore && (typeof ignore === "string" ? ignore === id : ignore.has(id));

/* occupied minutes. Permeable meetings (all-day, Free, or listed in
   CFG.openEvents) are only skipped — treated as free — when placing a quick
   task. A short or long session may never land inside one: pass forSession
   to keep them busy. */
function busyFor(date, ignore, forSession){
  const out=[];
  for(const e of allEvents()){
    if(e.allDay || !overlapsDay(e,date)) continue;
    if(ignored(e.id, ignore)) continue;
    if(permeable(e) && !forSession) continue;
    const s  = sameDay(e.start,date) ? minsOf(e.start) : 0;
    const en = sameDay(e.end,date)   ? minsOf(e.end)   : 24*60;
    out.push({ s, e:en });
  }
  return out;
}
/* What the day already holds, for the caps. Breaks are excluded outright —
   they're rest, not work, and counting them made a day look fuller than it
   was the moment breaks became real blocks. */
function existingBlocks(date, ignore){
  const evs = allEvents().filter(e => e.isTask && !e.isBreak && !e.allDay && overlapsDay(e,date) && !ignored(e.id, ignore));
  const short = evs.filter(e => e.size === "short").length;
  return { short, quick: evs.length-short, total: evs.length, foreign: evs.filter(e=>!e.mine).length };
}

/* Blocks a run may clear. Every card-linked block counts, including ones the
   morning routine made, ones whose slot has already passed, and — since
   2026-08-18, user request — the one you're in the middle of right now.
   "Rebuild" means rebuild the whole day; a user who taps it while a session
   is running wants that session re-ranked against everything else too, not
   silently pinned. planFor's own nowMin gate still keeps every new slot at
   or after the current time, so the card doesn't jump into the past — it
   just re-enters the pool like anything else and gets replaced only if
   something else now outranks it. Never a real meeting, never finished
   work. */
function clearableBlocks(date){
  return allEvents().filter(e => {
    if(!e.isTask || e.allDay || !overlapsDay(e,date)) return false;
    /* A brick is only "finished work" once every task inside it is —
       cardFor(e) alone would read just the first card, wrongly treating a
       brick with one done task and two still-open ones as fully done and
       skipping it on Rebuild. */
    if(e.isBrick){
      const cs = cardsFor(e);
      if(cs.length && cs.every(c => c.dueComplete)) return false;
      return true;
    }
    const c = cardFor(e);
    if(c && c.dueComplete) return false;                                    // you did it
    return true;
  });
}

/* card behind a block, if we can resolve one */
/* A board's 3-min refetch has been observed coming back with a card
   missing that was there a moment ago (list_by_board paging quirk, see
   CLAUDE.md) — with no error, so onWatch's own last-good fallback never
   kicks in. That flashed the block's colour to bk-none and its title back
   to the raw event summary for one render, then reverted. Once a card is
   seen, its last known shape is kept here and used if a later lookup comes
   up empty, so a block never visibly loses its card over a fetch blip. */
function cardFor(ev){
  if(!ev.cardShort) return null;
  const found = allCards().find(c => c.shortLink === ev.cardShort && !c.isStats) || null;
  if(found){ S.cardCache[ev.cardShort] = found; return found; }
  return S.cardCache[ev.cardShort] || null;
}
/* Same resolve-with-cache-fallback as cardFor, one card per link — used by
   a brick event (multiple "Original:" links in one description, see
   CLAUDE.md) to get every task inside it, not just the first. */
function cardOf(shortLink){
  const found = allCards().find(c => c.shortLink === shortLink && !c.isStats) || null;
  if(found){ S.cardCache[shortLink] = found; return found; }
  return S.cardCache[shortLink] || null;
}
function cardsFor(ev){
  return (ev.cardShorts || []).map(cardOf).filter(Boolean);
}

/* board hue class. A genuinely boardless block (a real meeting) gets the
   neutral bk-none; a task block whose card hasn't resolved yet gets
   bk-pending (no colour) instead of bk-none (a colour) — see .bk-pending.
   A break is boardless on purpose (no card, ever) but that's not the same
   "unresolved" state bk-pending exists for, so it gets its own fixed azure
   ahead of both checks. */
const boardClass = (card, isTask, isBreak) => isBreak ? "bk-break" : card ? "bk-" + card.boardKey : (isTask ? "bk-pending" : "bk-none");

/* small ↗ that opens the real Trello card in a new tab — every place a
   card's title renders gets one, so "which card is this again" is always
   one tap away instead of a detour through Trello's own search */
function cardLink(card){
  if(!card || !card.url) return null;
  const a = el("a","card-link","↗");
  a.href = card.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.title = "Open in Trello"; a.setAttribute("aria-label","Open in Trello");
  a.addEventListener("click", e => e.stopPropagation());
  return a;
}

/* The chip's *colour* already says which board a card came from (--bc/--bc-soft
   are the board's own colours), so its text is free to say the finer thing: the
   list. That's what stops a card title from having to carry its project by hand
   — "MP — SFX batch: enemy mechanics" was a list name inlined into a name, and
   now the chip renders "MonsterPunk" and the title is just the work. Falls back
   to the board name for a card with no list (none in practice, but a card read
   mid-move can briefly have one). Board colour is unchanged either way. */
function sourceChip(card){
  const b = el("span","chip bk");
  bidi(b, card.listName || card.boardName);
  return b;
}

/* .row's fixed-width left column: time + dot + (optional) list-name chip,
   grouped into one grid cell so the title next to it (.n) is unambiguously
   the other column — see the .row rule and fitRowTitle. */
function rowLead(timeText, chip, opts){
  opts = opts || {};
  const lead = el("div","row-lead");
  if(timeText) lead.appendChild(el("span","t", timeText));
  if(!opts.noDot) lead.appendChild(el("span","dot"));
  if(chip) lead.appendChild(chip);
  return lead;
}

/* ------------------------------------------------- checklists */
/* One call per card, cached. The day is capped at a handful of tasks, so
   prefetching them all is cheap and lets details open on their own. */
/* A failed fetch used to cache itself into S.lists and the guard below then
   made it permanent — one flaky call and that card had no checklist for the
   rest of the page's life. An errored entry may now be asked for again, but
   not immediately: paintMain calls this on every render, so an unguarded
   retry would hammer a down connector once a frame. */
const CHECKLIST_RETRY_MS = 30000;
function loadChecklists(card){
  if(!card) return;
  const bag = S.lists[card.id];
  if(bag && !(bag.error && Date.now() - bag.at > CHECKLIST_RETRY_MS)) return;
  S.lists[card.id] = { loading:true };
  callTool(TRELLO, "trelloReadChecklist",
    { action:"list_by_card", cardId:card.id, limit:25 },
    { cache:{ staleTime:120000 } })
    .then(res => {
      const p = res.payload || {};
      S.lists[card.id] = { loading:false, checklists: p.checklists || [] };
    })
    .catch(e => { S.lists[card.id] = { loading:false, error:errCopy(e), at:Date.now() }; })
    .then(render);
}
const hasDetail = card => {
  if(!card) return false;
  if(card.desc && card.desc.trim()) return true;
  const bag = S.lists[card.id];
  return !!(bag && bag.checklists && bag.checklists.some(cl => (cl.checkItems||[]).length));
};

/* Toggle a check item: paint it immediately, write, put it back if the write
   fails — a checkbox that waits on the network feels broken. */
async function toggleItem(card, checklistId, item){
  if(S.ticking.has(item.id)) return;
  const want = item.state !== "COMPLETE";
  S.ticking.add(item.id);
  item.state = want ? "COMPLETE" : "INCOMPLETE";       // optimistic
  render();
  try{
    const res = await callTool(TRELLO, "trelloWriteChecklist",
      { action:"update_item", checklistId, itemId:item.id, checked:want });
    const back = res.payload;
    if(back && back.state) item.state = back.state;     // trust the server
    if(want) chime();
  }catch(e){
    item.state = want ? "INCOMPLETE" : "COMPLETE";      // revert
    toast(errCopy(e), true);
  }finally{
    S.ticking.delete(item.id);
    render();
  }
}

/* Card text edits: find the raw payload node so the change survives the
   next allCards() rebuild (normCard() is rebuilt from it every render),
   patch it optimistically, then write through and let the usual
   invalidate bring the server copy back in sync. */
function rawCardNode(card){
  const bag = S.cards[card.boardKey];
  const nodes = bag && bag.payload && bag.payload.cards && bag.payload.cards.nodes;
  return nodes ? nodes.find(n => n.id === card.id) : null;
}
/* Pure network write — no local mutation of its own. Both callers
   (saveCardDesc below, pendingItem) own their own optimistic patch and undo,
   so this just has to make the call and let the caller decide what to do
   with success or failure. */
async function writeCardDesc(card, text){
  await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:card.id, desc:text });
  await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
}
/* Used to close the editor and render *before* the description text itself
   was patched in (that happened inside writeCardDesc, past the first await),
   so the closed editor showed the old text until the network call finished.
   Patch first, local-first like every other edit here.
   `text` is what the user actually typed, against the marker-stripped
   textarea detailPanel shows them — the Start marker (if any) is pulled
   from the card's *current* desc, not from `text`, since the user never saw
   it to edit in the first place. Re-appending it here (rather than trusting
   the webhook to restore it on the next sync pass) keeps this write from
   ever showing as start-date-less, even for the moment before that pass
   runs. */
function saveCardDesc(card, text){
  S.editing.delete("desc:"+card.id);
  const marker = extractStartMarker(card.desc);
  const full = marker ? (text.trim() ? text.trimEnd()+"\n\n"+marker : marker) : text;
  const undo = patchLocalCard(card, { desc:full });
  render();
  writeCardDesc(card, full).then(
    ()=>{},
    e => {
      undo();
      toast(errCopy(e), true);
      queueFailed(`Description: ${card.name}`, async () => {
        const again = patchLocalCard(card, { desc:full });
        try{ await writeCardDesc(card, full); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}
async function saveItemText(checklistId, item, text){
  const trimmed = text.trim();
  if(!trimmed){ toast("Item text can't be empty.", true); return; }
  const prev = item.name;
  item.name = trimmed;
  S.editing.delete("item:"+item.id);
  render();
  try{
    const res = await callTool(TRELLO, "trelloWriteChecklist",
      { action:"update_item", checklistId, itemId:item.id, text:trimmed });
    const back = res.payload;
    if(back && back.name) item.name = back.name;
  }catch(e){
    item.name = prev;
    toast(errCopy(e), true);
  }finally{ render(); }
}

/* ---------------------------------------------------------------- stats */
function parseStats(card){
  if(!card) return null;
  const d = card.desc || "";
  const i = d.indexOf(ST_OPEN), j = d.indexOf(ST_CLOSE);
  if(i<0 || j<0) return { ...DEFAULT_STATS };
  try{ return Object.assign({}, DEFAULT_STATS, JSON.parse(d.slice(i+ST_OPEN.length, j).trim())); }
  catch(_){ return { ...DEFAULT_STATS }; }
}
/* parseStats' Object.assign is shallow, so an old state card with no
   `projects` key gets {} for free — but a corrupt value (a string, null, a
   half-written object) would survive the merge intact and blow up every read
   in projectSnapshot. Normalise on the way in instead of guarding at each
   use site. Keyed off TRACKERS, so a project whose board is removed from
   BOARDS quietly drops out rather than lingering as dead state. */
function normProjects(raw){
  const out = {};
  const src = (raw && typeof raw === "object") ? raw : {};
  for(const b of TRACKERS){
    const p = src[b.key] && typeof src[b.key] === "object" ? src[b.key] : {};
    const d = typeof p.deadline === "string" && /^\d{4}-\d{2}-\d{2}$/.test(p.deadline) ? p.deadline : null;
    out[b.key] = { deadline:d, setAt:(typeof p.setAt === "string" ? p.setAt : null), note:(typeof p.note === "string" ? p.note : "") };
  }
  return out;
}
const projectState = key => (S.stats && S.stats.projects && S.stats.projects[key]) || { deadline:null, setAt:null, note:"" };
/* Same local-first shape as saveCfg: patch, paint, write behind it. saveStats
   itself needs no change — it serialises the whole S.stats object, so
   `projects` rides along with the streak and rollovers. */
function saveProjectDeadline(boardKey, iso){
  const st = S.stats || { ...DEFAULT_STATS };
  st.projects = normProjects(st.projects);
  st.projects[boardKey] = { ...st.projects[boardKey], deadline:iso || null, setAt:iso ? dayKey(new Date()) : null };
  S.stats = st;
  _snapCache = null;
  render();
  saveStats(st);
}
const statsCard = () => allCards().find(c => c.isStats) || null;

/* The state card lives on סידורים in its own list. Nothing in the app ever
   created it, so if it was missing — or had been archived by hand — every
   settings change, streak bump and rollover was dropped on the floor with no
   toast and no trace. Find its list from any card already loaded off that
   board, else ask Trello for the board's lists. */
/* Both spellings, same reason as STATS_NAME_RE: the real list is still called
   "📊 DayFlow (widget state — do not edit)". A miss here means statsListId()
   finds nowhere to write, and saveStats drops every settings change, streak
   bump and rollover on the floor. */
const STATS_LIST_RE = /Daisey|DayFlow/i;
async function statsListId(){
  /* The board the viewer chose during setup. The old `|| BOARDS[0]` fallback
     is deliberately gone: BOARDS[0] is a real work board, so a missing
     statsBoardKey used to silently aim the machine card at live work. Return
     null instead and let createStatsCard throw its honest error. */
  const board = BOARDS.find(b => b.key === (SETUP && SETUP.statsBoardKey));
  if(!board) return null;
  const known = allCards().find(c => c.boardKey === board.key && STATS_LIST_RE.test(c.listName || ""));
  if(known && known.listId) return known.listId;
  /* observed: list_by_board answers with a flat `lists` array plus pageInfo —
     not the nodes wrapper the card reads use */
  const res = await callTool(TRELLO, "trelloReadList", { action:"list_by_board", boardId:board.id, limit:50 });
  const arr = (res.payload && res.payload.lists) || [];
  const hit = arr.find(l => STATS_LIST_RE.test(l.name || ""));
  /* deliberately no "first list" fallback: dropping a machine-managed card
     into a real list would put it straight into the scheduling pool */
  return hit ? hit.id : null;
}
async function createStatsCard(body){
  const listId = await statsListId();
  if(!listId) throw { code:"tool_error", message:"No list to put the Daisey state card in.", server:"Trello" };
  const res = await callTool(TRELLO, "trelloWriteCard",
    { action:"create", listId, name:STATS_CARD_NAME, desc:body });
  const node = res.payload && res.payload.cards && res.payload.cards.nodes && res.payload.cards.nodes[0];
  if(node && node.id) S.statsCardId = node.id;
  return S.statsCardId;
}

/* "This board has told us something, even if that something was an error."
   The gates below used to demand S.cards[key], i.e. SUCCESS — so one
   unreachable board (deleted in Trello, unshared, renamed workspace) meant
   startDay() never ran and the page stayed a skeleton forever, with no
   timeout anywhere. Treating an errored board as settled lets the app come
   up the instant the truth is known, which is strictly better than waiting
   out a timer. */
const boardSettled = b => !!(S.cards[b.key] || S.errs["cards:"+b.key]);

/* ------------------------------------------------------ setup persistence
   The state card is the SOURCE OF TRUTH; localStorage is only a cache.
   That order matters: every localStorage call in this file is already
   wrapped in try/catch because it throws SecurityError in the test harness
   and has never been verified against the real published artifact. If
   storage silently fails, a localStorage-first design would re-run the
   setup wizard on every single load. Reading the card instead costs one
   board scan on a cold start and always works. */
const SETUP_LS_KEY = "daisey.setup.v1";
function readSetupCache(){
  try{
    const raw = localStorage.getItem(SETUP_LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    return validSetup(s) ? s : null;
  }catch(_){ return null; }
}
function cacheSetup(s){ try{ localStorage.setItem(SETUP_LS_KEY, JSON.stringify(s)); }catch(_){} }
/* Cold start: no cache, so we don't know which boards to watch, so we can't
   find the state card the normal way. Break the circle by listing the
   viewer's boards and reading each one's cards directly, looking for a state
   card that carries a `setup` block. One extra pass, only when the cache
   misses. */
async function discoverSetup(){
  let nodes = [];
  try{
    const res = await callTool(TRELLO, "trelloReadBoard", { action:"list", limit:50 });
    nodes = (res.payload && res.payload.cards && res.payload.cards.nodes) || [];
  }catch(_){ return null; }
  for(const n of nodes){
    if(!n || !n.id) continue;
    try{
      const r = await callTool(TRELLO, "trelloReadCard", { action:"list_by_board", boardIdOrUrl:n.id });
      const cards = (r.payload && r.payload.cards && r.payload.cards.nodes) || [];
      const hit = cards.find(c => STATS_NAME_RE.test(c.name || ""));
      if(!hit) continue;
      const st = parseStats({ desc: hit.desc || "" });
      if(st && validSetup(st.setup)) return st.setup;
    }catch(_){ /* a board we can't read is simply not the one */ }
  }
  return null;
}
/* The author's own install predates setup. Adopt his config only if the
   VIEWER's credentials can actually see his board — anyone else gets an
   error or an empty result here and goes to the wizard, so his boards can
   never leak into someone else's app. */
async function legacySetup(){
  try{
    const res = await callTool(TRELLO, "trelloReadBoard", { action:"get", boardId: LEGACY_PROBE });
    const nodes = (res.payload && res.payload.cards && res.payload.cards.nodes) || [];
    return nodes.length ? LEGACY_SETUP : null;
  }catch(_){ return null; }
}
/* Mirror the setup into the state card so it survives a cleared cache and
   reaches a second device. Rides along inside the existing stats blob. */
function persistSetup(s){
  cacheSetup(s);
  const st = S.stats || { ...DEFAULT_STATS };
  st.setup = s;
  S.stats = st;
  saveStats(st);
}

/* SINGLE-FLIGHT. The whole stats blob — streak, history, categories,
   rollovers, plans, project deadlines, settings — is stored as one JSON
   document in one Trello card description, and saveStats is called from ~20
   places, almost all of them fire-and-forget (`saveStats(st)` with no await)
   off the back of a Done / Swap / Pending / Remove / settings save.

   That used to mean: two actions close together started two overlapping
   writes of the ENTIRE document, each carrying a body serialized before the
   other had landed, and whichever response came back last won outright. The
   loser's change was gone with nothing on screen to say so — the shape of
   "my streak reset", "my setting reverted", "that completion didn't stick".

   Two changes fix it without touching the call sites:

   1. The body is serialized INSIDE the write, from S.stats at the moment the
      request actually goes out — not captured at call time. A queued retry
      then replays current state rather than re-sending a stale snapshot.
   2. At most one write is in flight. A call arriving while one is running
      does not start a second: it marks the state dirty and the in-flight
      chain re-writes once when it finishes, coalescing any number of
      overlapping updates into one final consistent write.

   S.stats is still assigned synchronously, so every local read stays
   correct and the UI stays instant. */
let statsFlight = null, statsDirty = false;
async function saveStats(next){
  S.stats = next;
  if(statsFlight){ statsDirty = true; return statsFlight; }
  statsFlight = (async () => {
    try{
      do{
        statsDirty = false;
        await writeStats();
      } while(statsDirty);
    } finally { statsFlight = null; }
  })();
  return statsFlight;
}
async function writeStats(){
  /* serialized here, not by the caller — see saveStats */
  const body = "Daisey widget state store. Machine-managed — edit via the widget, not by hand.\n\n"
             + ST_OPEN + "\n" + JSON.stringify(S.stats) + "\n" + ST_CLOSE + "\n";
  /* the id is resolved per attempt, not captured: a retry that runs after
     Trello finally loads should find the real card instead of creating a
     second one from the state the first attempt saw */
  const write = async () => {
    const card = statsCard();
    if(card) S.statsCardId = card.id;
    const id = card ? card.id : S.statsCardId;
    if(id) await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:id, desc:body });
    /* only create when Trello itself answered and simply had no such card —
       an unloaded board is "don't know yet", not "it isn't there". Tracker
       boards are deliberately not part of this gate: the state card can't
       live on one, and a 100+ asset board is the slowest thing to load —
       waiting for it would stall every settings write behind it. */
    else if(SCHED_BOARDS.every(boardSettled)) await createStatsCard(body);
    else throw { code:"server_unavailable", message:"Trello hasn't loaded yet.", server:"Trello" };
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(e => logErr("saveStats/invalidate", e));
  };
  try{ await write(); }
  catch(e){
    logErr("saveStats", e);
    toast(errCopy(e), true);
    /* The retry re-serializes from whatever S.stats holds when it runs, so a
       replay can't resurrect an old document over a newer one. */
    queueFailed("Daisey settings", async () => {
      const card = statsCard();
      if(card) S.statsCardId = card.id;
      const id = card ? card.id : S.statsCardId;
      const fresh = "Daisey widget state store. Machine-managed — edit via the widget, not by hand.\n\n"
                  + ST_OPEN + "\n" + JSON.stringify(S.stats) + "\n" + ST_CLOSE + "\n";
      if(id) await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:id, desc:fresh });
      else await createStatsCard(fresh);
      await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(e2 => logErr("saveStats/retry invalidate", e2));
    });
  }
}
function bumpCategory(cat, field){
  const st = S.stats || { ...DEFAULT_STATS };
  st.categories = st.categories || {};
  const c = st.categories[cat] || { picked:0, done:0, skipped:0 };
  c[field] = (c[field]||0)+1;
  st.categories[cat] = c;
  return st;
}
function catWeight(cat){
  const c = S.stats && S.stats.categories && S.stats.categories[cat];
  if(!c || !c.picked) return 0;
  return ((c.done/c.picked) - 0.5) * 0.8;
}
const rollInfo = c => (S.stats && S.stats.rollovers && S.stats.rollovers[c.id]) || null;
const ageDays = c => { const r = rollInfo(c); return r ? (r.count||0) : 0; };
const isAging = c => ageDays(c) >= AGING_DAYS;

/* ---------------------------------------------------------------- engine */
/* Reordered 2026-08-18 on direct feedback, in two ways.
   1. Overdue now outranks everything. It used to sit below the start-date /
      just-returned-from-Pending boost and below a rollover, which meant a
      card that had genuinely blown its date could be pushed down the day by
      a card that merely became eligible this morning. A missed date is the
      strongest signal on the board, so it goes first — still split into
      overdue-and-going-stale ahead of plain overdue.
   2. Due dates no longer have tiers of their own. "Due today", "due within
      two days" and "has a due date" were three separate rungs, so a card due
      in 3 days and one due in 30 ranked identically and were then separated
      by board order — which looked arbitrary from outside. Everything with a
      date now shares one tier and is ordered purely by how close that date
      is (see rankCards, where due is compared before board/weighting). Due
      today needs no special case: it's simply the closest date there is. */
/* An audio batch card carries no Trello due date — the deadline lives on the
   *project*, in S.stats.projects, not on any one card. So tierOf's due tier
   never fires for one, and a whole audio project ranks below any single dated
   errand right up until it's already late. This is the one place the Projects
   view feeds back into scheduling: once a project needs more work days than it
   has left, its batch cards get a tier boost.

   Returns null for anything that isn't one of audio-sync's own cards — a
   hand-written card on the same list has no marker and is deliberately
   invisible to this, same rule audio-sync.js itself applies. */
function projectPressureOf(c){
  /* No batch board configured (everyone but this app's author — the whole
     Projects feature is downstream of the audio-sync Netlify function, which
     nobody else runs) means there is no pressure to read. */
  if(!SETUP || !SETUP.batchBoardKey) return null;
  if(!c || c.boardKey !== SETUP.batchBoardKey || !c.desc) return null;
  const m = AUDIO_MARK_RE.exec(c.desc);
  if(!m) return null;
  const board = TRACKERS.find(b => bareId(b.id) === m[2]);
  if(!board) return null;
  const s = snapshotFor(board);
  return s ? s.pressure : null;
}
function tierOf(c){
  if(c.overdue && (c.blocked||c.stalled)) return 0;
  if(c.overdue) return 1;
  /* Tier 2, not 0 or 1: a card that has genuinely blown its own date still
     outranks a project that's merely over-committed. "A missed date is the
     strongest signal on the board" stays true. */
  const pp = projectPressureOf(c);
  if(pp !== null && pp >= 1) return 2;
