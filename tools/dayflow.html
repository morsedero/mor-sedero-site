<title>DayFlow</title>
<style>
/* ============================================================
   DayFlow — one day, one question: what's next?
   Light palette on bare :root; dark redefines TOKENS ONLY.
   ============================================================ */
:root{
  --bg:#EDEEEF;
  --surface:#FFFFFF;
  --surface-2:#F4F5F6;
  --ink:#14171A;
  --ink-2:#5A626A;
  --ink-3:#8A939B;
  --line:#DEE1E4;
  --line-2:#C7CCD1;

  --accent:#0E7C86;
  --accent-ink:#0A5C64;
  --accent-soft:rgba(14,124,134,.09);
  --accent-line:rgba(14,124,134,.30);
  --on-accent:#FFFFFF;

  --crit:#B3352F;
  --age:#B8761F;
  --age-soft:rgba(184,118,31,.12);
  --done:#2E7D4F;
  --deep:#5B4BA8;
  --deep-soft:rgba(91,75,168,.10);

  --shadow:0 1px 2px rgba(16,20,26,.05), 0 8px 24px rgba(16,20,26,.06);
  --shadow-lg:0 18px 50px rgba(16,20,26,.16);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1215;
    --surface:#171B1F;
    --surface-2:#1E2328;
    --ink:#EAEDEF;
    --ink-2:#A4ADB5;
    --ink-3:#6E777F;
    --line:#272D33;
    --line-2:#3A424A;

    --accent:#4FD1DB;
    --accent-ink:#8BE4EB;
    --accent-soft:rgba(79,209,219,.10);
    --accent-line:rgba(79,209,219,.34);
    --on-accent:#0B1013;

    --crit:#F2756B;
    --age:#E8A14B;
    --age-soft:rgba(232,161,75,.14);
    --done:#5FC98A;
    --deep:#A99CF0;
    --deep-soft:rgba(169,156,240,.13);

    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1215;
  --surface:#171B1F;
  --surface-2:#1E2328;
  --ink:#EAEDEF;
  --ink-2:#A4ADB5;
  --ink-3:#6E777F;
  --line:#272D33;
  --line-2:#3A424A;

  --accent:#4FD1DB;
  --accent-ink:#8BE4EB;
  --accent-soft:rgba(79,209,219,.10);
  --accent-line:rgba(79,209,219,.34);
  --on-accent:#0B1013;

  --crit:#F2756B;
  --age:#E8A14B;
  --age-soft:rgba(232,161,75,.14);
  --done:#5FC98A;
  --deep:#A99CF0;
  --deep-soft:rgba(169,156,240,.13);

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}

/* ---------------- shell ---------------- */
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 64px;}

.head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:26px;
}
.head .date{display:flex;align-items:baseline;gap:10px;min-width:0;}
.head .date h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}
.head .date .rel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
.nav{display:flex;gap:4px;align-items:center;}
.nav button{
  width:28px;height:28px;border-radius:7px;border:1px solid transparent;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{background:var(--surface);border-color:var(--line);color:var(--ink);}
.nav .todaybtn{width:auto;padding:0 11px;font-size:12px;}

/* ---------------- the answer ---------------- */
.now{
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:20px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.now.live{border-color:var(--accent-line);}
.now.live::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.now .when{
  display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap;
}
.now .clock{
  font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;
  font-weight:600;letter-spacing:-.01em;
}
.now.live .clock{color:var(--accent-ink);}
.now h2{
  margin:0 0 14px;font-size:21px;line-height:1.32;font-weight:600;
  letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere;
}
.now .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;}

.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;
}
.chip.crit{background:transparent;color:var(--crit);border-color:var(--crit);}
.chip.age{background:var(--age-soft);color:var(--age);border-color:transparent;}
.chip.deep{background:var(--deep-soft);color:var(--deep);border-color:transparent;}
.chip.live{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);}

.btn{
  border:1px solid var(--line-2);background:var(--surface);
  border-radius:9px;padding:9px 16px;cursor:pointer;
  font-size:14px;font-weight:530;
  transition:background .15s,border-color .15s,transform .12s,opacity .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent);}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:9px 12px;}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* meeting-in-progress note above the answer */
.meeting-now{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;margin-bottom:10px;
  border-radius:11px;border:1px dashed var(--line-2);color:var(--ink-2);
  font-size:13.5px;background:var(--surface-2);
}
.meeting-now .mn-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:0 0 auto;}
.meeting-now .mn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------------- later ---------------- */
.later{margin-top:30px;}
.later .lh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.rows{display:flex;flex-direction:column;}

.row{
  display:flex;align-items:center;gap:12px;
  padding:11px 4px;border-bottom:1px solid var(--line);
  transition:opacity .2s;
}
.row:last-child{border-bottom:0;}
.row .t{
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--ink-3);flex:0 0 42px;
}
.row .n{flex:1 1 auto;min-width:0;font-size:14px;overflow-wrap:anywhere;}
.row .n .sub{display:block;margin-top:2px;}
/* shrink-to-fit titles: RTL text stays next to its timestamp */
.nt{display:inline-block;max-width:100%;vertical-align:top;}
.row.meeting{color:var(--ink-2);}
.row.meeting .n{font-style:normal;}
.row.deep .t{color:var(--deep);}
.row.done{opacity:.42;}
.row.done .n{text-decoration:line-through;text-decoration-thickness:1px;}

.acts-inline{display:flex;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .15s;}
.row:hover .acts-inline,.acts-inline:focus-within{opacity:1;}
@media (hover:none){.acts-inline{opacity:1;}}
.mini{
  width:28px;height:28px;border-radius:7px;border:1px solid transparent;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;font-size:13px;line-height:1;
  transition:background .14s,color .14s,border-color .14s,transform .18s;
}
.mini:hover{background:var(--surface);border-color:var(--line-2);transform:scale(1.06);}
.mini.ok:hover{color:var(--done);border-color:var(--done);}
.mini.later-btn:hover{color:var(--accent);border-color:var(--accent);}
.mini.del:hover{color:var(--crit);border-color:var(--crit);}

/* ---------------- footer ---------------- */
.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.foot .stats{display:flex;gap:16px;align-items:baseline;}
.foot .stat{display:flex;align-items:baseline;gap:5px;}
.foot .stat .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;}
.foot .stat .v.streak{color:var(--age);}
.foot .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}

/* ---------------- states ---------------- */
.state{
  text-align:center;padding:44px 24px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
}
.state .big{font-size:34px;line-height:1;margin-bottom:14px;}
.state h2{margin:0 0 8px;font-size:19px;letter-spacing:-.01em;text-wrap:balance;}
.state p{margin:0 auto;max-width:38ch;color:var(--ink-2);font-size:14px;}
.state .acts{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:20px;text-align:left;}
.opt{
  padding:13px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;
  transition:border-color .15s,transform .15s,background .15s;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);}
.opt .ot{display:block;font-weight:600;font-size:14px;}
.opt .od{color:var(--ink-2);font-size:12.5px;}

.banner{
  border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:16px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);
}
.banner.crit{border-color:var(--crit);color:var(--ink);}
.banner strong{display:block;color:var(--ink);margin-bottom:2px;}
.skel{height:112px;border-radius:16px;background:var(--surface-2);}
@media (prefers-reduced-motion:no-preference){
  .skel{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.55;}}
}

/* ---------------- dialog / toast ---------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,18,.44);display:grid;place-items:center;padding:20px;}
.dialog{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);max-width:390px;width:100%;overflow:hidden;}
@media (prefers-reduced-motion:no-preference){
  .dialog{animation:pop .2s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0;}}
}
.dialog .dh{padding:16px 17px 12px;}
.dialog .dh h3{margin:0;font-size:15px;}
.dialog .dh p{margin:6px 0 0;font-size:13px;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere;}
.dialog .df{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;}
.toast{background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:22px;padding:8px 16px;font-size:13px;}
.toast.err{border-color:var(--crit);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .24s cubic-bezier(.2,.9,.3,1);}
  @keyframes tin{from{transform:translateY(10px);opacity:0;}}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;}
</style>

<div class="wrap">

    <div class="date">
      <h1 id="dateLabel">—</h1>

      <button id="prev" aria-label="Previous day">‹</button>

</div>

<script>
"use strict";
/* ==========================================================================
   DayFlow — minimal daily focus.

   Answers two questions and nothing else:
     1. What do I do right now?
     2. What else is left today?
   Plus one escape hatch: "not now" pushes a task to the next free slot
   later the same day.

   Connector call shapes were observed from real request/response pairs.
   ========================================================================== */

/* ---------------------------------------------------------------- config */
const WS   = "ari:cloud:trello::";
const bAri = id => WS + "board/workspace/6047bc9723ed9c3e9036b496/" + id;
const lAri = id => WS + "list/workspace/6047bc9723ed9c3e9036b496/" + id;

const TRELLO = "Trello";
const GCAL   = "Google Calendar";
const CAL_ID = "morsedero@gmail.com";

const BOARDS = [
  { key:"projects", id:bAri("692abd49a69c853bb71cb728"), name:"PROJECTS",   kind:"deep"  },
  { key:"sidurim",  id:bAri("693683bc8be8844147bbe82c"), name:"סידורים",    kind:"small" },
  { key:"sedco",    id:bAri("6a718220df5bd657f0636bc7"), name:"סדקו",       kind:"small" },
  { key:"today",    id:bAri("6a7a17e2ed53384c4f792d87"), name:"היום",       kind:"today" }
];
const LIST_DONE = lAri("6a7a17e6fa8d1b840074ed07");
const STATS_CARD_NAME = "📊 DayFlow Stats";

const DAY_START_H = 9, DAY_END_H = 20;
const MAX_SMALL = 3, SMALL_MIN = 30;
const MAX_DEEP = 1,  DEEP_DEFAULT = 90;
const BUFFER_MIN = 15, SNAP_MIN = 15;
const AGING_DAYS = 5, STALL_DAYS = 3;

const DF_MARK  = "[dayflow]";
const ST_OPEN  = "<!--DAYFLOW_STATE_V1";
const ST_CLOSE = "DAYFLOW_STATE_V1-->";

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const pad2 = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const sameDay = (a,b) => dayKey(a)===dayKey(b);
const hhmm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const minsOf = d => d.getHours()*60 + d.getMinutes();
const atMin = (base,m) => { const x=startOfDay(base); x.setMinutes(m); return x; };
const iso = d => new Date(d).toISOString();
const daysBetween = (a,b) => Math.floor((startOfDay(b)-startOfDay(a))/86400000);
const fmtRange = (a,b) => `${hhmm(a)}–${hhmm(b)}`;
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* per-field direction; the app chrome never flips */
function bidi(node,text){ node.setAttribute("dir","auto"); node.textContent = text==null?"":String(text); return node; }
/* An RTL title inside a wide LTR row would sit against the far edge, away from
   its timestamp. Wrapping it in a shrink-to-fit span keeps it beside the time
   while the text itself still lays out in its own direction. */
function bidiSpan(text){ const s = el("span","nt"); return bidi(s, text); }
const shortLinkOf = url => { const m=/trello\.com\/c\/([A-Za-z0-9]+)/.exec(url||""); return m?m[1]:null; };

/* ---------------------------------------------------------------- state */
const S = {
  anchor: startOfDay(new Date()),
  mcp:null, ready:false, busy:false,
  cards:{}, events:null, errs:{},
  stats:null, statsCardId:null,
  calRange:null, calUnsub:null,
  fridayAnswered:false, muted:false,
  pending:new Set()
};
const DEFAULT_STATS = { v:1, streak:0, lastCompletionDate:null, history:[], categories:{}, rollovers:{}, plans:{}, mute:false };

/* ---------------------------------------------------------------- MCP */
const AUTHZ = new Set(["needs_reauth","server_not_connected","selection_required","blocked_by_policy","approval_required","not_in_manifest","server_not_found"]);
const LIFECYCLE = new Set(["not_granted","capability_disabled","capability_removed"]);

function errCopy(e){
  const s = (e && e.server) || "the connector";
  switch(e && e.code){
    case "needs_reauth":         return `Reconnect ${s} in claude.ai → Settings → Connectors.`;
    case "server_not_connected": return `Add ${s} in claude.ai → Settings → Connectors.`;
    case "selection_required":   return `Choose which ${s} account to use, then reload.`;
    case "blocked_by_policy":    return `Your organization blocks this ${s} tool.`;
    case "approval_required":    return `This ${s} action needs approval artifacts can't request yet.`;
    case "server_unavailable":   return `${s} is unreachable right now. Retrying shortly.`;
    case "not_in_manifest":      return `This page isn't allowed to call that ${s} tool.`;
    case "tool_error":           return (e.message || `${s} rejected the request.`);
    case "rate_limited":         return `Too many ${s} requests. Pausing briefly.`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed":   return "Live data isn't available in this view.";
    default:                     return (e && e.message) || `${s} call failed.`;
  }
}
async function callTool(server, tool, input, opts){
  if(!S.mcp) throw { code:"capability_disabled", message:"no mcp", server };
  return S.mcp.callTool(server, tool, input, opts);
}
function onWatch(key, ev, assign){
  if(ev.type === "data"){
    delete S.errs[key];
    assign(ev.result);
  }else{
    const e = ev.error || {};
    S.errs[key] = { code:e.code, message:errCopy(e) };
    if(AUTHZ.has(e.code) || LIFECYCLE.has(e.code)) assign(null, true);   // retract
  }
  render();
}
function startWatches(){
  for(const b of BOARDS){
    S.mcp.watchTool(TRELLO, "trelloReadCard",
      { action:"list_by_board", boardIdOrUrl:b.id, filter:"open" },
      ev => onWatch("cards:"+b.key, ev, (res,drop) => {
        S.cards[b.key] = drop ? null : { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
      }),
      { refetchInterval:180000, cache:{ staleTime:60000 } });
  }
  syncCalendarWatch();
}
/* only ever the day in view — one watch, re-registered when the day changes */
function syncCalendarWatch(){
  const a = startOfDay(S.anchor), b = addDays(a,1);
  const key = iso(a);
  if(S.calRange === key) return;
  S.calRange = key;
  if(S.calUnsub){ try{ S.calUnsub(); }catch(_){} S.calUnsub=null; }
  if(!S.mcp) return;
  S.calUnsub = S.mcp.watchTool(GCAL, "list_events",
    { calendarId:CAL_ID, startTime:iso(a), endTime:iso(b), pageSize:100 },
    ev => onWatch("cal", ev, (res,drop) => {
      S.events = drop ? null : { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
    }),
    { refetchInterval:120000, cache:{ staleTime:45000 } });
}

/* ---------------------------------------------------------------- model */
const BLOCK_RE = /(תקוע|חסום|מחכה|ממתין|blocked|waiting|stuck|on hold)/i;
const EST_RE   = /(?:~|est[:\s]|estimate[:\s]|\[)\s*(\d{1,3})\s*(m|min|minutes|h|hr|hours)?\b/i;

function normCard(n, board){
  const name = n.name||"", desc = n.desc||"";
  const due = n.due ? new Date(n.due) : null;
  const last = n.lastActivityAt ? new Date(n.lastActivityAt) : null;
  const now = new Date();
  let est = null;
  const m = EST_RE.exec(desc) || EST_RE.exec(name);
  if(m){ const v=parseInt(m[1],10), u=(m[2]||"m").toLowerCase();
         est = u[0]==="h" ? v*60 : v; if(!(est>0 && est<=480)) est=null; }
  return {
    id:n.id, name, desc,
    url:n.url || n.webUrl || "",
    shortLink: shortLinkOf(n.url || n.webUrl),
    listId: n.list ? n.list.id : null,
    boardKey:board.key, boardName:board.name,
    due, dueComplete:!!n.dueComplete, lastActivityAt:last,
    stalled: last ? daysBetween(last, now) >= STALL_DAYS : false,
    blocked: BLOCK_RE.test(name) || BLOCK_RE.test(desc),
    overdue: !!(due && !n.dueComplete && due < now && !sameDay(due, now)),
    dueToday: !!(due && sameDay(due, now)),
    est, deep: board.kind === "deep",
    isStats: name === STATS_CARD_NAME
  };
}
function allCards(){
  const out=[];
  for(const b of BOARDS){
    const bag = S.cards[b.key];
    if(!bag || !bag.payload) continue;
    for(const n of ((bag.payload.cards && bag.payload.cards.nodes) || [])) out.push(normCard(n,b));
  }
  return out;
}
const evStart = e => e.start && e.start.dateTime ? new Date(e.start.dateTime) : (e.start && e.start.date ? new Date(e.start.date) : null);
const evEnd   = e => e.end   && e.end.dateTime   ? new Date(e.end.dateTime)   : (e.end   && e.end.date   ? new Date(e.end.date)   : null);

function allEvents(){
  const p = S.events && S.events.payload;
  return ((p && p.events) || [])
    .filter(e => e.status !== "cancelled")
    .map(e => {
      const d = e.description || "";
      const link = shortLinkOf(d);
      const mine = d.includes(DF_MARK);
      return {
        raw:e, id:e.id, summary:e.summary || "(untitled)",
        start:evStart(e), end:evEnd(e),
        allDay: !!(e.start && e.start.date && !e.start.dateTime),
        isTask: mine || !!link, mine, cardShort:link,
        deep: e.colorId === "5"
      };
    })
    .filter(e => e.start && e.end);
}
const overlapsDay = (e,d) => { const a=startOfDay(d), b=addDays(a,1); return e.start < b && e.end > a; };

/* occupied minutes, work-session buffers baked in */
function busyFor(date, ignoreEventId){
  const out=[];
  for(const e of allEvents()){
    if(e.allDay || !overlapsDay(e,date)) continue;
    if(ignoreEventId && e.id === ignoreEventId) continue;
    const pad = (e.isTask && e.deep) ? BUFFER_MIN : 0;
    const s  = sameDay(e.start,date) ? minsOf(e.start) : 0;
    const en = sameDay(e.end,date)   ? minsOf(e.end)   : 24*60;
    out.push({ s:s-pad, e:en+pad });
  }
  return out;
}
function existingBlocks(date){
  const evs = allEvents().filter(e => e.isTask && !e.allDay && overlapsDay(e,date));
  const deep = evs.filter(e => e.deep).length;
  return { deep, small: evs.length-deep, total: evs.length, foreign: evs.filter(e=>!e.mine).length };
}

/* card behind a block, if we can resolve one */
function cardFor(ev){
  if(!ev.cardShort) return null;
  return allCards().find(c => c.shortLink === ev.cardShort && !c.isStats) || null;
}

/* ---------------------------------------------------------------- stats */
function parseStats(card){
  if(!card) return null;
  const d = card.desc || "";
  const i = d.indexOf(ST_OPEN), j = d.indexOf(ST_CLOSE);
  if(i<0 || j<0) return { ...DEFAULT_STATS };
  try{ return Object.assign({}, DEFAULT_STATS, JSON.parse(d.slice(i+ST_OPEN.length, j).trim())); }
  catch(_){ return { ...DEFAULT_STATS }; }
}
const statsCard = () => allCards().find(c => c.isStats) || null;

async function saveStats(next){
  S.stats = next;
  const card = statsCard();
  const id = card ? card.id : S.statsCardId;
  if(!id) return;
  S.statsCardId = id;
  const body = "DayFlow widget state store. Machine-managed — edit via the widget, not by hand.\n\n"
             + ST_OPEN + "\n" + JSON.stringify(next) + "\n" + ST_CLOSE + "\n";
  try{
    await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:id, desc:body });
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
  }catch(e){ toast(errCopy(e), true); }
}
function bumpCategory(cat, field){
  const st = S.stats || { ...DEFAULT_STATS };
  st.categories = st.categories || {};
  const c = st.categories[cat] || { picked:0, done:0, skipped:0 };
  c[field] = (c[field]||0)+1;
  st.categories[cat] = c;
  return st;
}
function catWeight(cat){
  const c = S.stats && S.stats.categories && S.stats.categories[cat];
  if(!c || !c.picked) return 0;
  return ((c.done/c.picked) - 0.5) * 0.8;
}
const rollInfo = c => (S.stats && S.stats.rollovers && S.stats.rollovers[c.id]) || null;
const ageDays = c => { const r = rollInfo(c); return r ? (r.count||0) : 0; };
const isAging = c => ageDays(c) >= AGING_DAYS;

/* ---------------------------------------------------------------- engine */
function tierOf(c){
  if(c.overdue && (c.blocked||c.stalled)) return 1;
  if(c.overdue) return 2;
  if(c.dueToday) return 3;
  if(c.blocked || c.stalled) return 4;
  if(c.due) return 5;
  return 6;
}
function candidates(){
  return allCards().filter(c => !c.isStats && !c.dueComplete && c.boardKey !== "today" && c.listId !== LIST_DONE);
}
function rankCards(pool){
  return pool.slice().sort((a,b) => {
    const ta=tierOf(a), tb=tierOf(b);
    if(ta!==tb) return ta-tb;
    const aa=isAging(a)?1:0, ab=isAging(b)?1:0;
    if(aa!==ab) return ab-aa;
    const wa=catWeight(a.boardName), wb=catWeight(b.boardName);
    if(Math.abs(wa-wb)>0.001) return wb-wa;
    const da=a.due?a.due.getTime():Infinity, db=b.due?b.due.getTime():Infinity;
    if(da!==db) return da-db;
    return (a.lastActivityAt?a.lastActivityAt.getTime():0) - (b.lastActivityAt?b.lastActivityAt.getTime():0);
  });
}
function freeWindows(busy, winS, winE){
  const merged=[];
  for(const iv of busy.slice().sort((x,y)=>x.s-y.s)){
    if(!merged.length || iv.s > merged[merged.length-1].e) merged.push({s:iv.s,e:iv.e});
    else merged[merged.length-1].e = Math.max(merged[merged.length-1].e, iv.e);
  }
  const free=[]; let cur=winS;
  for(const iv of merged){
    if(iv.s > cur) free.push({ s:cur, e:Math.min(iv.s, winE) });
    cur = Math.max(cur, iv.e);
    if(cur >= winE) break;
  }
  if(cur < winE) free.push({ s:cur, e:winE });
  return free.filter(f => f.e-f.s > 0);
}
function findSlots(busy, winS, winE, dur, pad, max, fromMin){
  const need = dur + pad*2, out=[];
  for(const f of freeWindows(busy, winS, winE)){
    let s = Math.max(f.s, fromMin==null?winS:fromMin);
    s = Math.ceil(s/SNAP_MIN)*SNAP_MIN;
    while(s + need <= f.e){
      out.push({ s:s+pad, e:s+pad+dur });
      if(out.length >= max) return out;
      s += SNAP_MIN;
    }
  }
  return out;
}
function planFor(date, mode, picked){
  const have = existingBlocks(date);
  const smallCap = Math.max(0, (mode==="short"?2:MAX_SMALL) - have.small);
  const deepCap  = Math.max(0, (mode==="short"?0:MAX_DEEP)  - have.deep);

  const winS = DAY_START_H*60, winE = DAY_END_H*60;
  const nowMin = sameDay(date,new Date()) ? Math.ceil(minsOf(new Date())/SNAP_MIN)*SNAP_MIN : null;

  let pool = candidates();
  if(mode==="pick" && picked && picked.length){
    const set = new Set(picked);
    pool = pool.filter(c => set.has(c.id));
  }
  const already = new Set(allEvents().filter(e => e.isTask && overlapsDay(e,date) && e.cardShort).map(e => e.cardShort));
  pool = pool.filter(c => !c.shortLink || !already.has(c.shortLink));

  const ranked = rankCards(pool);
  const placed = [], live = busyFor(date);

  for(const c of ranked.filter(x=>x.deep).slice(0,deepCap)){
    const dur = c.est || DEEP_DEFAULT;
    const s = findSlots(live, winS, winE, dur, BUFFER_MIN, 1, nowMin)[0];
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"deep" });
    live.push({ s:s.s-BUFFER_MIN, e:s.e+BUFFER_MIN });
  }
  for(const c of ranked.filter(x=>!x.deep).slice(0,smallCap)){
    const s = findSlots(live, winS, winE, SMALL_MIN, 0, 1, nowMin)[0];
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"small" });
    live.push({ s:s.s, e:s.e });
  }
  placed.sort((a,b)=>a.s-b.s);
  return placed;
}
async function applyPlan(date, mode, picked){
  if(S.busy) return;
  S.busy = true; render();
  const placed = planFor(date, mode, picked);
  let ok=0;
  for(const p of placed){
    try{
      await createBlock(p.card, atMin(date,p.s), atMin(date,p.e), p.kind==="deep");
      ok++;
      const st = bumpCategory(p.card.boardName,"picked");
      st.rollovers = st.rollovers || {};
      st.rollovers[p.card.id] = st.rollovers[p.card.id] || { first:dayKey(date), count:0 };
      S.stats = st;
    }catch(e){
      toast(errCopy(e), true);
      if(AUTHZ.has(e && e.code)) break;
    }
  }
  const st = S.stats || { ...DEFAULT_STATS };
  st.plans = st.plans || {};
  st.plans[dayKey(date)] = { mode, n:ok, at:Date.now() };
  const keys = Object.keys(st.plans).sort();
  while(keys.length > 30) delete st.plans[keys.shift()];
  await saveStats(st);
  await refreshCalendar();
  S.busy = false;
  if(ok) toast(`Scheduled ${ok} task${ok===1?"":"s"}.`);
  else if(placed.length===0) toast("Nothing to add — the day is already full.");
  render();
}
async function rolloverSweep(){
  const st = S.stats || { ...DEFAULT_STATS };
  const today = dayKey(new Date());
  if(st.lastSweep === today) return;
  st.rollovers = st.rollovers || {};
  const open = new Set(candidates().map(c=>c.id));
  for(const [id,r] of Object.entries(st.rollovers)){
    if(!open.has(id)){ delete st.rollovers[id]; continue; }
    if(r.last !== today){ r.count = (r.count||0)+1; r.last = today; }
  }
  st.lastSweep = today;
  await saveStats(st);
}

/* ---------------------------------------------------------------- writes */
async function createBlock(card, start, end, deep){
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary:(deep?"🎵 ":"• ") + card.name,
    startTime:iso(start), endTime:iso(end),
    description:`${DF_MARK} DayFlow block.\nOriginal: ${card.url}`,
    colorId: deep ? "5" : "9"
  });
  return res.payload;
}
const moveBlock = (id,start,end) => callTool(GCAL, "update_event",
  { calendarId:CAL_ID, eventId:id, startTime:iso(start), endTime:iso(end), notificationLevel:"NONE" });
const deleteBlock = id => callTool(GCAL, "delete_event",
  { calendarId:CAL_ID, eventId:id, notificationLevel:"NONE" });
async function refreshCalendar(){ try{ await S.mcp.invalidate(GCAL, "list_events"); }catch(_){} }

async function completeItem(item){
  const card = item.card;
  const key = card ? card.id : item.ev.id;
  if(S.pending.has(key)) return;
  S.pending.add(key); render();
  try{
    if(card){
      await callTool(TRELLO, "trelloWriteCard", { action:"mark_done", cardId:card.id });
      if(card.boardKey === "today" && card.listId !== LIST_DONE)
        await callTool(TRELLO, "trelloWriteCard", { action:"move", cardId:card.id, listId:LIST_DONE, pos:"top" });
    }
    celebrate();
    const st = bumpCategory(card ? card.boardName : "—", "done");
    const today = dayKey(new Date());
    st.history = st.history || [];
    let h = st.history.find(x=>x.d===today);
    if(!h){ h={ d:today, done:0 }; st.history.push(h); }
    h.done++;
    while(st.history.length > 60) st.history.shift();
    if(st.lastCompletionDate !== today){
      st.streak = (st.lastCompletionDate === dayKey(addDays(new Date(),-1))) ? (st.streak||0)+1 : 1;
      st.lastCompletionDate = today;
    }
    if(card && st.rollovers) delete st.rollovers[card.id];
    await saveStats(st);
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    toast("Done.");
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(key); render(); }
}

/* "Not now" — push this task to the next free slot later the SAME day. */
async function postpone(item){
  const date = startOfDay(S.anchor);
  const dur = Math.max(SNAP_MIN, minsOf(item.ev.end) - minsOf(item.ev.start));
  const pad = item.ev.deep ? BUFFER_MIN : 0;
  const nowMin = sameDay(date, new Date()) ? minsOf(new Date()) : DAY_START_H*60;
  /* must land strictly after both "now" and where it currently sits */
  const from = Math.ceil((Math.max(nowMin, minsOf(item.ev.end)) + 1)/SNAP_MIN)*SNAP_MIN;

  const slot = findSlots(busyFor(date, item.ev.id), DAY_START_H*60, DAY_END_H*60, dur, pad, 1, from)[0];
  if(!slot){
    toast("No free time left today — try Re-plan or move it to tomorrow.", true);
    return;
  }
  if(S.pending.has(item.ev.id)) return;
  S.pending.add(item.ev.id); render();
  try{
    await moveBlock(item.ev.id, atMin(date,slot.s), atMin(date,slot.e));
    if(item.card) await saveStats(bumpCategory(item.card.boardName, "skipped"));
    await refreshCalendar();
    toast(`Moved to ${fmtRange(atMin(date,slot.s), atMin(date,slot.e))}.`);
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(item.ev.id); render(); }
}

async function removeItem(item){
  const name = item.card ? item.card.name : item.ev.summary;
  const ok = await confirmDialog("Remove this?", name + (item.card ? "\n\nThe card is archived in Trello and its time block is cleared." : "\n\nThe time block is cleared."), "Remove");
  if(!ok) return;
  S.pending.add(item.ev.id); render();
  try{
    if(item.card){
      await callTool(TRELLO, "trelloWriteCard", { action:"archive", cardId:item.card.id });
      const st = bumpCategory(item.card.boardName, "skipped");
      if(st.rollovers) delete st.rollovers[item.card.id];
      await saveStats(st);
      await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    }
    await deleteBlock(item.ev.id);
    await refreshCalendar();
    toast("Removed.");
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(item.ev.id); render(); }
}

/* ---------------------------------------------------------------- agenda */
/* One ordered list for the viewed day: task blocks (actionable) + meetings. */
function agenda(){
  const date = startOfDay(S.anchor);
  const items = allEvents()
    .filter(e => !e.allDay && overlapsDay(e,date))
    .map(e => {
      const card = e.isTask ? cardFor(e) : null;
      return {
        ev:e, card,
        task:e.isTask,
        title: card ? card.name : e.summary,
        s:minsOf(e.start), e2:minsOf(e.end),
        done: !!(card && card.dueComplete)
      };
    })
    .sort((a,b) => a.s - b.s || a.e2 - b.e2);
  return items;
}
function splitAgenda(){
  const items = agenda();
  const isToday = sameDay(S.anchor, new Date());
  const nowMin = minsOf(new Date());
  const open = items.filter(i => i.task && !i.done);

  let current = null;
  if(isToday){
    current = open.find(i => i.s <= nowMin && i.e2 > nowMin)     // happening now
           || open.find(i => i.e2 > nowMin)                       // next up
           || null;
  }else{
    current = open[0] || null;
  }
  const meetingNow = isToday
    ? items.find(i => !i.task && i.s <= nowMin && i.e2 > nowMin) || null
    : null;

  /* a task whose slot already passed isn't "later" — it's unfinished.
     It keeps its own group so "Later today" stays a truthful forecast. */
  const missed = isToday
    ? items.filter(i => i !== current && i.task && !i.done && i.e2 <= nowMin)
    : [];
  const rest = items.filter(i =>
    i !== current && i !== meetingNow && missed.indexOf(i) < 0 && (!isToday || i.e2 > nowMin));
  const doneCount = items.filter(i => i.task && i.done).length;
  return { items, current, meetingNow, rest, missed, doneCount, open };
}

/* ---------------------------------------------------------------- render */
function render(){
  if(render._q) return;
  render._q = true;
  requestAnimationFrame(()=>{
    render._q = false;
    try{ paint(); }catch(e){ console.error(e); }
  });
}

function paint(){
  const d = S.anchor, today = new Date();
  $("#dateLabel").textContent = `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  const delta = daysBetween(today, d);
  $("#dateRel").textContent = delta===0 ? "today" : delta===1 ? "tomorrow" : delta===-1 ? "yesterday" : "";

  const main = $("#main");
  main.innerHTML = "";
  $("#foot").hidden = true;

  /* no connector bridge at all in this view */
  if(S.noMcp){
    main.appendChild(stateCard("🔌","Live data isn't available here",
      "DayFlow needs the Trello and Google Calendar connectors. Open it from claude.ai with both connected."));
    return;
  }
  /* Without the day's events there is nothing truthful to show — say why,
     rather than rendering an empty day as though it were a real one. */
  const firstErr = Object.values(S.errs)[0];
  if(!S.events && firstErr){
    const transient = !AUTHZ.has(firstErr.code) && !LIFECYCLE.has(firstErr.code);
    main.appendChild(stateCard("🔌","Can't reach your data",
      firstErr.message + (transient ? " Your day will appear as soon as it responds." : "")));
    return;
  }
  if(!S.ready || !S.events){ main.appendChild(el("div","skel")); return; }

  /* Saturday: nothing, quietly */
  if(sameDay(d,today) && d.getDay() === 6){
    main.appendChild(stateCard("🕯️","Shabbat","No scheduling today. Enjoy it."));
    return;
  }
  /* Friday: ask before planning anything */
  if(sameDay(d,today) && d.getDay() === 5 && !S.fridayAnswered && !(S.stats && S.stats.plans && S.stats.plans[dayKey(d)])){
    main.appendChild(fridayCard());
    return;
  }

  const { current, meetingNow, rest, missed, doneCount, open } = splitAgenda();

  if(meetingNow) main.appendChild(meetingNowRow(meetingNow));

  if(current) main.appendChild(nowCard(current));
  else main.appendChild(emptyNow(doneCount));

  const upcoming = rest.filter(i => !i.done);
  if(upcoming.length) main.appendChild(section("Later today", upcoming));
  if(missed.length)   main.appendChild(section("Earlier — not done", missed));

  /* transient trouble: keep data, say it once, quietly */
  const soft = Object.values(S.errs).find(e => !AUTHZ.has(e.code) && !LIFECYCLE.has(e.code));
  if(soft){
    const b = el("div","banner");
    b.style.marginTop = "20px";
    b.appendChild(el("div",null,soft.message));
    main.appendChild(b);
  }

  $("#foot").hidden = false;
  $("#sStreak").textContent = (S.stats && S.stats.streak) || 0;
  $("#sDone").textContent = doneCount;
  $("#sLeft").textContent = open.length;
  $("#replanBtn").disabled = !!S.busy;
  $("#replanBtn").textContent = S.busy ? "Planning…" : "Re-plan day";
}

function section(label, list){
  const sec = el("section","later");
  const lh = el("div","lh");
  lh.appendChild(el("span","eyebrow",label));
  lh.appendChild(el("span","eyebrow", String(list.length)));
  sec.appendChild(lh);
  const rows = el("div","rows");
  for(const i of list) rows.appendChild(agendaRow(i));
  sec.appendChild(rows);
  return sec;
}

function nowCard(item){
  const isToday = sameDay(S.anchor, new Date());
  const nowMin = minsOf(new Date());
  const live = isToday && item.s <= nowMin && item.e2 > nowMin;

  const box = el("div","now" + (live ? " live" : ""));
  const when = el("div","when");
  when.appendChild(el("span","eyebrow", live ? "Now" : "Next"));
  when.appendChild(el("span","clock", fmtRange(item.ev.start, item.ev.end)));
  if(live) when.appendChild(el("span","chip live","in progress"));
  else if(isToday){
    const mins = item.s - nowMin;
    if(mins > 0) when.appendChild(el("span","chip", mins < 60 ? `in ${mins} min` : `in ${Math.round(mins/60)}h`));
  }
  box.appendChild(when);

  const h = el("h2"); h.appendChild(bidiSpan(item.title)); box.appendChild(h);

  const tags = el("div","tags");
  const c = item.card;
  if(c){
    if(isAging(c))      tags.appendChild(el("span","chip age", `waiting ${ageDays(c)} days`));
    else if(c.overdue)  tags.appendChild(el("span","chip crit","overdue"));
    else if(c.dueToday) tags.appendChild(el("span","chip","due today"));
    if(c.blocked)       tags.appendChild(el("span","chip","blocked"));
    if(c.deep)          tags.appendChild(el("span","chip deep","work session"));
    const bn = el("span","chip"); bidi(bn, c.boardName); tags.appendChild(bn);
  }else if(!item.ev.mine){
    tags.appendChild(el("span","chip","from your morning routine"));
  }
  if(tags.children.length) box.appendChild(tags);

  const acts = el("div","acts");
  const doneBtn = el("button","btn primary","Done");
  doneBtn.addEventListener("click", ()=>completeItem(item));
  const laterBtn = el("button","btn","Not now");
  laterBtn.title = "Move to the next free slot later today";
  laterBtn.addEventListener("click", ()=>postpone(item));
  const skipBtn = el("button","btn quiet","Remove");
  skipBtn.addEventListener("click", ()=>removeItem(item));
  if(S.pending.has(item.ev.id) || (item.card && S.pending.has(item.card.id))){
    doneBtn.disabled = laterBtn.disabled = skipBtn.disabled = true;
  }
  acts.appendChild(doneBtn); acts.appendChild(laterBtn); acts.appendChild(skipBtn);
  box.appendChild(acts);
  return box;
}

function emptyNow(doneCount){
  if(doneCount) return stateCard("✓","Day clear", `${doneCount} task${doneCount===1?"":"s"} done. Nothing else scheduled.`, true);
  return stateCard("—","Nothing scheduled","Re-plan to pull in today's priorities.", true);
}

function stateCard(glyph, title, body, withReplan){
  const s = el("div","state");
  s.appendChild(el("div","big",glyph));
  s.appendChild(el("h2",null,title));
  s.appendChild(el("p",null,body));
  if(withReplan){
    const a = el("div","acts");
    const b = el("button","btn","Re-plan day");
    b.disabled = !!S.busy;
    b.addEventListener("click", ()=>applyPlan(startOfDay(S.anchor),"normal"));
    a.appendChild(b); s.appendChild(a);
  }
  return s;
}

function meetingNowRow(item){
  const r = el("div","meeting-now");
  r.appendChild(el("span","mn-time", fmtRange(item.ev.start, item.ev.end)));
  const n = el("span","mn-name"); bidi(n, item.title); r.appendChild(n);
  return r;
}

function agendaRow(item){
  const r = el("div","row" + (item.task ? "" : " meeting") + (item.ev.deep ? " deep" : "") + (item.done ? " done" : ""));
  r.appendChild(el("span","t", hhmm(item.ev.start)));
  const n = el("span","n");
  n.appendChild(bidiSpan(item.title));
  if(!item.task) n.appendChild(el("span","eyebrow sub","meeting"));
  r.appendChild(n);

  if(item.task){
    const acts = el("div","acts-inline");
    const ok = el("button","mini ok","✓");
    ok.title = "Done"; ok.setAttribute("aria-label","Mark done");
    ok.addEventListener("click", ()=>completeItem(item));
    const lt = el("button","mini later-btn","↷");
    lt.title = "Not now — move later today"; lt.setAttribute("aria-label","Move later today");
    lt.addEventListener("click", ()=>postpone(item));
    const dl = el("button","mini del","✕");
    dl.title = "Remove"; dl.setAttribute("aria-label","Remove");
    dl.addEventListener("click", ()=>removeItem(item));
    if(S.pending.has(item.ev.id)) [ok,lt,dl].forEach(b=>b.disabled=true);
    acts.appendChild(ok); acts.appendChild(lt); acts.appendChild(dl);
    r.appendChild(acts);
  }
  return r;
}

function fridayCard(){
  const s = el("div","state");
  s.appendChild(el("div","big","🌤️"));
  s.appendChild(el("h2",null,"What do you want today to look like?"));
  s.appendChild(el("p",null,"It's Friday. Nothing is scheduled until you choose."));
  const opts = el("div","opts");
  const mk = (t,d,fn) => {
    const b = el("button","opt"); b.type="button";
    b.appendChild(el("span","ot",t)); b.appendChild(el("span","od",d));
    b.addEventListener("click", fn); return b;
  };
  opts.appendChild(mk("Normal, but short","Two quick tasks, no work session.",
    ()=>{ S.fridayAnswered=true; applyPlan(startOfDay(new Date()),"short"); }));
  opts.appendChild(mk("Only what's already there","Keep the day as it stands — nothing added.",
    ()=>{ S.fridayAnswered=true; render(); }));
  opts.appendChild(mk("Take the day off","Nothing scheduled.",
    ()=>{ S.fridayAnswered=true; render(); toast("Day off."); }));
  s.appendChild(opts);
  return s;
}

/* ---------------------------------------------------------------- dialog */
function confirmDialog(title, detail, okLabel){
  return new Promise(resolve => {
    const scrim = el("div","scrim");
    const dlg = el("div","dialog");
    dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
    const h = el("div","dh");
    h.appendChild(el("h3",null,title));
    const p = el("p"); bidi(p, detail); h.appendChild(p);
    dlg.appendChild(h);
    const f = el("div","df");
    const cancel = el("button","btn quiet","Keep");
    const go = el("button","btn primary",okLabel);
    cancel.addEventListener("click", ()=>{ close(); resolve(false); });
    go.addEventListener("click", ()=>{ close(); resolve(true); });
    f.appendChild(cancel); f.appendChild(go);
    dlg.appendChild(f);
    function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape"){ close(); resolve(false); } }
    document.addEventListener("keydown", onKey);
    scrim.addEventListener("click", e => { if(e.target===scrim){ close(); resolve(false); } });
    scrim.appendChild(dlg); document.body.appendChild(scrim); go.focus();
  });
}

/* ---------------------------------------------------------------- flourish */
const fx = $("#fx"), fxc = fx.getContext("2d");
let parts=[], raf=null;
function fitFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", fitFx); fitFx();
function celebrate(){
  chime();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--done","--age"].map(v => cs.getPropertyValue(v).trim() || "#0E7C86");
  const host = document.querySelector(".now") || document.querySelector(".state");
  const r = host ? host.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/3, width:0, height:0 };
  const ox = r.left + r.width/2, oy = r.top + r.height/2;
  for(let i=0;i<54;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({ x:ox, y:oy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2, r:2+Math.random()*2.6,
                 c:cols[i%cols.length], life:1, rot:Math.random()*6 });
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.life -= 0.014; p.rot += 0.15;
    fxc.save(); fxc.globalAlpha = Math.max(0,p.life);
    fxc.translate(p.x,p.y); fxc.rotate(p.rot);
    fxc.fillStyle = p.c; fxc.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2); fxc.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (fxc.clearRect(0,0,innerWidth,innerHeight), null);
}
let actx=null;
function chime(){
  if(S.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*0.08);
      g.gain.linearRampToValueAtTime(0.075,t+i*0.08+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.4);
      o.connect(g); g.connect(actx.destination); o.start(t+i*0.08); o.stop(t+i*0.08+0.42);
    });
  }catch(_){}
}
function toast(msg, isErr){
  const t = el("div","toast"+(isErr?" err":""));
  bidi(t, msg);
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 3400);
}

/* ---------------------------------------------------------------- boot */
function goDay(n){
  S.anchor = n===0 ? startOfDay(new Date()) : addDays(S.anchor, n);
  syncCalendarWatch();
  render();
}
$("#prev").addEventListener("click", ()=>goDay(-1));
$("#next").addEventListener("click", ()=>goDay(1));
$("#todayBtn").addEventListener("click", ()=>goDay(0));
$("#replanBtn").addEventListener("click", ()=>{
  const d = new Date();
  if(sameDay(S.anchor,d) && d.getDay()===6){ toast("It's Shabbat — nothing gets scheduled."); return; }
  applyPlan(startOfDay(S.anchor), "normal");
});
setInterval(render, 60000);   // keep "now" honest

(async function boot(){
  render();
  let mcp = null;
  try{ mcp = await (window.claude && window.claude.use ? window.claude.use("mcp") : null); }
  catch(_){ mcp = null; }

  if(!mcp){ S.noMcp = true; S.ready = true; render(); return; }
  S.mcp = mcp;
  startWatches();

  const settle = setInterval(async ()=>{
    if(!S.cards.today || !S.events) return;
    clearInterval(settle);
    S.ready = true;

    const sc = statsCard();
    S.stats = parseStats(sc) || { ...DEFAULT_STATS };
    if(sc) S.statsCardId = sc.id;
    S.muted = !!S.stats.mute;

    await rolloverSweep();

    const d = new Date();
    const planned = S.stats.plans && S.stats.plans[dayKey(d)];
    if(!planned && d.getDay()!==6 && d.getDay()!==5) await applyPlan(startOfDay(d),"normal");
    render();
  }, 400);
  setTimeout(()=>{ clearInterval(settle); if(!S.ready){ S.ready=true; render(); } }, 20000);
})();
</script>
