<title>DayFlow</title>
<style>
/* ============================================================
   DayFlow — one day, one question: what's next?
   Light palette on bare :root; dark redefines TOKENS ONLY.
   ============================================================ */
:root{
  --bg:#EDEEEF;
  --surface:#FFFFFF;
  --surface-2:#F4F5F6;
  --ink:#14171A;
  --ink-2:#5A626A;
  --ink-3:#8A939B;
  --line:#DEE1E4;
  --line-2:#C7CCD1;

  --accent:#00A3B5;
  --accent-ink:#00707D;
  --accent-soft:rgba(0,163,181,.13);
  --accent-line:rgba(0,163,181,.42);
  --on-accent:#04252A;

  --crit:#E01B24;
  --age:#E08700;
  --age-soft:rgba(224,135,0,.16);
  --done:#00A150;
  --deep:#6D3BEA;
  --deep-soft:rgba(109,59,234,.14);

  /* one hue per board — hues chosen to stay clear of the state colours
     (red overdue / amber aging / green done), which always carry text too */
  --b-projects:#6D3BEA;  --b-projects-soft:rgba(109,59,234,.14);
  --b-sidurim:#0B6BF0;   --b-sidurim-soft:rgba(11,107,240,.14);
  --b-sedco:#E85D04;     --b-sedco-soft:rgba(232,93,4,.15);
  --b-today:#D6008F;     --b-today-soft:rgba(214,0,143,.13);
  --b-none:#8A939B;      --b-none-soft:rgba(138,147,155,.11);

  --shadow:0 1px 2px rgba(16,20,26,.05), 0 8px 24px rgba(16,20,26,.06);
  --shadow-lg:0 18px 50px rgba(16,20,26,.16);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1215;
    --surface:#171B1F;
    --surface-2:#1E2328;
    --ink:#EAEDEF;
    --ink-2:#A4ADB5;
    --ink-3:#6E777F;
    --line:#272D33;
    --line-2:#3A424A;

    --accent:#22E0F0;
    --accent-ink:#5BEBF7;
    --accent-soft:rgba(34,224,240,.14);
    --accent-line:rgba(34,224,240,.46);
    --on-accent:#04252A;

    --crit:#FF6B6B;
    --age:#FFB01F;
    --age-soft:rgba(255,176,31,.18);
    --done:#34D97E;
    --deep:#B69CFF;
    --deep-soft:rgba(182,156,255,.18);

    --b-projects:#B69CFF;  --b-projects-soft:rgba(182,156,255,.18);
    --b-sidurim:#5AB4FF;   --b-sidurim-soft:rgba(90,180,255,.18);
    --b-sedco:#FF9A3D;     --b-sedco-soft:rgba(255,154,61,.18);
    --b-today:#FF7AD9;     --b-today-soft:rgba(255,122,217,.18);
    --b-none:#6E777F;      --b-none-soft:rgba(110,119,127,.16);

    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1215;
  --surface:#171B1F;
  --surface-2:#1E2328;
  --ink:#EAEDEF;
  --ink-2:#A4ADB5;
  --ink-3:#6E777F;
  --line:#272D33;
  --line-2:#3A424A;

  --accent:#22E0F0;
  --accent-ink:#5BEBF7;
  --accent-soft:rgba(34,224,240,.14);
  --accent-line:rgba(34,224,240,.46);
  --on-accent:#04252A;

  --crit:#FF6B6B;
  --age:#FFB01F;
  --age-soft:rgba(255,176,31,.18);
  --done:#34D97E;
  --deep:#B69CFF;
  --deep-soft:rgba(182,156,255,.18);

  --b-projects:#B69CFF;  --b-projects-soft:rgba(182,156,255,.18);
  --b-sidurim:#5AB4FF;   --b-sidurim-soft:rgba(90,180,255,.18);
  --b-sedco:#FF9A3D;   --b-sedco-soft:rgba(255,154,61,.18);
  --b-today:#FF7AD9;   --b-today-soft:rgba(255,122,217,.18);
  --b-none:#6E777F;    --b-none-soft:rgba(110,119,127,.16);

  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}

/* ---------------- shell ---------------- */
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 64px;}

.head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:26px;
}
.head .date{display:flex;align-items:baseline;gap:10px;min-width:0;}
.head .date h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}
.head .date .rel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
.nav{display:flex;gap:4px;align-items:center;}
.nav button{
  width:28px;height:28px;border-radius:7px;border:1px solid transparent;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{background:var(--surface);border-color:var(--line);color:var(--ink);}
.nav .todaybtn{font-size:17px;line-height:1;}

/* board identity: every element that represents a task carries its board hue */
.bk-projects{--bc:var(--b-projects);--bc-soft:var(--b-projects-soft);}
.bk-sidurim {--bc:var(--b-sidurim); --bc-soft:var(--b-sidurim-soft);}
.bk-sedco   {--bc:var(--b-sedco);   --bc-soft:var(--b-sedco-soft);}
.bk-today   {--bc:var(--b-today);   --bc-soft:var(--b-today-soft);}
.bk-none    {--bc:var(--b-none);    --bc-soft:var(--b-none-soft);}

/* ---------------- the hub ---------------- */
.now{
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:0;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.now::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--bc,var(--b-none));
}
.now.live{border-color:var(--bc,var(--accent-line));}

/* top strip: wall clock + status */
.hub-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px 10px;border-bottom:1px solid var(--line);
  background:var(--bc-soft,transparent);
}
.hub-clock{
  font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;
  font-weight:600;letter-spacing:-.02em;line-height:1;
}
.hub-clock .sec{font-size:14px;color:var(--ink-3);margin-left:1px;}
.hub-status{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}

.hub-body{padding:16px 18px 18px;}
.now .slot{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;margin-bottom:6px;
}
.now h2{
  margin:0 0 14px;font-size:21px;line-height:1.32;font-weight:600;
  letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere;
}
.now .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

/* remaining-time meter */
.meter{margin:0 0 14px;}
.meter .bar{
  height:6px;border-radius:99px;background:var(--surface-2);
  overflow:hidden;border:1px solid var(--line);
}
.meter .fill{
  height:100%;background:var(--bc,var(--accent));
  border-radius:99px;transition:width .9s linear;
}
.meter .lbl{
  display:flex;justify-content:space-between;gap:8px;margin-top:6px;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-3);
}
.meter .left{color:var(--ink);font-weight:600;}
.meter.over .left{color:var(--crit);}
.meter.over .fill{background:var(--crit);}

.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;
}
.chip.board{background:var(--bc-soft);color:var(--bc);border-color:transparent;font-weight:600;}
.chip.crit{background:transparent;color:var(--crit);border-color:var(--crit);}
.chip.age{background:var(--age-soft);color:var(--age);border-color:transparent;}
.chip.deep{background:var(--deep-soft);color:var(--deep);border-color:transparent;}
.chip.live{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);}

.btn{
  border:1px solid var(--line-2);background:var(--surface);
  border-radius:9px;padding:9px 16px;cursor:pointer;
  font-size:14px;font-weight:530;
  transition:background .15s,border-color .15s,transform .12s,opacity .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent);}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:9px 12px;}
.btn.icon{padding:0;width:42px;height:40px;display:grid;place-items:center;font-size:16px;line-height:1;}
.btn.icon.quiet{border-color:var(--line);background:transparent;}
.now .acts{gap:7px;}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* meeting-in-progress note above the answer */
.meeting-now{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;margin-bottom:10px;
  border-radius:11px;border:1px dashed var(--line-2);color:var(--ink-2);
  font-size:13.5px;background:var(--surface-2);
}
.meeting-now .mn-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:0 0 auto;}
.meeting-now .mn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------------- later ---------------- */
.later{margin-top:26px;}
.later.miss .row .t{color:var(--crit);}
.later .lh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.rows{display:flex;flex-direction:column;}

/* a row plus its expanded panel read as one unit, so the divider sits on the
   wrapper rather than between a row and its own details */
.item{display:flex;flex-direction:column;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.row{
  display:flex;align-items:center;gap:12px;
  padding:11px 4px;
  transition:opacity .2s;
}
.row .t{
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--ink-3);flex:0 0 42px;
}
.row .dot{
  flex:0 0 auto;width:8px;height:8px;border-radius:3px;
  background:var(--bc,var(--b-none));
}
.row.meeting .dot{background:transparent;border:1px solid var(--line-2);}
.row .n{flex:1 1 auto;min-width:0;font-size:14px;overflow-wrap:anywhere;}
.row .n .sub{display:block;margin-top:2px;}
/* shrink-to-fit titles: RTL text stays next to its timestamp */
.nt{display:inline-block;max-width:100%;vertical-align:top;}
.row.meeting{color:var(--ink-2);}
.row.meeting .n{font-style:normal;}
.row.deep .t{color:var(--deep);}
.row.done{opacity:.42;}
.row.done .n{text-decoration:line-through;text-decoration-thickness:1px;}

.acts-inline{display:flex;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .15s;}
.row:hover .acts-inline,.acts-inline:focus-within{opacity:1;}
@media (hover:none){.acts-inline{opacity:1;}}
.mini{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;font-size:14px;line-height:1;
  transition:background .14s,color .14s,border-color .14s,transform .18s;
}
.mini:hover{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink);transform:translateY(-1px);}
.mini:disabled{opacity:.4;cursor:not-allowed;}
.mini.on{border-color:var(--accent);color:var(--accent);}
.mini.ok:hover{color:var(--done);border-color:var(--done);}
.mini.later-btn:hover{color:var(--accent);border-color:var(--accent);}
.mini.del:hover{color:var(--crit);border-color:var(--crit);}

/* ---------------- expandable card detail ---------------- */
.details{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--ink-2);
}
/* indented to line up under the row's title, not its timestamp */
.item > .details{
  margin:0 4px 12px 62px;padding:11px 13px;border-top:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
}
@media (max-width:520px){ .item > .details{margin-left:16px;} }
.details .desc{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;}
.details .desc:last-child{margin-bottom:0;}
.details .clname{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin:10px 0 6px;
}
.details ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.details li{display:flex;gap:8px;align-items:flex-start;line-height:1.4;}
.details li .box{
  flex:0 0 auto;width:17px;height:17px;border-radius:5px;margin-top:1px;padding:0;
  border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;
  font-size:10px;color:transparent;cursor:pointer;
  transition:background .14s,border-color .14s,color .14s,transform .18s cubic-bezier(.2,.8,.25,1);
}
.details li .box:hover{border-color:var(--done);transform:scale(1.12);}
.details li .box:disabled{opacity:.5;cursor:progress;}
.details li.on .box{background:var(--done);border-color:var(--done);color:#fff;}
.details li.on .it{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;}
.details .it{min-width:0;overflow-wrap:anywhere;cursor:pointer;}
.details .it:hover{color:var(--ink);}
.details .muted{color:var(--ink-3);font-size:12.5px;}
.details .prog{
  height:4px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  overflow:hidden;margin-bottom:8px;
}
.details .prog i{display:block;height:100%;background:var(--done);}

.expand{
  border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 8px;border-radius:6px;
  transition:color .15s,background .15s;
}
.expand:hover{color:var(--ink);background:var(--surface-2);}

/* ---------------- footer ---------------- */
.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.foot .stats{display:flex;gap:16px;align-items:baseline;}
.foot .stat{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--ink-3);}
.foot .stat .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;}
.foot .stat .v.streak{color:var(--age);}
.foot .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}

/* ---------------- states ---------------- */
.state{
  text-align:center;padding:44px 24px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
}
.state .big{font-size:34px;line-height:1;margin-bottom:14px;}
.state h2{margin:0 0 8px;font-size:19px;letter-spacing:-.01em;text-wrap:balance;}
.state p{margin:0 auto;max-width:38ch;color:var(--ink-2);font-size:14px;}
.state .acts{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}


.banner{
  border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:16px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);
}
.banner.crit{border-color:var(--crit);color:var(--ink);}
.banner strong{display:block;color:var(--ink);margin-bottom:2px;}
.skel{height:112px;border-radius:16px;background:var(--surface-2);}
@media (prefers-reduced-motion:no-preference){
  .skel{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.55;}}
}

/* ---------------- dialog / toast ---------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,18,.44);display:grid;place-items:center;padding:20px;}
.dialog{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);max-width:390px;width:100%;overflow:hidden;}
@media (prefers-reduced-motion:no-preference){
  .dialog{animation:pop .2s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0;}}
}
.dialog .dh{padding:16px 17px 12px;}
.dialog .dh h3{margin:0;font-size:15px;}
.dialog .dh p{margin:6px 0 0;font-size:13px;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere;}
.dialog .df{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);}

/* settings */
.dialog.sheet{max-width:340px;}
.set{padding:14px 16px 6px;display:flex;flex-direction:column;gap:2px;}
.set-h{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:12px 0 6px;
}
.set-h:first-child{margin-top:0;}
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:5px 0;font-size:14px;
}
.set-k{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.set-v{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.set-dash,.set-u{font-family:var(--mono);font-size:11px;color:var(--ink-3);}
.num-in{
  width:52px;padding:5px 7px;border-radius:7px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:center;
}
.num-in.wide{width:76px;text-align:left;}
.num-in:focus{border-color:var(--accent);outline:none;}
.col-in{
  width:34px;height:26px;padding:0;border:1px solid var(--line-2);
  border-radius:7px;background:transparent;cursor:pointer;
}
.col-in::-webkit-color-swatch-wrapper{padding:2px;}
.col-in::-webkit-color-swatch{border:0;border-radius:5px;}
.toggle{
  padding:5px 12px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  transition:background .15s,color .15s,border-color .15s;
}
.toggle.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}

.pick{padding:8px 10px 4px;max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:2px;}
.pick-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;border:1px solid transparent;
  background:transparent;cursor:pointer;font-size:14px;color:var(--ink);
  transition:background .14s,border-color .14s;
}
.pick-row:hover{background:var(--surface-2);border-color:var(--line-2);}
.pick-row .dot{flex:0 0 auto;width:8px;height:8px;border-radius:3px;background:var(--bc,var(--b-none));}
.pick-row .n{flex:1 1 auto;min-width:0;overflow:hidden;}
.pick .muted{padding:14px;text-align:center;color:var(--ink-3);font-size:13px;}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;}
.toast{background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:22px;padding:8px 16px;font-size:13px;}
.toast.err{border-color:var(--crit);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .24s cubic-bezier(.2,.9,.3,1);}
  @keyframes tin{from{transform:translateY(10px);opacity:0;}}
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;}
</style>

<div class="wrap">
  <header class="head">
    <div class="date">
      <h1 id="dateLabel">—</h1>
      <span class="rel" id="dateRel"></span>
    </div>
    <nav class="nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button id="todayBtn" class="todaybtn" aria-label="Today">•</button>
      <button id="next" aria-label="Next day">›</button>
      <button id="setBtn" aria-label="Settings">⚙</button>
    </nav>
  </header>

  <main id="main"><div class="skel"></div></main>

  <footer class="foot" id="foot" hidden>
    <div class="stats">
      <span class="stat" title="Streak">🔥<span class="v streak" id="sStreak">0</span></span>
      <span class="stat" title="Done today">✓<span class="v" id="sDone">0</span></span>
      <span class="stat" title="Left today">◦<span class="v" id="sLeft">0</span></span>
    </div>
    <button class="btn quiet" id="replanBtn" aria-label="Re-plan day">↻</button>
  </footer>
</div>

<div class="toasts" id="toasts"></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* ==========================================================================
   DayFlow — minimal daily focus.

   Answers two questions and nothing else:
     1. What do I do right now?
     2. What else is left today?
   Plus one escape hatch: "not now" pushes a task to the next free slot
   later the same day.

   Connector call shapes were observed from real request/response pairs.
   ========================================================================== */

/* ---------------------------------------------------------------- config */
const WS   = "ari:cloud:trello::";
const bAri = id => WS + "board/workspace/6047bc9723ed9c3e9036b496/" + id;
const lAri = id => WS + "list/workspace/6047bc9723ed9c3e9036b496/" + id;

const TRELLO = "Trello";
const GCAL   = "Google Calendar";
const CAL_ID = "morsedero@gmail.com";

const BOARDS = [
  { key:"projects", id:bAri("692abd49a69c853bb71cb728"), name:"PROJECTS",   kind:"deep"  },
  { key:"sidurim",  id:bAri("693683bc8be8844147bbe82c"), name:"סידורים",    kind:"small" },
  { key:"sedco",    id:bAri("6a718220df5bd657f0636bc7"), name:"סדקו",       kind:"small" },
  { key:"today",    id:bAri("6a7a17e2ed53384c4f792d87"), name:"היום",       kind:"today" }
];
const LIST_DONE = lAri("6a7a17e6fa8d1b840074ed07");
const STATS_CARD_NAME = "📊 DayFlow Stats";

const SNAP_MIN = 15;
const AGING_DAYS = 5, STALL_DAYS = 3;

/* Everything the scheduler is allowed to argue about lives here and is
   editable from the settings panel; it persists in the Trello state card. */
const DEFAULTS = {
  dayStart:9, dayEnd:20,
  maxSmall:3, quickTotal:60,   // all quick tasks share one contiguous window
  maxDeep:1,  deepMin:90,
  buffer:15,
  dayOff:6,          // 0 Sun … 6 Sat; -1 = none
  sound:true,
  colors:{},         // boardKey -> hex, empty means the theme's own hue
  openEvents:["חמל"] // meetings tasks may run inside, by title
};
let CFG = { ...DEFAULTS, colors:{}, openEvents:DEFAULTS.openEvents.slice() };

function applyColors(){
  const root = document.documentElement;
  for(const b of BOARDS){
    const v = CFG.colors && CFG.colors[b.key];
    const prop = "--b-" + b.key;
    if(v) root.style.setProperty(prop, v);
    else  root.style.removeProperty(prop);
  }
}
function loadCfg(stats){
  const saved = (stats && stats.settings) || {};
  CFG = { ...DEFAULTS, ...saved,
          colors:{ ...(saved.colors || {}) },
          openEvents: Array.isArray(saved.openEvents) ? saved.openEvents.slice() : DEFAULTS.openEvents.slice() };
  /* settings saved before quick tasks shared one window */
  if(saved.smallMin && !saved.quickTotal) CFG.quickTotal = (+saved.smallMin) * (+saved.maxSmall || 3);
  delete CFG.smallMin;
  CFG.dayStart   = clamp(+CFG.dayStart||0, 0, 23);
  CFG.dayEnd     = clamp(+CFG.dayEnd||0, CFG.dayStart+1, 24);
  CFG.maxSmall   = clamp(Math.round(+CFG.maxSmall||0), 0, 12);
  CFG.maxDeep    = clamp(Math.round(+CFG.maxDeep||0), 0, 6);
  CFG.quickTotal = clamp(Math.round((+CFG.quickTotal||60)/5)*5, 5, 480);
  CFG.deepMin    = clamp(Math.round((+CFG.deepMin||90)/5)*5, 15, 480);
  CFG.buffer     = clamp(Math.round(+CFG.buffer||0), 0, 60);
  applyColors();
}
/* how long each quick task gets when they share the hour */
const quickSlice = n => Math.max(5, Math.round((CFG.quickTotal / Math.max(1,n)) / 5) * 5);

/* Meetings tasks may run inside: anything you've marked open, plus anything
   Google itself marks Free — that is what "Free" means. */
function permeable(e){
  if(!e || e.isTask) return false;
  if(e.raw && (e.raw.transparency === "transparent" || e.raw.availability === "AVAILABILITY_FREE")) return true;
  return (CFG.openEvents || []).indexOf(e.summary) >= 0;
}
async function toggleOpenEvent(name){
  const list = CFG.openEvents || (CFG.openEvents = []);
  const i = list.indexOf(name);
  if(i >= 0) list.splice(i,1); else list.push(name);
  await saveCfg();
}
async function saveCfg(){
  const st = S.stats || { ...DEFAULT_STATS };
  st.settings = { ...CFG };
  S.stats = st;
  applyColors();
  render();
  await saveStats(st);
}

const DF_MARK  = "[dayflow]";
const ST_OPEN  = "<!--DAYFLOW_STATE_V1";
const ST_CLOSE = "DAYFLOW_STATE_V1-->";

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const pad2 = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const sameDay = (a,b) => dayKey(a)===dayKey(b);
const hhmm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const minsOf = d => d.getHours()*60 + d.getMinutes();
const atMin = (base,m) => { const x=startOfDay(base); x.setMinutes(m); return x; };
const iso = d => new Date(d).toISOString();
const daysBetween = (a,b) => Math.floor((startOfDay(b)-startOfDay(a))/86400000);
const fmtRange = (a,b) => `${hhmm(a)}–${hhmm(b)}`;
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* per-field direction; the app chrome never flips */
function bidi(node,text){ node.setAttribute("dir","auto"); node.textContent = text==null?"":String(text); return node; }
/* An RTL title inside a wide LTR row would sit against the far edge, away from
   its timestamp. Wrapping it in a shrink-to-fit span keeps it beside the time
   while the text itself still lays out in its own direction. */
function bidiSpan(text){ const s = el("span","nt"); return bidi(s, text); }
const shortLinkOf = url => { const m=/trello\.com\/c\/([A-Za-z0-9]+)/.exec(url||""); return m?m[1]:null; };

/* ---------------------------------------------------------------- state */
const S = {
  anchor: startOfDay(new Date()),
  mcp:null, ready:false, busy:false,
  cards:{}, events:null, errs:{},
  lists:{},            // cardId -> {loading|checklists|error}
  collapsed:new Set(), // details are open by default; these were closed by hand
  ticking:new Set(),   // check items with a write in flight
  stats:null, statsCardId:null,
  calRange:null, calUnsub:null,
  muted:false,
  pending:new Set()
};
const DEFAULT_STATS = { v:1, streak:0, lastCompletionDate:null, history:[], categories:{}, rollovers:{}, plans:{}, mute:false };

/* ---------------------------------------------------------------- MCP */
const AUTHZ = new Set(["needs_reauth","server_not_connected","selection_required","blocked_by_policy","approval_required","not_in_manifest","server_not_found"]);
const LIFECYCLE = new Set(["not_granted","capability_disabled","capability_removed"]);

function errCopy(e){
  const s = (e && e.server) || "the connector";
  switch(e && e.code){
    case "needs_reauth":         return `Reconnect ${s} in claude.ai → Settings → Connectors.`;
    case "server_not_connected": return `Add ${s} in claude.ai → Settings → Connectors.`;
    case "selection_required":   return `Choose which ${s} account to use, then reload.`;
    case "blocked_by_policy":    return `Your organization blocks this ${s} tool.`;
    case "approval_required":    return `This ${s} action needs approval artifacts can't request yet.`;
    case "server_unavailable":   return `${s} is unreachable right now. Retrying shortly.`;
    case "not_in_manifest":      return `This page isn't allowed to call that ${s} tool.`;
    case "tool_error":           return (e.message || `${s} rejected the request.`);
    case "rate_limited":         return `Too many ${s} requests. Pausing briefly.`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed":   return "Live data isn't available in this view.";
    default:                     return (e && e.message) || `${s} call failed.`;
  }
}
async function callTool(server, tool, input, opts){
  if(!S.mcp) throw { code:"capability_disabled", message:"no mcp", server };
  return S.mcp.callTool(server, tool, input, opts);
}
function onWatch(key, ev, assign){
  if(ev.type === "data"){
    delete S.errs[key];
    assign(ev.result);
  }else{
    const e = ev.error || {};
    S.errs[key] = { code:e.code, message:errCopy(e) };
    if(AUTHZ.has(e.code) || LIFECYCLE.has(e.code)) assign(null, true);   // retract
  }
  render();
}
function startWatches(){
  for(const b of BOARDS){
    S.mcp.watchTool(TRELLO, "trelloReadCard",
      { action:"list_by_board", boardIdOrUrl:b.id, filter:"open" },
      ev => onWatch("cards:"+b.key, ev, (res,drop) => {
        S.cards[b.key] = drop ? null : { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
      }),
      { refetchInterval:180000, cache:{ staleTime:60000 } });
  }
  syncCalendarWatch();
}
/* only ever the day in view — one watch, re-registered when the day changes */
function syncCalendarWatch(){
  const a = startOfDay(S.anchor), b = addDays(a,1);
  const key = iso(a);
  if(S.calRange === key) return;
  S.calRange = key;
  if(S.calUnsub){ try{ S.calUnsub(); }catch(_){} S.calUnsub=null; }
  if(!S.mcp) return;
  S.calUnsub = S.mcp.watchTool(GCAL, "list_events",
    { calendarId:CAL_ID, startTime:iso(a), endTime:iso(b), pageSize:100 },
    ev => onWatch("cal", ev, (res,drop) => {
      S.events = drop ? null : { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
    }),
    { refetchInterval:120000, cache:{ staleTime:45000 } });
}

/* ---------------------------------------------------------------- model */
const BLOCK_RE = /(תקוע|חסום|מחכה|ממתין|blocked|waiting|stuck|on hold)/i;
const EST_RE   = /(?:~|est[:\s]|estimate[:\s]|\[)\s*(\d{1,3})\s*(m|min|minutes|h|hr|hours)?\b/i;

function normCard(n, board){
  const name = n.name||"", desc = n.desc||"";
  const due = n.due ? new Date(n.due) : null;
  const last = n.lastActivityAt ? new Date(n.lastActivityAt) : null;
  const now = new Date();
  let est = null;
  const m = EST_RE.exec(desc) || EST_RE.exec(name);
  if(m){ const v=parseInt(m[1],10), u=(m[2]||"m").toLowerCase();
         est = u[0]==="h" ? v*60 : v; if(!(est>0 && est<=480)) est=null; }
  return {
    id:n.id, name, desc,
    url:n.url || n.webUrl || "",
    shortLink: shortLinkOf(n.url || n.webUrl),
    listId: n.list ? n.list.id : null,
    boardKey:board.key, boardName:board.name,
    due, dueComplete:!!n.dueComplete, lastActivityAt:last,
    stalled: last ? daysBetween(last, now) >= STALL_DAYS : false,
    blocked: BLOCK_RE.test(name) || BLOCK_RE.test(desc),
    overdue: !!(due && !n.dueComplete && due < now && !sameDay(due, now)),
    dueToday: !!(due && sameDay(due, now)),
    est, deep: board.kind === "deep",
    isStats: name === STATS_CARD_NAME
  };
}
function allCards(){
  const out=[];
  for(const b of BOARDS){
    const bag = S.cards[b.key];
    if(!bag || !bag.payload) continue;
    for(const n of ((bag.payload.cards && bag.payload.cards.nodes) || [])) out.push(normCard(n,b));
  }
  return out;
}
const evStart = e => e.start && e.start.dateTime ? new Date(e.start.dateTime) : (e.start && e.start.date ? new Date(e.start.date) : null);
const evEnd   = e => e.end   && e.end.dateTime   ? new Date(e.end.dateTime)   : (e.end   && e.end.date   ? new Date(e.end.date)   : null);

function allEvents(){
  const p = S.events && S.events.payload;
  return ((p && p.events) || [])
    .filter(e => e.status !== "cancelled")
    .map(e => {
      const d = e.description || "";
      const link = shortLinkOf(d);
      const mine = d.includes(DF_MARK);
      return {
        raw:e, id:e.id, summary:e.summary || "(untitled)",
        start:evStart(e), end:evEnd(e),
        allDay: !!(e.start && e.start.date && !e.start.dateTime),
        isTask: mine || !!link, mine, cardShort:link,
        deep: e.colorId === "5"
      };
    })
    .filter(e => e.start && e.end);
}
const overlapsDay = (e,d) => { const a=startOfDay(d), b=addDays(a,1); return e.start < b && e.end > a; };

/* `ignore` may be a single id or a Set of ids */
const ignored = (id, ignore) => !!ignore && (typeof ignore === "string" ? ignore === id : ignore.has(id));

/* occupied minutes, work-session buffers baked in */
function busyFor(date, ignore){
  const out=[];
  for(const e of allEvents()){
    if(e.allDay || !overlapsDay(e,date)) continue;
    if(ignored(e.id, ignore)) continue;
    if(permeable(e)) continue;                      // you said tasks may run inside
    const pad = (e.isTask && e.deep) ? CFG.buffer : 0;
    const s  = sameDay(e.start,date) ? minsOf(e.start) : 0;
    const en = sameDay(e.end,date)   ? minsOf(e.end)   : 24*60;
    out.push({ s:s-pad, e:en+pad });
  }
  return out;
}
function existingBlocks(date, ignore){
  const evs = allEvents().filter(e => e.isTask && !e.allDay && overlapsDay(e,date) && !ignored(e.id, ignore));
  const deep = evs.filter(e => e.deep).length;
  return { deep, small: evs.length-deep, total: evs.length, foreign: evs.filter(e=>!e.mine).length };
}

/* Blocks a run may clear. Every card-linked block counts, including ones the
   morning routine made and ones whose slot has already passed: an unfinished
   block is not a record, and clearing it loses nothing — the Trello card is
   the source of truth and tomorrow's run picks it up again.
   Never a real meeting, never finished work, never what you're on right now. */
function clearableBlocks(date){
  const now = new Date();
  const isToday = sameDay(date, now);
  const nowMin = minsOf(now);
  return allEvents().filter(e => {
    if(!e.isTask || e.allDay || !overlapsDay(e,date)) return false;
    const c = cardFor(e);
    if(c && c.dueComplete) return false;                                    // you did it
    if(isToday && minsOf(e.start) <= nowMin && minsOf(e.end) > nowMin) return false;  // you're on it
    return true;
  });
}

/* card behind a block, if we can resolve one */
function cardFor(ev){
  if(!ev.cardShort) return null;
  return allCards().find(c => c.shortLink === ev.cardShort && !c.isStats) || null;
}

/* board hue class; falls back to neutral when the card can't be resolved */
const boardClass = card => card ? "bk-" + card.boardKey : "bk-none";

/* ------------------------------------------------- checklists */
/* One call per card, cached. The day is capped at a handful of tasks, so
   prefetching them all is cheap and lets details open on their own. */
function loadChecklists(card){
  if(!card || S.lists[card.id]) return;
  S.lists[card.id] = { loading:true };
  callTool(TRELLO, "trelloReadChecklist",
    { action:"list_by_card", cardId:card.id, limit:25 },
    { cache:{ staleTime:120000 } })
    .then(res => {
      const p = res.payload || {};
      S.lists[card.id] = { loading:false, checklists: p.checklists || [] };
    })
    .catch(e => { S.lists[card.id] = { loading:false, error:errCopy(e) }; })
    .then(render);
}
const hasDetail = card => {
  if(!card) return false;
  if(card.desc && card.desc.trim()) return true;
  const bag = S.lists[card.id];
  return !!(bag && bag.checklists && bag.checklists.some(cl => (cl.checkItems||[]).length));
};

/* Toggle a check item: paint it immediately, write, put it back if the write
   fails — a checkbox that waits on the network feels broken. */
async function toggleItem(card, checklistId, item){
  if(S.ticking.has(item.id)) return;
  const want = item.state !== "COMPLETE";
  S.ticking.add(item.id);
  item.state = want ? "COMPLETE" : "INCOMPLETE";       // optimistic
  render();
  try{
    const res = await callTool(TRELLO, "trelloWriteChecklist",
      { action:"update_item", checklistId, itemId:item.id, checked:want });
    const back = res.payload;
    if(back && back.state) item.state = back.state;     // trust the server
    if(want) chime();
  }catch(e){
    item.state = want ? "INCOMPLETE" : "COMPLETE";      // revert
    toast(errCopy(e), true);
  }finally{
    S.ticking.delete(item.id);
    render();
  }
}

/* ---------------------------------------------------------------- stats */
function parseStats(card){
  if(!card) return null;
  const d = card.desc || "";
  const i = d.indexOf(ST_OPEN), j = d.indexOf(ST_CLOSE);
  if(i<0 || j<0) return { ...DEFAULT_STATS };
  try{ return Object.assign({}, DEFAULT_STATS, JSON.parse(d.slice(i+ST_OPEN.length, j).trim())); }
  catch(_){ return { ...DEFAULT_STATS }; }
}
const statsCard = () => allCards().find(c => c.isStats) || null;

async function saveStats(next){
  S.stats = next;
  const card = statsCard();
  const id = card ? card.id : S.statsCardId;
  if(!id) return;
  S.statsCardId = id;
  const body = "DayFlow widget state store. Machine-managed — edit via the widget, not by hand.\n\n"
             + ST_OPEN + "\n" + JSON.stringify(next) + "\n" + ST_CLOSE + "\n";
  try{
    await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:id, desc:body });
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
  }catch(e){ toast(errCopy(e), true); }
}
function bumpCategory(cat, field){
  const st = S.stats || { ...DEFAULT_STATS };
  st.categories = st.categories || {};
  const c = st.categories[cat] || { picked:0, done:0, skipped:0 };
  c[field] = (c[field]||0)+1;
  st.categories[cat] = c;
  return st;
}
function catWeight(cat){
  const c = S.stats && S.stats.categories && S.stats.categories[cat];
  if(!c || !c.picked) return 0;
  return ((c.done/c.picked) - 0.5) * 0.8;
}
const rollInfo = c => (S.stats && S.stats.rollovers && S.stats.rollovers[c.id]) || null;
const ageDays = c => { const r = rollInfo(c); return r ? (r.count||0) : 0; };
const isAging = c => ageDays(c) >= AGING_DAYS;

/* ---------------------------------------------------------------- engine */
function tierOf(c){
  if(c.overdue && (c.blocked||c.stalled)) return 1;
  if(c.overdue) return 2;
  if(c.dueToday) return 3;
  if(c.blocked || c.stalled) return 4;
  if(c.due) return 5;
  return 6;
}
function candidates(){
  return allCards().filter(c => !c.isStats && !c.dueComplete && c.boardKey !== "today" && c.listId !== LIST_DONE);
}
function rankCards(pool){
  return pool.slice().sort((a,b) => {
    const ta=tierOf(a), tb=tierOf(b);
    if(ta!==tb) return ta-tb;
    const aa=isAging(a)?1:0, ab=isAging(b)?1:0;
    if(aa!==ab) return ab-aa;
    const wa=catWeight(a.boardName), wb=catWeight(b.boardName);
    if(Math.abs(wa-wb)>0.001) return wb-wa;
    const da=a.due?a.due.getTime():Infinity, db=b.due?b.due.getTime():Infinity;
    if(da!==db) return da-db;
    return (a.lastActivityAt?a.lastActivityAt.getTime():0) - (b.lastActivityAt?b.lastActivityAt.getTime():0);
  });
}
function freeWindows(busy, winS, winE){
  const merged=[];
  for(const iv of busy.slice().sort((x,y)=>x.s-y.s)){
    if(!merged.length || iv.s > merged[merged.length-1].e) merged.push({s:iv.s,e:iv.e});
    else merged[merged.length-1].e = Math.max(merged[merged.length-1].e, iv.e);
  }
  const free=[]; let cur=winS;
  for(const iv of merged){
    if(iv.s > cur) free.push({ s:cur, e:Math.min(iv.s, winE) });
    cur = Math.max(cur, iv.e);
    if(cur >= winE) break;
  }
  if(cur < winE) free.push({ s:cur, e:winE });
  return free.filter(f => f.e-f.s > 0);
}
function findSlots(busy, winS, winE, dur, pad, max, fromMin){
  const need = dur + pad*2, out=[];
  for(const f of freeWindows(busy, winS, winE)){
    let s = Math.max(f.s, fromMin==null?winS:fromMin);
    s = Math.ceil(s/SNAP_MIN)*SNAP_MIN;
    while(s + need <= f.e){
      out.push({ s:s+pad, e:s+pad+dur });
      if(out.length >= max) return out;
      s += SNAP_MIN;
    }
  }
  return out;
}
function planFor(date, mode, picked, ignore){
  const have = existingBlocks(date, ignore);
  const smallCap = Math.max(0, CFG.maxSmall - have.small);
  const deepCap  = Math.max(0, CFG.maxDeep  - have.deep);

  const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const nowMin = sameDay(date,new Date()) ? Math.ceil(minsOf(new Date())/SNAP_MIN)*SNAP_MIN : null;

  let pool = candidates();
  if(mode==="pick" && picked && picked.length){
    const set = new Set(picked);
    pool = pool.filter(c => set.has(c.id));
  }
  const already = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e,date) && e.cardShort && !ignored(e.id, ignore))
    .map(e => e.cardShort));
  pool = pool.filter(c => !c.shortLink || !already.has(c.shortLink));

  const ranked = rankCards(pool);
  const placed = [], live = busyFor(date, ignore);

  for(const c of ranked.filter(x=>x.deep).slice(0,deepCap)){
    const dur = c.est || CFG.deepMin;
    const s = findSlots(live, winS, winE, dur, CFG.buffer, 1, nowMin)[0];
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"deep" });
    live.push({ s:s.s-CFG.buffer, e:s.e+CFG.buffer });
  }
  /* Quick tasks share one contiguous window rather than scattering across the
     day. Shrink the group until it fits somewhere. */
  const quick = ranked.filter(x=>!x.deep).slice(0, smallCap);
  if(quick.length){
    let n = quick.length, slot = null, slice = 0;
    while(n > 0){
      slice = quickSlice(n);
      slot = findSlots(live, winS, winE, n*slice, 0, 1, nowMin)[0];
      if(slot) break;
      n--;
    }
    if(slot){
      for(let i=0;i<n;i++){
        const s = slot.s + i*slice;
        placed.push({ card:quick[i], s, e:s+slice, kind:"small" });
      }
      live.push({ s:slot.s, e:slot.s + n*slice });
    }
  }
  placed.sort((a,b)=>a.s-b.s);
  return placed;
}
/* A run rebuilds the day: every card-linked block it is allowed to touch is
   cleared and the day is laid out again under the caps. That is what keeps a
   day stuffed with Trello-generated blocks from staying stuffed. */
async function applyPlan(date, mode, picked, rebuild){
  if(S.busy) return;
  const clearable = rebuild ? clearableBlocks(date) : [];
  const ignore = new Set(clearable.map(e => e.id));

  S.busy = true; render();
  const placed = planFor(date, mode, picked, ignore);

  let cleared = 0;
  for(const e of clearable){
    try{ await deleteBlock(e.id); cleared++; }
    catch(err){ toast(errCopy(err), true); }
  }
  let ok=0;
  for(const p of placed){
    try{
      await createBlock(p.card, atMin(date,p.s), atMin(date,p.e), p.kind==="deep");
      ok++;
      const st = bumpCategory(p.card.boardName,"picked");
      st.rollovers = st.rollovers || {};
      st.rollovers[p.card.id] = st.rollovers[p.card.id] || { first:dayKey(date), count:0 };
      S.stats = st;
    }catch(e){
      toast(errCopy(e), true);
      if(AUTHZ.has(e && e.code)) break;
    }
  }
  const st = S.stats || { ...DEFAULT_STATS };
  st.plans = st.plans || {};
  st.plans[dayKey(date)] = { mode, n:ok, at:Date.now() };
  const keys = Object.keys(st.plans).sort();
  while(keys.length > 30) delete st.plans[keys.shift()];
  await saveStats(st);
  await refreshCalendar();
  S.busy = false;
  if(ok) toast(cleared ? `${ok} task${ok===1?"":"s"} · cleared ${cleared}` : `Scheduled ${ok} task${ok===1?"":"s"}.`);
  else if(cleared) toast(`Cleared ${cleared} · rolls to the next day`);
  else toast("Day is full.");
  render();
}
async function rolloverSweep(){
  const st = S.stats || { ...DEFAULT_STATS };
  const today = dayKey(new Date());
  if(st.lastSweep === today) return;
  st.rollovers = st.rollovers || {};
  const open = new Set(candidates().map(c=>c.id));
  for(const [id,r] of Object.entries(st.rollovers)){
    if(!open.has(id)){ delete st.rollovers[id]; continue; }
    if(r.last !== today){ r.count = (r.count||0)+1; r.last = today; }
  }
  st.lastSweep = today;
  await saveStats(st);
}

async function createBlock(card, start, end, deep){
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary:(deep?"🎵 ":"• ") + card.name,
    startTime:iso(start), endTime:iso(end),
    description:`${DF_MARK} DayFlow block.\nOriginal: ${card.url}`,
    colorId: deep ? "5" : "9"
  });
  return res.payload;
}
const moveBlock = (id,start,end) => callTool(GCAL, "update_event",
  { calendarId:CAL_ID, eventId:id, startTime:iso(start), endTime:iso(end), notificationLevel:"NONE" });
const deleteBlock = id => callTool(GCAL, "delete_event",
  { calendarId:CAL_ID, eventId:id, notificationLevel:"NONE" });
async function refreshCalendar(){ try{ await S.mcp.invalidate(GCAL, "list_events"); }catch(_){} }

async function completeItem(item){
  const card = item.card;
  const key = card ? card.id : item.ev.id;
  if(S.pending.has(key)) return;
  S.pending.add(key); render();
  try{
    if(card){
      await callTool(TRELLO, "trelloWriteCard", { action:"mark_done", cardId:card.id });
      if(card.boardKey === "today" && card.listId !== LIST_DONE)
        await callTool(TRELLO, "trelloWriteCard", { action:"move", cardId:card.id, listId:LIST_DONE, pos:"top" });
    }
    celebrate();
    const st = bumpCategory(card ? card.boardName : "—", "done");
    const today = dayKey(new Date());
    st.history = st.history || [];
    let h = st.history.find(x=>x.d===today);
    if(!h){ h={ d:today, done:0 }; st.history.push(h); }
    h.done++;
    while(st.history.length > 60) st.history.shift();
    if(st.lastCompletionDate !== today){
      st.streak = (st.lastCompletionDate === dayKey(addDays(new Date(),-1))) ? (st.streak||0)+1 : 1;
      st.lastCompletionDate = today;
    }
    if(card && st.rollovers) delete st.rollovers[card.id];
    await saveStats(st);
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    toast("Done.");
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(key); render(); }
}

/* "Not now" — push this task to the next free slot later the SAME day. */
async function postpone(item){
  const date = startOfDay(S.anchor);
  const dur = Math.max(SNAP_MIN, minsOf(item.ev.end) - minsOf(item.ev.start));
  const pad = item.ev.deep ? CFG.buffer : 0;
  const nowMin = sameDay(date, new Date()) ? minsOf(new Date()) : CFG.dayStart*60;
  /* must land strictly after both "now" and where it currently sits */
  const from = Math.ceil((Math.max(nowMin, minsOf(item.ev.end)) + 1)/SNAP_MIN)*SNAP_MIN;

  const slot = findSlots(busyFor(date, item.ev.id), CFG.dayStart*60, CFG.dayEnd*60, dur, pad, 1, from)[0];
  if(!slot){
    toast("No room left today.", true);
    return;
  }
  if(S.pending.has(item.ev.id)) return;
  S.pending.add(item.ev.id); render();
  try{
    await moveBlock(item.ev.id, atMin(date,slot.s), atMin(date,slot.e));
    if(item.card) await saveStats(bumpCategory(item.card.boardName, "skipped"));
    await refreshCalendar();
    toast(`→ ${fmtRange(atMin(date,slot.s), atMin(date,slot.e))}`);
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(item.ev.id); render(); }
}

async function removeItem(item){
  const name = item.card ? item.card.name : item.ev.summary;
  const ok = await confirmDialog("Remove this?", name + (item.card ? "\n\nArchives the card and clears its block." : "\n\nClears the block."), "Remove");
  if(!ok) return;
  S.pending.add(item.ev.id); render();
  try{
    if(item.card){
      await callTool(TRELLO, "trelloWriteCard", { action:"archive", cardId:item.card.id });
      const st = bumpCategory(item.card.boardName, "skipped");
      if(st.rollovers) delete st.rollovers[item.card.id];
      await saveStats(st);
      await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    }
    await deleteBlock(item.ev.id);
    await refreshCalendar();
    toast("Removed.");
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(item.ev.id); render(); }
}

/* ---------------------------------------------------------------- agenda */
/* One ordered list for the viewed day: task blocks (actionable) + meetings. */
function agenda(){
  const date = startOfDay(S.anchor);
  const items = allEvents()
    .filter(e => !e.allDay && overlapsDay(e,date))
    .map(e => {
      const card = e.isTask ? cardFor(e) : null;
      return {
        ev:e, card,
        task:e.isTask,
        title: card ? card.name : e.summary,
        s:minsOf(e.start), e2:minsOf(e.end),
        done: !!(card && card.dueComplete)
      };
    })
    .sort((a,b) => a.s - b.s || a.e2 - b.e2);
  return items;
}
function splitAgenda(){
  const items = agenda();
  const isToday = sameDay(S.anchor, new Date());
  const nowMin = minsOf(new Date());
  const open = items.filter(i => i.task && !i.done);

  /* The hub must always answer "what now" while work remains. Prefer what is
     running, then what is next — and if the whole day is behind you, the
     earliest thing still unfinished rather than an empty screen. */
  let current = null;
  if(isToday){
    current = open.find(i => i.s <= nowMin && i.e2 > nowMin)     // happening now
           || open.find(i => i.e2 > nowMin)                       // next up
           || open[0]                                             // day's over, still open
           || null;
  }else{
    current = open[0] || null;
  }
  const meetingNow = isToday
    ? items.find(i => !i.task && i.s <= nowMin && i.e2 > nowMin) || null
    : null;

  /* a task whose slot already passed isn't "later" — it's unfinished.
     It keeps its own group so "Later today" stays a truthful forecast. */
  const missed = isToday
    ? items.filter(i => i !== current && i.task && !i.done && i.e2 <= nowMin)
    : [];
  const rest = items.filter(i =>
    i !== current && i !== meetingNow && missed.indexOf(i) < 0 && (!isToday || i.e2 > nowMin));
  const doneCount = items.filter(i => i.task && i.done).length;
  return { items, current, meetingNow, rest, missed, doneCount, open };
}

/* ---------------------------------------------------------------- render */
function render(){
  if(render._q) return;
  render._q = true;
  requestAnimationFrame(()=>{
    render._q = false;
    try{ paint(); }catch(e){ console.error(e); }
  });
}

function paint(){
  const d = S.anchor, today = new Date();
  $("#dateLabel").textContent = `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  const delta = daysBetween(today, d);
  $("#dateRel").textContent = delta===0 ? "" : delta>0 ? `+${delta}` : String(delta);

  const main = $("#main");
  main.innerHTML = "";
  $("#foot").hidden = true;

  /* no connector bridge at all in this view */
  if(S.noMcp){
    main.appendChild(stateCard("🔌","Live data isn't available here",
      "Needs the Trello and Google Calendar connectors."));
    return;
  }
  /* Without the day's events there is nothing truthful to show — say why,
     rather than rendering an empty day as though it were a real one. */
  const firstErr = Object.values(S.errs)[0];
  if(!S.events && firstErr){
    const transient = !AUTHZ.has(firstErr.code) && !LIFECYCLE.has(firstErr.code);
    main.appendChild(stateCard("🔌","Can't reach your data",
      firstErr.message));
    return;
  }
  if(!S.ready || !S.events){ main.appendChild(el("div","skel")); return; }

  /* Saturday: nothing, quietly */
  if(sameDay(d,today) && d.getDay() === CFG.dayOff){
    main.appendChild(stateCard("🕯️","Shabbat",""));
    return;
  }

  const { current, meetingNow, rest, missed, doneCount, open } = splitAgenda();

  /* the day is capped at a few tasks, so fetch their checklists up front and
     let the panels appear without being asked for */
  let budget = 12;
  for(const i of [current].concat(rest, missed)){
    if(budget <= 0) break;
    if(i && i.card && !S.lists[i.card.id]){ loadChecklists(i.card); budget--; }
  }

  if(meetingNow) main.appendChild(meetingNowRow(meetingNow));

  if(current) main.appendChild(nowCard(current));
  else main.appendChild(emptyNow(doneCount));

  const upcoming = rest.filter(i => !i.done);
  if(upcoming.length) main.appendChild(section(upcoming, false));
  if(missed.length)   main.appendChild(section(missed, true));

  /* transient trouble: keep data, say it once, quietly */
  const soft = Object.values(S.errs).find(e => !AUTHZ.has(e.code) && !LIFECYCLE.has(e.code));
  if(soft){
    const b = el("div","banner");
    b.style.marginTop = "20px";
    b.appendChild(el("div",null,soft.message));
    main.appendChild(b);
  }

  $("#foot").hidden = false;
  $("#sStreak").textContent = (S.stats && S.stats.streak) || 0;
  $("#sDone").textContent = doneCount;
  $("#sLeft").textContent = open.length;
  $("#replanBtn").disabled = !!S.busy;
  $("#replanBtn").textContent = S.busy ? "…" : "↻";
}

/* Missed rows are marked by a red timestamp, which says it without a heading. */
function section(list, missed){
  const sec = el("section","later" + (missed ? " miss" : ""));
  const rows = el("div","rows");
  for(const i of list) rows.appendChild(agendaRow(i));
  sec.appendChild(rows);
  return sec;
}

/* The hub: wall clock, what you're on, and how long is left on it. */
function nowCard(item){
  const now = new Date();
  const isToday = sameDay(S.anchor, now);
  const nowMin = minsOf(now);
  const live = isToday && item.s <= nowMin && item.e2 > nowMin;
  const c = item.card;

  S.hubItem = item;
  const box = el("div","now " + boardClass(c) + (live ? " live" : ""));

  /* --- top strip: the wall clock --- */
  const top = el("div","hub-top");
  const clock = el("div","hub-clock");
  clock.id = "hubClock";
  clock.appendChild(el("span","hh", hhmm(now)));
  clock.appendChild(el("span","sec", ":" + pad2(now.getSeconds())));
  top.appendChild(clock);

  const overdueSlot = isToday && item.e2 <= nowMin;
  const status = el("div","hub-status");
  status.appendChild(el("span","eyebrow",
    live ? "On it" : overdueSlot ? "Still open" : isToday ? "Up next" : "First up"));
  if(c) { const b = el("span","chip board"); bidi(b, c.boardName); status.appendChild(b); }
  else if(!item.ev.mine) status.appendChild(el("span","chip","external"));
  top.appendChild(status);
  box.appendChild(top);

  /* --- body --- */
  const body = el("div","hub-body");
  body.appendChild(el("div","slot", fmtRange(item.ev.start, item.ev.end)));

  const h = el("h2"); h.appendChild(bidiSpan(item.title)); body.appendChild(h);

  /* how long you have */
  const total = Math.max(1, item.e2 - item.s);
  const m = el("div","meter"); m.id = "hubMeter";
  const bar = el("div","bar");
  const fill = el("i","fill"); fill.id = "hubFill";
  bar.appendChild(fill); m.appendChild(bar);
  const lbl = el("div","lbl");
  const leftEl = el("span","left"); leftEl.id = "hubLeft";
  lbl.appendChild(leftEl);
  m.appendChild(lbl);
  body.appendChild(m);
  paintMeter(m, fill, leftEl, item, isToday);

  const tags = el("div","tags");
  if(c){
    if(isAging(c))      tags.appendChild(el("span","chip age", `${ageDays(c)}d waiting`));
    else if(c.overdue)  tags.appendChild(el("span","chip crit","overdue"));
    else if(c.dueToday) tags.appendChild(el("span","chip","due today"));
    if(c.blocked)       tags.appendChild(el("span","chip","blocked"));
    if(c.deep)          tags.appendChild(el("span","chip deep","session"));
  }
  if(tags.children.length) body.appendChild(tags);

  const acts = el("div","acts");
  const doneBtn = el("button","btn primary","Done");
  doneBtn.addEventListener("click", ()=>completeItem(item));
  const laterBtn = el("button","btn icon","↷");
  laterBtn.title = "Later today"; laterBtn.setAttribute("aria-label","Later today");
  const swapBtn = el("button","btn icon","⇄");
  swapBtn.title = "Swap for another task"; swapBtn.setAttribute("aria-label","Swap task");
  swapBtn.addEventListener("click", ()=>swapPicker(item));
  laterBtn.addEventListener("click", ()=>postpone(item));
  const skipBtn = el("button","btn icon quiet","✕");
  skipBtn.title = "Remove"; skipBtn.setAttribute("aria-label","Remove");
  skipBtn.addEventListener("click", ()=>removeItem(item));
  if(S.pending.has(item.ev.id) || (c && S.pending.has(c.id))){
    doneBtn.disabled = laterBtn.disabled = skipBtn.disabled = swapBtn.disabled = true;
  }
  acts.appendChild(doneBtn); acts.appendChild(laterBtn);
  acts.appendChild(swapBtn); acts.appendChild(skipBtn);
  body.appendChild(acts);

  /* details open on their own when the card has any */
  if(c && hasDetail(c) && !S.collapsed.has("hub:"+item.ev.id)){
    const panel = detailPanel(c);
    if(panel) body.appendChild(panel);
  }
  box.appendChild(body);
  return box;
}

/* remaining time on the current block; counts over if it has run past */
function paintMeter(meter, fill, leftEl, item, isToday){
  const nowMin = minsOf(new Date()) + new Date().getSeconds()/60;
  const total = Math.max(1, item.e2 - item.s);
  if(!isToday || nowMin < item.s){
    fill.style.width = "0%";
    const until = Math.round(item.s - nowMin);
    leftEl.textContent = isToday && until > 0
      ? (until < 60 ? `starts in ${until} min` : `starts in ${Math.floor(until/60)}h ${until%60}m`)
      : `${total} min block`;
    meter.classList.remove("over");
    return;
  }
  const elapsed = nowMin - item.s;
  const left = Math.ceil(item.e2 - nowMin);
  fill.style.width = clamp((elapsed/total)*100, 0, 100) + "%";
  if(left > 0){
    leftEl.textContent = left < 60 ? `${left} min left` : `${Math.floor(left/60)}h ${left%60}m left`;
    meter.classList.remove("over");
  }else{
    /* an overrun counter only means something while you're plausibly still on
       it; once the slot is well past, say when it was rather than tick upward */
    const over = Math.abs(left);
    leftEl.textContent = over <= 60 ? `${over} min over` : `slot ended ${hhmm(item.ev.end)}`;
    meter.classList.add("over");
  }
}

/* description + checklists; items are clickable and write straight through */
function detailPanel(card){
  const bag = S.lists[card.id];
  const lists = (bag && bag.checklists) || [];
  const hasDesc = !!(card.desc && card.desc.trim());
  if(!hasDesc && !lists.length && !(bag && bag.error)) return null;   // say nothing

  const d = el("div","details");
  if(hasDesc){ const p = el("div","desc"); bidi(p, card.desc.trim()); d.appendChild(p); }
  if(bag && bag.error){ d.appendChild(el("div","muted", bag.error)); return d; }

  for(const cl of lists){
    const items = cl.checkItems || [];
    if(!items.length) continue;
    const done = items.filter(i => i.state === "COMPLETE").length;
    const head = el("div","clname");
    const nm = el("span"); bidi(nm, /^checklist$/i.test(cl.name||"") ? "" : (cl.name||"")); head.appendChild(nm);
    head.appendChild(el("span",null, `${done}/${items.length}`));
    d.appendChild(head);

    const prog = el("div","prog");
    const bar = el("i"); bar.style.width = Math.round(100*done/items.length) + "%";
    prog.appendChild(bar); d.appendChild(prog);

    const ul = el("ul");
    for(const it of items){
      const on = it.state === "COMPLETE";
      const li = el("li", on ? "on" : "");
      const b = el("button","box","✓");
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", it.name || "check item");
      if(S.ticking.has(it.id)) b.disabled = true;
      b.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(b);
      const t = el("span","it"); bidi(t, it.name);
      t.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(t);
      ul.appendChild(li);
    }
    d.appendChild(ul);
  }
  return d;
}

/* ---------------------------------------------------------------- dialog */
/* ---------------------------------------------------------------- swap */
/* Replace what's in a slot with a card you pick. The slot keeps its time. */
function swapPicker(item){
  const scheduled = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e, S.anchor) && e.cardShort).map(e => e.cardShort));
  const pool = rankCards(candidates().filter(c =>
    (!c.shortLink || !scheduled.has(c.shortLink)) && (!item.card || c.id !== item.card.id)));

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null, fmtRange(item.ev.start, item.ev.end)));
  dlg.appendChild(h);

  const body = el("div","pick");
  if(!pool.length) body.appendChild(el("div","muted","Nothing else open."));
  for(const c of pool.slice(0,40)){
    const b = el("button","pick-row " + boardClass(c));
    b.type = "button";
    b.appendChild(el("span","dot"));
    const n = el("span","n"); n.appendChild(bidiSpan(c.name)); b.appendChild(n);
    const t = tierOf(c);
    if(isAging(c))    b.appendChild(el("span","chip age", ageDays(c)+"d"));
    else if(c.overdue)b.appendChild(el("span","chip crit","!"));
    else if(c.deep)   b.appendChild(el("span","chip deep","∎"));
    b.addEventListener("click", ()=>{ close(); swapTo(item, c); });
    body.appendChild(b);
  }
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", close);
  f.appendChild(cancel);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  cancel.focus();
}

async function swapTo(item, card){
  if(S.pending.has(item.ev.id)) return;
  S.pending.add(item.ev.id); render();
  const start = item.ev.start, end = item.ev.end;
  try{
    await deleteBlock(item.ev.id);
    await createBlock(card, start, end, card.deep);
    await saveStats(bumpCategory(card.boardName, "picked"));
    await refreshCalendar();
    toast("Swapped.");
  }catch(e){ toast(errCopy(e), true); }
  finally{ S.pending.delete(item.ev.id); render(); }
}

/* ---------------------------------------------------------------- settings */

  const scrim = el("div","scrim");

  const body = el("div","set");

  const row = (label, ...controls) => {
    const r = el("label","set-row");
    r.appendChild(el("span","set-k", label));
    const w = el("span","set-v");
    controls.forEach(c => w.appendChild(c));
    r.appendChild(w);
    body.appendChild(r);
    return r;
  };
  const num = (key, min, max, step) => {
    const i = el("input","num-in");
    i.type="number"; i.min=min; i.max=max; i.step=step||1; i.value=CFG[key];
    i.addEventListener("change", ()=>{ CFG[key]=+i.value; loadCfg({settings:CFG}); i.value=CFG[key]; saveCfg(); });
    return i;
  };

  body.appendChild(el("div","set-h","Day"));
  row("Hours", num("dayStart",0,23), el("span","set-dash","–"), num("dayEnd",1,24));
  const off = el("select","num-in wide");
  [["-1","none"]].concat(DAYS.map((d,i)=>[String(i),d])).forEach(([v,t])=>{
    const o=el("option",null,t); o.value=v; if(+v===CFG.dayOff) o.selected=true; off.appendChild(o);
  });
  off.addEventListener("change", ()=>{ CFG.dayOff=+off.value; saveCfg(); });
  row("Off", off);

  body.appendChild(el("div","set-h","Load"));
  row("Quick", num("maxSmall",0,12), el("span","set-dash","in"), num("quickTotal",5,480,5), el("span","set-u","min"));
  row("Sessions", num("maxDeep",0,6), el("span","set-dash","×"), num("deepMin",15,480,5), el("span","set-u","min"));
  row("Buffer", num("buffer",0,60,5), el("span","set-u","min"));

  body.appendChild(el("div","set-h","Colour"));
  for(const b of BOARDS){
    const c = el("input","col-in");
    c.type="color";
    c.value = (CFG.colors && CFG.colors[b.key]) ||
      (getComputedStyle(document.documentElement).getPropertyValue("--b-"+b.key).trim() || "#888888");
    c.addEventListener("input", ()=>{ CFG.colors[b.key]=c.value; applyColors(); });
    c.addEventListener("change", saveCfg);
    const rst = el("button","mini","↺");
    rst.setAttribute("aria-label","Reset colour");
    rst.addEventListener("click", e=>{ e.preventDefault(); delete CFG.colors[b.key]; saveCfg(); close(); settingsPanel(); });
    const r = row(b.name, c, rst);
    r.querySelector(".set-k").setAttribute("dir","auto");
  }

  body.appendChild(el("div","set-h","Sound"));
  const snd = el("button","toggle" + (CFG.sound ? " on" : ""), CFG.sound ? "on" : "off");
  snd.type="button";
  snd.addEventListener("click", ()=>{ CFG.sound=!CFG.sound; snd.textContent=CFG.sound?"on":"off";
    snd.classList.toggle("on",CFG.sound); saveCfg(); });
  row("Chime", snd);

  dlg.appendChild(body);

  const f = el("div","df");
  const reset = el("button","btn quiet","Reset");
  reset.addEventListener("click", async ()=>{ CFG={...DEFAULTS,colors:{}}; await saveCfg(); close(); });
  const done = el("button","btn primary","Done");
  done.addEventListener("click", ()=>close());
  f.appendChild(reset); f.appendChild(done);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); render(); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  done.focus();
}

function confirmDialog(title, detail, okLabel){
  return new Promise(resolve => {
    const scrim = el("div","scrim");
    const dlg = el("div","dialog");
    dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");
    const h = el("div","dh");
    h.appendChild(el("h3",null,title));
    const p = el("p"); bidi(p, detail); h.appendChild(p);
    dlg.appendChild(h);
    const f = el("div","df");
    const cancel = el("button","btn quiet","Keep");
    const go = el("button","btn primary",okLabel);
    cancel.addEventListener("click", ()=>{ close(); resolve(false); });
    go.addEventListener("click", ()=>{ close(); resolve(true); });
    f.appendChild(cancel); f.appendChild(go);
    dlg.appendChild(f);
    function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape"){ close(); resolve(false); } }
    document.addEventListener("keydown", onKey);
    scrim.addEventListener("click", e => { if(e.target===scrim){ close(); resolve(false); } });
    scrim.appendChild(dlg); document.body.appendChild(scrim); go.focus();
  });
}

/* ---------------------------------------------------------------- flourish */
const fx = $("#fx"), fxc = fx.getContext("2d");
let parts=[], raf=null;
function fitFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", fitFx); fitFx();
function celebrate(){
  chime();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--done","--age"].map(v => cs.getPropertyValue(v).trim() || "#0E7C86");
  const host = document.querySelector(".now") || document.querySelector(".state");
  const r = host ? host.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/3, width:0, height:0 };
  const ox = r.left + r.width/2, oy = r.top + r.height/2;
  for(let i=0;i<54;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4.5;
    parts.push({ x:ox, y:oy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2, r:2+Math.random()*2.6,
                 c:cols[i%cols.length], life:1, rot:Math.random()*6 });
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.life -= 0.014; p.rot += 0.15;
    fxc.save(); fxc.globalAlpha = Math.max(0,p.life);
    fxc.translate(p.x,p.y); fxc.rotate(p.rot);
    fxc.fillStyle = p.c; fxc.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2); fxc.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (fxc.clearRect(0,0,innerWidth,innerHeight), null);
}
let actx=null;
function chime(){
  if(!CFG.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*0.08);
      g.gain.linearRampToValueAtTime(0.075,t+i*0.08+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.4);
      o.connect(g); g.connect(actx.destination); o.start(t+i*0.08); o.stop(t+i*0.08+0.42);
    });
  }catch(_){}
}
function toast(msg, isErr){
  const t = el("div","toast"+(isErr?" err":""));
  bidi(t, msg);
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 3400);
}

/* ---------------------------------------------------------------- boot */
function goDay(n){
  S.anchor = n===0 ? startOfDay(new Date()) : addDays(S.anchor, n);
  syncCalendarWatch();
  render();
}
$("#prev").addEventListener("click", ()=>goDay(-1));
$("#next").addEventListener("click", ()=>goDay(1));
$("#todayBtn").addEventListener("click", ()=>goDay(0));
$("#setBtn").addEventListener("click", settingsPanel);
$("#replanBtn").addEventListener("click", ()=>replan());

async function replan(){
  const d = new Date();
  if(sameDay(S.anchor,d) && d.getDay()===CFG.dayOff){ toast("It's Shabbat — nothing gets scheduled."); return; }
  const date = startOfDay(S.anchor);
  const clearable = clearableBlocks(date);
  if(clearable.length){
    const ok = await confirmDialog(
      "Rebuild today?",
      `Clears ${clearable.length} block${clearable.length===1?"":"s"} and re-lays the day: ${CFG.maxSmall} quick, ${CFG.maxDeep} session.\n\nMeetings, finished and past work stay.`,
      "Rebuild");
    if(!ok) return;
  }
  applyPlan(date, "normal", null, true);
}
/* the wall clock and the remaining-time meter tick every second without
   repainting the whole page */
function tickHub(){
  const clock = $("#hubClock");
  if(clock && clock.firstChild && clock.lastChild){
    const n = new Date();
    clock.firstChild.textContent = hhmm(n);
    clock.lastChild.textContent = ":" + pad2(n.getSeconds());
  }
  const meter = $("#hubMeter"), fill = $("#hubFill"), left = $("#hubLeft");
  if(meter && fill && left && S.hubItem) paintMeter(meter, fill, left, S.hubItem, sameDay(S.anchor, new Date()));
}
setInterval(tickHub, 1000);
setInterval(render, 60000);   // keep "now" honest

(async function boot(){
  render();
  let mcp = null;
  try{ mcp = await (window.claude && window.claude.use ? window.claude.use("mcp") : null); }
  catch(_){ mcp = null; }

  if(!mcp){ S.noMcp = true; S.ready = true; render(); return; }
  S.mcp = mcp;
  startWatches();

  const settle = setInterval(async ()=>{
    if(!S.cards.today || !S.events) return;
    clearInterval(settle);
    S.ready = true;

    const sc = statsCard();
    S.stats = parseStats(sc) || { ...DEFAULT_STATS };
    if(sc) S.statsCardId = sc.id;
    loadCfg(S.stats);

    await rolloverSweep();

    const d = new Date();
    const planned = S.stats.plans && S.stats.plans[dayKey(d)];
    if(!planned && d.getDay()!==CFG.dayOff) await applyPlan(startOfDay(d),"normal",null,true);
    render();
  }, 400);
  setTimeout(()=>{ clearInterval(settle); if(!S.ready){ S.ready=true; render(); } }, 20000);
})();
