/* ---------------------------------------------------------------- state */
const S = {
  anchor: startOfDay(new Date()),
  today: dayKey(new Date()),   // the calendar day the app currently believes it is
  view:"day",     // "day" | "week" | "month" — which view the one page shows
  mcp:null, ready:false, busy:false,
  cards:{}, events:null, errs:{},
  cardCache:{},        // shortLink -> last resolved card, bridges a board fetch that transiently drops it
  failed:[],           // writes that ran out of retries — see queueFailed()
  lastRefresh:0,       // when the connectors were last poked, for the on-return refresh
  lists:{},            // cardId -> {loading|checklists|error}
  collapsed:new Set(), // details are open by default; these were closed by hand
  ticking:new Set(),   // check items with a write in flight
  editing:new Set(),   // "desc:"+cardId or "item:"+itemId currently open for edit
  stats:null, statsCardId:null,
  calRange:null, calUnsub:null,
  muted:false,
  pending:new Set(),
  lastMove:null,       // [{id,start,end},...] — slot(s) before the most recent drag/resize/push
  evVer:Object.create(null),  // id -> version counter, see applyLocalMove/commitMove
  undoTimer:null
};
const DEFAULT_STATS = { v:1, streak:0, lastCompletionDate:null, history:[], categories:{}, rollovers:{}, plans:{}, mute:false };

/* ---------------------------------------------------------------- MCP */
const AUTHZ = new Set(["needs_reauth","server_not_connected","selection_required","blocked_by_policy","approval_required","not_in_manifest","server_not_found"]);
const LIFECYCLE = new Set(["not_granted","capability_disabled","capability_removed"]);

function errCopy(e){
  const s = (e && e.server) || "the connector";
  switch(e && e.code){
    case "needs_reauth":         return `Reconnect ${s} in claude.ai → Settings → Connectors.`;
    case "server_not_connected": return `Add ${s} in claude.ai → Settings → Connectors.`;
    case "selection_required":   return `Choose which ${s} account to use, then reload.`;
    case "blocked_by_policy":    return `Your organization blocks this ${s} tool.`;
    case "approval_required":    return `This ${s} action needs approval artifacts can't request yet.`;
    case "server_unavailable":   return `${s} is unreachable right now. Retrying shortly.`;
    case "not_in_manifest":      return `This page isn't allowed to call that ${s} tool.`;
    case "tool_error":           return (e.message || `${s} rejected the request.`);
    case "rate_limited":         return `Too many ${s} requests. Pausing briefly.`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed":   return "Live data isn't available in this view.";
    default:                     return (e && e.message) || `${s} call failed.`;
  }
}
/* errCopy has always promised "Retrying shortly." / "Pausing briefly." for the
   transient codes and nothing was behind it — there was no retry anywhere in
   the file. Now there is. Auth and lifecycle failures are never retried: they
   need the user, not another attempt. Neither is tool_error, which means the
   request itself was rejected and will be rejected again. A missing code is
   the network dropping mid-call, which is exactly the case worth retrying. */
const RETRY_DELAYS = [400, 1200];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const retryable = e => {
  const c = e && e.code;
  if(!c) return true;
  return c === "server_unavailable" || c === "rate_limited";
};
async function callTool(server, tool, input, opts){
  if(!S.mcp) throw { code:"capability_disabled", message:"no mcp", server };
  let last;
  for(let attempt = 0; attempt <= RETRY_DELAYS.length; attempt++){
    try{ return await S.mcp.callTool(server, tool, input, opts); }
    catch(e){
      last = e;
      if(attempt === RETRY_DELAYS.length || !retryable(e)) break;
      await sleep(RETRY_DELAYS[attempt]);
    }
  }
  throw last;
}

/* A toast lasts 3.4 seconds; a write that never landed lasts forever. Anything
   still failing after its retries lands here and stays on screen as "N didn't
   save" until it's either retried successfully or dismissed — the alternative
   was a drag made on a dead connection looking saved and quietly not being. */
function queueFailed(label, retry){
  S.failed.push({ label, retry });
  render();
}
async function retryFailed(){
  const queue = S.failed.slice();
  S.failed = [];
  render();
  for(const f of queue){
    try{ await f.retry(); }
    catch(_){ S.failed.push(f); }
  }
  render();
  toast(S.failed.length ? `${S.failed.length} still unsaved.` : "Saved.", !!S.failed.length);
}

function onWatch(key, ev, assign){
  if(ev.type === "data"){
    delete S.errs[key];
    assign(ev.result);
  }else{
    /* Errors used to retract the cached payload on any auth/lifecycle code,
       which blanked the whole app on a reauth blip. Last-good data plus the
       banner beats an empty page: what's on screen is still what was true a
       few minutes ago, and the banner says why it isn't newer. */
    const e = ev.error || {};
    S.errs[key] = { code:e.code, message:errCopy(e) };
  }
  render();
}
function startWatches(){
  for(const b of BOARDS){
    S.mcp.watchTool(TRELLO, "trelloReadCard",
      { action:"list_by_board", boardIdOrUrl:b.id, filter:"open" },
      ev => onWatch("cards:"+b.key, ev, res => {
        S.cards[b.key] = { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
      }),
      { refetchInterval:180000, cache:{ staleTime:60000 } });
  }
  syncCalendarWatch();
}
/* Day view only needs the one visible day. Week/Month need to see the whole
   visible range so the grid doesn't have to fetch per-cell — widen only
   when that range is actually on screen. */
function calFetchRange(){
  if(S.view === "week"){
    const { start } = weekBounds(S.anchor);
    return { a:start, b:addDays(start,7) };
  }
  if(S.view === "month"){
    const first = new Date(S.anchor.getFullYear(), S.anchor.getMonth(), 1);
    const a = addDays(first, -first.getDay());
    return { a, b:addDays(a,42) };
  }
  const a = startOfDay(S.anchor);
  return { a, b:addDays(a,1) };
}
/* one watch, re-registered whenever the visible range changes */
function syncCalendarWatch(){
  const { a, b } = calFetchRange();
  const key = iso(a) + "|" + iso(b);
  if(S.calRange === key) return;
  S.calRange = key;
  if(S.calUnsub){ try{ S.calUnsub(); }catch(_){} S.calUnsub=null; }
  if(!S.mcp) return;
  S.calUnsub = S.mcp.watchTool(GCAL, "list_events",
    { calendarId:CAL_ID, startTime:iso(a), endTime:iso(b), pageSize:100 },
    ev => onWatch("cal", ev, res => {
      S.events = { payload:res.payload, storedAt: res.cache ? res.cache.storedAt : Date.now() };
    }),
    { refetchInterval:120000, cache:{ staleTime:45000 } });
}

/* ---------------------------------------------------------------- model */
const BLOCK_RE = /(תקוע|חסום|מחכה|ממתין|blocked|waiting|stuck|on hold|pending)/i;
const EST_RE   = /(?:~|est[:\s]|estimate[:\s]|\[)\s*(\d{1,3})\s*(m|min|minutes|h|hr|hours)?\b/i;
/* Pending's own marker, optionally dated ("check back on"). Matched with its
   own regex (not just BLOCK_RE) so an expired date can specifically lift
   the block this marker caused — see normCard's `blocked` below — without
   touching a block caused by other text the card happens to contain. */
const PENDING_RE = /^⏳ Pending(?: until (\d{4}-\d{2}-\d{2}))? — /;
const pendingMark = until => until ? `⏳ Pending until ${until} — ` : "⏳ Pending — ";

/* Size comes from the Trello label, not the board: yellow = short session
   (3h), orange = long session / work day (8h), no label = quick task. */
function sizeFromLabels(labels){
  const colors = (Array.isArray(labels) ? labels : []).map(l => l && l.color);
  if(colors.includes("orange")) return "long";
  if(colors.includes("yellow")) return "short";
  return "quick";
}

function normCard(n, board){
  const name = n.name||"", desc = n.desc||"";
  const due = n.due ? new Date(n.due) : null;
  const last = n.lastActivityAt ? new Date(n.lastActivityAt) : null;
  const now = new Date();
  const size = sizeFromLabels(n.labels);
  let est = null;
  const m = EST_RE.exec(desc) || EST_RE.exec(name);
  if(m){ const v=parseInt(m[1],10), u=(m[2]||"m").toLowerCase();
         est = u[0]==="h" ? v*60 : v; if(!(est>0 && est<=600)) est=null; }
  return {
    id:n.id, name, desc,
    url:n.url || n.webUrl || "",
    shortLink: shortLinkOf(n.url || n.webUrl),
    /* labels come along whole, not just distilled into `size`: candidates()
       reads them to keep green "info only" cards out of scheduling, and it
       used to read a key that was never here — the filter was a permanent
       no-op via optional chaining, so green cards got scheduled anyway. */
    labels: Array.isArray(n.labels) ? n.labels : [],
    listId: n.list ? n.list.id : null,
    listName: n.list ? (n.list.name || null) : null,
    boardKey:board.key, boardName:board.name,
    due, dueComplete:!!n.dueComplete, lastActivityAt:last,
    stalled: last ? daysBetween(last, now) >= STALL_DAYS : false,
    /* blocked reads title/description text, and — cheaply, no extra call,
       labels are already part of the card payload — a label whose own name
       says "waiting"/"blocked" too. A dated Pending marker past its date no
       longer counts on its own — re-test with the marker stripped, so any
       *other* blocking text in the card (unrelated to Pending) still holds. */
    blocked: (() => {
      const pend = PENDING_RE.exec(desc);
      const expired = !!(pend && pend[1] && now >= new Date(pend[1]+"T23:59:59"));
      const body = expired ? desc.slice(pend[0].length) : desc;
      return BLOCK_RE.test(name) || BLOCK_RE.test(body) ||
        (Array.isArray(n.labels) && n.labels.some(l => l && BLOCK_RE.test(l.name||"")));
    })(),
    overdue: !!(due && !n.dueComplete && due < now && !sameDay(due, now)),
    dueToday: !!(due && sameDay(due, now)),
    est, size, deep: size !== "quick",
    isStats: name === STATS_CARD_NAME
  };
}
/* the connector has been observed returning the same card more than once
   in a single list_by_board page — dedupe by id or the swap picker (and
   anything else built on this) shows it twice */
function allCards(){
  const out=[], seen=new Set();
  for(const b of BOARDS){
    const bag = S.cards[b.key];
    if(!bag || !bag.payload) continue;
    for(const n of ((bag.payload.cards && bag.payload.cards.nodes) || [])){
      if(seen.has(n.id)) continue;
      seen.add(n.id);
      out.push(normCard(n,b));
    }
  }
  return out;
}
const evStart = e => e.start && e.start.dateTime ? new Date(e.start.dateTime) : (e.start && e.start.date ? new Date(e.start.date) : null);
const evEnd   = e => e.end   && e.end.dateTime   ? new Date(e.end.dateTime)   : (e.end   && e.end.date   ? new Date(e.end.date)   : null);

function allEvents(){
  const p = S.events && S.events.payload;
  return ((p && p.events) || [])
    .filter(e => e.status !== "cancelled")
    .map(e => {
      const d = e.description || "";
      const link = shortLinkOf(d);
      const mine = d.includes(DF_MARK);
      /* mirrors createBlock's colour choice: 9 quick, 5 short, 11 long */
      const size = e.colorId === "11" ? "long" : e.colorId === "5" ? "short" : "quick";
      return {
        raw:e, id:e.id, summary:e.summary || "(untitled)",
        start:evStart(e), end:evEnd(e),
        allDay: !!(e.start && e.start.date && !e.start.dateTime),
        isTask: mine || !!link, mine, cardShort:link,
        size, deep: size !== "quick"
      };
    })
    .filter(e => e.start && e.end)
    /* a stale card-linked block (left over from a day that's rolled past)
       is presumed wrong and hidden — but that window has to match what's
       actually schedulable (today and tomorrow, see isSchedulable), or a
       block built for tomorrow vanishes from the app the instant it's
       created: still real on the calendar, invisible everywhere here,
       and rebuilt as a duplicate on every subsequent run. */
    .filter(e => !(e.cardShort && !isSchedulable(e.start)));
}
const overlapsDay = (e,d) => { const a=startOfDay(d), b=addDays(a,1); return e.start < b && e.end > a; };

/* `ignore` may be a single id or a Set of ids */
const ignored = (id, ignore) => !!ignore && (typeof ignore === "string" ? ignore === id : ignore.has(id));

/* occupied minutes, work-session buffers baked in.
   Permeable meetings (all-day, Free, or listed in CFG.openEvents) are only
   skipped — treated as free — when placing a quick task. A short or long
   session may never land inside one: pass forSession to keep them busy. */
function busyFor(date, ignore, forSession){
  const out=[];
  for(const e of allEvents()){
    if(e.allDay || !overlapsDay(e,date)) continue;
    if(ignored(e.id, ignore)) continue;
    if(permeable(e) && !forSession) continue;
    const pad = (e.isTask && e.deep) ? CFG.buffer : 0;
    const s  = sameDay(e.start,date) ? minsOf(e.start) : 0;
    const en = sameDay(e.end,date)   ? minsOf(e.end)   : 24*60;
    out.push({ s:s-pad, e:en+pad });
  }
  return out;
}
function existingBlocks(date, ignore){
  const evs = allEvents().filter(e => e.isTask && !e.allDay && overlapsDay(e,date) && !ignored(e.id, ignore));
  const long = evs.filter(e => e.size === "long").length;
  const short = evs.filter(e => e.size === "short").length;
  return { long, short, quick: evs.length-long-short, total: evs.length, foreign: evs.filter(e=>!e.mine).length };
}

/* Blocks a run may clear. Every card-linked block counts, including ones the
   morning routine made and ones whose slot has already passed: an unfinished
   block is not a record, and clearing it loses nothing — the Trello card is
   the source of truth and tomorrow's run picks it up again.
   Never a real meeting, never finished work, never what you're on right now. */
function clearableBlocks(date){
  const now = new Date();
  const isToday = sameDay(date, now);
  const nowMin = minsOf(now);
  return allEvents().filter(e => {
    if(!e.isTask || e.allDay || !overlapsDay(e,date)) return false;
    const c = cardFor(e);
    if(c && c.dueComplete) return false;                                    // you did it
    if(isToday && minsOf(e.start) <= nowMin && minsOf(e.end) > nowMin) return false;  // you're on it
    return true;
  });
}

/* card behind a block, if we can resolve one */
/* A board's 3-min refetch has been observed coming back with a card
   missing that was there a moment ago (list_by_board paging quirk, see
   CLAUDE.md) — with no error, so onWatch's own last-good fallback never
   kicks in. That flashed the block's colour to bk-none and its title back
   to the raw event summary for one render, then reverted. Once a card is
   seen, its last known shape is kept here and used if a later lookup comes
   up empty, so a block never visibly loses its card over a fetch blip. */
function cardFor(ev){
  if(!ev.cardShort) return null;
  const found = allCards().find(c => c.shortLink === ev.cardShort && !c.isStats) || null;
  if(found){ S.cardCache[ev.cardShort] = found; return found; }
  return S.cardCache[ev.cardShort] || null;
}

/* board hue class; falls back to neutral when the card can't be resolved */
const boardClass = card => card ? "bk-" + card.boardKey : "bk-none";

/* small ↗ that opens the real Trello card in a new tab — every place a
   card's title renders gets one, so "which card is this again" is always
   one tap away instead of a detour through Trello's own search */
function cardLink(card){
  if(!card || !card.url) return null;
  const a = el("a","card-link","↗");
  a.href = card.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.title = "Open in Trello"; a.setAttribute("aria-label","Open in Trello");
  a.addEventListener("click", e => e.stopPropagation());
  return a;
}

/* ------------------------------------------------- checklists */
/* One call per card, cached. The day is capped at a handful of tasks, so
   prefetching them all is cheap and lets details open on their own. */
/* A failed fetch used to cache itself into S.lists and the guard below then
   made it permanent — one flaky call and that card had no checklist for the
   rest of the page's life. An errored entry may now be asked for again, but
   not immediately: paintMain calls this on every render, so an unguarded
   retry would hammer a down connector once a frame. */
const CHECKLIST_RETRY_MS = 30000;
function loadChecklists(card){
  if(!card) return;
  const bag = S.lists[card.id];
  if(bag && !(bag.error && Date.now() - bag.at > CHECKLIST_RETRY_MS)) return;
  S.lists[card.id] = { loading:true };
  callTool(TRELLO, "trelloReadChecklist",
    { action:"list_by_card", cardId:card.id, limit:25 },
    { cache:{ staleTime:120000 } })
    .then(res => {
      const p = res.payload || {};
      S.lists[card.id] = { loading:false, checklists: p.checklists || [] };
    })
    .catch(e => { S.lists[card.id] = { loading:false, error:errCopy(e), at:Date.now() }; })
    .then(render);
}
const hasDetail = card => {
  if(!card) return false;
  if(card.desc && card.desc.trim()) return true;
  const bag = S.lists[card.id];
  return !!(bag && bag.checklists && bag.checklists.some(cl => (cl.checkItems||[]).length));
};

/* Toggle a check item: paint it immediately, write, put it back if the write
   fails — a checkbox that waits on the network feels broken. */
async function toggleItem(card, checklistId, item){
  if(S.ticking.has(item.id)) return;
  const want = item.state !== "COMPLETE";
  S.ticking.add(item.id);
  item.state = want ? "COMPLETE" : "INCOMPLETE";       // optimistic
  render();
  try{
    const res = await callTool(TRELLO, "trelloWriteChecklist",
      { action:"update_item", checklistId, itemId:item.id, checked:want });
    const back = res.payload;
    if(back && back.state) item.state = back.state;     // trust the server
    if(want) chime();
  }catch(e){
    item.state = want ? "INCOMPLETE" : "COMPLETE";      // revert
    toast(errCopy(e), true);
  }finally{
    S.ticking.delete(item.id);
    render();
  }
}

/* Card text edits: find the raw payload node so the change survives the
   next allCards() rebuild (normCard() is rebuilt from it every render),
   patch it optimistically, then write through and let the usual
   invalidate bring the server copy back in sync. */
function rawCardNode(card){
  const bag = S.cards[card.boardKey];
  const nodes = bag && bag.payload && bag.payload.cards && bag.payload.cards.nodes;
  return nodes ? nodes.find(n => n.id === card.id) : null;
}
async function writeCardDesc(card, text){
  const raw = rawCardNode(card);
  const prev = raw ? raw.desc : card.desc;
  if(raw) raw.desc = text;
  card.desc = text;
  try{
    await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:card.id, desc:text });
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
  }catch(e){
    if(raw) raw.desc = prev;
    card.desc = prev;
    throw e;
  }
}
async function saveCardDesc(card, text){
  S.editing.delete("desc:"+card.id);
  render();
  try{ await writeCardDesc(card, text); }
  catch(e){ toast(errCopy(e), true); }
  finally{ render(); }
}
async function saveItemText(checklistId, item, text){
  const trimmed = text.trim();
  if(!trimmed){ toast("Item text can't be empty.", true); return; }
  const prev = item.name;
  item.name = trimmed;
  S.editing.delete("item:"+item.id);
  render();
  try{
    const res = await callTool(TRELLO, "trelloWriteChecklist",
      { action:"update_item", checklistId, itemId:item.id, text:trimmed });
    const back = res.payload;
    if(back && back.name) item.name = back.name;
  }catch(e){
    item.name = prev;
    toast(errCopy(e), true);
  }finally{ render(); }
}

/* ---------------------------------------------------------------- stats */
function parseStats(card){
  if(!card) return null;
  const d = card.desc || "";
  const i = d.indexOf(ST_OPEN), j = d.indexOf(ST_CLOSE);
  if(i<0 || j<0) return { ...DEFAULT_STATS };
  try{ return Object.assign({}, DEFAULT_STATS, JSON.parse(d.slice(i+ST_OPEN.length, j).trim())); }
  catch(_){ return { ...DEFAULT_STATS }; }
}
const statsCard = () => allCards().find(c => c.isStats) || null;

/* The state card lives on סידורים in its own list. Nothing in the app ever
   created it, so if it was missing — or had been archived by hand — every
   settings change, streak bump and rollover was dropped on the floor with no
   toast and no trace. Find its list from any card already loaded off that
   board, else ask Trello for the board's lists. */
const STATS_LIST_RE = /DayFlow/i;
async function statsListId(){
  const board = BOARDS.find(b => b.key === "sidurim") || BOARDS[0];
  const known = allCards().find(c => c.boardKey === board.key && STATS_LIST_RE.test(c.listName || ""));
  if(known && known.listId) return known.listId;
  /* observed: list_by_board answers with a flat `lists` array plus pageInfo —
     not the nodes wrapper the card reads use */
  const res = await callTool(TRELLO, "trelloReadList", { action:"list_by_board", boardId:board.id, limit:50 });
  const arr = (res.payload && res.payload.lists) || [];
  const hit = arr.find(l => STATS_LIST_RE.test(l.name || ""));
  /* deliberately no "first list" fallback: dropping a machine-managed card
     into a real list would put it straight into the scheduling pool */
  return hit ? hit.id : null;
}
async function createStatsCard(body){
  const listId = await statsListId();
  if(!listId) throw { code:"tool_error", message:"No list to put the DayFlow state card in.", server:"Trello" };
  const res = await callTool(TRELLO, "trelloWriteCard",
    { action:"create", listId, name:STATS_CARD_NAME, desc:body });
  const node = res.payload && res.payload.cards && res.payload.cards.nodes && res.payload.cards.nodes[0];
  if(node && node.id) S.statsCardId = node.id;
  return S.statsCardId;
}

async function saveStats(next){
  S.stats = next;
  const body = "DayFlow widget state store. Machine-managed — edit via the widget, not by hand.\n\n"
             + ST_OPEN + "\n" + JSON.stringify(next) + "\n" + ST_CLOSE + "\n";
  /* the id is resolved per attempt, not captured: a retry that runs after
     Trello finally loads should find the real card instead of creating a
     second one from the state the first attempt saw */
  const write = async () => {
    const card = statsCard();
    if(card) S.statsCardId = card.id;
    const id = card ? card.id : S.statsCardId;
    if(id) await callTool(TRELLO, "trelloWriteCard", { action:"update", cardId:id, desc:body });
    /* only create when Trello itself answered and simply had no such card —
       an unloaded board is "don't know yet", not "it isn't there" */
    else if(BOARDS.every(b => S.cards[b.key])) await createStatsCard(body);
    else throw { code:"server_unavailable", message:"Trello hasn't loaded yet.", server:"Trello" };
    await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
  };
  try{ await write(); }
  catch(e){
    toast(errCopy(e), true);
    queueFailed("DayFlow settings", write);
  }
}
function bumpCategory(cat, field){
  const st = S.stats || { ...DEFAULT_STATS };
  st.categories = st.categories || {};
  const c = st.categories[cat] || { picked:0, done:0, skipped:0 };
  c[field] = (c[field]||0)+1;
  st.categories[cat] = c;
  return st;
}
function catWeight(cat){
  const c = S.stats && S.stats.categories && S.stats.categories[cat];
  if(!c || !c.picked) return 0;
  return ((c.done/c.picked) - 0.5) * 0.8;
}
const rollInfo = c => (S.stats && S.stats.rollovers && S.stats.rollovers[c.id]) || null;
const ageDays = c => { const r = rollInfo(c); return r ? (r.count||0) : 0; };
const isAging = c => ageDays(c) >= AGING_DAYS;

/* ---------------------------------------------------------------- engine */
/* Tier 0 is DayFlow's own rule, ahead of the shared ranking spec: a card
   with a rollover already had a day and didn't get finished, which beats
   even overdue+blocked. Tiers 1-6 below mirror the accountability-manager
   routine's ranking (§2) so both systems agree on urgency order; DayFlow
   just doesn't act on tomorrow-pre-booking or list moves the way that
   routine does. */
function tierOf(c){
  if(ageDays(c) >= 1) return 0;
  if(c.overdue && (c.blocked||c.stalled)) return 1;
  if(c.overdue) return 2;
  if(c.dueToday) return 3;
  if(c.blocked || c.stalled) return 4;
  if(c.due && daysBetween(new Date(), c.due) <= 2) return 5;
  if(c.due) return 6;
  return 7;
}
function candidates(){
  /* blocked/pending cards sit out of scheduling entirely — not just ranked
     low — until whatever's holding them up clears (edit the description
     to drop the marker, or the label). pendingItem() is what puts them
     here in the first place. green label = info only, never schedule. */
  return allCards().filter(c => !c.isStats && !c.dueComplete && !c.blocked &&
    !c.labels.some(l => l && l.color === "green"));
}
/* board order tie-break, straight from the routine's §2: סדקו, then
   סידורים, then PROJECTS — ahead of DayFlow's own win-rate weighting */
const BOARD_ORDER = { "סדקו":0, "סידורים":1, "PROJECTS":2 };
function rankCards(pool){
  return pool.slice().sort((a,b) => {
    const ta=tierOf(a), tb=tierOf(b);
    if(ta!==tb) return ta-tb;
    const boa=BOARD_ORDER[a.boardName], bob=BOARD_ORDER[b.boardName];
    if(boa!==undefined && bob!==undefined && boa!==bob) return boa-bob;
    const wa=catWeight(a.boardName), wb=catWeight(b.boardName);
    if(Math.abs(wa-wb)>0.001) return wb-wa;
    const da=a.due?a.due.getTime():Infinity, db=b.due?b.due.getTime():Infinity;
    if(da!==db) return da-db;
    return (a.lastActivityAt?a.lastActivityAt.getTime():0) - (b.lastActivityAt?b.lastActivityAt.getTime():0);
  });
}
function freeWindows(busy, winS, winE){
  const merged=[];
  for(const iv of busy.slice().sort((x,y)=>x.s-y.s)){
    if(!merged.length || iv.s > merged[merged.length-1].e) merged.push({s:iv.s,e:iv.e});
    else merged[merged.length-1].e = Math.max(merged[merged.length-1].e, iv.e);
  }
  const free=[]; let cur=winS;
  for(const iv of merged){
    if(iv.s > cur) free.push({ s:cur, e:Math.min(iv.s, winE) });
    cur = Math.max(cur, iv.e);
    if(cur >= winE) break;
  }
  if(cur < winE) free.push({ s:cur, e:winE });
  return free.filter(f => f.e-f.s > 0);
}
function findSlots(busy, winS, winE, dur, pad, max, fromMin){
  const need = dur + pad*2, out=[];
  for(const f of freeWindows(busy, winS, winE)){
    let s = Math.max(f.s, fromMin==null?winS:fromMin);
    s = Math.ceil(s/SNAP_MIN)*SNAP_MIN;
    while(s + need <= f.e){
      out.push({ s:s+pad, e:s+pad+dur });
      if(out.length >= max) return out;
      s += SNAP_MIN;
    }
  }
  return out;
}
function planFor(date, mode, picked, ignore){
  const have = existingBlocks(date, ignore);
  const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const nowMin = sameDay(date,new Date()) ? Math.ceil(minsOf(new Date())/SNAP_MIN)*SNAP_MIN : null;

  let pool = candidates();
  if(mode==="pick" && picked && picked.length){
    const set = new Set(picked);
    pool = pool.filter(c => set.has(c.id));
  }
  const already = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e,date) && e.cardShort && !ignored(e.id, ignore))
    .map(e => e.cardShort));
  pool = pool.filter(c => !c.shortLink || !already.has(c.shortLink));

  const ranked = rankCards(pool);
  const placed = [];
  /* Two busy sets: sessions may never land inside a permeable meeting
     (חמל included), quick tasks still can. Every placed block — whichever
     pass placed it — has to occupy both, so later passes see it. */
  const sessionLive = busyFor(date, ignore, true);
  const quickLive   = busyFor(date, ignore, false);

  /* A long session claims the day. Whether one is worth attempting today —
     rather than a shorter alternative — is decided by the same urgency
     ranking as everything else for now (overdue, blocked, due date); a
     finer read on project scale can refine this later without changing the
     shape of the rule. */
  let workDay = have.long > 0;
  for(const c of ranked.filter(x=>x.size==="long")){
    const dur = c.est || CFG.longMin;
    const s = findSlots(sessionLive, winS, winE, dur, CFG.buffer, 1, nowMin)[0];
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"long" });
    sessionLive.push({ s:s.s-CFG.buffer, e:s.e+CFG.buffer });
    quickLive.push({ s:s.s-CFG.buffer, e:s.e+CFG.buffer });
    workDay = true;
  }

  for(const c of ranked.filter(x=>x.size==="short")){
    const dur = c.est || CFG.shortMin;
    const s = findSlots(sessionLive, winS, winE, dur, CFG.buffer, 1, nowMin)[0];
    if(!s) continue;
    placed.push({ card:c, s:s.s, e:s.e, kind:"short" });
    sessionLive.push({ s:s.s-CFG.buffer, e:s.e+CFG.buffer });
    quickLive.push({ s:s.s-CFG.buffer, e:s.e+CFG.buffer });
  }

  /* A day that fits a full work day gets no quick tasks — the whole point
     of an 8-hour session is not splitting attention. */
  if(!workDay){
    const quick = ranked.filter(x=>x.size==="quick");
    if(quick.length){
      let n = quick.length, slot = null, slice = 0;
      while(n > 0){
        slice = quickSlice(n);
        slot = findSlots(quickLive, winS, winE, n*slice, 0, 1, nowMin)[0];
        if(slot) break;
        n--;
      }
      if(slot){
        for(let i=0;i<n;i++){
          const s = slot.s + i*slice;
          placed.push({ card:quick[i], s, e:s+slice, kind:"quick" });
        }
        quickLive.push({ s:slot.s, e:slot.s + n*slice });
      }
    }
  }

  /* a card never gets two blocks in one run */
  const seen = new Set();
  const unique = placed.filter(p => !seen.has(p.card.id) && seen.add(p.card.id));
  unique.sort((a,b)=>a.s-b.s);
  return unique;
}
/* A run rebuilds the day: every card-linked block it is allowed to touch is
   cleared and the day is laid out again under the caps. That is what keeps a
   day stuffed with Trello-generated blocks from staying stuffed. */
async function applyPlan(date, mode, picked, rebuild){
  if(S.busy) return;
  const clearable = rebuild ? clearableBlocks(date) : [];
  const ignore = new Set(clearable.map(e => e.id));

  S.busy = true; render();
  const placed = planFor(date, mode, picked, ignore);

  let cleared = 0;
  for(const e of clearable){
    try{ await deleteBlock(e.id); cleared++; }
    catch(err){ toast(errCopy(err), true); }
  }
  let ok=0, broke=false;
  for(const p of placed){
    try{
      await createBlock(p.card, atMin(date,p.s), atMin(date,p.e), p.kind);
      ok++;
      const st = bumpCategory(p.card.boardName,"picked");
      st.rollovers = st.rollovers || {};
      st.rollovers[p.card.id] = st.rollovers[p.card.id] || { first:dayKey(date), count:0 };
      S.stats = st;
    }catch(e){
      toast(errCopy(e), true);
      if(AUTHZ.has(e && e.code)){ broke = true; break; }
    }
  }
  /* A run clears the day before it rebuilds it, so a connector that dies
     between the two halves used to leave the day wiped and only partly
     re-laid — strictly worse than not running at all. If nothing at all got
     placed while the plan wanted blocks, put back what was cleared. */
  if(broke && !ok && cleared){
    let back = 0;
    for(const e of clearable){
      const c = cardFor(e);
      if(!c) continue;
      try{ await createBlock(c, e.start, e.end, e.size); back++; }
      catch(_){}
    }
    S.busy = false;
    await refreshCalendar();
    toast(back ? "Rebuild failed — the day was put back." : "Rebuild failed.", true);
    render();
    return;
  }
  const st = S.stats || { ...DEFAULT_STATS };
  st.plans = st.plans || {};
  st.plans[dayKey(date)] = { mode, n:ok, at:Date.now() };
  const keys = Object.keys(st.plans).sort();
  while(keys.length > 30) delete st.plans[keys.shift()];
  await saveStats(st);
  await refreshCalendar();
  S.busy = false;
  if(ok) toast(cleared ? `${ok} task${ok===1?"":"s"} · cleared ${cleared}` : `Scheduled ${ok} task${ok===1?"":"s"}.`);
  else if(cleared) toast(`Cleared ${cleared} · rolls to the next day`);
  else toast("Day is full.");
  render();
}
async function rolloverSweep(){
  const st = S.stats || { ...DEFAULT_STATS };
  const today = dayKey(new Date());
  if(st.lastSweep === today) return;
  st.rollovers = st.rollovers || {};
  const open = new Set(candidates().map(c=>c.id));
  for(const [id,r] of Object.entries(st.rollovers)){
    if(!open.has(id)){ delete st.rollovers[id]; continue; }
    if(r.last !== today){ r.count = (r.count||0)+1; r.last = today; }
  }
  st.lastSweep = today;
  await saveStats(st);
}

/* ---------------------------------------------------------------- writes */
/* colorId mirrors back into allEvents()'s size read — keep them in sync */
async function createBlock(card, start, end, size){
  const emoji = size === "long" ? "🗓️ " : size === "short" ? "🎵 " : "• ";
  const colorId = size === "long" ? "11" : size === "short" ? "5" : "9";
  /* colorId stays the pure quick/short/long signal every scheduling
     decision reads back — see CLAUDE.md. The real sync gap was the
     description: it used to be a bare marker+link, so opening the block
     directly in Google Calendar told you nothing about the actual task.
     The marker and the Trello link both stay findable by shortLinkOf()'s
     regex and the DF_MARK substring check regardless of what's between
     them, so this is safe to enrich. */
  const desc = (card.desc || "").trim().slice(0, 500);
  const res = await callTool(GCAL, "create_event", {
    calendarId:CAL_ID,
    summary: emoji + card.name,
    startTime:iso(start), endTime:iso(end),
    description:`${DF_MARK} ${card.name}${desc ? "\n\n"+desc : ""}\n\nOriginal: ${card.url}`,
    colorId
  });
  return res.payload;
}
const moveBlock = (id,start,end) => callTool(GCAL, "update_event",
  { calendarId:CAL_ID, eventId:id, startTime:iso(start), endTime:iso(end), notificationLevel:"NONE" });
const deleteBlock = id => callTool(GCAL, "delete_event",
  { calendarId:CAL_ID, eventId:id, notificationLevel:"NONE" });
async function refreshCalendar(){ try{ await S.mcp.invalidate(GCAL, "list_events"); }catch(_){} }

/* Drag/resize/reorder all go through these two: patch the block's time
   locally so render() shows the result immediately, then let the actual
   Google Calendar write happen in the background instead of holding the
   UI up for the round trip — that wait was most of what made dragging a
   card feel slow. findRawEvent reaches into S.events.payload directly
   because allEvents() re-derives fresh decorated objects from it on every
   call rather than caching them, so patching one of those copies wouldn't
   stick.
   evVer guards against a stale write's failure clobbering a newer move:
   if this id gets dragged again before the first write lands, the first
   write's eventual rejection must not roll back the second one's result —
   only the still-current version for that id is allowed to revert. */
function findRawEvent(id){
  const list = S.events && S.events.payload && S.events.payload.events;
  return (list || []).find(e => e.id === id) || null;
}
function applyLocalMove(id, start, end){
  const raw = findRawEvent(id);
  if(!raw) return null;
  const prevRaw = { start: raw.start, end: raw.end };
  raw.start = { dateTime: iso(start) };
  raw.end = { dateTime: iso(end) };
  S.evVer[id] = (S.evVer[id] || 0) + 1;
  return prevRaw;
}
/* Same idea one level up, for the actions that add or take away a block
   rather than re-time one: Done, Swap, Remove and Pending all used to hold
   the whole UI still behind `S.pending` while two or three round trips to
   Trello and Google Calendar finished, which is exactly the wait that made
   dragging feel slow before commitMove existed. Each returns an undo closure
   so the background write's failure path can put the model back. */
const rawEvents = () => (S.events && S.events.payload && S.events.payload.events) || null;
function dropLocalEvent(id){
  const list = rawEvents();
  if(!list) return () => {};
  const i = list.findIndex(e => e.id === id);
  if(i < 0) return () => {};
  const [gone] = list.splice(i,1);
  return () => { if(!list.includes(gone)) list.splice(Math.min(i,list.length), 0, gone); };
}
function addLocalEvent(raw){
  const list = rawEvents();
  if(!list) return () => {};
  list.push(raw);
  return () => { const i = list.indexOf(raw); if(i>=0) list.splice(i,1); };
}
/* A stand-in for a block Google hasn't given us an id for yet. It carries the
   same marker and colorId the real one will, so allEvents() reads it back as
   the right size and links it to its card exactly like the real thing. */
function localBlock(card, start, end, size){
  return {
    id: "local-" + Math.random().toString(36).slice(2),
    colorId: size === "long" ? "11" : size === "short" ? "5" : "9",
    summary: (size === "long" ? "🗓️ " : size === "short" ? "🎵 " : "• ") + card.name,
    description: `${DF_MARK} ${card.name}\n\nOriginal: ${card.url}`,
    start:{ dateTime: iso(start) }, end:{ dateTime: iso(end) },
    status:"confirmed"
  };
}
/* Optimistic card-field patch: normCard() rebuilds the decorated card from
   the raw payload node on every render, so the change has to land there. */
function patchLocalCard(card, fields){
  const raw = rawCardNode(card);
  const prev = {};
  for(const k in fields){
    prev[k] = raw ? raw[k] : card[k];
    if(raw) raw[k] = fields[k];
    card[k] = fields[k];
  }
  return () => { for(const k in prev){ if(raw) raw[k] = prev[k]; card[k] = prev[k]; } };
}
function commitMove(id, start, end, prevRaw, label){
  const ver = S.evVer[id];
  moveBlock(id, start, end).then(
    () => { if(S.evVer[id] === ver) refreshCalendar().then(render); },
    e => {
      if(S.evVer[id] !== ver) return;   // superseded by a later move — leave it be
      const raw = findRawEvent(id);
      if(raw && prevRaw){ raw.start = prevRaw.start; raw.end = prevRaw.end; }
      toast(errCopy(e), true);
      /* the block snapped back on screen, but the move the user made is still
         gone — hold it in the unsaved list so it's retryable rather than only
         announced for three seconds and then forgotten */
      queueFailed(label || "Move", async () => {
        const again = applyLocalMove(id, start, end);
        try{ await moveBlock(id, start, end); render(); }
        catch(err){
          const r = findRawEvent(id);
          if(r && again){ r.start = again.start; r.end = again.end; }
          render();
          throw err;
        }
      });
      render();
    }
  );
}

/* Done is the action that most needs to feel instant — it's the one you press
   dozens of times a day — so the card strikes through and the progress pill
   moves on the same frame as the tap, and Trello hears about it afterwards.
   The whole stats bump (streak, history, rollover clear) happens locally too:
   S.stats is the in-memory source of truth and saveStats already writes it in
   the background with its own retry/unsaved handling. */
function completeItem(item){
  const card = item.card;
  const key = card ? card.id : item.ev.id;
  if(S.pending.has(key)) return;

  const undo = card ? patchLocalCard(card, { dueComplete:true }) : (()=>{});
  celebrate();

  const st = bumpCategory(card ? card.boardName : "—", "done");
  const today = dayKey(new Date());
  st.history = st.history || [];
  let h = st.history.find(x=>x.d===today);
  if(!h){ h={ d:today, done:0 }; st.history.push(h); }
  h.done++;
  while(st.history.length > 60) st.history.shift();
  if(st.lastCompletionDate !== today){
    st.streak = (st.lastCompletionDate === dayKey(addDays(new Date(),-1))) ? (st.streak||0)+1 : 1;
    st.lastCompletionDate = today;
  }
  if(card && st.rollovers) delete st.rollovers[card.id];
  render();

  if(!card){ saveStats(st); return; }

  S.pending.add(key);
  const write = () => callTool(TRELLO, "trelloWriteCard", { action:"mark_done", cardId:card.id })
    .then(()=>{ S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{}); });
  write().then(
    ()=>{ S.pending.delete(key); saveStats(st); render(); },
    e =>{
      S.pending.delete(key);
      undo();                       // the strike-through comes back off
      toast(errCopy(e), true);
      queueFailed(`Done: ${card.name}`, async () => {
        const again = patchLocalCard(card, { dueComplete:true });
        try{ await write(); saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}

function removeItem(item){
  const name = item.card ? item.card.name : item.ev.summary;
  return confirmDialog("Remove this?", name + (item.card ? "\n\nArchives the card and clears its block." : "\n\nClears the block."), "Remove")
    .then(ok => { if(ok) doRemove(item); });
}
function doRemove(item){
  const id = item.ev.id, card = item.card;
  const label = card ? card.name : (item.ev.summary || "block");
  if(S.pending.has(id)) return;
  S.pending.add(id);

  /* the block leaves the list on the tap, not two round trips later */
  const restore = dropLocalEvent(id);
  const st = card ? bumpCategory(card.boardName, "skipped") : null;
  if(st && st.rollovers && card) delete st.rollovers[card.id];
  render();
  toast("Removed.");

  /* Block first, card second. Archiving first meant a failed delete left an
     archived card still holding a live block — invisible in Trello, still
     eating the slot, and not recoverable from inside the widget. Clearing the
     block first is the reversible half: if the archive then fails, the worst
     case is an unscheduled card that's still open. */
  const write = async () => {
    await deleteBlock(id);
    if(card){
      await callTool(TRELLO, "trelloWriteCard", { action:"archive", cardId:card.id });
      await S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{});
    }
  };
  write().then(
    ()=>{ S.pending.delete(id); if(st) saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id);
      restore();
      toast(errCopy(e), true);
      queueFailed(`Remove: ${label}`, async () => {
        const again = dropLocalEvent(id);
        try{ await write(); if(st) saveStats(st); render(); }
        catch(err){ again(); render(); throw err; }
      });
      render();
    }
  );
}

/* A card that's actively waiting on someone/something else: not done, not
   abandoned — just off today. Marks it blocked (via the same text BLOCK_RE
   already reads, so it reads back consistently everywhere else) and clears
   its block, but never touches the card's list/archive state. Once blocked
   it's held out of candidates() entirely, so replans leave it alone until
   the marker's edited away (the description pencil now makes that a normal
   edit, not a special unblock action) — or, if a "check back on" date was
   set, until that date passes (normCard's `blocked` reads PENDING_RE). */
/* edits: optional {desc, until, items:[{cl,it,text,checked}]} gathered by
   pendingDialog() — lets "why is this waiting" get written down (and a
   subtask ticked off) in the same motion that parks the card, instead of
   a separate trip back into the card afterward. */
function pendingItem(item, edits){
  const card = item.card;
  const id = item.ev.id;
  if(!card || S.pending.has(id)) return;
  S.pending.add(id);

  /* The dialog has already been confirmed at this point, so the card is off
     today either way — take the block off screen now and let the description
     write and the calendar delete happen behind it. */
  const restore = dropLocalEvent(id);
  const body = (()=>{
    if(card.blocked) return null;
    const raw = edits ? edits.desc : card.desc;
    const trimmed = (raw || "").trim();
    const mark = pendingMark(edits && edits.until);
    return trimmed ? mark + "\n\n" + trimmed : mark.trim();
  })();
  const undoDesc = body === null ? (()=>{}) : patchLocalCard(card, { desc:body });
  render();
  toast("Set aside as pending.");

  const write = async () => {
    if(edits && edits.items){
      for(const {cl, it, text, checked} of edits.items){
        if(checked !== (it.state === "COMPLETE")) await toggleItem(card, cl.id, it);
        if(text !== (it.name || "")) await saveItemText(cl.id, it, text);
      }
    }
    if(body !== null) await writeCardDesc(card, body);
    await deleteBlock(id);
  };
  write().then(
    ()=>{ S.pending.delete(id); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id);
      restore(); undoDesc();
      toast(errCopy(e), true);
      queueFailed(`Pending: ${card.name}`, async () => {
        const againEv = dropLocalEvent(id);
        const againDesc = body === null ? (()=>{}) : patchLocalCard(card, { desc:body });
        try{ await write(); render(); }
        catch(err){ againEv(); againDesc(); render(); throw err; }
      });
      render();
    }
  );
}

/* Popup that opens on Pending: lets you edit the description and tick/edit
   checklist items before the card is parked, instead of committing blind.
   Cancel changes nothing — the card isn't touched until "Set pending". */
function pendingDialog(item){
  const card = item.card;
  if(!card || S.pending.has(item.ev.id)) return;
  const bag = S.lists[card.id];
  const lists = (bag && bag.checklists) || [];

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null,"Set aside as pending"));
  const sub = el("p"); bidi(sub, card.name); h.appendChild(sub);
  dlg.appendChild(h);

  const body = el("div","details pending-edit");
  const taWrap = el("div","edit-row");
  const ta = el("textarea");
  ta.value = card.desc || "";
  ta.rows = Math.min(10, Math.max(3, (card.desc||"").split("\n").length + 1));
  ta.placeholder = "What are you waiting on?";
  taWrap.appendChild(ta);
  body.appendChild(taWrap);

  const untilRow = el("div","until-row");
  const untilLbl = el("label",null,"Check back on");
  const untilInp = el("input","until-in");
  untilInp.type = "date";
  untilInp.min = dayKey(addDays(startOfDay(new Date()),1));
  untilLbl.appendChild(untilInp);
  const untilHint = el("span","muted","optional — clears the marker on its own once this date passes");
  untilRow.appendChild(untilLbl); untilRow.appendChild(untilHint);
  body.appendChild(untilRow);

  const itemEdits = [];
  for(const cl of lists){
    const items = cl.checkItems || [];
    if(!items.length) continue;
    const head = el("div","clname");
    const nm = el("span"); bidi(nm, /^checklist$/i.test(cl.name||"") ? "" : (cl.name||"")); head.appendChild(nm);
    body.appendChild(head);
    const ul = el("ul");
    for(const it of items){
      let checked = it.state === "COMPLETE";
      const li = el("li", checked ? "on" : "");
      const b = el("button","box","✓");
      b.type = "button"; b.setAttribute("aria-pressed", String(checked));
      b.addEventListener("click", ()=>{
        checked = !checked; li.classList.toggle("on",checked); b.setAttribute("aria-pressed",String(checked));
      });
      li.appendChild(b);
      const inp = el("input","edit-item");
      inp.type = "text"; inp.value = it.name || "";
      li.appendChild(inp);
      ul.appendChild(li);
      itemEdits.push({ cl, it, getText:()=>inp.value, getChecked:()=>checked });
    }
    body.appendChild(ul);
  }
  if(bag && bag.loading) body.appendChild(el("div","muted","Checklist still loading — you can still set this pending."));
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", close);
  const go = el("button","btn primary","Set pending");
  go.addEventListener("click", ()=>{
    const edits = { desc: ta.value, until: untilInp.value || null,
      items: itemEdits.map(x => ({ cl:x.cl, it:x.it, text:x.getText(), checked:x.getChecked() })) };
    close();
    pendingItem(item, edits);
  });
  f.appendChild(cancel); f.appendChild(go);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim) close(); });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  ta.focus();
}

/* ---------------------------------------------------------------- agenda */
/* One ordered list for the viewed day: task blocks (actionable) + meetings. */
function agenda(){
  const date = startOfDay(S.anchor);
  const items = allEvents()
    .filter(e => !e.allDay && overlapsDay(e,date))
    .map(e => {
      const card = e.isTask ? cardFor(e) : null;
      return {
        ev:e, card,
        task:e.isTask,
        title: card ? card.name : e.summary,
        s:minsOf(e.start), e2:minsOf(e.end),
        done: !!(card && card.dueComplete)
      };
    })
    .sort((a,b) => a.s - b.s || a.e2 - b.e2);
  return items;
}
function splitAgenda(){
  const items = agenda();
  const isToday = sameDay(S.anchor, new Date());
  const nowMin = minsOf(new Date());
  const open = items.filter(i => i.task && !i.done);

  /* The hub must always answer "what now" while work remains. Prefer what is
     running, then what is next — and if the whole day is behind you, the
     earliest thing still unfinished rather than an empty screen. */
  let current = null;
  if(isToday){
    current = open.find(i => i.s <= nowMin && i.e2 > nowMin)     // happening now
           || open.find(i => i.e2 > nowMin)                       // next up
           || open[0]                                             // day's over, still open
           || null;
  }else{
    current = open[0] || null;
  }
  const meetingNow = isToday
    ? items.find(i => !i.task && i.s <= nowMin && i.e2 > nowMin) || null
    : null;

  /* a task whose slot already passed isn't "later" — it's unfinished.
     It keeps its own group so "Later today" stays a truthful forecast. */
  const missed = isToday
    ? items.filter(i => i !== current && i.task && !i.done && i.e2 <= nowMin)
    : [];
  const rest = items.filter(i =>
    i !== current && i !== meetingNow && missed.indexOf(i) < 0 && (!isToday || i.e2 > nowMin));
  const doneCount = items.filter(i => i.task && i.done).length;
  return { items, current, meetingNow, rest, missed, doneCount, open };
}

/* ---------------------------------------------------------------- render */
function render(){
  if(render._q || S.dragBusy) return;
  render._q = true;
  requestAnimationFrame(()=>{
    render._q = false;
    try{ paint(); }catch(e){ console.error(e); }
  });
}

/* Every view falls back to the same "nothing truthful to show yet" states —
   no connector, a fetch error with no cached data, or still loading. */
function sharedState(){
  if(S.noMcp)
    return stateCard("🔌","Live data isn't available here",
      "Needs the Trello and Google Calendar connectors.");
  const firstErr = Object.values(S.errs)[0];
  if(!S.events && firstErr) return stateCard("🔌","Can't reach your data", firstErr.message);
  if(!S.ready || !S.events) return el("div","skel");
  return null;
}

function paintHeader(){
  const d = S.anchor, today = new Date();
  for(const b of $("#viewSwitch").children) b.classList.toggle("active", b.dataset.view === S.view);

  if(S.view === "week"){
    $("#dateLabel").textContent = weekLabel(d);
    $("#dateRel").textContent = "";
  }else if(S.view === "month"){
    $("#dateLabel").textContent = monthLabel(d);
    $("#dateRel").textContent = "";
  }else{
    $("#dateLabel").textContent = `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
    const delta = daysBetween(today, d);
    $("#dateRel").textContent = delta===0 ? "" : delta>0 ? `+${delta}` : String(delta);
  }
}

/* The one page. Day shows the activity list — the hub plus everything else
   left today, meetings included so a permeable one (see groupForStack)
   shows what's scheduled inside it. Week/Month swap that list for the
   calendar grid, toggled from the same switcher used to be Schedule-only. */
function paintMain(){
  const host = $("#pageMain");
  host.innerHTML = "";

  const shared = sharedState();
  if(shared){ host.appendChild(shared); $("#dashRight").hidden = true; return; }

  if(S.view === "week"){ host.appendChild(weekGrid(S.anchor)); $("#dashRight").hidden = true; return; }
  if(S.view === "month"){ host.appendChild(monthGrid(S.anchor)); $("#dashRight").hidden = true; return; }

  const d = S.anchor;
  if(d.getDay() === CFG.dayOff){
    host.appendChild(stateCard("🏄‍♂️","My Day Off",""));
    $("#dashRight").hidden = true;
    return;
  }

  const { current, meetingNow, rest, missed, doneCount, open } = splitAgenda();

  /* the day is capped at a few tasks, so fetch their checklists up front and
     let the panels appear without being asked for */
  let budget = 12;
  for(const i of [current].concat(rest, missed)){
    if(budget <= 0) break;
    if(i && i.card && !S.lists[i.card.id]){ loadChecklists(i.card); budget--; }
  }

  if(meetingNow) host.appendChild(meetingNowRow(meetingNow));

  if(current) host.appendChild(nowCard(current));
  else host.appendChild(emptyNow(doneCount));

  /* every remaining thing today, tasks and meetings alike */
  const upcoming = rest.filter(i => !i.done);
  const missedTasks = missed.filter(i => i.task);
  for(const i of missedTasks) i.missed = true;
  const laterItems = upcoming.concat(missedTasks);
  if(laterItems.length) host.appendChild(timeline(laterItems));

  /* transient trouble: keep data, say it once, quietly */
  const soft = Object.values(S.errs).find(e => !AUTHZ.has(e.code) && !LIFECYCLE.has(e.code));
  if(soft){
    const b = el("div","banner");
    b.style.marginTop = "20px";
    b.appendChild(el("div",null,soft.message));
    host.appendChild(b);
  }

  $("#dashRight").hidden = false;
  $("#progressPill").textContent = `${doneCount}/${doneCount + open.length}`;
  /* only today is buildable — the rebuild button only ever creates new
     blocks, so it has nothing honest to do on any other day */
  $("#replanBtn").hidden = isLockedDay(d);
  $("#replanBtn").disabled = !!S.busy;
  $("#replanBtn").textContent = S.busy ? "…" : "↻";
}

/* Sits with the toasts rather than in the dash: it has to be visible in Week
   and Month too, and the dash row is already measured to fit at phone width. */
function paintFailed(){
  const host = $("#toasts");
  const old = host.querySelector(".toast.unsaved");
  if(old) old.remove();
  const n = S.failed.length;
  if(!n) return;
  const t = el("div","toast unsaved");
  t.appendChild(el("span","undo-msg", `${n} change${n===1?"":"s"} didn't save`));
  const again = el("button","undo-btn","Retry");
  again.addEventListener("click", retryFailed);
  t.appendChild(again);
  const x = el("button","undo-x","✕");
  x.title = "Discard";
  x.addEventListener("click", ()=>{ S.failed = []; render(); });
  t.appendChild(x);
  host.appendChild(t);
}

function paint(){
  paintHeader();
  paintMain();
  paintFailed();
}

/* ---------------------------------------------------------------- timeline
   The day's activity list: a plain chronological stack, not a minute-precise
   grid — "smaller, less detail" reads better as a list than as a calendar.
   A permeable meeting (one tasks may run inside — see permeable()) groups
   the tasks scheduled during it underneath itself instead of listing them
   as flat siblings, so "I have חמל, and two tasks inside it" reads at a
   glance. Position/height math for the minute-precise grid lives on in
   weekGrid (layoutOverlaps + timelineItem in "grid" mode); Day view no
   longer has one now that the Schedule page is gone. */
const TL_PPM = 1.6; // pixels per minute

/* group a flat, time-sorted item list so a permeable meeting's own tasks
   nest under it instead of scattering through the list */
function groupForStack(items){
  const sorted = items.slice().sort((a,b) => a.s-b.s || a.e2-b.e2);
  const used = new Set();
  const groups = [];
  for(const it of sorted){
    if(used.has(it)) continue;
    used.add(it);
    if(!it.task && permeable(it.ev)){
      const children = sorted.filter(t =>
        t.task && !used.has(t) && t.s >= it.s && t.e2 <= it.e2);
      children.forEach(c => used.add(c));
      groups.push({ meeting:it, children });
    }else{
      groups.push({ item:it });
    }
  }
  return groups;
}

function timeline(items, opts){
  opts = opts || {};
  const sec = el("section","later stack");
  const rowsEl = el("div","rows stack");
  for(const g of groupForStack(items)){
    if(g.meeting){
      rowsEl.appendChild(timelineItem(g.meeting, 0, 0, 0, 1, {mode:"stack"}));
      if(g.children.length){
        const nest = el("div","nest");
        for(const c of g.children) nest.appendChild(timelineItem(c, 0, 0, 0, 1, {mode:"stack"}));
        rowsEl.appendChild(nest);
      }
    }else{
      rowsEl.appendChild(timelineItem(g.item, 0, 0, 0, 1, {mode:"stack"}));
    }
  }
  sec.appendChild(rowsEl);
  return sec;
}

/* simple greedy interval-graph column layout — only matters when a foreign
   calendar event happens to overlap a task block; DayFlow's own scheduling
   never places two of its own blocks on top of each other */
function layoutOverlaps(items){
  const sorted = items.slice().sort((a,b) => a.s-b.s || a.e2-b.e2);
  const clusters = []; let cluster=[], clusterEnd=-Infinity;
  for(const it of sorted){
    if(cluster.length && it.s >= clusterEnd){ clusters.push(cluster); cluster=[]; clusterEnd=-Infinity; }
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e2);
  }
  if(cluster.length) clusters.push(cluster);

  const out = [];
  for(const cl of clusters){
    const colEnd = [], placed = [];
    for(const it of cl){
      let c = colEnd.findIndex(end => end <= it.s);
      if(c < 0){ c = colEnd.length; colEnd.push(0); }
      colEnd[c] = it.e2; placed.push({ item:it, col:c });
    }
    for(const p of placed) out.push({ item:p.item, col:p.col, cols:colEnd.length });
  }
  return out;
}


/* ---------------------------------------------------------- week & month
   Google-Calendar-style multi-day views, swapped in for the Day activity
   list via the same switcher. Week reuses the grid math timelineItem's
   "grid" mode was built for (layoutOverlaps), just narrower and seven-wide;
   Month is a genuinely different grid-of-cells renderer with no
   minute-precision. */
const MON_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function weekBounds(d){
  const start = addDays(startOfDay(d), -d.getDay());
  return { start, end: addDays(start, 6) };
}
function weekLabel(d){
  const { start, end } = weekBounds(d);
  return start.getMonth() === end.getMonth()
    ? `${start.getDate()}–${end.getDate()} ${MON[start.getMonth()]}`
    : `${start.getDate()} ${MON[start.getMonth()]} – ${end.getDate()} ${MON[end.getMonth()]}`;
}
function monthLabel(d){ return `${MON_FULL[d.getMonth()]} ${d.getFullYear()}`; }

function dayEvents(day){
  return allEvents().filter(e => !e.allDay && overlapsDay(e, day)).map(e => ({
    ev:e, card: e.isTask ? cardFor(e) : null, task:e.isTask,
    title: (e.isTask && cardFor(e)) ? cardFor(e).name : e.summary,
    s:minsOf(e.start), e2:minsOf(e.end), done:false
  }));
}

function weekGrid(anchorDate){
  const { start } = weekBounds(anchorDate);
  const days = Array.from({length:7}, (_,i) => addDays(start,i));
  const ppm = TL_PPM * 0.62;
  let winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
  const perDay = days.map(day => {
    const items = dayEvents(day);
    for(const it of items){
      winS = Math.min(winS, Math.floor(it.s/60)*60);
      winE = Math.max(winE, Math.ceil(it.e2/60)*60);
    }
    return { day, items };
  });
  const height = Math.round((winE-winS) * ppm);
  const isTodayIn = day => sameDay(day, new Date());

  const wk = el("section","week");
  const head = el("div","week-head");
  head.appendChild(el("div","tl-gutter"));
  for(const day of days){
    const h = el("button","week-day-h" + (isTodayIn(day) ? " today" : ""));
    h.appendChild(el("span","wdow", DOW[day.getDay()].slice(0,3)));
    h.appendChild(el("span","wdate", String(day.getDate())));
    h.addEventListener("click", ()=>{ S.anchor = day; S.view = "day"; syncCalendarWatch(); render(); });
    head.appendChild(h);
  }
  wk.appendChild(head);

  const body = el("div","week-body");
  const hoursCol = el("div","tl-hours tl-gutter");
  hoursCol.style.height = height + "px";
  for(let h = Math.ceil(winS/60); h <= Math.floor(winE/60); h++){
    const lab = el("div","hl", pad2(h%24) + ":00");
    lab.style.top = ((h*60-winS)*ppm) + "px";
    hoursCol.appendChild(lab);
  }
  body.appendChild(hoursCol);

  const colsWrap = el("div","week-cols");
  const colEls = perDay.map(({ day }) => {
    const c = el("div","rows week-col" + (isTodayIn(day) ? " today" : ""));
    c.style.height = height + "px";
    for(let h = Math.ceil(winS/60); h <= Math.floor(winE/60); h++){
      const gl = el("div","grid-line"); gl.style.top = ((h*60-winS)*ppm) + "px"; c.appendChild(gl);
    }
    colsWrap.appendChild(c);
    return { day, el:c };
  });
  const columns = colEls.map(c => ({ date:c.day, el:c.el }));
  perDay.forEach(({ day, items }, i) => {
    const colEl = colEls[i].el;
    for(const { item, col, cols } of layoutOverlaps(items))
      colEl.appendChild(timelineItem(item, winS, ppm, col, cols, { mode:"grid", compact:true, date:day, columns }));
    if(isTodayIn(day)){
      const nowMin = minsOf(new Date());
      if(nowMin >= winS && nowMin <= winE){
        const line = el("div","tl-now"); line.style.top = ((nowMin-winS)*ppm) + "px";
        colEl.appendChild(line);
      }
    }
  });
  body.appendChild(colsWrap);
  wk.appendChild(body);
  return wk;
}

function monthGrid(anchorDate){
  const first = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());
  const days = Array.from({length:42}, (_,i) => addDays(gridStart,i));
  const today = new Date();

  const grid = el("div","month");
  const dow = el("div","month-dow");
  for(const d of DAYS) dow.appendChild(el("span",null,d));
  grid.appendChild(dow);

  const cells = el("div","month-cells");
  for(const day of days){
    const inMonth = day.getMonth() === anchorDate.getMonth();
    const isToday = sameDay(day, today);
    const cell = el("button","month-cell" + (inMonth ? "" : " dim") + (isToday ? " today" : ""));
    cell.appendChild(el("span","mc-num", String(day.getDate())));

    const items = dayEvents(day);
    if(items.length){
      const chips = el("div","mc-chips");
      for(const it of items.slice(0,3)){
        const chip = el("div","mc-chip " + boardClass(it.card));
        chip.appendChild(el("span","mc-dot"));
        chip.appendChild(bidiSpan(it.title));
        chips.appendChild(chip);
      }
      if(items.length > 3) chips.appendChild(el("div","mc-more", `+${items.length-3} more`));
      cell.appendChild(chips);
    }
    cell.addEventListener("click", ()=>{ S.anchor = day; S.view = "day"; syncCalendarWatch(); render(); });
    cells.appendChild(cell);
  }
  grid.appendChild(cells);
  return grid;
}

/* The hub: wall clock, what you're on, and how long is left on it. */
/* The hub card deliberately shares its inner layout with a plain timeline
   row (see timelineItem's stack mode) — same .row/.row-meta/.acts-inline —
   so "the one thing right now" reads as the same kind of object as
   everything below it, not a bespoke bigger widget. What stays unique to
   it: the white card surface (.now falls back to --surface, no --glass
   defined any more) and the .hub-top status line (Up next / On it / …). No
   remaining-time meter and no age/overdue/blocked badges here any more —
   dropped for that same reason, on request. */
function nowCard(item){
  const now = new Date();
  const isToday = sameDay(S.anchor, now);
  const nowMin = minsOf(now);
  const live = isToday && item.s <= nowMin && item.e2 > nowMin;
  const c = item.card;

  S.hubItem = item;
  const box = el("div","now " + boardClass(c) + (live ? " live" : ""));

  /* --- top strip: status only now — the clock lives in its own widget --- */
  const top = el("div","hub-top");

  const overdueSlot = isToday && item.e2 <= nowMin;
  const status = el("div","hub-status");
  status.appendChild(el("span","eyebrow",
    live ? "On it" : overdueSlot ? "Still open" : isToday ? "Up next" : "First up"));
  if(c) { const b = el("span","chip board"); bidi(b, c.boardName); status.appendChild(b); }
  else if(!item.ev.mine) status.appendChild(el("span","chip","external"));
  top.appendChild(status);
  box.appendChild(top);

  /* --- body: same row/row-meta/acts-inline shape as a timeline row --- */
  const body = el("div","hub-body");
  const key = "hub:"+item.ev.id;

  const r = el("div","row");
  r.appendChild(el("span","t", fmtRange(item.ev.start, item.ev.end)));
  r.appendChild(el("span","dot"));
  const n = el("span","n");
  n.appendChild(bidiSpan(item.title));
  if(c){ const link = cardLink(c); if(link) n.appendChild(link); }
  r.appendChild(n);

  const acts = el("div","acts-inline");
  if(c && hasDetail(c)){
    const shut = S.collapsed.has(key);
    const info = el("button","mini info", shut ? "▾" : "▴");
    info.setAttribute("aria-label", shut ? "Show details" : "Hide details");
    info.addEventListener("click", ()=>{
      if(shut) S.collapsed.delete(key); else S.collapsed.add(key);
      render();
    });
    acts.appendChild(info);
  }
  const doneBtn = el("button","mini text ok","Done");
  doneBtn.title = "Done"; doneBtn.setAttribute("aria-label","Done");
  doneBtn.addEventListener("click", ()=>completeItem(item));
  acts.appendChild(doneBtn);
  const btns = [doneBtn];
  const swapBtn = el("button","mini text swap","Swap");
  swapBtn.title = "Swap for another task"; swapBtn.setAttribute("aria-label","Swap task");
  swapBtn.addEventListener("click", ()=>swapPicker(item));
  if(isLockedItem(item)){ swapBtn.disabled = true; swapBtn.title = "Only today and tomorrow can be scheduled."; }
  acts.appendChild(swapBtn); btns.push(swapBtn);
  if(c){
    const pendingBtn = el("button","mini text pend","Pending");
    pendingBtn.title = "Waiting on something else — clears today's block, keeps the card open";
    pendingBtn.setAttribute("aria-label","Set pending");
    pendingBtn.addEventListener("click", ()=>pendingDialog(item));
    acts.appendChild(pendingBtn); btns.push(pendingBtn);
  }
  const skipBtn = el("button","mini text del","Remove");
  skipBtn.title = "Remove"; skipBtn.setAttribute("aria-label","Remove");
  skipBtn.addEventListener("click", ()=>removeItem(item));
  acts.appendChild(skipBtn); btns.push(skipBtn);
  if(S.pending.has(item.ev.id) || (c && S.pending.has(c.id))) btns.forEach(b=>b.disabled=true);
  r.appendChild(acts);
  body.appendChild(r);

  const meta = el("div","row-meta");
  meta.appendChild(el("span","chip deep", fmtDur(item.e2 - item.s)));
  if(c){ const b = el("span","chip bk"); bidi(b, c.boardName); meta.appendChild(b); }
  body.appendChild(meta);

  /* details open on their own when the card has any */
  if(c && hasDetail(c) && !S.collapsed.has(key)){
    const panel = detailPanel(c);
    if(panel) body.appendChild(panel);
  }
  box.appendChild(body);
  wireStackDrag(box, item);
  return box;
}

/* the hub says this itself (eyebrow + meter); list-row cards get the same
   read in one line — "Doing now" while live, "Starting in X" while ahead,
   nothing once it's missed (the dashed miss styling already says that) */
function itemStatusText(item){
  if(!sameDay(item.ev.start, new Date())) return null;
  const now = new Date();
  const nowMin = minsOf(now) + now.getSeconds()/60;
  if(item.s <= nowMin && item.e2 > nowMin) return "Doing now";
  if(nowMin < item.s) return `Starting in ${fmtDur(Math.round(item.s - nowMin))}`;
  return null;
}

/* description + checklists; items are clickable and write straight through */
function detailPanel(card){
  const bag = S.lists[card.id];
  const lists = (bag && bag.checklists) || [];
  const hasDesc = !!(card.desc && card.desc.trim());
  const descKey = "desc:"+card.id;
  const editingDesc = S.editing.has(descKey);
  if(!hasDesc && !editingDesc && !lists.length && !(bag && bag.error)) return null;   // say nothing

  const d = el("div","details");
  if(editingDesc){
    const wrap = el("div","edit-row");
    const ta = el("textarea");
    ta.value = card.desc || "";
    ta.rows = Math.min(10, Math.max(3, (card.desc||"").split("\n").length + 1));
    wrap.appendChild(ta);
    const acts = el("div","edit-acts");
    const save = el("button","btn primary","Save");
    save.addEventListener("click", ()=>saveCardDesc(card, ta.value));
    const cancel = el("button","btn quiet","Cancel");
    cancel.addEventListener("click", ()=>{ S.editing.delete(descKey); render(); });
    acts.appendChild(save); acts.appendChild(cancel);
    wrap.appendChild(acts);
    d.appendChild(wrap);
    requestAnimationFrame(()=>{ ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; });
  }else if(hasDesc){
    const row = el("div","desc-row");
    const p = el("div","desc"); bidi(p, card.desc.trim()); row.appendChild(p);
    const pen = el("button","edit-pencil","✎");
    pen.type = "button"; pen.title = "Edit description"; pen.setAttribute("aria-label","Edit description");
    pen.addEventListener("click", ()=>{ S.editing.add(descKey); render(); });
    row.appendChild(pen);
    d.appendChild(row);
  }
  if(bag && bag.error){ d.appendChild(el("div","muted", bag.error)); return d; }

  for(const cl of lists){
    const items = cl.checkItems || [];
    if(!items.length) continue;
    const done = items.filter(i => i.state === "COMPLETE").length;
    const head = el("div","clname");
    const nm = el("span"); bidi(nm, /^checklist$/i.test(cl.name||"") ? "" : (cl.name||"")); head.appendChild(nm);
    head.appendChild(el("span",null, `${done}/${items.length}`));
    d.appendChild(head);

    const prog = el("div","prog");
    const bar = el("i"); bar.style.width = Math.round(100*done/items.length) + "%";
    prog.appendChild(bar); d.appendChild(prog);

    const ul = el("ul");
    for(const it of items){
      const on = it.state === "COMPLETE";
      const itemKey = "item:"+it.id;
      const li = el("li", on ? "on" : "");
      if(S.editing.has(itemKey)){
        li.classList.add("editing");
        const inp = el("input","edit-item");
        inp.type = "text"; inp.value = it.name || "";
        inp.addEventListener("keydown", e=>{
          if(e.key === "Enter"){ e.preventDefault(); saveItemText(cl.id, it, inp.value); }
          else if(e.key === "Escape"){ e.preventDefault(); S.editing.delete(itemKey); render(); }
        });
        li.appendChild(inp);
        const save = el("button","mini ok","✓");
        save.type = "button"; save.title = "Save"; save.setAttribute("aria-label","Save item text");
        save.addEventListener("click", ()=>saveItemText(cl.id, it, inp.value));
        li.appendChild(save);
        const cancel = el("button","mini","✕");
        cancel.type = "button"; cancel.title = "Cancel"; cancel.setAttribute("aria-label","Cancel edit");
        cancel.addEventListener("click", ()=>{ S.editing.delete(itemKey); render(); });
        li.appendChild(cancel);
        ul.appendChild(li);
        requestAnimationFrame(()=>{ inp.focus(); inp.select(); });
        continue;
      }
      const b = el("button","box","✓");
      b.type = "button";
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", it.name || "check item");
      if(S.ticking.has(it.id)) b.disabled = true;
      b.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(b);
      const t = el("span","it"); bidi(t, it.name);
      t.addEventListener("click", ()=>toggleItem(card, cl.id, it));
      li.appendChild(t);
      const pen = el("button","edit-pencil","✎");
      pen.type = "button"; pen.title = "Edit item text"; pen.setAttribute("aria-label","Edit item text");
      pen.addEventListener("click", e=>{ e.stopPropagation(); S.editing.add(itemKey); render(); });
      li.appendChild(pen);
      ul.appendChild(li);
    }
    d.appendChild(ul);
  }
  return d;
}

function emptyNow(doneCount){
  if(doneCount) return stateCard("✓","Day clear", `${doneCount} done.`, true);
  const past = sameDay(S.anchor, new Date()) && minsOf(new Date()) >= CFG.dayEnd*60;
  if(past) return stateCard("—","Day's over","", false);
  return stateCard("—","Nothing scheduled","", true);
}
