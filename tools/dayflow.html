  --deep:#8B5CF6;
  --deep-soft:rgba(139,92,246,.15);

  /* one hue per board — candy-bright, kept clear of the state colours
     (red overdue / amber aging / green done), which always carry text too */
  --b-projects:#8B5CF6;  --b-projects-soft:rgba(139,92,246,.15);
  --b-sidurim:#2FA8FF;   --b-sidurim-soft:rgba(47,168,255,.15);
  --b-sedco:#FF8A3D;     --b-sedco-soft:rgba(255,138,61,.16);
  --b-none:#A0937A;      --b-none-soft:rgba(160,147,122,.13);

  --shadow:0 6px 20px rgba(40,26,4,.09);
  --shadow-lg:0 16px 44px rgba(40,26,4,.16);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-body:'Nunito',var(--sans);
  --font-display:'Titan One',var(--sans);
}
/* DayFlow deliberately commits to one bright look and has no dark palette.
   The viewer's theme is overridden rather than followed: the artifact shell
   stamps data-theme="dark" and an inline style.colorScheme on <html> when
   the reader's browser is dark, so color-scheme is forced back to light with
   !important (an important author rule outranks a plain inline style) —
   otherwise scrollbars and form controls would still render dark against
   the light page. Do not reintroduce a dark block without asking: being
   bright regardless of the OS/browser theme is the point, not an oversight. */
:root{ color-scheme:light !important; }

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.5;font-weight:600;
  -webkit-font-smoothing:antialiased;
}
/* The night-sky backdrop went with the dark palette — a starfield behind a
   paper-toned day theme reads as dirt, not atmosphere. */
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}

@media (prefers-reduced-motion:no-preference){
  @keyframes wob{0%,100%{transform:rotate(var(--wob,-1deg));}50%{transform:rotate(calc(var(--wob,-1deg) * -1));}}
}

/* ---------------- shell ----------------
   The app fills the viewport and doesn't scroll to reach its own chrome:
   header and dash are fixed at their content height, #pageMain takes
   whatever's left and is the one thing that can ever scroll — a safety
   net for content that genuinely doesn't fit, not the normal case. */
html,body{overflow:hidden;}
.wrap{
  height:100dvh;max-width:600px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* topbar: the real clock, above everything else and anchored left — the
   one thing that's true regardless of which day S.anchor is looking at.
   Settings sits opposite it since it no longer fits in .nav (prev/next
   are the only two buttons left there, flanking the date). */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:10px;position:relative;
}
.topbar-left{
  display:flex;align-items:center;justify-content:flex-start;gap:8px;flex:0 0 auto;
}
.topbar-center{
  display:flex;align-items:center;justify-content:center;
  position:absolute;left:50%;transform:translateX(-50%);flex:0 0 auto;
}
.dayflow-title{
  margin:0;padding:0;
  font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg, var(--accent) 0%, #FFB700 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:0 2px 4px rgba(0,0,0,.08);
  filter:drop-shadow(0 1px 2px rgba(148,98,0,.15));
}
.topbar-right{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;
}

.head{
  display:none;
}
/* the date sits centered between the prev/next arrows, which pin
   themselves close together — clicking it jumps back to today */
.dash-center .date{
  display:flex;align-items:baseline;justify-content:center;gap:8px;
  background:transparent;border:none;padding:2px;margin:0;cursor:pointer;text-align:center;
  border-radius:8px;flex:0 0 auto;
}
.dash-center .date:hover{background:var(--surface);}
.dash-center .date h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
.dash-center .date .rel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}

/* Day/Week/Month switcher — Day shows the activity list, Week/Month show
   the calendar grid, both in place of one another on the one page. Lives
   in the .dash row now, so it's sized to its content, not forced full-width. */
.segmented{
  display:flex;gap:2px;padding:3px;border:1.5px solid var(--line);border-radius:16px;
  background:var(--surface-2);flex:0 0 auto;
}
.segmented button{
  border:none;background:transparent;color:var(--ink-2);cursor:pointer;
  font-family:var(--font-body);font-size:11px;font-weight:800;
  padding:5px 8px;border-radius:13px;transition:background .15s,color .15s;white-space:nowrap;
}
.segmented button.active{background:var(--accent);color:var(--on-accent);}

/* standalone icon buttons — prev/next flanking the date, settings in the
   topbar — no longer grouped inside a shared <nav>, so the class name is
   just its own look rather than "a button that lives in .nav" */
.navbtn{
  width:32px;height:32px;border-radius:12px;border:1.5px solid transparent;flex:0 0 auto;
  background:transparent;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;font-size:15px;
  transition:background .15s,color .15s,border-color .15s,transform .12s;
}
.navbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink);transform:translateY(-1px);}
.navbtn:active{transform:scale(.92);}

/* layout: segmented (Day/Week/Month) on left, date navigation centered,
   rebuild/progress on right */
.dash{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:12px;flex-wrap:nowrap;
  position:relative;
}
.dash-left{
  display:flex;align-items:center;justify-content:flex-start;gap:4px;flex:0 0 auto;
  order:1;
}
.dash-center{
  display:flex;align-items:center;justify-content:center;gap:4px;
  position:absolute;left:50%;transform:translateX(-50%);flex:0 0 auto;
  order:2;
}
/* stacked (date line over time line) rather than side by side, and
   left-aligned now that it's alone in the topbar instead of centered
   between two flanking groups */
.clockw{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
  background:var(--glass,var(--surface));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--line);border-radius:16px;
  padding:5px 10px;box-shadow:var(--shadow);
}
.clockw .cw-date{display:flex;align-items:baseline;gap:4px;line-height:1.1;white-space:nowrap;}
.clockw .cw-dow{
  font-family:var(--font-body);font-size:9px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.clockw .cw-day{font-family:var(--font-body);font-size:10.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;}
.clockw .cw-time{
  font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;
  font-weight:400;letter-spacing:0;line-height:1;color:var(--ink);white-space:nowrap;
}
.clockw .cw-sec{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-3);margin-left:1px;}

.dash-right{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
.dash-right[hidden]{display:none;}
/* the gamified bit: a solid, badge-like fraction instead of two quiet stats */
.progress-pill{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  font-family:var(--font-display);font-size:14px;font-weight:400;
  color:var(--on-accent);background:var(--accent);
  border:1.5px solid var(--accent-ink);border-radius:99px;
  padding:5px 11px 5px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:filter .14s;
}
.progress-pill:hover{filter:brightness(1.06);}
.progress-pill::before{content:"✓";font-family:var(--font-body);font-size:10px;font-weight:800;}
/* the rebuild button, promoted from a quiet footer icon to a small FAB */
.rebuild{
  width:37px;height:37px;border-radius:50%;flex:0 0 auto;
  border:1.5px solid var(--accent-ink);background:var(--accent);color:var(--on-accent);
  cursor:pointer;font-size:16px;display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.28);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.rebuild:hover{filter:brightness(1.06);}
.rebuild:active{transform:scale(.93);}
.rebuild[disabled]{opacity:.5;cursor:not-allowed;}
.rebuild[hidden]{display:none;}
@media (prefers-reduced-motion:no-preference){
  .rebuild:hover{transform:rotate(50deg);}
  .rebuild:active{transform:rotate(50deg) scale(.93);}
}

/* the one thing allowed to scroll — everything above it is fixed chrome */
.page{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* board identity: every element that represents a task carries its board hue */
.bk-projects{--bc:var(--b-projects);--bc-soft:var(--b-projects-soft);}
.bk-sidurim {--bc:var(--b-sidurim); --bc-soft:var(--b-sidurim-soft);}
.bk-sedco   {--bc:var(--b-sedco);   --bc-soft:var(--b-sedco-soft);}
.bk-none    {--bc:var(--b-none);    --bc-soft:var(--b-none-soft);}

/* ---------------- the hub — same styling as regular cards, status moved above --- */
.now{
  position:relative;width:100%;box-shadow:var(--shadow);transition:transform .15s;
  cursor:grab;touch-action:none;overflow:hidden;
}
.now::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:var(--bc,var(--b-none));
}

/* drag-to-reorder in the Day-view list — hub card included, it's just the
   topmost of the same cards now */
.now.stack-dragging, .item.stack.stack-dragging{
  cursor:grabbing;box-shadow:var(--shadow-lg);z-index:30;transition:none;
  pointer-events:none;
}
.now.drop-target, .item.stack.drop-target{
  outline:2.5px dashed var(--bc,var(--accent));outline-offset:-2.5px;
}
/* the hovered row slides into the exact gap the dragged card left
   behind — transform is set inline (per-pair distance varies), the
   transform transition on .now/.item.stack above is what animates it. */

/* status label above the hub card — small text, no special styling */
.hub-top{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  padding:6px 0 8px;font-size:11px;font-weight:700;color:var(--ink-2);
}
.hub-status{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}

/* body is otherwise the same .row/.row-meta/.acts-inline shape a timeline
   row uses in stack mode — these three overrides are copied straight from
   .item.stack's own, so the two genuinely match instead of just looking
   similar by coincidence. */
.hub-body{padding:0;}
.now .row{flex-wrap:wrap;gap:6px 10px;padding:9px 12px;}
.now .row .n{font-size:14px;}
.now .acts-inline{flex:1 1 100%;justify-content:flex-end;gap:8px;margin-top:6px;}

.chip{
  font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);
  border:1.5px solid var(--line);white-space:nowrap;display:inline-block;
}
.chip.board{background:var(--bc-soft);color:var(--bc);border-color:transparent;--wob:-2deg;animation:wob 3.6s ease-in-out infinite;}
/* same board colour, but sitting next to the duration chip in a row-meta
   line — matched to .chip.deep's plain look there, no wobble */
.chip.bk{background:var(--bc-soft);color:var(--bc);border-color:transparent;}
.chip.crit{background:var(--crit);color:#fff;border-color:var(--crit);--wob:2deg;animation:wob 2.4s ease-in-out infinite;}
.chip.age{background:var(--age-soft);color:var(--age);border-color:transparent;}
.chip.deep{background:var(--deep-soft);color:var(--deep);border-color:transparent;}
.chip.due{background:var(--surface-2);color:var(--ink-3);border-color:transparent;}
.chip.live{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}

/* compact open-in-Trello glyph, dropped next to any card title */
.card-link{
  display:inline-grid;place-items:center;width:18px;height:18px;margin-inline-start:6px;
  border-radius:99px;color:var(--ink-3);text-decoration:none;font-size:11px;line-height:1;
  border:1.5px solid var(--line);background:var(--surface);vertical-align:middle;
  transition:background .14s,color .14s,border-color .14s;
}
.card-link:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3);}

.btn{
  border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:99px;padding:10px 18px;cursor:pointer;
  font-family:var(--font-body);font-size:14.5px;font-weight:800;
  box-shadow:none;
  transition:background .15s,border-color .15s,transform .1s,filter .1s,opacity .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);border-color:var(--accent-ink);color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent);}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:10px 12px;}
.btn.quiet:active{transform:scale(.94);}
.btn.icon{padding:0;width:44px;height:42px;display:grid;place-items:center;font-size:17px;line-height:1;}
.btn.icon.quiet{border-color:var(--line);background:transparent;}
.btn.icon.quiet:active{transform:scale(.9);}
.now .acts{gap:8px;}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* meeting-in-progress note above the answer */
.meeting-now{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;margin-bottom:10px;
  border-radius:16px;border:1.5px dashed var(--line-2);color:var(--ink-2);
  font-size:13.5px;font-weight:700;background:var(--surface-2);
}
.meeting-now .mn-time{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);flex:0 0 auto;}
.meeting-now .mn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------------- later: day timeline ---------------- */
.later{margin-top:16px;}
.later .lh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.tl-gutter{width:46px;flex:0 0 auto;}
.tl-hours{position:relative;}
.tl-hours .hl{
  position:absolute;left:0;right:6px;text-align:right;
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-3);
  transform:translateY(-50%);
}
.rows{position:relative;flex:1 1 auto;min-width:0;}
.rows .grid-line{position:absolute;left:0;right:0;border-top:2px dashed var(--line);}
.rows .tl-now{
  position:absolute;left:-8px;right:0;height:0;border-top:3px solid var(--crit);z-index:6;
}
.rows .tl-now::before{
  content:"";position:absolute;left:0;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--crit);
}

/* each scheduled thing is its own card, positioned by time */
.item{
  position:absolute;left:0;right:0;
  border-radius:18px;border:1.5px solid var(--bc,var(--line-2));
  background:var(--bc-soft,var(--surface-2));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  overflow:hidden;touch-action:none;cursor:grab;
  transition:box-shadow .15s,transform .1s;
}
.item.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:20;transition:none;}
.item.expanded{z-index:8;height:auto!important;}
.item.miss{border-color:var(--crit);border-style:dashed;}
.item.meeting{cursor:default;background:var(--surface-2);border-color:var(--line-2);opacity:.82;}
.item.done{opacity:.5;}

/* Tasks page: a plain vertical stack instead of a minute-precise grid —
   "smaller, less detail" reads better as a list than as a calendar.
   Border-top separates from the hub card above when present */
.rows.stack{
  position:static;height:auto!important;display:flex;flex-direction:column;gap:8px;
  border-top:1.5px solid var(--line-2);margin-top:12px;padding-top:12px;
}
.item.stack{position:static;width:100%;box-shadow:var(--shadow);transition:transform .15s;}
.item.stack .row{flex-wrap:wrap;gap:6px 10px;padding:9px 12px;}
.item.stack .row .n{font-size:14px;}
.item.stack .acts-inline{flex:1 1 100%;justify-content:flex-end;gap:8px;margin-top:6px;}
/* tasks scheduled inside a permeable meeting nest under it, so "חמל, and
   two tasks inside it" reads as one group instead of scattering in the list */
.nest{
  display:flex;flex-direction:column;gap:8px;
  margin:-2px 0 0 20px;padding-left:14px;border-left:2px dashed var(--line-2);
}

.row{
  display:flex;align-items:flex-start;gap:8px;
  padding:6px 8px;height:100%;min-height:100%;
}
.row .t{
  font-family:var(--mono);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--ink-2);flex:0 0 auto;padding-top:1px;white-space:nowrap;
}
.row .dot{
  flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  background:var(--bc,var(--b-none));margin-top:4px;
}
.item.meeting .dot{background:transparent;border:1.5px solid var(--line-2);}
.row .n{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700;overflow-wrap:anywhere;line-height:1.3;text-align:right;}
/* status / duration / board, one line under the row — the same read the
   hub gives its one task, just compact enough for a whole list of them */
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 12px 10px;margin-top:-2px;}
.row-meta .eyebrow{font-size:10px;}
/* shrink-to-fit titles: RTL text stays next to its timestamp */
.nt{display:inline-block;max-width:100%;vertical-align:top;}
.item.meeting .n{font-style:normal;color:var(--ink-2);}
.item.miss .t{color:var(--crit);}
.row.done .n{text-decoration:line-through;text-decoration-thickness:2px;}

.acts-inline{display:flex;gap:3px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
.mini{
  width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;font-size:12px;line-height:1;
  transition:background .14s,color .14s,border-color .14s,transform .12s;
}
.mini:hover{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink);transform:scale(1.08);}
.mini:active{transform:scale(.9);}
.mini:disabled{opacity:.4;cursor:not-allowed;}
.mini.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
/* Done/Swap/Pending/Remove get a coloured ring at rest — border only, no
   fill or text tint — so four actions in a row still read apart by
   colour without shouting; the fill lands on hover. */
.mini.ok{border-color:var(--done);}
.mini.ok:hover{color:#fff;background:var(--done);border-color:var(--done);}
.mini.swap{border-color:var(--accent-line);}
.mini.swap:hover{color:var(--on-accent);background:var(--accent);border-color:var(--accent-ink);}
.mini.pend{border-color:var(--age);}
.mini.pend:hover{color:#fff;background:var(--age);border-color:var(--age);}
.mini.del{border-color:var(--crit);}
.mini.del:hover{color:#fff;background:var(--crit);border-color:var(--crit);}
.mini.text{width:auto;padding:0 10px;font-size:11px;font-weight:800;}
.resize-handle{
  position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none;
}
.resize-handle::after{
  content:"";position:absolute;left:50%;bottom:2px;width:26px;height:3px;border-radius:2px;
  background:var(--bc,var(--ink-3));opacity:.5;transform:translateX(-50%);
}
.item.dragging.cross-day{outline:2.5px dashed var(--accent);outline-offset:2px;}

/* ---------------- week view ---------------- */
.week-head{display:flex;margin-bottom:6px;}
.week-head .tl-gutter{width:46px;flex:0 0 auto;}
.week-day-h{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:transparent;border:none;cursor:pointer;padding:6px 2px;border-radius:14px;
  font-family:var(--font-body);color:var(--ink);
}
.week-day-h:hover{background:var(--surface);}
.week-day-h .wdow{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
.week-day-h .wdate{font-size:15px;font-weight:800;}
.week-day-h.today .wdate{
  color:var(--on-accent);background:var(--accent);border-radius:50%;
  width:24px;height:24px;display:grid;place-items:center;
}
.week-body{display:flex;}
.week-cols{display:flex;flex:1 1 auto;min-width:0;gap:2px;}
.week-col{position:relative;flex:1 1 0;min-width:0;border-left:2px dashed var(--line);}
.week-col.today{background:var(--accent-soft);}
/* the title gets the column's full width instead of squeezing next to the
   time label — stack them instead of sitting them side by side */
.item.compact .row{flex-direction:column;align-items:stretch;gap:1px;padding:3px 5px;}
.item.compact .row .t{font-size:9px;}

<script>
"use strict";
/* Self-healing stale-cache guard. Chrome outside incognito has repeatedly
   kept serving an old cached copy of this page after a republish, so even a
   manual refresh shows stale code. Fixed from inside the page, with no
   version string to remember to bump: the artifact shell stamps every
   publish into a versioned <base href="/_f/<stamp>/">, so compare ours
   against a copy fetched with cache:"reload" — which skips the cache on the
   way in *and* overwrites the cache entry with what it downloads. If the
   stamps differ we were stale, and that fetch has already repaired the
   cache, so an ordinary reload now lands on the new build.
   Runs this check on every load, not just the first in a tab — an earlier
   version cached "already verified this tab" and skipped the fetch from
   then on, which meant one clean load early in a long tab session (common
   here: republishing several times while iterating) permanently disabled
   the guard for every publish after it. The one-shot part is now scoped to
   the specific stale stamp seen, via sessionStorage, so it still can't loop
   forever against a server that keeps disagreeing, but a *new* stale stamp
   after a later publish gets its own reload attempt instead of being
   silently trusted. */
(function(){
  try{
    const tag = document.querySelector("base");
    const mine = tag && tag.getAttribute("href");
    if(!mine || !window.fetch) return;   // not in the shell (tests, file://)
    /* deliberately the bare canonical path, not location.href: opening a
       ?cache-busted variant of this page then also repairs the cache entry
       for the clean URL a home-screen shortcut points at. */
    fetch(location.pathname, {cache:"reload"}).then(r => r.text()).then(html => {
      const m = /<base[^>]+href="([^"]+)"/.exec(html);
      if(!m || m[1] === mine) return;   // current, or couldn't tell — leave it
      if(window.sessionStorage){
        if(sessionStorage.getItem("dfStale") === mine) return;   // already tried reloading past this exact stale stamp
        sessionStorage.setItem("dfStale", mine);
      }
      location.reload();
    }).catch(()=>{});
  }catch(_){}
})();
/* ==========================================================================

/* ---------------------------------------------------------------- config */

  { key:"projects", id:bAri("692abd49a69c853bb71cb728"), name:"PROJECTS" },
  { key:"sidurim",  id:bAri("693683bc8be8844147bbe82c"), name:"סידורים" },

/* Pure: turns a saved/draft settings object into a complete, clamped CFG

function normalizeCfg(saved){
  const cfg = { ...DEFAULTS, ...saved,
          colors:{ ...(saved.colors || {}) },
          openEvents: Array.isArray(saved.openEvents) ? saved.openEvents.slice() : DEFAULTS.openEvents.slice() };

     maxDeep/deepMin were the single pre-label session concept, replaced

}
function loadCfg(stats){

}
/* how long each quick task gets when n of them share the quickTotal window */
const quickSlice = (n) => n > 0 ? Math.max(5, Math.round((CFG.quickTotal / n) / 5) * 5) : CFG.quickTotal;

/* Meetings tasks may run inside: anything you've marked open, plus anything
   Google itself marks Free — that is what "Free" means. */
function permeable(e){
  if(!e || e.isTask) return false;
  if(e.raw && (e.raw.transparency === "transparent" || e.raw.availability === "AVAILABILITY_FREE")) return true;
  return (CFG.openEvents || []).indexOf(e.summary) >= 0;
}
async function toggleOpenEvent(name){

async function saveCfg(){

const DF_MARK  = "[dayflow]";
const ST_OPEN  = "<!--DAYFLOW_STATE_V1";
const ST_CLOSE = "DAYFLOW_STATE_V1-->";

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const pad2 = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const sameDay = (a,b) => dayKey(a)===dayKey(b);
const hhmm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const minsOf = d => d.getHours()*60 + d.getMinutes();
const atMin = (base,m) => { const x=startOfDay(base); x.setMinutes(m); return x; };
const iso = d => new Date(d).toISOString();
const daysBetween = (a,b) => Math.floor((startOfDay(b)-startOfDay(a))/86400000);

   past days are history, future days risk Trello cards landing on multiple days.
   Marking existing work done or removing it is still fine on any day. */
const isSchedulable = d => {
  const now = new Date();
  const daysAhead = daysBetween(now, d);
  return daysAhead === 0 || daysAhead === 1;
};
const isLockedDay = d => !isSchedulable(d);
const isLockedItem = item => isLockedDay(item.ev.start);
const fmtRange = (a,b) => `${hhmm(a)}–${hhmm(b)}`;
/* "70 min" reads worse than "1 hour 10 min" past the hour mark */
function fmtDur(mins){
  mins = Math.round(mins);
  if(mins < 60) return `${mins} min`;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h} hour${h===1?"":"s"}` + (m ? ` ${m} min` : "");
}
function fmtShortDate(date){
  const today = new Date();
  if(sameDay(date, today)) return "Today";
  const tomorrow = addDays(today, 1);
  if(sameDay(date, tomorrow)) return "Tomorrow";
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${MON[date.getMonth()]} ${date.getDate()}`;
}
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* per-field direction; the app chrome never flips */
function bidi(node,text){ node.setAttribute("dir","auto"); node.textContent = text==null?"":String(text); return node; }
/* An RTL title inside a wide LTR row would sit against the far edge, away from
   its timestamp. Wrapping it in a shrink-to-fit span keeps it beside the time

function bidiSpan(text){ const s = el("span","nt"); return bidi(s, text); }
