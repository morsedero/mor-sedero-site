function timelineItem(item, winS, ppm, col, cols, opts){
  opts = opts || {};
  const stack = opts.mode === "stack";
  const cls = ["item", boardClass(item.card), item.task ? "" : "meeting",
               item.missed ? "miss" : "", item.done ? "done" : "",
               stack ? "stack" : "", opts.compact ? "compact" : ""].filter(Boolean).join(" ");
  const wrap = el("div", cls);
  if(!stack){
    const top = (item.s - winS) * ppm;
    const height = Math.max(20, (item.e2 - item.s) * ppm);
    wrap.style.top = top + "px";
    wrap.style.height = height + "px";
    if(cols > 1){ wrap.style.left = (col*100/cols) + "%"; wrap.style.width = `calc(${100/cols}% - 6px)`; }
  }

  const r = el("div","row" + (item.done ? " done" : ""));
  r.appendChild(el("span","t", fmtRange(item.ev.start, item.ev.end)));
  r.appendChild(el("span","dot"));
  const n = el("span","n");
  n.appendChild(bidiSpan(item.title));
  if(item.card){ const link = cardLink(item.card); if(link) n.appendChild(link); }
  r.appendChild(n);

  if(item.task){
    const key = "row:"+item.ev.id;
    /* Week-view chips are too narrow for a full action row — dragging and
       resizing still work, everything else happens from Day view (tap the
       column header to jump there), same as opening an event in real
       Google Calendar's week view for anything beyond moving it. */
    if(!opts.compact){
      const acts = el("div","acts-inline");
      if(item.card && hasDetail(item.card)){
        const shut = S.collapsed.has(key);
        const info = el("button","mini info", shut ? "▾" : "▴");
        info.setAttribute("aria-label", shut ? "Show details" : "Hide details");
        info.addEventListener("click", e=>{
          e.stopPropagation();
          if(shut) S.collapsed.delete(key); else S.collapsed.add(key);
          render();
        });
        acts.appendChild(info);
      }
      const ok = el("button","mini text ok","Done");
      ok.title = "Done"; ok.setAttribute("aria-label","Done");
      ok.addEventListener("click", e=>{ e.stopPropagation(); completeItem(item); });
      acts.appendChild(ok);
      const btns = [ok];
      const sw = el("button","mini text swap","Swap");
      sw.title = "Swap"; sw.setAttribute("aria-label","Swap task");
      sw.addEventListener("click", e=>{ e.stopPropagation(); swapPicker(item); });
      if(isLockedItem(item)){ sw.disabled = true; sw.title = "Only today and tomorrow can be scheduled."; }
      acts.appendChild(sw); btns.push(sw);
      if(item.card){
        const pd = el("button","mini text pend","Pending");
        pd.title = "Waiting on something else — clears today's block, keeps the card open";
        pd.setAttribute("aria-label","Set pending");
        pd.addEventListener("click", e=>{ e.stopPropagation(); pendingDialog(item); });
        acts.appendChild(pd); btns.push(pd);
      }
      const dl = el("button","mini text del","Remove");
      dl.title = "Remove"; dl.setAttribute("aria-label","Remove");
      dl.addEventListener("click", e=>{ e.stopPropagation(); removeItem(item); });
      acts.appendChild(dl); btns.push(dl);
      if(S.pending.has(item.ev.id)) btns.forEach(b=>b.disabled=true);
      r.appendChild(acts);
    }
    wrap.appendChild(r);
    /* Day-list cards get the same status/duration/board read the hub gives
       its one task — week view stays cramped-on-purpose, no room for it */
    if(stack){
      const meta = el("div","row-meta");
      const status = itemStatusText(item);
      if(status) meta.appendChild(el("span","eyebrow",status));
      meta.appendChild(el("span","chip deep", fmtDur(item.e2 - item.s)));
      if(item.card){
        if(item.card.due) meta.appendChild(el("span","chip due", fmtShortDate(item.card.due)));
        const b = el("span","chip bk"); bidi(b, item.card.boardName); meta.appendChild(b);
      }
      wrap.appendChild(meta);
    }
    if(!opts.compact && item.card && hasDetail(item.card) && !S.collapsed.has(key)){
      const panel = detailPanel(item.card);
      if(panel){ wrap.appendChild(panel); wrap.classList.add("expanded"); }
    }
    if(!stack){
      wireItemDrag(wrap, item, winS, ppm, opts);
      const handle = el("div","resize-handle");
      wrap.appendChild(handle);
      wireItemResize(handle, wrap, item, winS, ppm, opts);
    }else{
      wireStackDrag(wrap, item);
    }
    return wrap;
  }
  else if(!opts.compact){
    const open = permeable(item.ev);
    const t = el("button","mini" + (open ? " on" : ""), open ? "⊙" : "⊘");
    t.title = open ? "Tasks may run inside" : "Blocks tasks";
    t.setAttribute("aria-label", t.title);
    t.addEventListener("click", async e=>{ e.stopPropagation(); await toggleOpenEvent(item.ev.summary); replan(); });
    const acts = el("div","acts-inline"); acts.appendChild(t); r.appendChild(acts);
  }
  wrap.appendChild(r);
  return wrap;
}

/* Drag-to-reorder for the Day-view list — the hub card included, since
   it's just the topmost of these now. Position:static, so this isn't
   pixel/time math like wireItemDrag: pick the card up, follow the pointer
   with a transform, and land it on whatever row the pointer is over. Hub
   and list rows aren't literal DOM siblings, so the order is collected by
   query instead of a sibling walk. Dropping on one calls pushReorder(),
   which shifts every card between the old and new position over by one
   slot rather than just trading times with whatever's under the pointer;
   dropping on empty space or a meeting is a no-op.

   Every row between the dragged card's original slot and wherever it's
   currently hovering gets pushed to its own new rest position — one slot
   toward the gap the drag opened — so letting go visibly *is* where
   everything lands. That push moves rows away from the pointer, though —
   so hit-testing can't be a live elementFromPoint (it'd immediately see
   through to whatever the push just uncovered and lose the target).
   Instead every row's un-pushed rect is snapshotted once at pickup and
   reused for the rest of the drag. */
function wireStackDrag(wrap, item){
  if(!item.task || isLockedItem(item)) return;   // meetings hold their slot; only today and tomorrow can be rebuilt
  wrap.dataset.evId = item.ev.id;
  let startY=0, startX=0, dragging=false, moved=false, order=[], originIdx=-1, targetIdx=-1, pushed=[];
  const eligible = e => !e.target.closest(".mini, .details, a");
  function onDown(e){
    if(!eligible(e) || S.pending.has(item.ev.id)) return;
    startY = e.clientY; startX = e.clientX; dragging = false;
    order = [...document.querySelectorAll(".now, .item.stack:not(.meeting)")]
      .filter(el => el.dataset.evId)
      .map(el => { const r = el.getBoundingClientRect(); return { el, id:el.dataset.evId, top:r.top, bottom:r.bottom }; });
    originIdx = order.findIndex(o => o.el === wrap);
    targetIdx = originIdx;
    wrap.setPointerCapture(e.pointerId);
    wrap.addEventListener("pointermove", onMove);
    wrap.addEventListener("pointerup", onUp, { once:true });
    wrap.addEventListener("pointercancel", onCancel, { once:true });
  }
  function clearPush(){
    for(const o of pushed){ o.el.classList.remove("drop-target"); o.el.style.transform = ""; }
    pushed = [];
  }
  /* rows between origin and the new target each slide one slot toward the
     gap the drag opened — toward origin's old rect if dragging down past
     them, toward the far end if dragging up past them */
  function applyPush(idx){
    clearPush();
    if(idx === originIdx || idx < 0) return;
    if(idx > originIdx){
      for(let i=originIdx+1;i<=idx;i++){
        const o = order[i], prev = order[i-1];
        o.el.style.transform = `translateY(${prev.top - o.top}px)`;
        o.el.classList.add("drop-target");
        pushed.push(o);
      }
    }else{
      for(let i=idx;i<originIdx;i++){
        const o = order[i], next = order[i+1];
        o.el.style.transform = `translateY(${next.top - o.top}px)`;
        o.el.classList.add("drop-target");
        pushed.push(o);
      }
    }
  }
  function onMove(e){
    const dy = e.clientY - startY, dx = e.clientX - startX;
    if(!dragging){
      if(Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
      dragging = true; moved = true; S.dragBusy = true;
      wrap.classList.add("stack-dragging");
    }
    wrap.style.transform = `translateY(${dy}px)`;
    const hitIdx = order.findIndex(o => e.clientY >= o.top && e.clientY < o.bottom);
    const next = hitIdx < 0 ? originIdx : hitIdx;
    if(next !== targetIdx){ targetIdx = next; applyPush(targetIdx); }
  }
  function cleanup(){
    wrap.removeEventListener("pointermove", onMove);
    wrap.classList.remove("stack-dragging"); wrap.style.transform = "";
    clearPush(); S.dragBusy = false;
  }
  function onUp(){
    const target = (targetIdx >= 0 && targetIdx !== originIdx) ? order[targetIdx] : null;
    const orderIds = order.map(o => o.id);
    cleanup();
    if(dragging && target) pushReorder(orderIds, item.ev.id, target.id);
    setTimeout(()=>{ moved = false; }, 0);
  }
  function onCancel(){ cleanup(); moved = false; }
  wrap.addEventListener("pointerdown", onDown);
  wrap.addEventListener("click", e => { if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* Drag the block to change its time, keeping duration. A small movement
   threshold tells a drag apart from a tap, so the "▾ details" button (and
   every other click inside the block) keeps working untouched. */
function wireItemDrag(wrap, item, winS, ppm, opts){
  opts = opts || {};
  const baseDate = opts.date || startOfDay(S.anchor);
  const columns = opts.columns || null;
  let startY=0, startTop=0, dur=0, dragging=false, moved=false, dropDate=baseDate;
  function eligible(e){ return !e.target.closest(".mini, .resize-handle, .details"); }
  function onDown(e){
    if(!eligible(e) || S.pending.has(item.ev.id) || isLockedDay(baseDate)) return;
    startY = e.clientY; startTop = parseFloat(wrap.style.top); dur = item.e2-item.s; dragging = false;
    dropDate = baseDate;
    wrap.setPointerCapture(e.pointerId);
    wrap.addEventListener("pointermove", onMove);
    wrap.addEventListener("pointerup", onUp, { once:true });
    wrap.addEventListener("pointercancel", onCancel, { once:true });
  }
  function onMove(e){
    const dy = e.clientY - startY;
    if(!dragging){
      if(Math.abs(dy) < 6) return;
      dragging = true; moved = true; S.dragBusy = true; wrap.classList.add("dragging");
    }
    /* clamp to the configured day window, not the (possibly wider) render
       grid — a stray early meeting can widen the grid without widening
       where a task is actually allowed to land */
    const minTop = Math.max(0, (CFG.dayStart*60-winS)*ppm);
    const maxTop = Math.max(minTop, (CFG.dayEnd*60-winS)*ppm - dur*ppm);
    const top = Math.max(minTop, Math.min(startTop+dy, maxTop));
    wrap.style.top = (Math.round(top/ppm/SNAP_MIN)*SNAP_MIN*ppm) + "px";
    /* week view only: which day column the pointer is over right now decides
       which day this lands on if released here — the item itself doesn't
       hop columns mid-drag, only the eventual drop target changes */
    if(columns){
      const col = columns.find(c => {
        const r = c.el.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX < r.right;
      });
      dropDate = col ? col.date : dropDate;
      wrap.classList.toggle("cross-day", dayKey(dropDate) !== dayKey(baseDate));
    }
  }
  function onUp(){
    wrap.removeEventListener("pointermove", onMove);
    wrap.classList.remove("dragging","cross-day"); S.dragBusy = false;
    if(dragging){
      const newS = winS + Math.round(parseFloat(wrap.style.top)/ppm);
      rescheduleTo(item, atMin(dropDate,newS), atMin(dropDate,newS+dur));
    }
    setTimeout(()=>{ moved = false; }, 0);
  }
  function onCancel(){
    wrap.removeEventListener("pointermove", onMove);
    wrap.classList.remove("dragging","cross-day"); S.dragBusy = false;
    if(dragging) render();
    moved = false;
  }
  wrap.addEventListener("pointerdown", onDown);
  /* swallow the click a drag-release generates, so it doesn't also fire
     whatever's under the pointer */
  wrap.addEventListener("click", e => { if(moved){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* Drag the bottom-edge handle to change duration, start fixed. */
function wireItemResize(handle, wrap, item, winS, ppm, opts){
  opts = opts || {};
  const date = opts.date || startOfDay(S.anchor);
  let startY=0, startH=0, dragging=false;
  function onDown(e){
    e.stopPropagation();
    if(S.pending.has(item.ev.id) || isLockedDay(date)) return;
    startY = e.clientY; startH = parseFloat(wrap.style.height); dragging = false;
    handle.setPointerCapture(e.pointerId);
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp, { once:true });
    handle.addEventListener("pointercancel", onCancel, { once:true });
  }
  function onMove(e){
    const dy = e.clientY - startY;
    if(!dragging){
      if(Math.abs(dy) < 6) return;
      dragging = true; S.dragBusy = true; wrap.classList.add("dragging");
    }
    const top = parseFloat(wrap.style.top);
    const maxH = (CFG.dayEnd*60-winS)*ppm - top;
    const minH = SNAP_MIN*ppm;
    const h = Math.max(minH, Math.min(startH+dy, maxH));
    wrap.style.height = Math.max(minH, Math.round(h/ppm/SNAP_MIN)*SNAP_MIN*ppm) + "px";
  }
  function onUp(){
    handle.removeEventListener("pointermove", onMove);
    wrap.classList.remove("dragging"); S.dragBusy = false;
    if(dragging){
      const top = parseFloat(wrap.style.top);
      const newS = winS + Math.round(top/ppm);
      const newDur = Math.max(SNAP_MIN, Math.round(parseFloat(wrap.style.height)/ppm));
      rescheduleTo(item, atMin(date,newS), atMin(date,newS+newDur));
    }
  }
  function onCancel(){
    handle.removeEventListener("pointermove", onMove);
    wrap.classList.remove("dragging"); S.dragBusy = false;
    if(dragging) render();
  }
  handle.addEventListener("pointerdown", onDown);
}

/* Commits a drag/resize: validate, patch the block's time locally so
   render() shows the new slot immediately, and let the Google Calendar
   write land in the background (applyLocalMove/commitMove) — waiting on
   that round trip before the UI moved on is what made dragging feel slow.
   The block's prior slot is kept as the one undoable move — Ctrl+Z or the
   popup's Undo button puts it straight back.
   Same meeting rule as planFor/postpone/push: a session (item.ev.deep) may
   never land inside a meeting, permeable or not; a quick task may still
   skip a permeable one. Drag had no such check until now, so a session
   dragged onto a permeable meeting (חמל and friends) would happily commit —
   this closes that gap rather than only preventing the scheduler from
   doing it itself.
   Also rejects landing on a locked day — the item's own day is already
   guaranteed unlocked by wireItemDrag/wireItemResize refusing to start a
   drag there, but a Week-view drag can still cross columns mid-gesture
   into a day this widget won't build for, so the destination gets its
   own check here. */
function rescheduleTo(item, start, end){
  if(S.pending.has(item.ev.id)) return;
  if(isLockedDay(start)){ toast("Only today and tomorrow can be scheduled.", true); render(); return; }
  const date = startOfDay(start);
  const pad = item.ev.deep ? CFG.buffer : 0;
  const s = minsOf(start) - pad, e = minsOf(end) + pad;
  const busy = busyFor(date, item.ev.id, item.ev.deep);
  if(busy.some(b => s < b.e && e > b.s)){
    toast(item.ev.deep ? "Sessions can't run inside a meeting or another block." : "That slot's already taken.", true);
    render();
    return;
  }
  const prevStart = item.ev.start, prevEnd = item.ev.end;
  const prevRaw = applyLocalMove(item.ev.id, start, end);
  S.lastMove = [{ id:item.ev.id, start:prevStart, end:prevEnd }];
  render();
  showUndoPopup(`→ ${fmtRange(start,end)}`);
  commitMove(item.ev.id, start, end, prevRaw);
}

/* Drag-to-reorder in the Day-view list: dropping a card among others pushes
   the whole run of cards between its old and new position over by one
   slot — the vacated slot closes, a new one opens where it lands, same as
   sliding a run of items along a shelf. Each card keeps its own duration;
   the affected run's outer boundary (earliest start of the topmost slot in
   play) doesn't move, only what's sitting in each slot inside it does. It
   used to just trade times with whatever it landed on, which only reads as
   "moving this card here" when there happen to be exactly two cards
   involved — a real reorder is what the gesture actually implies once
   there's a longer run of cards on screen.
   Same collision rule as rescheduleTo, checked per card with the whole
   moving run ignored (every card in it is vacating its own slot). Also
   rejected if the repacked run would spill outside the day window.
   Meetings are never a party to this — wireStackDrag doesn't wire them as
   draggable or as a drop target, their time is a real commitment, so they
   just get stepped over in the run without being touched.
   Optimistic like rescheduleTo: every affected card's time is patched
   locally and shown before any of the writes lands, and each write then
   goes out in the background rather than being waited on one at a time. */
function pushReorder(orderIds, originId, targetId){
  if(originId === targetId) return;
  const byId = new Map(allEvents().map(e => [e.id, e]));
  const order = orderIds.map(id => byId.get(id)).filter(Boolean);
  const originIdx = order.findIndex(e => e.id === originId);
  const targetIdx = order.findIndex(e => e.id === targetId);
  if(originIdx < 0 || targetIdx < 0 || originIdx === targetIdx) return;
  const lo = Math.min(originIdx, targetIdx), hi = Math.max(originIdx, targetIdx);
  const range = order.slice(lo, hi+1);
  if(range.some(e => S.pending.has(e.id))) return;

  const dragged = order[originIdx];
  const rest = range.filter(e => e.id !== originId);
  const newOrder = originIdx < targetIdx ? [...rest, dragged] : [dragged, ...rest];

  const date = startOfDay(dragged.start);
  const gap = (a,b) => (a.deep || b.deep) ? CFG.buffer : 0;
  let cursor = minsOf(range[0].start);
  const laid = newOrder.map((e,i) => {
    if(i>0) cursor += gap(newOrder[i-1], e);
    const dur = minsOf(e.end) - minsOf(e.start);
    const s = cursor, en = s + dur;
    cursor = en;
    return { e, s, en };
  });

  const ignoreIds = new Set(range.map(e => e.id));
  for(const { e, s, en } of laid){
    if(s < CFG.dayStart*60 || en > CFG.dayEnd*60){
      toast("That push doesn't fit inside the day.", true);
      render();
      return;
    }
    const pad = e.deep ? CFG.buffer : 0;
    const busy = busyFor(date, ignoreIds, e.deep);
    if(busy.some(b => (s-pad) < b.e && (en+pad) > b.s)){
      toast(e.deep ? "Sessions can't run inside a meeting or another block." : "That push doesn't fit — something's in the way.", true);
      render();
      return;
    }
  }

  const moves = laid
    .map(({ e, s, en }) => ({ id:e.id, start:atMin(date,s), end:atMin(date,en), prevStart:e.start, prevEnd:e.end }))
    .filter(m => +m.start !== +m.prevStart || +m.end !== +m.prevEnd);
  if(!moves.length) return;   // dropped back where it started

  S.lastMove = moves.map(m => ({ id:m.id, start:m.prevStart, end:m.prevEnd }));
  for(const m of moves) m.prevRaw = applyLocalMove(m.id, m.start, m.end);
  render();
  showUndoPopup(moves.length > 1 ? `Pushed ${moves.length} cards.` : `→ ${fmtRange(moves[0].start, moves[0].end)}`);
  for(const m of moves) commitMove(m.id, m.start, m.end, m.prevRaw);
}

/* ---------------------------------------------------------------- undo
   One level, scoped to the last drag/resize/push — matches what a single
   Ctrl+Z press can reasonably promise to put back. A push undoes every
   card it moved together. Optimistic like the moves themselves: every
   card snaps back locally at once, each write goes out in the background. */
function undoMove(){
  const moves = S.lastMove;
  if(!moves || !moves.length) return;
  dismissUndo();
  S.lastMove = null;
  for(const m of moves) m.prevRaw = applyLocalMove(m.id, m.start, m.end);
  render();
  toast(moves.length > 1 ? "Push undone." : "Move undone.");
  for(const m of moves) commitMove(m.id, m.start, m.end, m.prevRaw);
}
/* clears the popup itself (DOM + timer) without touching S.lastMove — used
   by showUndoPopup to retire a stale popup right before showing a new one */
function clearUndoPopup(){
  if(S.undoTimer){ clearTimeout(S.undoTimer); S.undoTimer = null; }
  const t = document.querySelector(".toast.undo");
  if(t) t.remove();
}
function dismissUndo(){
  clearUndoPopup();
  S.lastMove = null;
}
function showUndoPopup(label){
  clearUndoPopup();
  const t = el("div","toast undo");
  const msg = el("span","undo-msg"); bidi(msg, label);
  const undoBtn = el("button","undo-btn","Undo");
  undoBtn.addEventListener("click", undoMove);
  const closeBtn = el("button","undo-x","✕");
  closeBtn.setAttribute("aria-label","Dismiss");
  closeBtn.addEventListener("click", dismissUndo);
  t.appendChild(msg); t.appendChild(undoBtn); t.appendChild(closeBtn);
  $("#toasts").appendChild(t);
  S.undoTimer = setTimeout(dismissUndo, 8000);
}
document.addEventListener("keydown", e => {
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "z") return;
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(!S.lastMove) return;
  e.preventDefault();
  undoMove();
});

/* ---------------------------------------------------------------- swap */
/* Replace what's in a slot with a card you pick. The slot keeps its time. */
/* true when ev's own slot sits inside a permeable meeting — a session
   can't be swapped into that slot, only another quick task can. */
function withinPermeable(ev, date){
  return allEvents().some(m => !m.isTask && permeable(m) && overlapsDay(m,date) &&
    sameDay(m.start,date) && minsOf(m.start) <= minsOf(ev.start) && minsOf(m.end) >= minsOf(ev.end));
}
function swapPicker(item){
  if(isLockedItem(item)){ toast("Only today and tomorrow can be scheduled.", true); return; }
  const scheduled = new Set(allEvents()
    .filter(e => e.isTask && overlapsDay(e, S.anchor) && e.cardShort).map(e => e.cardShort));
  const insideMeeting = withinPermeable(item.ev, S.anchor);
  const pool = rankCards(candidates().filter(c =>
    (!c.shortLink || !scheduled.has(c.shortLink)) && (!item.card || c.id !== item.card.id) &&
    (!insideMeeting || c.size === "quick")));

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const h = el("div","dh");
  h.appendChild(el("h3",null, fmtRange(item.ev.start, item.ev.end)));
  dlg.appendChild(h);

  if(!pool.length) body.appendChild(el("div","muted","Nothing else open."));
  for(const c of pool.slice(0,40)){
    const b = el("button","pick-row " + boardClass(c));
    b.type = "button";
    b.appendChild(el("span","dot"));
    const n = el("span","n"); n.appendChild(bidiSpan(c.name)); b.appendChild(n);
    const t = tierOf(c);
    if(isAging(c))    b.appendChild(el("span","chip age", ageDays(c)+"d"));
    else if(c.overdue)b.appendChild(el("span","chip crit","!"));
    if(c.size==="long")       b.appendChild(el("span","chip deep","8h"));
    else if(c.size==="short") b.appendChild(el("span","chip deep","3h"));
    b.addEventListener("click", ()=>{ close(); swapTo(item, c); });
    body.appendChild(b);
  }
  dlg.appendChild(body);

  const f = el("div","df");
  const cancel = el("button","btn quiet","Cancel");
  cancel.addEventListener("click", close);
  f.appendChild(cancel);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);

  scrim.appendChild(dlg); document.body.appendChild(scrim);
  cancel.focus();
}

function swapTo(item, card){
  const id = item.ev.id;
  if(S.pending.has(id)) return;
  const existingBlock = allEvents().find(e => e.cardShort === card.shortLink && overlapsDay(e, S.anchor));

  /* The old slot's own length used to carry straight over to whatever card
     landed in it — swap a quick task's 20-minute slot for a work day and
     the block stayed 20 minutes; swap a work day out for a quick task and
     it stayed 8 hours. A swap has to give the incoming card its own real
     size, not inherit the outgoing one's. Re-search for a slot of the
     right length only when the size actually differs — the common
     quick-for-quick swap never has to move. */
  let start = item.ev.start, end = item.ev.end;
  const wantDur = card.est || (card.size === "long" ? CFG.longMin : card.size === "short" ? CFG.shortMin : quickSlice(1));
  const haveDur = minsOf(end) - minsOf(start);
  if(wantDur !== haveDur){
    const ignore = new Set([id]);
    if(existingBlock) ignore.add(existingBlock.id);
    const winS = CFG.dayStart*60, winE = CFG.dayEnd*60;
    const busy = busyFor(S.anchor, ignore, card.size !== "quick");
    const fromMin = minsOf(start);
    const slot = findSlots(busy, winS, winE, wantDur, CFG.buffer, 1, fromMin)[0]
              || findSlots(busy, winS, winE, wantDur, CFG.buffer, 1, winS)[0];
    if(!slot){ toast("Doesn't fit here — nowhere left today.", true); return; }
    start = atMin(S.anchor, slot.s);
    end = atMin(S.anchor, slot.e);
  }
  S.pending.add(id);

  /* The slot changes hands on the tap. A stand-in block stands in for the one
     Google hasn't minted an id for yet; the real ids arrive with the refresh
     that follows the write. */
  const stand = localBlock(card, start, end, card.size);
  const undo = [dropLocalEvent(id), addLocalEvent(stand)];
  if(existingBlock) undo.push(dropLocalEvent(existingBlock.id));
  /* the stand-in has no real event id yet, so hold it out of drag, swap and
     the action buttons until the refresh replaces it with the real block */
  S.pending.add(stand.id);
  const st = bumpCategory(card.boardName, "picked");
  render();
  toast("Swapped.");

  /* Create before destroying. This used to delete the slot first, so a failing
     create left an empty slot with *both* cards unscheduled — the swap lost
     work instead of just not happening. Worst case now is a harmless duplicate
     that the next rebuild clears. */
  const write = async () => {
    await createBlock(card, start, end, card.size);
    await deleteBlock(id);
    if(existingBlock) await deleteBlock(existingBlock.id);
  };
  write().then(
    ()=>{ S.pending.delete(id); S.pending.delete(stand.id); saveStats(st); refreshCalendar().then(render); },
    e =>{
      S.pending.delete(id); S.pending.delete(stand.id);
      for(const u of undo) u();
      toast(errCopy(e), true);
      queueFailed(`Swap: ${card.name}`, async () => {
        try{ await write(); saveStats(st); refreshCalendar().then(render); }
        catch(err){ render(); throw err; }
      });
      render();
    }
  );
}

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function settingsPanel(){
  /* Edits land on a draft copy, not the live CFG — Save commits it, Cancel
     throws it away. Colours still preview live (nice immediate swatch
     feedback) but against the draft, and get reverted on Cancel. */
  let draft = normalizeCfg(CFG);

  const scrim = el("div","scrim");
  const dlg = el("div","dialog sheet");
  dlg.setAttribute("role","dialog"); dlg.setAttribute("aria-modal","true");

  const body = el("div","set");
  dlg.appendChild(body);

  const row = (label, ...controls) => {
    const r = el("label","set-row");
    r.appendChild(el("span","set-k", label));
    const w = el("span","set-v");
    controls.forEach(c => w.appendChild(c));
    r.appendChild(w);
    body.appendChild(r);
    return r;
  };
  const num = (key, min, max, step) => {
    const i = el("input","num-in");
    i.type="number"; i.min=min; i.max=max; i.step=step||1; i.value=draft[key];
    i.addEventListener("change", ()=>{ draft = normalizeCfg({...draft, [key]:+i.value}); i.value = draft[key]; });
    return i;
  };
  const numHours = (key, min, max, step) => {
    const i = el("input","num-in");
    i.type="number"; i.min=min; i.max=max; i.step=step||0.5; i.value=draft[key]/60;
    i.addEventListener("change", ()=>{ draft = normalizeCfg({...draft, [key]:+i.value*60}); i.value = draft[key]/60; });
    return i;
  };

  function buildBody(){
    body.innerHTML = "";

    body.appendChild(el("div","set-h","Day"));
    row("Hours", num("dayStart",0,23), el("span","set-dash","–"), num("dayEnd",1,24));
    const off = el("select","num-in wide");
    [["-1","none"]].concat(DAYS.map((d,i)=>[String(i),d])).forEach(([v,t])=>{
      const o=el("option",null,t); o.value=v; if(+v===draft.dayOff) o.selected=true; off.appendChild(o);
    });
    off.addEventListener("change", ()=>{ draft.dayOff=+off.value; });
    row("My Day Off", off);

    body.appendChild(el("div","set-h","Load"));
    row("Quick Task", num("quickTotal",5,480,5), el("span","set-u","min"));
    row("Session", numHours("shortMin",0.5,8,0.5), el("span","set-u","h"));
    row("Work Day", numHours("longMin",1,10,0.5), el("span","set-u","h"));
    row("Break time", num("buffer",0,60,5), el("span","set-u","min"));
    const lg = el("div","legend");
    lg.appendChild(document.createTextNode("No label = Quick Task. Yellow = Session. Orange = Work Day."));
    body.appendChild(lg);

    /* one row, three boards — used far less often than the Load numbers
       above, so it doesn't need a row of its own per board */
    body.appendChild(el("div","set-h","Colour"));
    const swatchRow = el("div","set-row tall");
    const sw = el("span","set-v swatches");
    for(const b of BOARDS){
      const card = el("span","swatch-card");
      const c = el("input","col-in");
      c.type="color";
      c.value = (draft.colors && draft.colors[b.key]) ||
        (getComputedStyle(document.documentElement).getPropertyValue("--b-"+b.key).trim() || "#888888");
      c.addEventListener("input", ()=>{ draft.colors[b.key]=c.value; applyColors(draft.colors); });
      const rst = el("button","mini","↺");
      rst.type = "button";
      rst.setAttribute("aria-label","Reset "+b.name+" colour");
      rst.addEventListener("click", e=>{
        e.preventDefault();
        delete draft.colors[b.key];
        applyColors(draft.colors);
        c.value = getComputedStyle(document.documentElement).getPropertyValue("--b-"+b.key).trim() || "#888888";
      });
      const swrow = el("span","swrow");
      swrow.appendChild(c); swrow.appendChild(rst);
      const name = el("span","swname", b.name);
      name.setAttribute("dir","auto");
      card.appendChild(swrow); card.appendChild(name);
      sw.appendChild(card);
    }
    swatchRow.appendChild(sw);
    body.appendChild(swatchRow);

    body.appendChild(el("div","set-h","Sound"));
    const snd = el("button","toggle" + (draft.sound ? " on" : ""), draft.sound ? "on" : "off");
    snd.type="button";
    snd.addEventListener("click", ()=>{ draft.sound=!draft.sound; snd.textContent=draft.sound?"on":"off";
      snd.classList.toggle("on",draft.sound); });
    row("Chime", snd);
  }
  buildBody();

  const f = el("div","df");

  const save = el("button","btn primary","Save");
  save.addEventListener("click", async ()=>{ CFG = draft; await saveCfg(); close(); });
  f.appendChild(cancel); f.appendChild(reset); f.appendChild(save);
  dlg.appendChild(f);

  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); render(); }
  function onKey(e){ if(e.key==="Escape"){ applyColors(); close(); } }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", e => { if(e.target===scrim){ applyColors(); close(); } });
  scrim.appendChild(dlg); document.body.appendChild(scrim);
  save.focus();
}

    const go = el("button","btn primary",okLabel);
    cancel.addEventListener("click", ()=>{ close(); resolve(false); });
    go.addEventListener("click", ()=>{ close(); resolve(true); });
    f.appendChild(cancel); f.appendChild(go);
    dlg.appendChild(f);
    function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key==="Escape"){ close(); resolve(false); } }
    document.addEventListener("keydown", onKey);
    scrim.addEventListener("click", e => { if(e.target===scrim){ close(); resolve(false); } });
    scrim.appendChild(dlg); document.body.appendChild(scrim); go.focus();
  });
}

const CHORES = [
  { id:"dishwasher", icon:"🍽️", label:"Dishwasher", cc:"#2FA8FF", glow:"rgba(47,168,255,.55)" },
  { id:"trash",      icon:"🗑️", label:"Trash",      cc:"#22C55E", glow:"rgba(34,197,94,.55)" },
  { id:"laundry",    icon:"🧺", label:"Laundry",    cc:"#8B5CF6", glow:"rgba(139,92,246,.55)" },
  { id:"broom",      icon:"🧹", label:"Broom",      cc:"#FF8A3D", glow:"rgba(255,138,61,.55)" },
];

/* Prototype: locks the screen behind a big square until the user confirms
   they're really done. No app-state wiring yet — triggered from the 🔒
   test button in the topbar. Done stays disabled until one chore is picked. */
function lockDialog(){
  const scrim = el("div","scrim lock-scrim");
  const box = el("div","lock-box");
  box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  box.appendChild(el("div","lock-title","Did you do your CHORES?"));
  box.appendChild(el("div","lock-sub","Choose"));

  const doneBtn = el("button","lock-square","Done!");
  doneBtn.disabled = true;

  const grid = el("div","lock-choices");
  for(const c of CHORES){
    const btn = el("button","lock-choice");
    btn.type = "button";
    btn.setAttribute("aria-label", c.label);
    btn.style.setProperty("--cc", c.cc);
    btn.style.setProperty("--cc-glow", c.glow);
    const badge = el("div","lc-badge");
    const icon = el("div","lc-icon", c.icon);
    badge.appendChild(icon);
    btn.appendChild(badge);
    btn.appendChild(el("div","lc-label", c.label));
    icon.addEventListener("animationend", () => icon.classList.remove("hover-in","hover-out"));
    btn.addEventListener("mouseenter", () => { icon.classList.remove("hover-out"); icon.classList.add("hover-in"); });
    btn.addEventListener("mouseleave", () => { icon.classList.remove("hover-in"); icon.classList.add("hover-out"); });
    btn.addEventListener("click", () => {
      grid.querySelectorAll(".lock-choice.sel").forEach(b => b.classList.remove("sel"));
      btn.classList.add("sel");
      doneBtn.disabled = false;
    });
    grid.appendChild(btn);
  }
  box.appendChild(grid);

  doneBtn.addEventListener("click", () => lockConfirmDialog(scrim));
  box.appendChild(doneBtn);
  scrim.appendChild(box); document.body.appendChild(scrim);
}

function lockConfirmDialog(lockScrim){
  const scrim = el("div","scrim lock-confirm-scrim");
  const box = el("div","lock-confirm-box");
  box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  box.appendChild(el("div","lock-confirm-text","Are you ABSOLUTELY sure?!?!"));
  const row = el("div","lock-confirm-btns");
  const yes = el("button","lock-confirm-square yes","YES!");
  const no = el("button","lock-confirm-square whoopsy","Whoopsy...");
  yes.addEventListener("click", () => { scrim.remove(); lockScrim.remove(); });
  no.addEventListener("click", () => scrim.remove());
  row.appendChild(yes); row.appendChild(no);
  box.appendChild(row);
  scrim.appendChild(box); document.body.appendChild(scrim);
  yes.focus();
}

/* ---------------------------------------------------------------- flourish */
const fx = $("#fx"), fxc = fx.getContext("2d");
let parts=[], raf=null;
function fitFx(){ fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", fitFx); fitFx();
function celebrate(){
  chime();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--done","--age","--crit","--deep","--b-sidurim"].map(v => cs.getPropertyValue(v).trim() || "#0E7C86");
  const host = document.querySelector(".now") || document.querySelector(".state");
  const r = host ? host.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/3, width:0, height:0 };
  const ox = r.left + r.width/2, oy = r.top + r.height/2;
  for(let i=0;i<64;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
    parts.push({ x:ox, y:oy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2.6, r:2.4+Math.random()*3,
                 c:cols[i%cols.length], life:1, rot:Math.random()*6, shape:i%3 });
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.life -= 0.014; p.rot += 0.15;
    fxc.save(); fxc.globalAlpha = Math.max(0,p.life);
    fxc.translate(p.x,p.y); fxc.rotate(p.rot);
    fxc.fillStyle = p.c;
    if(p.shape===0) fxc.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
    else if(p.shape===1){ fxc.beginPath(); fxc.arc(0,0,p.r*0.9,0,Math.PI*2); fxc.fill(); }
    else{ fxc.beginPath(); for(let k=0;k<5;k++){ const ang=k*2*Math.PI/5-Math.PI/2, x=Math.cos(ang)*p.r,y=Math.sin(ang)*p.r; k?fxc.lineTo(x,y):fxc.moveTo(x,y); } fxc.closePath(); fxc.fill(); }
    fxc.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (fxc.clearRect(0,0,innerWidth,innerHeight), null);
}
let actx=null;
function chime(){
  if(!CFG.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*0.08);
      g.gain.linearRampToValueAtTime(0.075,t+i*0.08+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.08+0.4);
      o.connect(g); g.connect(actx.destination); o.start(t+i*0.08); o.stop(t+i*0.08+0.42);
    });
  }catch(_){}
}
function toast(msg, isErr){
  const t = el("div","toast"+(isErr?" err":""));
  bidi(t, msg);
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 3400);
}

/* ---------------------------------------------------------------- boot */
function goDay(n){
  S.anchor = n===0 ? startOfDay(new Date()) : addDays(S.anchor, n);
  syncCalendarWatch();
  render();
}
function goWeek(n){
  S.anchor = addDays(S.anchor, n*7);
  syncCalendarWatch();
  render();
}
function goMonth(n){
  const d = new Date(S.anchor);
  d.setDate(1); d.setMonth(d.getMonth()+n);
  S.anchor = startOfDay(d);
  syncCalendarWatch();
  render();
}
/* prev/next mean "one unit of whatever's on screen" — a day in Day view,
   a week or a month while Week/Month is showing, same as Google Calendar's
   own prev/next */
function stepNav(n){
  if(S.view === "week")  return goWeek(n);
  if(S.view === "month") return goMonth(n);
  goDay(n);
}
$("#prev").addEventListener("click", ()=>stepNav(-1));
$("#next").addEventListener("click", ()=>stepNav(1));
$("#setBtn").addEventListener("click", settingsPanel);
$("#lockTestBtn").addEventListener("click", lockDialog);
$("#replanBtn").addEventListener("click", ()=>replan());
$("#dateWrap").addEventListener("click", ()=>goDay(0));
$("#progressPill").addEventListener("click", doneDialog);

for(const b of $("#viewSwitch").children){
  b.addEventListener("click", ()=>{ S.view = b.dataset.view; syncCalendarWatch(); render(); });
}

async function replan(){
  if(isLockedDay(S.anchor)){ toast("Only today and tomorrow can be built.", true); return; }
  if(S.anchor.getDay() === CFG.dayOff){ toast("My Day Off — nothing gets scheduled."); return; }
  const date = startOfDay(S.anchor);
  const clearable = clearableBlocks(date);
  if(clearable.length){
    const ok = await confirmDialog(
      "Rebuild today?",
      `Clears ${clearable.length} block${clearable.length===1?"":"s"} and re-lays the day.\n\nSchedules tasks by available time: quick tasks fit in a ${CFG.quickTotal}min window, sessions take ${CFG.shortMin}min, work days take ${CFG.longMin}min. A work day takes the whole day — no quick tasks alongside it. Meetings, finished and past work stay.`,
      "Rebuild");
    if(!ok) return;
  }
  applyPlan(date, "normal", null, true);
}
/* the little clock widget lives outside #pageMain, so it survives every
   repaint untouched — it only needs its own second-by-second tick */
function tickClockWidget(){
  const n = new Date();
  $("#cwDow").textContent = DOW[n.getDay()].slice(0,3);
  $("#cwDay").textContent = `${n.getDate()} ${MON[n.getMonth()]}`;
  $("#cwHH").textContent = hhmm(n);
  $("#cwSec").textContent = ":" + pad2(n.getSeconds());
}
/* Everything that has to happen when a day becomes *the* day: re-read the
   state card, load settings, sweep rollovers, and build the day if it hasn't
   been built yet. Boot runs it once the connectors settle; the rollover
   watcher runs it again after midnight, so both paths agree instead of one
   of them being a half-copy of the other. */
async function startDay(){
  const sc = statsCard();
  /* keep what we have if Trello can't answer — resetting to DEFAULT_STATS on
     a blip would wipe the streak and re-plan an already-planned day */
  if(sc){ S.stats = parseStats(sc); S.statsCardId = sc.id; }
  else if(!S.stats) S.stats = { ...DEFAULT_STATS };
  loadCfg(S.stats);

  await rolloverSweep();

  const d = new Date();
  const planned = S.stats.plans && S.stats.plans[dayKey(d)];
  if(!planned && d.getDay()!==CFG.dayOff) await applyPlan(startOfDay(d),"normal",null,true);
  render();
}

/* Crossing midnight with the page open used to gut the app. S.anchor was set
   once at load and only user navigation moved it, while allEvents() drops
   every card-linked block that doesn't start today — so at 00:00 the entire
   schedule vanished from the model, the hub fell to "Nothing scheduled", and
   its own Re-plan button could only answer "Only today can be built right
   now." Nothing short of a reload recovered, and leaving the tab open
   overnight is the normal way this thing gets used.
   Now the clock tick watches the date. If the anchor was on the old today it
   follows the clock; either way the calendar watch re-registers on the new
   range and the new day gets built exactly as a fresh boot would build it. */
function checkDayRollover(){
  const now = dayKey(new Date());
  if(S.today === now) return;
  const wasOnToday = S.anchor && dayKey(S.anchor) === S.today;
  S.today = now;
  if(wasOnToday) S.anchor = startOfDay(new Date());
  syncCalendarWatch();
  render();
  if(S.ready && !S.noMcp) startDay();
}

/* Nothing refreshed on return: a backgrounded tab rode entirely on the host's
   2-3 minute refetch, so coming back to it showed minutes-old data with no
   sign of it. Paired with checkDayRollover above, re-opening the tab the next
   morning now lands on the right day with fresh data in one step. */
const REFRESH_IDLE_MS = 60000;
function refreshIfStale(){
  if(!S.mcp || document.hidden) return;
  checkDayRollover();
  if(Date.now() - S.lastRefresh < REFRESH_IDLE_MS) return;
  S.lastRefresh = Date.now();
  Promise.all([
    S.mcp.invalidate(GCAL, "list_events").catch(()=>{}),
    S.mcp.invalidate(TRELLO, "trelloReadCard").catch(()=>{})
  ]).then(render);
}
document.addEventListener("visibilitychange", refreshIfStale);
window.addEventListener("focus", refreshIfStale);

function tick(){
  tickClockWidget();
  checkDayRollover();
}
tick();   // paint the clock widget immediately, don't wait a full second
setInterval(tick, 1000);
setInterval(render, 60000);   // keep "now" honest

(async function boot(){
  render();
  let mcp = null;
  try{ mcp = await (window.claude && window.claude.use ? window.claude.use("mcp") : null); }
  catch(_){ mcp = null; }

  if(!mcp){ S.noMcp = true; S.ready = true; render(); return; }
  S.mcp = mcp;
  S.lastRefresh = Date.now();
  startWatches();

  /* Two gates, not one. The calendar alone is enough to draw a truthful day,
     so the page stops being a skeleton the moment it lands — it used to wait
     for all three Trello boards as well, which meant a slow board bought a
     20-second blank screen and then a fallback that skipped settings, the
     rollover sweep and the auto-plan entirely. Those still wait for both
     sources, but they now run the moment the second one arrives rather than
     being abandoned on a timeout. */
  let started = false;
  const settle = setInterval(()=>{
    if(S.events && !S.ready){ S.ready = true; render(); }
    if(started || !S.events || !BOARDS.every(b => S.cards[b.key])) return;
    started = true;
    clearInterval(settle);
    startDay();
  }, 400);
})();
