# Daisey's deployed page is GENERATED from daisey/daisey.html at deploy time.
# Before this existed, daisey/ lived on a separate branch and site/daisey/index.html
# was copied across by hand — the live site served a build several revisions
# old on two separate occasions, and nobody noticed because every individual
# step looked right. Building it here means what ships is always built from
# the source in the same commit; there is nothing to remember and nothing to
# forget. build-standalone.js self-checks its own output and exits non-zero on
# a bad splice, so a broken build fails the deploy instead of shipping.
# build-app.js copies Daisey v1 (daisey/app/) to site/daisey/now/ the same way.
[build]
  command = "node daisey/build-standalone.js && node daisey/build-app.js"
  publish = "site"

[functions]
  directory = "daisey/functions"

# Audio project -> PROJECTS session/work-day card sync. See daisey/functions/audio-sync.js
# for what it does and why. Every 30 min.
[functions."audio-sync"]
  schedule = "*/30 * * * *"

# Daisey v1 morning brief: checks every 15 min who is at the start of their day.
[functions."daisey-now-morning"]
  schedule = "*/15 * * * *"
